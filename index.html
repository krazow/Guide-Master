function boatHours(sp,max,illegal){

function boatFish(sp,h,illegal){

  spend(cost);const got=loc==='lower'?burnSolo(bn('soloHour')*h):1;const o=avgOdds(sp,loc,t0,h*60)*got;if(got<1)h=Math.max(1,Math.round(h*got));else pass(h*60+20);adj('energy',-4*h);adj('boat',loc==='lower'?-2:-1);

  const lines=[],rnd=()=>.6+Math.random()*.8;

    if(n){n=addFish(n);lines.push(`🧊 ${n} ${S_.n.toLowerCase()} for the freezer, every one hooked in the mouth.`)}else lines.push(`😶 ${h} hours and no ${S_.n.toLowerCase()} kept. ${o<.3?'The run isn’t here yet.':'Some days are like that.'}`)}
  else{lines.push(n?`${S_.ic} ${n} ${S_.n.toLowerCase()} to hand, photographed wet and released.`:`${S_.ic} Nothing to hand. Pretty river, though.`)}

// ============================================================
//  GUIDE MASTER, part 5: the career.
//  A career is 2, 5 or 10 seasons. Each season you play the two-week July peak
//  (Monday to Sunday, starting on the Monday nearest July 13); the rest of the year is the off-season:
//  a recap, license and permit renewals, next year's forecast and rule changes, upgrades and new bookings.
//
//  Day indexes stay continuous across seasons (S.cur 0..14×years−1), so the engine needs no changes
//  beyond GAME.days (a getter in 00-game.js) and the HUD hook hudDay().
// ============================================================
const SEASON=14;
const CAREERS={2:{n:'2-year career',ic:'🎣',d:'Two Julys on the Kenai. A taste of the guiding life.'},
  5:{n:'5-year career',ic:'🛶',d:'Build a business: upgrade boats, raise your rates, ride out good runs and bad.'},
  10:{n:'10-year career',ic:'🏔️',d:'A decade on the river. King closures come and go, permits expire, the river changes.'}};
const seasonOf=d=>Math.floor(d/SEASON);
const sday=d=>d-seasonOf(d)*SEASON;                         // day within the season, 0 = Monday
const yearOf=d=>2026+seasonOf(d);
const seasonFirst=(s=seasonOf(day()))=>s*SEASON;
const isLastSeason=(d=day())=>seasonOf(d)>=S.years-1;
// the Monday nearest July 13 of a year, as a UTC date
function seasonStartUTC(y){const t=Date.UTC(y,6,13),w=new Date(t).getUTCDay();let off=(1-w+7)%7;if(off>3)off-=7;return t+off*864e5}
const dateOf=d=>new Date(seasonStartUTC(yearOf(d))+sday(d)*864e5);
const MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dlabel=d=>{const x=dateOf(d);return `${dayName(d).slice(0,3)} ${MONTH[x.getUTCMonth()].slice(0,3)} ${x.getUTCDate()}`};
const dlong=d=>{const x=dateOf(d);return `${dayName(d)}, ${MONTH[x.getUTCMonth()]} ${x.getUTCDate()}`};
const dlongY=d=>`${dlong(d)}, ${yearOf(d)}`;
const isSunMon=d=>{const w=((d%7)+7)%7;return w===6||w===0};   // DAYS starts on Monday; seasons are whole weeks
function doyOf(d){const x=dateOf(d);return Math.round((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5)+1}
const evenYear=d=>yearOf(d)%2===0;
function hudDay(d){return `Season ${seasonOf(d)+1}/${S.years} · ${dlabel(d)}, ${yearOf(d)}`}

// ---- the rules and the runs change every season ----
// Season 1 is 2026 as it really is. Later seasons are invented: forecasts vary, kings may reopen,
// halibut charter rules shift with the allocation. (A game, not a prediction.)
function genRegs(s){
  if(s===0) return {year:2026,king:'closed',hal:{size:27,closed:[1,2]},mult:{sockeye:1,coho:1,king:1},shift:0,
    fc:'Late-run sockeye forecast: about average. Kenai kings: closed all season (stock of concern).'};
  const r=Math.random,sock=Math.round((.6+r()*.8)*100)/100,coho=Math.round((.6+r()*.8)*100)/100;
  const kr=r(),king=kr<.45?'closed':kr<.75?'cr':'open';
  const hal={size:pick([26,27,28,30,32]),closed:pick([[1,2],[1,2],[2],[1],[]])};
  const w=x=>x>=1.2?'strong':x>=.95?'about average':x>=.75?'below average':'weak';
  return {year:2026+s,king,hal,mult:{sockeye:sock,coho,king:king==='open'?1.6:king==='cr'?1:.8},shift:Math.round((r()-.5)*8),
    fc:`Late-run sockeye forecast: ${w(sock)}. Coho: ${w(coho)}. Kenai kings: ${{closed:'closed all season',cr:'catch-and-release only',open:'open: 1 per day, 20 inches or longer'}[king]}.`};
}
const REG=()=>S.reg||genRegs(0);
const kingRule=()=>REG().king;                              // 'closed' | 'cr' (catch-and-release) | 'open'
const noBait=()=>REG().king!=='open';                        // single-hook, no-bait EO rides along with king restrictions
const halSize=()=>REG().hal.size;
const halClosed=d=>REG().hal.closed.includes(((d%7)+7)%7);
const halDaysTxt=()=>{const c=REG().hal.closed;return c.length?c.map(i=>DAYS[i]+'s').join(' and '):'none this year'};
function kingRuleTxt(){return {closed:`Closed in ${REG().year} by emergency order, including catch-and-release. A king hooked by accident is released right away, without lifting it from the water.`,
  cr:`Catch-and-release only in ${REG().year}. Kings may not be kept, and big kings may not be removed from the water.`,
  open:`Open in ${REG().year}: 1 per day, 20 inches or longer, recorded on your harvest record right away.`}[kingRule()]}
function gearRuleTxt(){return noBait()?'Below Skilak, Jun 20–Aug 15: one unbaited, single-hook artificial lure. No bait, no treble hooks.':'Bait and multiple hooks allowed below Skilak this year (kings are open). Single hooks still kinder to release fish.'}
// first-aid/CPR: a card lasts two years
const faDue=(d=day())=>S.cred.fa<(seasonOf(d)+1)*SEASON;     // expires before this season ends
const faRenewTo=(d=day())=>(seasonOf(d)+2)*SEASON+2;         // the Wednesday of the season two years on
// Classes: Monday, Tuesday and Thursday, 1:00-4:00 PM at the Soldotna clinic; you can join up to 1:30 PM (late arrivals still sit the 3 hours)
const faClassDay=d=>[0,1,3].includes(sday(d));
const faJoinable=m=>m>=780&&m<=810;
// the card runs out this season and today is on or before the expiry day, from the Monday of that week
const faUrgent=(d=day())=>faDue(d)&&S.cred.fa>=d&&d>=S.cred.fa-(((S.cred.fa%7)+7)%7);
const FA_CLASS_TXT='Mon/Tue/Thu 1 PM at the Soldotna clinic';

// ---- off-season upgrades ----

function genSeasonBookings(s){

  const q=()=>r()<.3?[pick(['drinker','nolicense','kingfan','photo','kid'])]:[];
  const party=()=>pick(PARTIES);
  for(let i=0;i<SEASON;i++){const d=base+i,w=i%7;

    }

    if(w<1||w>5||r()>p0*.9) continue;
    const types=['reds','reds','trout'].concat(i>=7?['silver']:[]).filter(t=>conflicts(d,t)&&!conflicts(d,t,true));
    if(!types.length) continue;const type=pick(types),p=party();
    addBooking({d,type,n:type==='trout'?pick([2,3]):pick([2,3,4]),who:p.who,from:p.from,res:!!p.res,quirk:[],asst:true})}

  return regLines;
}

// What a booked trip will burn, and from which tank (null = no fuel needed)
function tripFuel(b){

// What a trip is likely to burn, planned for the longest run you could pick: base burn + the longest run's extra + the usual scatter, times the wind.
// (The charter's Barren Islands run is a flagged choice of its own, so it isn't counted in the charter's check.)
function expectBurn(b,d){const f=tripFuel(b);if(!f)return 0;d=d!=null?d:(b.d!=null?b.d:day());

// STEP for the trip engine: the tank is low at launch
STEP.fuel=(b,t)=>{const f=tripFuel(b),have=S[f.tank],p=fuelPrice(f.where),cap=f.tank==='fuel'?SLED_TANK():CHARTER_TANK,est=Math.round((cap-have)*p),need=expectBurn(b),typical=f.gal;

// You play the two-week July peak; the rest of your season is booked off your reputation.
// (1.8.0) The rest of the summer follows how the July went, not only how many trips you ran: the average client's happiness

function restOfSeason(p){

  const trips=Math.round(p.trips*REST_X*DF().book*clamp(S.rep/70,.5,1.25)*qualityF(p)*(1+clamp((p.wom||0)*WOM_W,-.10,.15))*(1-CITE_REST*Math.min(4,p.cites||0))*(1+REG_W*Math.min(REG_MAX,(S.regs||[]).length))*rateDemand()*(S.up&&S.up.lodge?1.1:1)*(S.up&&S.up.dock?1.08:1)*(S.up&&S.up.web===p.year-2026?WEB_REST:1)),fare=(p.fares+(p.tips||0))/p.trips;

// POST one message. Resolves 'sent' | 'queue' (network trouble: try later) | 'rejected' (Formspree said no).
async function fbPost(item){

  const ctl=typeof AbortController!=='undefined'?new AbortController():null,timer=setTimeout(()=>ctl&&ctl.abort(),12000);
  try{

    if(r.ok) return 'sent';
    return r.status===429||r.status>=500?'queue':'rejected';
  }catch(e){return 'queue'}finally{clearTimeout(timer)}
}
async function fbFlush(){
  const q=fbQueue();if(!q.length||!fbEndpoint()||(navigator.onLine===false))return;

}

//  GUIDE MASTER, part 9: winter camping (the adapter).
//  The camping game itself lives in src/camp/ (the KenaiCamp engine, which knows nothing about this game). This file is the
//  thin bridge: it builds the engine's trip ticket from the save (S), gives it a host adapter made of our own pop-ups, and
//  applies the trip report back to S. In the off-season ("S.winter" pending) the player has WINTER_DAYS free days to spend on
//  up to three camping trips and some winter work. Nothing here moves the game clock (S.t, S.cur).
//
//  Save state: S.camp = {v:2, s (winter these counters belong to), days, trips, gigs, gigsDone, gear (owned gear ids), lic (the
//  calendar year of the last fishing license), boost {s,q,book} (next season's bonus), hint, ach, noTrace, tot {…}}.
//  S.stats.campNights / encounters / seen keep counting as before (the end screen and the old achievements read them).

const CAMP_MAX_TACKLE=12;
const CAMP_FISH_PER_RED=3;   // stocked trout and char are small: about three of them make the meals of one red salmon in the freezer
function campBase(){return {v:2,s:-1,days:0,trips:0,gigs:0,gigsDone:[],gear:[],lic:0,boost:{s:-1,q:0,book:0},hint:null,ach:[],noTrace:0,tot:{trips:0,nights:0,fish:0,tackle:0,gigs:0,spent:0,net:0}}}
const campGas=()=>Math.round(Math.max(4.5,((S.fuelBase&&S.fuelBase.kenai)||6.19)-.85)*100)/100;   // Peninsula pump gas ≈ marine dock price − the marine premium
// this winter's counters (they restart when a new off-season begins)
function campW(){
  const C=S.camp&&S.camp.v===2?S.camp:(S.camp=campBase());
  if(S.winter&&C.s!==S.winter.s){C.s=S.winter.s;C.days=0;C.trips=0;C.gigs=0;C.gigsDone=[]}
  return C;
}
const campDaysLeft=()=>S.winter?Math.max(0,KenaiCamp.data.WINTER_DAYS-campW().days):0;
const campTripsLeft=()=>S.winter?Math.max(0,KenaiCamp.data.MAX_TRIPS-campW().trips):0;
// is there anything left to do this winter? (the pop-up can still be opened to see the log or buy a shelter)
const campUsed=()=>!S.winter||campDaysLeft()<=0||(campTripsLeft()<=0&&campW().gigs>=KenaiCamp.data.MAX_GIGS);
// effects on next season's trips and bookings (used by 22-trips.js and genSeasonBookings in 24-career.js)
function campQ(){
  const C=S.camp;if(!C||!C.boost||C.boost.s<0||C.boost.s!==seasonOf(day())) return 0;
  return S.stats.trips-((S.st0&&S.st0.trips)||0)<3?C.boost.q:0;
}
const campBook=s=>{const C=S.camp;return C&&C.boost&&C.boost.s===s?C.boost.book:0};

function campTicket(){
  const C=campW(),A=S.arcs&&S.arcs.rival,W=S.winter;
  return {
    mode:'guide',year:2025+W.s,cash:Math.round(S.money),energy:S.energy,rep:S.rep,skill:S.skill,
    gas:campGas(),mpg:15,costMult:DF().cost,
    gear:C.gear.slice(),licYear:C.lic,food:{meals:foodMeals(),freezerRoom:Math.max(0,fishCap()-S.freezer)*CAMP_FISH_PER_RED},
    regulars:S.regs.map(g=>({id:g.who,name:'the '+g.who,mood:g.last?g.last.h:60})),
    rival:A&&A.st>=2?{id:'rival',name:'Dale Voss',mood:A.mood||0}:null,guideFriend:true,
    daysLeft:campDaysLeft(),tripsLeft:campTripsLeft(),gigsLeft:Math.max(0,KenaiCamp.data.MAX_GIGS-C.gigs),gigsDone:C.gigsDone.slice(),

// the trip report goes back into the save
function campApply(rep){
  const C=campW(),st=S.stats,W=S.winter;
  money(rep.cashDelta);st.spent+=rep.spent;
  S.energy=clamp(S.energy+rep.energyDelta,Math.min(S.energy,40),100);
  if(rep.repDelta)adj('rep',rep.repDelta);
  S.skill+=rep.skillDelta;S.wom=(S.wom||0)+rep.womDelta;
  if(rep.foodFish)S.freezer=Math.min(fishCap(),S.freezer+Math.round(rep.foodFish/CAMP_FISH_PER_RED));
  if(rep.tackleCredit)S.gear=Math.min(Math.max(S.gear,CAMP_MAX_TACKLE),S.gear+rep.tackleCredit);
  if(rep.firstTripBoost||rep.bookingBoost){
    const B=C.boost.s===W.s?C.boost:(C.boost={s:W.s,q:0,book:0});
    B.q=Math.round(Math.min(KenaiCamp.data.MAX_FIRST,B.q+rep.firstTripBoost)*1000)/1000;B.book=Math.round(Math.min(KenaiCamp.data.MAX_BOOK,B.book+rep.bookingBoost)*1000)/1000;
  }
  if(rep.scout){const sh=(S.reg&&S.reg.shift)||0;
    C.hint={s:W.s,txt:rep.scout.areas.includes('kasilof')&&!rep.scout.areas.includes('upper')?'Kasilof anglers':'upper-river guides',
      run:sh>=2?`the late run should come about ${sh} days later than usual`:sh<=-2?`the late run should come about ${-sh} days earlier than usual`:'the late run should arrive about when it normally does'}}
  rep.relations.forEach(x=>{
    if(x.kind==='regular'){const g=S.regs.find(y=>y.who===x.id);if(g&&g.last){g.last.h=clamp(g.last.h+x.delta*5,0,100);if(x.delta>=2)g.miss=0}}
    else if(x.kind==='rival'&&S.arcs&&S.arcs.rival){const A=S.arcs.rival;if(x.delta>=2)A.mood=1;else if(x.delta<=-2)A.mood=-1}
  });
  st.seen=st.seen||{};Object.keys(rep.speciesSeen).forEach(id=>{st.seen[id]=(st.seen[id]||0)+rep.speciesSeen[id]});
  st.encounters=(st.encounters||0)+rep.encounters;st.campNights=(st.campNights||0)+rep.nights;
  rep.gearBought.forEach(g=>{if(!C.gear.includes(g))C.gear.push(g)});if(rep.license)C.lic=Math.max(C.lic,rep.license.year);
  rep.achievements.forEach(a=>{if(!C.ach.includes(a))C.ach.push(a)});C.noTrace+=rep.noTraceTrips;
  C.days+=rep.daysUsed;C.trips+=rep.tripsTaken;C.gigs+=rep.gigs.length;C.gigsDone=C.gigsDone.concat(rep.gigs);
  const T=C.tot;T.trips+=rep.tripsTaken;T.nights+=rep.nights;T.fish+=rep.foodFish;T.tackle+=rep.tackleCredit;T.gigs+=rep.gigs.length;T.spent+=rep.spent;T.net+=rep.cashDelta;
  return rep;
}

function campWrapHtml(rep){

  if(rep.foodFish)L.push(`🐟 ${rep.foodFish} stocked fish in the freezer: about ${Math.round(rep.foodFish/CAMP_FISH_PER_RED)} red${Math.round(rep.foodFish/CAMP_FISH_PER_RED)===1?'':'s'}’ worth of meals.`);
  if(rep.tackleCredit)L.push(`🪶 Tackle +${rep.tackleCredit}: that many trips’ worth of flies and leaders you won’t have to buy.`);

  if(rep.bookingBoost)L.push(`📅 A few more bookings next season.`);

const CHANGELOG_GENERIC='Fixes and small improvements throughout.';
const LASTVER_KEY=KEY('lastVersion');
function lastSeenVersion(){try{return localStorage.getItem(LASTVER_KEY)||''}catch(e){return ''}}
function rememberVersion(){try{localStorage.setItem(LASTVER_KEY,APP_VERSION)}catch(e){}}
// Run every slot's save through the engine's own migrate() and write it back stamped with this version
// (keeping its timestamp, so the current slot and "newest save" don't change). Returns {count, oldest app version}.
function upgradeAllSaves(){
  const ls=store(),out={count:0,oldest:''};if(!ls)return out;
  for(let n=1;n<=GAME.slots;n++){
    try{
      const r=rawSave(n);if(!r)continue;
      const raw=JSON.parse(r.v),d=migrate(raw);if(d.S.over)continue;
      out.count++;
      if(typeof raw.app==='string'&&raw.app&&(!out.oldest||verCmp(raw.app,out.oldest)<0))out.oldest=raw.app;
      if(d.newer)continue; // from a newer version: leave it exactly as it is
      ls.setItem(r.k,JSON.stringify({schema:d.schema,app:APP_VERSION,S:d.S,uiNarr:d.uiNarr,tab:d.tab,at:r.at||d.at}));
    }catch(e){}
  }
  return out;
}
function changelogLines(from){
  const vs=Object.keys(CHANGELOG).filter(v=>verCmp(v,APP_VERSION)<=0&&(!from||verCmp(v,from)>0)).sort((a,b)=>verCmp(b,a));
  const lines=[];
  if(!CHANGELOG[APP_VERSION])lines.push([APP_VERSION,CHANGELOG_GENERIC]);
  vs.forEach(v=>CHANGELOG[v].forEach(t=>lines.push([v,t])));
  return lines.slice(0,8);
}
function maybeUpdateNotice(){
  try{
    const seen=lastSeenVersion();
    if(seen===APP_VERSION)return;
    if(document.getElementById('mbg'))return; // something else is open; the next title screen will show it
    const saves=upgradeAllSaves(),from=seen||saves.oldest;
    if(!seen&&!saves.count){rememberVersion();return} // brand-new player
    const lines=changelogLines(from),multi=new Set(lines.map(l=>l[0])).size>1;
    const intro=from&&from!==APP_VERSION?`<p>${esc(GAME.title)} was updated from version ${esc(from)} to <b>${esc(APP_VERSION)}</b>.</p>`:`<p>${esc(GAME.title)} is now on version <b>${esc(APP_VERSION)}</b>.</p>`;
    const sv=saves.count?`<p>${saves.count>1?'Your saved games were':'Your saved game was'} updated to work with this version.</p>`:'';
    modal(`🆕 Updated to version ${esc(APP_VERSION)}`,`${intro}${sv}<p style="margin-bottom:2px"><b>What’s new</b></p><ul>${lines.map(l=>`<li>${multi?`<small>${esc(l[0])}</small> `:''}${l[1]}</li>`).join('')}</ul>`,

// ---- returning parties ----
const ORD=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'];
const REG_MAX=10;
function addReg(b,h,s,arc){S.regs.push({who:b.who,from:b.from,res:!!b.res,type:b.type==='halibut'?'reds':b.type,n:Math.min(b.n,b.type==='trout'?3:b.type==='silver'?4:5),trips:1,last:{h,s},arc:arc?'garza':null});if(arc)S.arcs.garza.st=1}
// "Hand them your card" at the dock: a party that had a good day and didn't offer their number. Better days say yes more often.
function regCard(b){
  pass(10);const h=b.out?b.out.happy:75;b.card=false;
  if(S.regs.length>=REG_MAX||S.regs.some(x=>x.who===b.who)) return;
  if(Math.random()<(h>=88?.85:.6)){addReg(b,h,seasonOf(day()),false);say(`⭐ The ${b.who} tuck your card in a wallet: “We’ll call you for next July.” They’re a regular now.`)}
  else say(`🪪 The ${b.who} thank you for the card. “Maybe next year.”`)
}
function regAfterTrip(b,happy,notes){
  const h=Math.round(happy),s=seasonOf(day());let g=S.regs.find(x=>x.who===b.who);
  const arc=b.arc==='garza';
  if(g){
    g.last={h,s};g.trips=(g.trips||1)+1;
    if(h>=88) notes.push(`⭐ The ${b.who} are already talking about July ${yearOf(day())+1}.`);
  }else{
    const join=arc?h>=60:(h>=75&&S.regs.length<REG_MAX&&Math.random()<.4);
    if(join){addReg(b,h,s,arc);
      notes.push(`⭐ The ${b.who} slip you a card with their number: “Same time next July?” If you treat them right, they will be back.`)}
    else if(arc)S.arcs.garza.st=-1;
    else if(h>=75&&S.regs.length<REG_MAX) b.card=true;                 // a happy party that didn't ask: you can hand them your card at the dock
  }
}
// next season's bookings from the regulars; returns report lines for the off-season
function regsRebook(base,r){
  const lines=[];
  S.regs.slice().forEach(g=>{
    const h=g.last?g.last.h:0,p=h>=88?.95:h>=75?.85:h>=60?.55:h>=45?.25:0,type=g.type;
    if(r()<p){
      for(let k=0;k<12;k++){
        const i=1+Math.floor(r()*13),w=i%7;
        if(w<1||w>5||(type==='silver'&&i<7)) continue;
        const d=base+i;if(conflicts(d,type)) continue;
        const n=Math.min(g.n+(h>=88&&g.n<(type==='trout'?3:type==='silver'?4:5)?1:0),type==='trout'?3:type==='silver'?4:5);
        addBooking({d,type,n,who:g.who,from:g.from,res:g.res,quirk:[],reg:true,arc:g.arc||undefined});g.miss=0;
        lines.push(`⭐ The ${g.who} (${g.from}) are back for their ${ORD[Math.min(10,(g.trips||1)+1)]} July${h>=88?': last time was a five-star day':''}.`);break}
    }else{
      g.miss=(g.miss||0)+1;
      if(h<45||g.miss>=2){S.regs=S.regs.filter(x=>x!==g);if(g.arc==='garza')S.arcs.garza.st=-1;lines.push(`🪧 The ${g.who} didn’t rebook${h<45?': last year’s trip left a bad taste':''}.`)}
    }
  });
  return lines;
}
// at launch: they remember last time
function regTripStart(b,t){
  const g=b.reg&&S.regs.find(x=>x.who===b.who);if(!g||!g.last) return;
  const h=g.last.h,nth=ORD[Math.min(10,(g.trips||1)+1)];
  if(h>=88){t.happy+=5;t.notes.push(`⭐ The ${b.who} are back for their ${nth} July. They’ve talked about last year’s day all winter and trust you with this one.`)}
  else if(h>=75){t.happy+=3;t.notes.push(`⭐ The ${b.who} are back for their ${nth} July and glad to see you.`)}
  else if(h<62){t.happy-=4;t.notes.push(`😬 The ${b.who} came back, but they remember last year’s rough day. They’re watching.`)}
}
// after a trip: returning parties and arcs
function storyAfterTrip(b,happy,notes){
  regAfterTrip(b,happy,notes);
  if(b.arc==='garza'&&b.reg){const A=S.arcs.garza;if(A.st>=1&&A.st<=3){A.st++;if(A.st===4)say('👨‍👩‍👦 The Garzas’ fourth July. Some families become part of the river.')}}
}

// ============================================================
//  GUIDE MASTER, part 8: food, home fuel and backup power (added in 1.7.0).
//
//  Three small systems that share one idea: the cabin has stores, and the stores can run out.
//
//  FOOD (S.food, S.freezer)
//    Meals are the unit (3 a day). The pantry (dry goods, no spoilage), the fridge (fresh, goes off after 6 days) and the freezer
//    (your dipnet and solo-trip reds, one red is about 4 meals) feed you. Every night the game eats the day's meals for you,
//    fridge first, then pantry, then a thawed red; a meal you already ate in town or packed for a trip doesn't count twice.
//    A meal you can't eat costs energy. One tap at the Soldotna grocery store stocks about a week ("Stock up").
//    Groceries used to be part of the nightly overhead; that part now lives here (OVERHEAD went from $75 to $57), so nobody pays twice.
//  THE COOLER (STEP.pack)
//    Before each trip you pack your own lunch (energy) and decide what the clients get: nothing, snack bags, store lunch kits
//    or a shore lunch of freezer reds (happiness, so tips). On a long day (the trout float, halibut) hungry clients are unhappy.
//  HOME FUEL (S.home)
//    Fuel is still bought only at the Kenai Harbor dock; you can haul extra home into approved cans (and a 100-gallon transfer tank
//    you can buy) and fuel the sled from it at the shop. Untreated gas goes stale over a winter; stabilizer ($9 per 25 gal) carries
//    it through one. Stale gas takes up room until you dispose of it.
//  OUTAGES AND THE GENERATOR (S.home.gen, the power_out event, suppliesWinter)
//    Wind and trees knock out the Peninsula's power now and then, in July and in winter. A portable generator (outside, with an
//    inlet and interlock) burns home fuel to keep the freezer going; without one a long outage spoils fresh food and, past a day
//    or two, the freezer, and costs you sleep. A freezer holds about 24 hours half full and 48 hours full; the fridge only a few hours.
//
//  Off-season: pantry and freezer carry over, the fridge doesn't, untreated fuel goes stale, one winter outage may hit, and there is
//  no day-to-day food tracking (the winter living bill already covers eating).
//  Prices are 2026 estimates; README.md ("Food, home fuel and the generator") lists them and where they come from.
// ============================================================
const MEALS=3, FISH_MEALS=4, FRESH_DAYS=6;
const PANTRY_CAP=60, FRIDGE_CAP=15, KIT_CAP=18;                // meals; meals; client lunch kits
const MEAL_PRICE={fri:7,pan:5}, KIT_PRICE=12, GAS_STATION_LUNCH=12;   // dollars (×the difficulty's cost)
const CAN_GAL=5, CAN_PRICE=35, CANS_MAX=8, TANK_GAL=100, TANK_PRICE=768;
const STAB_PRICE=9, STAB_GAL=25, STALE_FEE=15;                 // stabilizer ($ per 25 gal), hazardous-waste drop-off
const FREEZER_BASE=30, FREEZER_BIG=70, FREEZER_PRICE=650;      // fish the freezer holds
const GENS=[null,
  {n:'7,500 W open-frame generator',short:'open-frame',cost:850,install:600,gph:.45},
  {n:'7,000 W inverter generator',short:'inverter',cost:4449,install:600,gph:.28}];
const mealPrice=k=>Math.round(MEAL_PRICE[k]*DF().cost*100)/100;
const kitPrice=()=>Math.round(KIT_PRICE*DF().cost);
const r1=x=>Math.round(x*10)/10;

// ---- what you have ----
const fuelCap=()=>S.home.cans*CAN_GAL+(S.home.tank?TANK_GAL:0);
const fuelFresh=()=>r1(S.home.gal+S.home.tgal);                 // usable gallons (untreated + stabilized)
const fuelAll=()=>r1(S.home.gal+S.home.tgal+S.home.stale);      // everything taking up room
const fuelRoom=()=>Math.max(0,r1(fuelCap()-fuelAll()));
const fishCap=()=>S.home.frz?FREEZER_BIG:FREEZER_BASE;
const groceryMeals=()=>S.food.fri+S.food.pan;
const foodMeals=()=>groceryMeals()+S.freezer*FISH_MEALS+S.food.fm;
const foodDays=()=>Math.floor(foodMeals()/MEALS*10)/10;
const dayWord=d=>d===1?'day':'days';
const daysTxt=d=>d>=10?String(Math.floor(d)):d.toFixed(1).replace(/\.0$/,'');
const genOf=()=>GENS[S.home.gen]||null;
// A hint for the fuel alerts: gas from your own cans is a way to fuel the sled without a trip to the harbor.
const homeFuelHint=()=>fuelFresh()>=3?` Or fuel the sled at the shop from your home cans (${fuelFresh()} gal).`:'';
const genHours=()=>genOf()?r1(fuelFresh()/genOf().gph):0;

// Put fish in the freezer (it holds fishCap()); the rest go to the neighbors. Returns how many were stored.
function addFish(n){
  const put=Math.max(0,Math.min(n,fishCap()-S.freezer));S.freezer+=put;
  if(put<n) say(`🧊 The freezer is full (${fishCap()}). ${n-put} fish go to the neighbors.`);
  return put;
}
// A meal eaten somewhere else today (the diner, fish and chips, a packed lunch) doesn't come out of the pantry tonight.
function ateAdd(k){const d=day();S.ate=(S.ate&&S.ate.d===d)?S.ate:{d,n:0};S.ate.n+=k}
const ateToday=()=>S.ate&&S.ate.d===day()?S.ate.n:0;
// Take meals from the stores: the fridge first (it spoils), then the pantry, then a thawed red. Returns {fri,pan,fish,miss}.
function takeMeals(k){
  const F=S.food,got={fri:0,pan:0,fish:0,miss:0};
  for(let i=0;i<k;i++){
    if(F.fri>0){F.fri--;got.fri++}
    else if(F.pan>0){F.pan--;got.pan++}
    else if(F.fm>0){F.fm--;got.fish++}
    else if(S.freezer>0){S.freezer--;F.fm=FISH_MEALS-1;got.fish++}
    else got.miss++;
  }
  return got;
}

// ---- the grocery store ----
// How many meals of fresh and pantry food a shop to `target` meals buys (the fridge holds 15, the pantry 60).
function groceryPlan(target){
  const F=S.food,need=Math.max(0,target-F.pan-F.fri);
  let fri=Math.min(Math.round(need*.4),FRIDGE_CAP-F.fri),pan=Math.min(need-fri,PANTRY_CAP-F.pan);
  fri=Math.min(need-pan,FRIDGE_CAP-F.fri);
  fri=Math.max(0,fri);pan=Math.max(0,pan);
  return {fri,pan,cost:Math.round((fri*mealPrice('fri')+pan*mealPrice('pan'))*100)/100};
}
// "Stock up": buy groceries to `days` days of pantry and fridge food. Returns the plan, or null if there's nothing to buy or no money.
function stockUp(days){
  const target=Math.min(PANTRY_CAP+FRIDGE_CAP,Math.round(days*MEALS)),p=groceryPlan(target);
  if(p.fri+p.pan<=0||S.money<p.cost) return null;
  spend(p.cost);S.food.fri+=p.fri;S.food.pan+=p.pan;if(p.fri>0)S.food.fd=day();
  S.stats.groceries=(S.stats.groceries||0)+p.cost;return p;
}
function buyKits(n){
  n=Math.min(n,KIT_CAP-S.food.kits);const c=n*kitPrice();
  if(n<=0||S.money<c) return 0;
  spend(c);S.food.kits+=n;S.stats.groceries=(S.stats.groceries||0)+c;return n;
}

// ---- home fuel ----
// Buy fuel at a dock and carry it home in cans. Fuel is sold only at the Kenai Harbor dock (or your own pump, with the riverfront lot).
function haulFuel(gal,where){
  const p=fuelPrice(where||'kenai'),room=fuelRoom();
  const g=Math.max(0,Math.min(gal==null?room:gal,room,Math.floor(S.money/p*10)/10)),cost=Math.round(g*p*100)/100;
  if(g<=0) return 0;
  S.home.gal=r1(S.home.gal+g);money(-cost);S.stats.spent+=cost;S.stats.fuelGal=(S.stats.fuelGal||0)+g;S.stats.fuelCost=(S.stats.fuelCost||0)+cost;
  return {gal:r1(g),cost,p};
}
function takeHomeFuel(g){                                       // untreated first, then stabilized
  const H=S.home;let left=g;
  const a=Math.min(H.gal,left);H.gal=r1(H.gal-a);left-=a;
  const b=Math.min(H.tgal,left);H.tgal=r1(H.tgal-b);left-=b;
  return r1(g-left);
}
function fuelSledFromHome(){
  const g=r1(Math.min(SLED_TANK()-S.fuel,fuelFresh()));
  if(g<=0) return 0;
  takeHomeFuel(g);S.fuel=r1(S.fuel+g);return g;
}
const stabCost=()=>Math.ceil(S.home.gal/STAB_GAL)*STAB_PRICE;
function stabilize(){
  const H=S.home,c=stabCost();
  if(H.gal<=0||S.money<c) return 0;
  spend(c);const g=H.gal;H.tgal=r1(H.tgal+g);H.gal=0;return g;
}

// ---- power outages ----
// An outage of h hours. A generator runs on home fuel for as long as the fuel lasts; the rest of the time the freezer and fridge warm up.
function outage(h,winter){
  const G=genOf(),out={h,run:0,burn:0,off:h,fish:0,fresh:0,energy:0,lines:[]};
  if(G){out.run=r1(Math.min(h,fuelFresh()/G.gph));out.burn=takeHomeFuel(r1(out.run*G.gph));out.off=r1(h-out.run)}
  const off=out.off,keep=S.freezer>=fishCap()/2?48:24;
  out.fish=Math.round(S.freezer*clamp((off-keep)/24,0,1));S.freezer-=out.fish;S.stats.spoiled=(S.stats.spoiled||0)+out.fish;
  out.fresh=Math.round(S.food.fri*clamp((off-8)/16,0,1));S.food.fri-=out.fresh;
  if(!winter&&off>=4){out.energy=Math.min(10,Math.round(2+off/3));adj('energy',-out.energy)}
  S.stats.outages=(S.stats.outages||0)+1;
  const hrs=out.h>=48?`${r1(out.h/24)} days`:`${Math.round(out.h)} hours`;
  if(G&&out.off<=0) out.lines.push(`🔌 The power is out about ${hrs}. You roll out the ${G.short} generator, plug it into the inlet and run it outside, well away from the cabin (exhaust is carbon monoxide). ${out.burn} gallons of home gas later the freezer, fridge and lights never missed a beat.`);
  else if(G&&out.run>0) out.lines.push(`🔌 The power is out about ${hrs}. The ${G.short} generator keeps things going for ${Math.round(out.run)} hours, then the home gas runs out (${out.burn} gallons burned). The last ${Math.round(out.off)} hours are cold and dark.`);
  else if(G) out.lines.push(`🔌 The power is out about ${hrs}, and the ${G.short} generator has no gas to run on: your cans are empty.`);
  else out.lines.push(`⚡ The power is out about ${hrs}. Without a generator the freezer and fridge are on their own.`);
  if(out.fish||out.fresh) out.lines.push(`🧊 ${[out.fish?`${out.fish} red${out.fish>1?'s':''} thawed in the freezer and went in the dump`:'',out.fresh?`${out.fresh} meals of fresh food spoiled`:''].filter(Boolean).join(' and ')}.`);
  else if(out.off>0) out.lines.push(`🧊 The freezer held (${out.off<keep?'it was closed and stayed cold':'barely'}).`);
  if(out.energy) out.lines.push(`😮‍💨 No lights, no coffee maker, a dead phone and a warm cabin: you sleep badly. Energy −${out.energy}.`);
  return out;
}
const outageHours=winter=>{const r=Math.random();
  if(winter) return r<.45?8+Math.floor(Math.random()*17):r<.85?24+Math.floor(Math.random()*37):60+Math.floor(Math.random()*51);
  return r<.55?2+Math.floor(Math.random()*6):r<.9?8+Math.floor(Math.random()*13):24+Math.floor(Math.random()*17)};
// July: a windy morning is the likeliest time for a tree on the line.
defEvent({id:'power_out',hook:'wake',tile:['⚡','Power outage','bad'],bad:true,cooldown:3,chance:()=>S.wx[day()]==='wind'?.1:.025,cond:()=>!S.winter&&day()>0,
  run:()=>{const o=outage(outageHours(false));S.power={d:day(),h:o.h,gen:!!genOf()&&o.run>0,burn:o.burn,fish:o.fish,fresh:o.fresh};say(o.lines.join(' '))}});

// ---- the off-season ----
// Runs once as a season rolls over (24-career.js, startSeason). Returns lines for the winter summary.
function suppliesWinter(){
  const H=S.home,F=S.food,bits=[];
  if(H.gal>0){H.stale=r1(H.stale+H.gal);bits.push(`⛽ ${r1(H.gal)} gal of untreated gas went stale (dispose of it at the shop)`);H.gal=0}
  if(H.tgal>0){H.gal=H.tgal;H.tgal=0}                       // stabilized gas made it through; it is a year old now and needs treating again
  if(F.fri>0){bits.push(`🥬 ${F.fri} meals of fresh food spoiled`);F.fri=0}
  const lines=bits.length?[bits.join(' · ')+'.']:[];
  if(Math.random()<.55*DF().bad){const o=outage(outageHours(true),true);
    lines.push(`🌨️ <b>A winter storm cut the power for ${o.h>=48?`${r1(o.h/24)} days`:`${Math.round(o.h)} hours`}.</b> ${genOf()?(o.off<=0?`The generator burned ${o.burn} gal and the freezer held.`:o.run<=0?'The generator had no gas to run on.':`The generator ran ${Math.round(o.run)} hours on ${o.burn} gal of home gas, then it was cold and dark.`):'No generator.'}${o.fish?` ${o.fish} freezer reds spoiled.`:S.freezer&&o.off>0?' The freezer held.':''}`)}
  return lines;
}

// ---- nightly meals (called from onNight) ----
function suppliesNight(notes,d){
  const F=S.food;
  if(F.fri>0&&d-F.fd>=FRESH_DAYS){notes.push(`🥬 ${F.fri} meals of fresh food went off in the fridge.`);F.fri=0}
  const need=Math.max(0,MEALS-(S.ate&&S.ate.d===d?S.ate.n:0)),got=takeMeals(need);
  const eaten=got.fri+got.pan+got.fish,out=MEALS-need;
  if(eaten) notes.push(`🍽️ ${eaten} meal${eaten>1?'s':''} at home${got.fish?' (red salmon from the freezer)':''}${out?`, ${out} on the road`:''}. About ${daysTxt(foodDays())} days of food left.`);
  S.hungry=got.miss>0?Math.min(3,(S.hungry||0)+1):0;             // nights in a row you went without
  if(got.miss){S.stats.missed=(S.stats.missed||0)+got.miss;const e=7*got.miss;adj('energy',-e);notes.push(`🍽️ The cupboards are bare: you went without ${got.miss} meal${got.miss>1?'s':''}. Energy −${e}. Stock up at the grocery store in Soldotna.`)}
  else if(foodDays()<2) notes.push('🛒 Food is running low. Stock up at the grocery store in Soldotna.');
  if(S.power&&S.power.d===d) S.power=null;
  if(S.hungry>=2&&foodMeals()<MEALS&&!(S.ev.last.hungry_morning!=null&&d+1-S.ev.last.hungry_morning<HUNGER_WARN_GAP)) chain('hungry_morning');      // (1.8.1) a second night without: a warning, with a quick fix, first thing tomorrow
}

// (1.8.1) Running on empty: after a second night in a row without enough to eat, the morning opens with a warning and a quick, pricier fix

    {l:`Gas station on the way: breakfast and a day of food — ${$(c)}`,s:`15 min. About twice grocery prices. Not hungry today, energy +6, and ${EMERGENCY_MEALS} meals in the cupboard.`,dis:!canAfford(c),fn:()=>{
      spend(c);S.stats.emergencyFood=(S.stats.emergencyFood||0)+1;pass(15);ateAdd(1);adj('energy',6);S.food.pan=Math.min(PANTRY_CAP,S.food.pan+EMERGENCY_MEALS);S.hungry=0;
      say(`⛽ Breakfast burritos, coffee and a bag of canned chili, bread and peanut butter from the 24-hour gas station: ${$(c)}. Not cheap, but you’re fed. Stock up at the grocery store when you can.`)}},
    {l:'Not now: push through',s:`Clients −${HUNGER_HAPPY[Math.min(3,h)]} happiness today, and another night without dinner costs energy.`,fn:()=>say('🥱 You push through on coffee. The grocery store in Soldotna is open 5 AM to 10 PM.')}]);
}

// (1.8.1: was −5 a night, up to −15; the curve is softer so going hungry hurts without ending a career on its own.)
const HUNGER_HAPPY=[0,5,9,13];
function hungerTrip(t){
  const h=S.hungry||0;if(h<=0) return;
  t.happy-=HUNGER_HAPPY[Math.min(3,h)];t.q-=.015*h;t.notes.push(`🍽️ ${h>1?'Days':'A day'} of going without food: you’re short-tempered and slow, and the clients notice.`);
}

// ---- the cooler: before each trip ----
const LUNCH_EFFECT={none:[0,-6],snack:[2,4],kit:[4,7],fish:[6,9]};   // client happiness on a short / long trip
STEP.pack=(b,t)=>{
  const T=TRIPS[b.type],long=T.len>=480,n=b.n,F=S.food,L_=long?1:0;
  const skips=long?10:6,kitN=n,fishN=Math.ceil(n/4),snackN=Math.ceil(n/3);

  const lunch=(kind,txt)=>{const [s,l]=LUNCH_EFFECT[kind],h=L_?l:s;t.happy+=h;t.notes.push(txt)};
  const eatOwn=()=>{
    if(foodMeals()>0){takeMeals(1);t.notes.push('🥪 You pack your own lunch from home. A real lunch keeps you going.')}
    else{fx(t,-rp(GAS_STATION_LUNCH),'Gas-station sandwich');t.notes.push('🥪 Nothing at home to pack, so you grab a gas-station sandwich on the way.')}
    ateAdd(1);adj('energy',3);
  };
  const o=[O('Pack your own lunch',`${ownNote} ${long?'The clients get nothing, and on a long day they notice (−6 happiness).':'The clients bring their own.'}`,(b,t)=>{eatOwn();if(long)lunch('none','😒 No lunch for the clients on an all-day trip. Stomachs growl by noon.')})];
  if(F.pan>=snackN) o.push(O('…and snack bags for the clients',`Pantry granola bars, jerky and drinks (${snackN} pantry meals). Clients ${long?'+4':'+2'} happiness.`,(b,t)=>{eatOwn();F.pan-=snackN;lunch('snack','🍫 Snack bags and hot drinks for the clients.')}));
  if(F.kits>=kitN) o.push(O('…and a lunch kit for each client',`Sandwich, chips, fruit and a drink (${kitN} of your ${F.kits} kits). Clients ${long?'+7':'+4'} happiness.`,(b,t)=>{eatOwn();F.kits-=kitN;lunch('kit','🥪 Lunch kits at the first gravel bar: the clients are delighted.')}));
  if(S.freezer>=fishN) o.push(O('…and a shore lunch of grilled red salmon',`Thaw ${fishN} freezer red${fishN>1?'s':''} (${S.freezer} on hand). A Kenai tradition. Clients ${long?'+9':'+6'} happiness.`,(b,t)=>{eatOwn();S.freezer-=fishN;lunch('fish','🔥 Grilled red salmon with lemon and pepper on a gravel bar: the clients will remember it.')}));
  o.push(O('Skip food and just go',`Saves the food. You'll drag all day: energy −${skips}.${long?' The clients go hungry too (−6 happiness).':''}`,(b,t)=>{adj('energy',-skips);t.notes.push('🥱 No lunch for anyone. By two o’clock you are running on coffee.');if(long)lunch('none','😒 No lunch for the clients on an all-day trip. Stomachs growl by noon.')}));
  return {t:'🧺 Pack the cooler',b:`<p>${hrsTxt(T.len)} on the water with the ${b.who}. Pack your own lunch and decide what the ${n} clients get. You have <b>${daysTxt(foodDays())} ${dayWord(foodDays())}</b> of food at home${F.kits?`, ${F.kits} lunch kit${F.kits>1?'s':''}`:''}${S.freezer?` and ${S.freezer} red${S.freezer>1?'s':''} in the freezer`:''}.</p>`,o,fixed:true};
};

    const open2=isOpen('harbor'),room=fuelRoom(),p=fuelPrice('kenai');
    if(fuelCap()>0){
      a.push({ic:'🛢️',l:room>=1?`Haul fuel home: fill the cans — ${room.toFixed(1)} gal × ${$(p)} = ${$(Math.round(room*p))}`:'Haul fuel home: your cans and tank are full',s:`${fuelAll()}/${fuelCap()} gal stored${H.stale?` (${H.stale} stale)`:''}. Marine fuel from the dock into approved cans, outside on the truck bed. 15 min.`,cat:'work',dis:!open2||room<1||S.money<p,fn:()=>{const r=haulFuel(null,'kenai');pass(15);if(r)say(`🛢️ ${r.gal} gallons into the cans for home: ${$(Math.round(r.cost))}. ${fuelFresh()} gal in storage.`)}});
      if(room>10) a.push({ic:'🛢️',l:`Haul 10 gallons home — ${$(Math.round(10*p))}`,s:'A smaller load for the truck bed.',cat:'work',dis:!open2||S.money<p*10,fn:()=>{const r=haulFuel(10,'kenai');pass(10);if(r)say(`🛢️ ${r.gal} gallons into the cans for home: ${$(Math.round(r.cost))}. ${fuelFresh()} gal in storage.`)}});
    }
  }
}

// ---- status tags, alerts, to-do ----
function suppliesTags(){
  const t=[],gd=foodDays(),H=S.home;
  t.push(`<span class="tag ${gd<2?'bad':''}">🍽️ ${daysTxt(gd)} ${dayWord(gd)} of food</span>`);
  if(S.loc==='shop'||S.loc==='harbor') t.push(`<span class="tag ${H.stale?'bad':''}">🛢️ ${fuelFresh()}/${fuelCap()} gal at home${H.stale?` · ${H.stale} stale`:''}</span>`);
  if(S.loc==='shop'&&genOf()) t.push(`<span class="tag">🔌 ${genOf().short} generator</span>`);
  if(S.food.kits&&(S.loc==='shop'||S.loc==='town')) t.push(`<span class="tag">🥪 ${S.food.kits} lunch kit${S.food.kits>1?'s':''}</span>`);
  if(S.hungry>0) t.push('<span class="tag bad">🍽️ hungry: short-tempered</span>');
  if(S.power&&S.power.d===day()) t.push(`<span class="tag bad">⚡ power ${S.power.gen?'out, generator on':'out'}</span>`);
  return t;
}
function suppliesAlert(){
  if(S.power&&S.power.d===day()){const P=S.power;return {t:P.gen?`🔌 Power outage (about ${Math.round(P.h)} h). The generator is carrying the house: ${P.burn} gallons of home gas used.`:`⚡ Power outage (about ${Math.round(P.h)} h).${P.fish||P.fresh?` ${P.fish?P.fish+' reds':''}${P.fish&&P.fresh?' and ':''}${P.fresh?P.fresh+' meals of fresh food':''} spoiled.`:' The freezer is holding.'}`,kind:'info'}}
  if(foodDays()<1.5) return {t:`🍽️ ${foodDays()<=0?'No food at home.':`Only ${daysTxt(foodDays())} ${dayWord(foodDays())} of food at home.`} Stock up at the grocery store in Soldotna, or you go hungry and tired.`};
  if(S.home.gal>0&&!isLastSeason()&&sday(day())>=SEASON-3) return {t:`⛽ ${S.home.gal} gallons of untreated gas in the cans will be stale by next July. Add stabilizer at the shop before the season ends.`,kind:'info'};
  return null;
}
function suppliesTodo(){
  const it=[],gd=foodDays();
  it.push({l:'Keep food in the house',s:`${daysTxt(gd)} ${dayWord(gd)} of food (${S.food.fri+S.food.pan} meals of groceries, ${S.freezer} reds). Stock up at the grocery store in Soldotna.`,ok:gd>=3,urgent:gd<2});
  if(S.home.gal>0&&!isLastSeason()&&sday(day())>=SEASON-3) it.push({l:'Stabilize the stored gas before winter',s:`${S.home.gal} gal untreated. $${STAB_PRICE} per ${STAB_GAL} gal at the shop; otherwise it goes stale.`,ok:false,urgent:sday(day())>=SEASON-1});
  if(genOf()&&fuelFresh()<10) it.push({l:'Haul gas home for the generator',s:`${fuelFresh()} gal in storage is ${genHours()} hours of generator time. Fuel is sold only at the Kenai Harbor dock.`,ok:false,urgent:false});
  return it;
}
// 1.7.0: the Food stat joins the top bar; tips for the new ideas
STATS.splice(5,0,{l:'Food',v:()=>`${Math.floor(foodDays())}d`,m:()=>foodDays()/10*100,warn:()=>foodDays()<2,title:'Days of food at home: pantry, fridge and freezer reds. Stock up at the grocery store in Soldotna.'});
TIPS.push({id:'food',when:()=>day()>=1&&foodDays()<3,t:'🍽️ You’re low on food at home. <b>Stock up</b> at the grocery store in Soldotna: meals come out of the pantry every night, and a hungry guide runs out of energy.'},
  {id:'cooler',when:()=>day()>=1&&todays().length>0&&foodDays()>=1,t:'🧺 Before each trip you <b>pack the cooler</b>: your own lunch keeps your energy up, and a lunch kit or a shore lunch of freezer reds makes the clients happier (and tips bigger), especially on the long trout float and halibut days.'});
// ---------------- boot ----------------
applyPrefs();
titleScreen();
</script>
