// ---------------- player name ----------------
// Any text can contain {{name}}. It's swapped in only when shown, so renaming updates every line already in the log.
const NAME_KEY=KEY('name');
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function currentName(){return (typeof S!=='undefined'&&S&&S.name)||profileName()||GAME.defaultName}
function withName(t){return typeof t==='string'?t.replace(/\{\{name\}\}/g,esc(currentName())):t}
function cleanName(raw){const n=String(raw||'').replace(/\s+/g,' ').trim();
  if(!n) return {err:'Please enter a name.'};
  if(n.length>20) return {err:'Keep it to 20 characters or fewer.'};
  if(!/^[\p{L}\p{N}][\p{L}\p{N} '’.\-]*$/u.test(n)) return {err:'Letters, numbers, spaces, apostrophes, periods and hyphens only.'};
  return {name:n}}
function setPlayerName(n){
  const old=currentName();
  try{localStorage.setItem(NAME_KEY,n)}catch(e){}
  if(S&&!S.over){S.name=n;if(old!==n)say('✏️ From now on, everyone calls you {{name}}.');saveGame()}
  else{ // on the title screen: rename the saved game too, so Continue uses the new name
    const ls=store();if(ls)try{for(const k of slotKeys()){const v=ls.getItem(k);if(!v)continue;const d=JSON.parse(v);if(d&&d.S){d.S.name=n;ls.setItem(k,JSON.stringify(d))}}}catch(e){}
    if(S&&S.over) S.name=n}
}

// ---------------- time ----------------
// S.t is minutes since the start of the run (day 0, midnight). S.cur is the current day index.
const day=()=>S.cur;
const tod=()=>S.t-S.cur*1440;                       // minutes since midnight today
const dayName=d=>DAYS[((d%7)+7)%7];
function fmt(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mi=m%60;const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap}
function fmtAbs(a){const d=Math.floor(a/1440);return (d!==day()?dayName(d).slice(0,3)+' ':'')+fmt(a)}

// ---------------- helpers for content ----------------
function say(s){uiNarr.push(s);S.log.push({t:S.t,s})}              // narrate + log
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function adj(k,v,lo=0,hi=100){S[k]=clamp(Math.round(S[k]+v),lo,hi)} // nudge a 0–100 stat
function money(v){S.money=Math.round((S.money+v)*100)/100}
// Numbers with thousands separators; $() is the one money formatter (cents only when there are some): $47,975, −$1,200, $6.19.
const grp=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const $=x=>{const f=(Math.round(Math.abs(x)*100)/100).toFixed(x%1?2:0).split('.');f[0]=grp(+f[0]);return (x<0?'−':'')+'$'+f.join('.')};
const $k=x=>Math.abs(x)>=10000?(x<0?'−':'')+'$'+Math.round(Math.abs(x)/1000)+'k':$(x);   // compact money for tight spots (the top bar): $48k
const pick=a=>a[Math.floor(Math.random()*a.length)];
function isOpen(id,t=S.t){const h=L[id].hours;if(!h)return true;const r=h(Math.floor(t/1440));if(!r)return false;const m=t%1440;return m>=r[0]&&m<r[1]}
function hoursTxt(id){const h=L[id].hours;if(!h)return '';const r=h(day());return r?`Open ${fmt(r[0])}–${fmt(r[1])}`:'Closed today'}
// ---------------- bottom-sheet modal ----------------
// modal(title, bodyHtml, [{l:'Label', s:'subtitle', fn:()=>{}, dis:false}, …])
// The first enabled button is highlighted (unless it has np:true; dilemma choices do, so no option is the "right" one).
// A button may carry legal:true/false, written to its data-legal attribute. Modals opened while one is showing are queued and shown in order.
// A 4th argument true makes the pop-up required: Esc doesn't close it, only its own button does (no backdrop-tap close exists).
// After any button, the game re-renders (unless you're on the title or end screen).
let MB=[], MQ=[], FOCUS_RET=null;
let DIGEST=null;   // the morning report being collected (04-loop.js endDay): {night, items, lines, held}
// Keyboard and screen-reader behavior: while a pop-up is open the page behind it is inert and Tab stays inside the pop-up;
// Esc closes it unless it is required (a 4th argument of true); closing gives focus back to what you had pressed.
const FOCUSABLE='button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
function focusKey(el){if(!el||el===document.body||!el.tagName)return null;const tag=el.tagName.toLowerCase();return {id:el.id||'',tag,txt:(el.textContent||'').trim().slice(0,80),idx:[...document.querySelectorAll(tag)].indexOf(el)}}
function focusBack(k){if(!k)return;
  let el=k.id?document.getElementById(k.id):null;
  if(!el){const all=[...document.querySelectorAll(k.tag)].filter(e=>!e.closest('#mbg'));el=all.find(e=>(e.textContent||'').trim().slice(0,80)===k.txt)||all[k.idx]}
  if(el&&!el.disabled&&el.offsetParent!==null){try{el.focus({preventScroll:true})}catch(e){}}}
function syncInert(){const a=document.getElementById('app'),on=!!document.getElementById('mbg');if(a){if(on)a.setAttribute('inert','');else a.removeAttribute('inert')}}
// The pop-up's inner HTML (shared by modal() and modalSwap())
// An illustration that opens the body (40-art.js) is lifted above the title: a full-bleed banner across the top of the sheet.
function sheetHTML(title,body,btns){let fig='';if(body.startsWith('<figure class="art-fig"')){const k=body.indexOf('</figure>')+9;fig=body.slice(0,k);body=body.slice(k)}
  return withName(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}" tabindex="-1">${fig}<h2>${title}</h2><div class="mb">${body}</div>${btns.map((b,i)=>`<button class="act ${i===0&&!b.dis&&!b.np?'primary':''}" ${b.legal!==undefined?`data-legal="${b.legal}"`:''} ${b.dis?'disabled':''} onclick="MBTN(${i})"><span class="tx"><b>${b.l}</b>${b.s?'<span>'+b.s+'</span>':''}</span></button>`).join('')}</div>`)}
// A button with stay:true keeps the pop-up on screen while its fn runs: if fn calls modalSwap(), the same sheet shows the next step in place
// (one pop-up for a whole trip, say); if it doesn't, the sheet closes as usual.
let SWAPOK=false,SWAPPED=false;
function modalSwap(title,body,btns,noClose){
  const el=document.getElementById('mbg');
  if(!(SWAPOK&&el)) return modal(title,body,btns,noClose);
  MB=btns;SWAPPED=true;
  if(noClose)el.dataset.lock='1';else delete el.dataset.lock;
  el.innerHTML=sheetHTML(title,body,btns);
  const m=el.querySelector('.modal');if(m){m.classList.add('swap');m.scrollTop=0}
  setTimeout(()=>{const m2=el.querySelector('.modal'),b=el.querySelector('button.act:not([disabled])');if(!document.body.contains(el))return;
    if(b&&!el.querySelector('input,textarea'))b.focus({preventScroll:true});else if(m2)m2.focus({preventScroll:true})},30);
}
window.modalSwap=modalSwap;
function modal(title,body,btns,noClose){
  if(DIGEST&&!DIGEST.open){DIGEST.held.push([title,body,btns,noClose]);return}   // while the morning report is being put together, pop-ups wait behind it
  if(document.getElementById('mbg')){MQ.push([title,body,btns,noClose]);return}
  MB=btns;
  if(!FOCUS_RET)FOCUS_RET=focusKey(document.activeElement)||{};
  const el=document.createElement('div');el.className='modal-bg';el.id='mbg';if(noClose)el.dataset.lock='1';
  el.innerHTML=sheetHTML(title,body,btns);
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();escModal();return}
    if(e.key!=='Tab')return;
    const f=[...el.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length){e.preventDefault();el.querySelector('.modal').focus();return}
    const first=f[0],last=f[f.length-1],cur=document.activeElement;
    if(!el.contains(cur)||cur===el.querySelector('.modal')){e.preventDefault();(e.shiftKey?last:first).focus();return}
    if(e.shiftKey&&cur===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&cur===last){e.preventDefault();first.focus()}});
  document.body.appendChild(el);syncInert();
  setTimeout(()=>{const m=el.querySelector('.modal'),b=el.querySelector('button.act:not([disabled])');if(!document.body.contains(el))return;
    if(b&&!el.querySelector('input,textarea'))b.focus({preventScroll:true});else if(!el.contains(document.activeElement)&&m)m.focus({preventScroll:true})},30);
}
// after a pop-up closes: show the next queued one, else redraw and give focus back
function modalClosed(){
  if(!document.getElementById('mbg')&&MQ.length&&S&&!S.over){const q=MQ.shift();modal(...q)}
  if(S&&!S.over&&!document.querySelector('.title,.end'))render();
  syncInert();
  if(!document.getElementById('mbg')){const k=FOCUS_RET;FOCUS_RET=null;focusBack(k)}
}
window.MBTN=i=>{const b=MB[i];if(b&&b.dis)return;const el=document.getElementById('mbg');
  if(b&&b.stay&&el){SWAPOK=true;SWAPPED=false;try{b.fn&&b.fn()}finally{SWAPOK=false;if(!SWAPPED){const e2=document.getElementById('mbg');e2&&e2.remove()}}modalClosed();return}
  el&&el.remove();const f=b&&b.fn;f&&f();modalClosed()};
// Esc: press the pop-up's own close button if it has one (or its only button); otherwise just put it away. Required pop-ups ignore it.
function escModal(){
  const el=document.getElementById('mbg');if(!el||el.dataset.lock)return false;
  const bs=[...el.querySelectorAll('.modal > button.act')].filter(b=>!b.disabled);
  const c=[...bs].reverse().find(x=>/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i.test(((x.querySelector('.tx b')||x).textContent||'').trim()))||(bs.length===1?bs[0]:null);
  if(c){c.click();return true}
  el.remove();modalClosed();return true}
window.escModal=escModal;
function closeModals(){MQ=[];FOCUS_RET=null;document.querySelectorAll('.modal-bg').forEach(e=>e.remove());syncInert()}

// ---------------- full-screen transition ----------------
// transition('🚌','Off to work','20 minutes', done)  plays a short animation, then calls done().
// Tap to skip. Reduce-motion shortens it.
function transition(ic,cap,cap2,done,snd){
  const el=document.createElement('div');el.className='cross';el.tabIndex=0;sfx(snd||'whoosh');
  el.innerHTML=`<svg viewBox="0 0 480 260" aria-hidden="true"><rect width="480" height="260" fill="none"/><path d="M0 200 h480 M0 222 h480" stroke="#fff" stroke-opacity=".1"/>
    <text class="bob" x="240" y="150" text-anchor="middle" font-size="84">${ic}</text></svg>
    <div class="cap">${withName(cap)}</div><div class="cap2">${withName(cap2||'')}</div><div class="cap2" style="margin-top:18px">tap to skip</div>`;
  document.body.appendChild(el);el.focus();
  let fin=false;const end=()=>{if(fin)return;fin=true;el.remove();done&&done()};
  el.onclick=end;el.onkeydown=e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();end()}};
  setTimeout(end,prefs().rm?700:2200);
}

// ---------------- event tiles (toasts) ----------------
// showTile('🎉','Found $20','On the way to the park','good')   kind: good | bad | warn | info
// One tile at a time, shown just below the HUD so Cash and Rep stay readable. Extra tiles wait in a short queue (duplicates are
// dropped, the oldest goes if it grows past TILE_QUEUE) and each stays about 3.5 seconds. A tile whose title is already in an open
// (or queued) pop-up is skipped: the pop-up says it.
let tileQ=[];const TILE_MAX=1,TILE_QUEUE=3,TILE_MS=3500;
const plain=h=>String(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function modalSays(title){
  const t=plain(withName(title));if(!t) return false;
  const open=document.getElementById('mbg');
  return (open&&plain(open.textContent).includes(t))||MQ.some(q=>plain(q[0]+' '+q[1]).includes(t));
}
function tileBox(){let el=document.getElementById('tiles');if(!el){el=document.createElement('div');el.id='tiles';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}return el}
function showTile(ic,title,sub,kind,when){
  if(!S||S.over) return;
  if(DIGEST&&!DIGEST.open){DIGEST.items.push({ic,title,lines:sub?[sub]:[],kind,tile:true});return}   // a toast that would pop up while you wake: it goes in the morning report
  if(modalSays(title)) return;
  when=when||`${dayName(day()).slice(0,3)} ${fmt(S.t)}`;
  const box=tileBox();
  if(box.children.length>=TILE_MAX){
    if(!tileQ.some(q=>q[1]===title&&q[2]===sub)){tileQ.push([ic,title,sub,kind,when]);while(tileQ.length>TILE_QUEUE)tileQ.shift()}
    return}
  const hud=document.querySelector('.hud');box.style.top=hud?Math.round(hud.getBoundingClientRect().bottom+6)+'px':'';
  const t=document.createElement('div');t.className='tile '+(kind||'info');
  title=withName(title);sub=withName(sub);sfx(kind==='good'?'good':kind==='bad'?'bad':'info');
  t.innerHTML=`<span class="ti">${ic}</span><span class="tt"><small>${{good:'Good news',bad:'Event',warn:'Heads up'}[kind]||'Update'} · ${when}</small><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span><button class="ok" aria-label="Got it">✓</button>`;
  let gone=false;const close=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>{t.remove();if(tileQ.length){const q=tileQ.shift();showTile(...q)}},260)};
  t.querySelector('.ok').onclick=close;t.onclick=e=>{if(e.target===t)close()};
  setTimeout(close,tileQ.length>=2?TILE_MS-1200:TILE_MS);box.appendChild(t);
}
function clearTiles(){tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove())}
window.showTile=showTile;
// ---------------- random events ----------------
// defEvent({
//   id:'found_cash',             unique id (saved in S.ev, so don't rename casually: see MIGRATIONS)
//   hook:'arrive',               when it can fire: 'wake' | 'arrive' | 'travel' | 'night' | any name you fireHook() yourself
//                                (or an array of hooks)
//   tile:['💵','Found $20','good'],  icon, title, kind for the toast
//   chance:0.1,                  0–1, or a function (ctx)=>number
//   bad:true,                    scale chance by the difficulty's "bad" multiplier
//   cond:ctx=>S.loc==='park',    must be true to fire
//   cooldown:2,                  days before it can fire again
//   max:1,                       times per game
//   priority:0,                  higher runs first
//   run:ctx=>{ money(20); say('…'); return {stop:true} }  return {stop:true} to stop later events on this hook
// })
// chain('id') forces an event to fire the next time its hook runs (one event can set up another).
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}
let EV_RUNNING=null;
function chain(id,cause){if(!S.ev.force.includes(id))S.ev.force.push(id);S.ev.cause=S.ev.cause||{};S.ev.cause[id]=cause||EV_RUNNING||null}
window.forceEvent=id=>chain(id);
const HOOK_SCALE={wake:0.85}; // chance that a hook call lets any event through at all (15% of mornings stay quiet)
const HOOK_SUB={wake:'This morning',night:'Overnight'};
function fireHook(hook,ctx={}){
  ctx.hook=hook;let res=null;const popItems=[];
  const capped=infoPopsToday()>=INFO_POP_CAP;   // enough "OK" pop-ups today: the rest show as tiles and go in the log
  const scale=HOOK_SCALE[hook]??1,open=scale>=1||Math.random()<scale;
  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond){let ok=false;try{ok=e.cond(ctx)}catch(err){ok=false}if(!ok)continue}
    if(!open&&!forced) continue;
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=(typeof e.chance==='function'?e.chance(ctx):e.chance)*(e.bad?DF().bad:1);
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    const nBefore=uiNarr.length,mBefore=MQ.length+(document.getElementById('mbg')?1:0);
    if(Array.isArray(ctx.fired))ctx.fired.push(e.id);   // the caller can ask which events ran (endDay: the morning report's picture)
    EV_RUNNING=e.id;let r;try{r=e.run(ctx)||{}}finally{EV_RUNNING=null}

// numeric dotted version compare: >0 when a is newer than b ('1.10.0' > '1.9.2')
const verCmp=(a,b)=>{const p=v=>String(v||'').split('.').map(n=>parseInt(n,10)||0),x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){const k=(x[i]||0)-(y[i]||0);if(k)return k}return 0};
let newerWarned='';
function migrate(d){
  if(!d||typeof d!=='object'||!d.S||typeof d.S!=='object') throw new Error('not a '+GAME.title+' save');
  const from=num(d.schema,1),x=d.S,notes=[];
  // your schema upgrades (21-story.js), oldest first
  for(const m of (typeof MIGRATIONS!=='undefined'?MIGRATIONS:[]).slice().sort((a,b)=>a.to-b.to)) if(from<m.to) m.run(x,notes,d);
  fillDefaults(x,baseState());
  // engine fields must be sane
  x.t=num(x.t,GAME.wake);x.cur=clamp(num(x.cur,Math.floor(x.t/1440)),0,(x.years?x.years*14:GAME.days)-1); // years: Guide Master careers
  if(!L[x.loc]){notes.push('a place from another version doesn’t exist here, so you’re back at the start');x.loc=GAME.startLoc}
  if(!DIFFS[x.diff]) x.diff='normal';
  if(!Array.isArray(x.log)) x.log=[];
  if(!Array.isArray(x.prios)) x.prios=[];
  if(!Array.isArray(x.ev.force)) x.ev.force=[];
  if(!Array.isArray(x.ev.history)) x.ev.history=[];
  const newer=typeof d.app==='string'&&verCmp(d.app,APP_VERSION)>0?d.app:null;
  if(from>SAVE_SCHEMA&&!newer) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  const tabs=allTabs().map(t=>t[0]);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:tabs.includes(d.tab)?d.tab:'act',at:d.at,notes,newer};
}
function rawSave(n){const ls=store();if(!ls)return null;let best=null;
  for(const k of slotKeys(n)){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}if(!best||at>best.at)best={k,v,at}}
  return best}
function loadSave(n){
  const r=rawSave(n);if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){ // set an unreadable save aside instead of crashing on it forever
    try{const ls=store(),sn=n||curSlot();ls.setItem(KEY('save.broken'+(sn>1?'.slot'+sn:'')),r.v);slotKeys(sn).forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new game.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;
  render();
  if(d.newer&&newerWarned!==d.newer){newerWarned=d.newer;modal('⚠️ Save from a newer version',`<p>This save is from ${esc(GAME.title)} ${esc(d.newer)}, newer than this copy (${APP_VERSION}). Update to keep everything: whatever this copy doesn’t know about is ignored, and may be lost if you keep playing here.</p>`,[{l:'Continue anyway',fn:()=>{}}])}
  if(d.notes&&d.notes.length) modal('Save loaded',`<p>Welcome back. Note: ${d.notes.join('; ')}.</p>`,[{l:'Continue',fn:()=>{}}]);
}
window.resumeGame=()=>{const d=loadSave();if(!d)return titleScreen();

// ---- transfer codes: move a game between devices, browsers or the installed app ----
function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
function b64dec(b){return decodeURIComponent(escape(atob(b)))}
function exportCode(){const d=rawSave();if(!d&&!S)return '';const obj=d?JSON.parse(d.v):packSave();return GAME.codePrefix+':'+b64enc(JSON.stringify(obj))}
window.openTransfer=()=>{

  ${code?`<textarea id="exp" readonly aria-label="Your transfer code" style="width:100%;height:70px;font-size:11px;border-radius:8px;border:1.5px solid var(--line);padding:6px">${code}</textarea>
  <button class="act" style="margin-top:6px" onclick="copyCode()"><span class="tx"><b id="cpl">📋 Copy code</b></span></button>`:'<p><i>No game in progress to export.</i></p>'}
  <p style="margin-top:12px">Or paste a code here to load it. It replaces the save in this slot.</p>
  <textarea id="imp" aria-label="Paste a transfer code" oninput="window.IMPV=this.value" placeholder="${GAME.codePrefix}:…" style="width:100%;height:70px;font-size:12px;border-radius:8px;border:1.5px solid var(--line);padding:6px"></textarea>

function importCode(){
  const raw=(window.IMPV||document.getElementById('imp')?.value||'').trim();window.IMPV='';

    const body=raw.replace(new RegExp('^'+GAME.codePrefix+':'),'').replace(/\s+/g,'');
    const d=migrate(JSON.parse(b64dec(body)));
    if(d.S.over) throw new Error('already over');

  }catch(e){setTimeout(()=>{openTransfer();const el=document.getElementById('imperr');if(el)el.textContent=/already over/.test(e.message)?'That game is already finished.':`That code didn’t work. Make sure you copied all of it, starting with ${GAME.codePrefix}:`;const i=document.getElementById('imp');if(i)i.value=raw},0)}

  <div class="kv"><span>Score</span><b>${grp(sc)}${newBest?' 🏆 new best':''}</b></div>${best!=null?`<div class="kv"><span>Previous best</span><b>${grp(best)}</b></div>`:''}
  ${typeof scoreParts==='function'?`<div class="sect" style="margin-top:14px">How the score adds up</div>${scoreParts().map(([k,v,n])=>`<div class="kv"><span>${k}<small style="display:block;color:var(--mute);font-weight:400">${n}</small></span><b>${v<0?'−':''}${grp(Math.abs(v))}</b></div>`).join('')}<div class="kv"><span><b>Total</b></span><b>${grp(sc)}</b></div><div class="sect" style="margin-top:14px">Your career</div>`:''}

// a tab's first letter switches to it (H Here, T To-do, L Log…), Esc closes, ? lists all of this.

const KEY_CLOSE=/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i;
const keyTabs=()=>{const m={};allTabs().forEach(([k,,l])=>{const c=l[0].toLowerCase();if(!m[c])m[c]=k});return m};
const keyVisible=el=>!!el&&!el.disabled&&el.offsetParent!==null&&el.getClientRects().length>0;
function keyTargets(){
  const mb=document.getElementById('mbg');
  if(mb) return {where:'modal',list:[...mb.querySelectorAll('.modal > button.act')].filter(keyVisible)};
  if(document.querySelector('.cross'))return {where:'none',list:[]};
  if(typeof S==='undefined'||!S||S.over||!document.querySelector('#app .hud'))return {where:'none',list:[]};
  return {where:'main',list:tab==='act'?[...document.querySelectorAll('#app .content button.act')].filter(keyVisible):[]}}
function keyHints(){try{
  document.querySelectorAll('.kn').forEach(n=>n.remove());
  const {list}=keyTargets();list.slice(0,9).forEach((b,i)=>{const n=document.createElement('i');n.className='kn';n.setAttribute('aria-hidden','true');n.textContent=i+1;b.appendChild(n)})}catch(e){}}
function keysModal(back){
  const row=(k,t)=>`<div class="keys-row"><kbd>${k}</kbd><span>${t}</span></div>`;
  const tabs=Object.entries(keyTabs());
  modal('⌨️ Keyboard shortcuts',`<div class="keys">${[
    row('1 – 9','Press the numbered button (the small number on its right)'),
    row(tabs.map(([c])=>c.toUpperCase()).join(' '),tabs.map(([,k])=>allTabs().find(t=>t[0]===k)[2]).join(', ')+' tabs'),
    row('Esc','Close the pop-up; skip a transition'),
    row('Enter','Press the highlighted button'),
    row('?','This list')].join('')}</div><p style="font-size:12px;color:var(--mute)">Shortcuts never fire while you’re typing.</p>`,
    (back?[{l:'Back to settings',fn:back}]:[]).concat([{l:'Close',fn:()=>{}}]))}
window.keysModal=keysModal;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key,lk=k.length===1?k.toLowerCase():k;
  if(k==='?'){e.preventDefault();if(!document.getElementById('mbg'))keysModal();return}
  const {where,list}=keyTargets();
  if(/^[1-9]$/.test(k)){const b=list[+k-1];if(b){e.preventDefault();b.click()}return}
  if(where==='modal'){
    if(k==='Escape'){e.preventDefault();escModal()}
    return}
  if(where!=='main')return;
  const kt=keyTabs();if(kt[lk]){e.preventDefault();setTab(kt[lk])}
});

{let q=false;const go=()=>{q=false;keyHints()};

// A boat that is nearly dead or out of service: an emergency patch (to 25 for a day or two) or a loaner for the day, at the shop or a launch.
function boatRescueActions(a){
  const d=day(),trips=todays(d).some(b=>b.type!=='halibut');
  if(canPatch()) a.push({ic:'🩹',l:`Emergency patch — ${$(rp(PATCH_COST))}`,s:`1 hour of epoxy, hose clamps and a borrowed impeller: boat back to ${PATCH_TO}. It still breaks down a lot. The patch gives out after two days. A service or major repair is the real fix.`,cat:'work',dis:!canAfford(rp(PATCH_COST)),
    fn:()=>{const c0=S.boat;spend(rp(PATCH_COST));pass(60);S.patch={d,base:S.boat};S.boat=Math.max(S.boat,PATCH_TO);adj('energy',-3);say(`🩹 Epoxy, hose clamps and a borrowed impeller: ${$(rp(PATCH_COST))}. The boat is back at ${S.boat}, for a day or two. It won’t hold long.`);artShop(c0,null)}});
  if(boatDown()&&S.loaner!==d&&trips) a.push({ic:'🤝',l:`Rent a loaner sled and drift boat — ${$(rp(LOANER_COST))} for today`,s:'A buddy’s old rig for the day, so today’s booked trips can run. The clients notice it is tired. Your own boat still needs the major repair.',cat:'work',dis:!canAfford(rp(LOANER_COST)),
    fn:()=>{const c0=S.boat;spend(rp(LOANER_COST));S.loaner=d;say(`🤝 You borrow a buddy’s old jet sled and drift boat for the day: ${$(rp(LOANER_COST))}. Your own boat is still out of service.`);artShop(c0,todays(d).find(b=>b.type!=='halibut')||null)}});
}
// ⏳ Wait until…: choices that make sense right now (a launch you're at, the time to leave for one, today's first-aid class, +30/+60 min).
function waitChoices(){
  const d=day(),m=tod(),end=(d+1)*1440-1-d*1440,o=[];          // minutes into today; waiting can't run past midnight
  todays(d).sort((x,y)=>TRIPS[x.type].start-TRIPS[y.type].start).forEach(b=>{
    const T=TRIPS[b.type],meet=T.start-60;
    if(T.loc===S.loc){if(m<meet)o.push({at:meet,l:`Until the ${b.who} show up: ${fmt(meet)}`,s:`Next launch: ${T.n}, ${fmt(T.start)}. ${meet-m} min.`,say:`⏳ You wait at ${L[S.loc].name} until the ${b.who} pull in.`})}
    else{const leave=meet-travelMins(S.loc,T.loc);if(m<leave)o.push({at:leave,l:`Until it’s time to leave for the ${T.n.toLowerCase()}: ${fmt(leave)}`,s:`${L[T.loc].name} is ${travelMins(S.loc,T.loc)} min away. ${leave-m} min.`,say:`⏳ You kill time until it’s time to head for ${L[T.loc].name}.`})}
  });
  if(faDue(d)&&faClassDay(d)&&m<780) o.push({at:780,l:'Until the 1:00 PM first-aid class',s:`The Soldotna clinic doors open at 1:00. ${780-m} min.`,say:'⏳ You wait for the 1:00 first-aid class.'});
  [30,60].forEach(x=>o.push({at:m+x,l:`${x} more minutes`,s:`Until ${fmt(S.t+x)}.`,say:`⏳ You wait ${x} minutes.`}));
  return o.filter(x=>x.at>m&&x.at<=end).sort((x,y)=>x.at-y.at).filter((x,i,a)=>i===0||x.at!==a[i-1].at);
}
function waitModal(){
  const o=waitChoices();
  modal('⏳ Wait until…',`<p style="font-size:13px;color:var(--mute)">Time passes, you get a little tired, and nothing else happens. It’s ${fmt(S.t)}.</p>`,
    o.map(x=>({l:x.l,s:x.s,fn:()=>{pass(x.at-tod());say(x.say)}})).concat([{l:'Never mind',fn:()=>{}}]));
}
window.waitChoices=waitChoices;

  if(isSunMon(d)) t.push('<span class="tag bad">🚫 no guide-boat fishing below Skilak</span>');

  if(S.boat<=40) t.push(`<span class="tag ${S.boat<=20?'bad':''}">🔧 boat ${S.boat}${S.boat<=0?(S.loaner===d?' (loaner today)':' (out of service)'):''}</span>`);

function alertBar(){
  const d=day(),m=tod();
  if(noBoat()&&todays(d).some(b=>b.type!=='halibut')) return {t:`🔧 Your boat is out of service (condition 0). A major repair at the shop (${$(rp(MAJOR_REPAIR))}), an emergency patch (${$(rp(PATCH_COST))}) or a loaner (${$(rp(LOANER_COST))}) gets today’s trip on the water.`};
  if(S.boat>0&&S.boat<=10) return {t:BOAT_WARN[3].replace('{b}',S.boat)};
  for(const b of todays(d)){const T=TRIPS[b.type];
    if(m>T.start&&m<=T.start+90&&S.loc!==T.loc) return {t:`⏰ The ${b.who} are waiting at ${L[T.loc].name} (launch was ${fmt(T.start)}).`};
    if(m>=T.start-120&&m<=T.start&&S.loc!==T.loc) return {t:`🛶 ${T.n} launches at ${fmt(T.start)} from ${L[T.loc].name}: ${travelMins(S.loc,T.loc)} min away.`,kind:'info'};}
  {const low=todays(d).find(b=>tripFuel(b)&&tripFuel(b).tank==='fuel'&&fuelShort(b));if(low&&m<TRIPS[low.type].start)return {t:`⛽ ${Math.round(S.fuel)} gallons in the sled; your ${TRIPS[low.type].n.toLowerCase()} burns ~${tripFuel(low).gal} and up to ~${Math.round(expectBurn(low))} with wind or a long run. Fuel dock: Kenai Harbor, ${hoursTxt('harbor').replace('Open ','')}.${homeFuelHint()}`}}
  {const fp=fuelPlan();if(fp.short&&fp.tomorrow&&m>=1020)return {t:`⛽ Fuel for tomorrow: ${fp.need} gallons likely needed, ${fp.have} in the sled. ${m<1320?`Kenai Harbor’s fuel dock is open until ${fmt(1320)}.`:`Kenai Harbor’s fuel dock opens at ${fmt(360)}.`}${homeFuelHint()}`}}
  {const sa=suppliesAlert();if(sa)return sa}
  if(S.boat>10&&S.boat<=40&&todays(d).some(b=>b.type!=='halibut')) return {t:BOAT_WARN[S.boat<=20?2:1].replace('{b}',S.boat),kind:S.boat<=20?'':'info'};
  if(faUrgent(d)) return {t:`⛑️ First-aid card expires ${dayName(S.cred.fa)} night: classes ${FA_CLASS_TXT}`,kind:'info'};
  return null;
}

function onMorning(d){
  if(d===0) return;
  const sd=sday(d),newSeason=sd===0;
  patchExpire(d);
  reqExpire(d).forEach(l=>{say(l);digestLine(l)});
  if(newSeason) startSeason(seasonOf(d));               // 24-career.js: bills, new rules, forecast, upgrades
  rollDay(d);
  const w=WX[S.wx[d]];
  say(newSeason?`❄️➡️☀️ <b>${dlongY(d)}</b>, ${fmt(S.t)}. Season ${seasonOf(d)+1} of ${S.years}. ${w.ic} ${w.n}. Plan the off-season to open this year’s bookings.`:`${dlong(d)}, ${fmt(S.t)}. ${w.ic} ${w.n}.${Math.random()<.4?' '+pick(LORE):''}`);
  if(newSeason) return;
  homeMorning();                                        // 32-home.js: cabin drift, a bear, the garden, one gentle reminder
  const t=todays(d);
  if(t.length) say('🛶 Today: '+t.map(b=>`${TRIPS[b.type].ic} ${TRIPS[b.type].n} at ${fmt(TRIPS[b.type].start)}, ${L[TRIPS[b.type].loc].name} (the ${b.who}, ${b.n})`).join(' · '));
  else say('🛶 No trips booked today. Service the boat, return calls, or go fill the freezer.');
  if(isSunMon(d)) say(`🚫 ${dayName(d)}: no fishing from guide boats on the Kenai below Skilak Lake through July 31.`);
  const strong=REG().mult.sockeye>=.85;
  if(!strong&&S.limit===3&&REG().mult.sockeye<.7&&sd>=5){
    S.limit=2;S.eo.push('Kenai River sockeye limit cut to 2 per day, 4 in possession');
    say('📣 <b>Emergency order:</b> the late run is tracking below its goal. ADF&G cuts the Kenai sockeye limit to <b>2 per day</b>.');
    showTile('📣','Sockeye limit cut to 2','ADF&G emergency order','bad');
  }
  if(strong&&S.limit===3&&(S.cum>1200000*REG().mult.sockeye||sd>=8)){
    S.limit=6;S.eo.push('Kenai River sockeye limit raised to 6 per day, 12 in possession');
    say('📣 <b>Emergency order:</b> with the late run past its escapement goal, ADF&G raises the Kenai sockeye limit to <b>6 per day, 12 in possession</b>.');
    showTile('📣','Sockeye limit raised to 6','ADF&G emergency order','good');
  }
  if(strong&&sd===10&&!S.eo.some(e=>/Russian/.test(e))){
    S.eo.push('Russian River & upper Kenai sockeye limit 6 per day, 12 in possession');
    say('📣 <b>Emergency order:</b> the Russian River and a stretch of the upper Kenai go to 6 sockeye a day, too.');
  }
}
function onNight(where,notes,d){
  if(S.trip){S.trip=null;notes.push('🛶 You never finished the trip. The party drove off without paying.')}
  if(where==='collapsed'){S.loc='shop';notes.push('😵 You were up past midnight and fell asleep in the truck at the shop.')}
  money(-overhead());S.stats.spent+=overhead();notes.push(`💸 Boat payment, insurance and utilities: ${$(overhead())}.`);
  {const fp=fuelPlan();if(fp.short&&fp.tomorrow)notes.push(`⛽ The sled has ${fp.have} gallons and tomorrow’s trips need about ${fp.need}. Fill up at Kenai Harbor (6 AM–10 PM) before you launch.${homeFuelHint()}`)}
  S.book.filter(b=>b.d===d&&b.status==='booked'&&b.asst).forEach(b=>asstSettle(b,notes));
  S.book.filter(b=>b.d===d&&b.status==='booked'&&!b.asst).forEach(b=>{b.status='noshow';adj('rep',-15);S.stats.noshow++;S.stats.hapSum=(S.stats.hapSum||0)+20;S.stats.hapN=(S.stats.hapN||0)+1;
    notes.push(`😠 You never showed for the ${b.who}. They posted a one-star review from the parking lot.`)});
  if(S.unlogged){S.overdue+=S.unlogged;notes.push(`📓 ${S.unlogged} logbook entr${S.unlogged>1?'ies are':'y is'} now overdue. Write ${S.unlogged>1?'them':'it'} up before a trooper asks.`);S.unlogged=0}
  adj('energy',(where==='home'?60:30)/(where==='collapsed'?2:1));
  suppliesNight(notes,d);                                // 31-supplies.js: tonight's meals, spoilage
  if(d===S.cred.fa) notes.push('⛑️ Your first-aid/CPR card expired at midnight. You can’t legally guide until you renew it.');
  if(S.energy<15) notes.push('🥱 You’re running on fumes.');
}

// Is a trip of this type on day d against the rules? (guide boats below Skilak Sun/Mon; charter halibut can't be kept on closed days)
const illegalDay=(type,d)=>!!(TRIPS[type].below&&isSunMon(d))||(type==='halibut'&&halClosed(d));
function makeRequest(){
  const d0=day()+1,end=seasonFirst()+SEASON;if(d0>=end||S.winter) return null;
  const s=seasonOf(day()),span=Math.min(6,end-d0);
  // the dipnet "guests" scam: rolled once per call, and at most one per season
  if(S.dipnetAsk!==s&&Math.random()<.12){
    const p=pick(PARTIES.filter(x=>!x.res));S.dipnetAsk=s;
    return {kind:'dipnet',d:d0+Math.floor(Math.random()*span),n:2+Math.floor(Math.random()*3),who:p.who,from:p.from,res:false};
  }
  const roll=()=>{const d=d0+Math.floor(Math.random()*span),types=weekReqTypes(d);return {d,type:pick(types)}};   // 34-summer.js: what the week's water offers
  for(let i=0;i<24;i++){
    let {d,type}=roll();
    if(illegalDay(type,d)) ({d,type}=roll());             // re-roll an illegal date once; the second pick stands, so some illegal requests still teach the lesson
    const p=pick(PARTIES),kind=Math.random()<.22&&type==='reds'?'king':'trip';
    const nr={reds:[2,6],silver:[2,5],trout:[2,4],halibut:[4,6],king:[2,4]}[type],n=nr[0]+Math.floor(Math.random()*(nr[1]-nr[0]+1));
    let asst=false;
    if(conflicts(d,type)){if(S.up.asst&&type!=='halibut'&&!conflicts(d,type,true))asst=true;else continue}
    const quirk=Math.random()<.25?[pick(['drinker','nolicense','photo','kid'])]:[];
    return {kind,asst,d,type,n,who:p.who,from:p.from,res:!!p.res,quirk,tr:traitsFor({type,who:p.who,quirk:kind==='king'?quirk.concat('kingfan'):quirk})};
  }
  return null;
}
// What's wrong with the requested date, as a modal line ('' when nothing)
function requestWarn(r){
  const T=TRIPS[r.type],iss=issueOf({type:r.type,d:r.d,n:r.n}),w=[];
  if(iss==='sunmon') w.push(`🚫 ${dayName(r.d)}: guide boats can’t fish below Skilak Lake (May 1–Jul 31)`);
  if(iss==='overload') w.push(`🚫 ${T.n}s are limited to ${r.type==='silver'?4:5} anglers on a guide boat`);
  if(r.type==='halibut'&&halClosed(r.d)) w.push(`⚓ ${dayName(r.d)}: charter anglers can’t keep halibut today (${halDaysTxt()})`);
  if(faDue(r.d)&&faClassDay(r.d)&&T.start<960&&T.start+T.len>780) w.push(`⛑️ This runs into the 1–4 PM first-aid class on ${dayName(r.d)}, and your card is still due`);
  return w.map(x=>`<p style="font-size:13px;color:var(--warn)">${x}</p>`).join('');
}
// nearest later day in the same season that is legal and free (null if none). Only date problems are fixed by moving the date.
function nextLegalDay(r){
  const s=seasonOf(r.d),end=weekGap(s)?r.d-sday(r.d)%7+7:seasonFirst(s)+SEASON;   // 1.14.0: weeks apart, a moved trip stays in its week (34-summer.js)
  for(let d=r.d+1;d<end;d++) if(!illegalDay(r.type,d)&&!conflicts(d,r.type,!!r.asst)) return d;
  return null;
}

// ---- requests wait in the Bookings tab ----
// A request that comes in goes to the top of 📅 Bookings (with a dot on the tab) and waits a day or two; the morning report mentions it.
// Only a request for tomorrow or sooner, made while you're on the phone, is answered on the spot.
const REQ_WAIT=2;
const reqKey=r=>r.kind==='dipnet'?'dipnetting at the mouth':`${TRIPS[r.type].ic} ${TRIPS[r.type].n.toLowerCase()}${r.big?` (🎯 ${r.big.txt})`:''}`;
function queueRequest(r,quiet){
  const q={id:S.reqN++,r,exp:day()+REQ_WAIT};S.reqs.push(q);
  const line=`📞 <b>Booking request:</b> the ${r.who} (${r.n}) want a ${reqKey(r)} on ${dlong(r.d)}. Answer it in the 📅 Bookings tab: it waits ${REQ_WAIT===1?'a day':'two days'}.`;
  say(line);
  if(!quiet) showTile('📞','New booking request',`The ${r.who}, ${dlabel(r.d)}. See the Bookings tab.`,'info');

}
function requestArrives(r){if(r.d<=day()+1)requestModal(r);else queueRequest(r)}
const reqDot=()=>!!(S&&S.reqs&&S.reqs.length);
// drop requests that lapsed (the party booked someone else, or the date went by); returns the lines for the morning report
function reqExpire(d){
  if(!S.reqs||!S.reqs.length) return [];
  const gone=S.reqs.filter(q=>q.exp<d||q.r.d<=d);
  S.reqs=S.reqs.filter(q=>!gone.includes(q));
  return gone.map(q=>`📞 The ${q.r.who} didn’t wait for an answer and booked somebody else.`);
}
window.reqAns=(id,k)=>{
  const i=S.reqs.findIndex(q=>q.id===id);if(i<0)return;
  const q=S.reqs[i],o=requestOpts(q.r).opts[k];if(!o||o.dis)return;

};
function reqView(){
  const rs=S.reqs||[];if(!rs.length) return '';
  return `<div class="sect">📞 Booking requests · ${rs.length} waiting</div>`+rs.map(q=>{

const FINISH_TEXT={h1:'{{name}}, that’s a wrap on your career',sub:()=>`${S.years} Julys on the Kenai, ${yearOf(0)}–${yearOf(day())}. The river keeps running; somebody else gets your seams now.`};
function curSeason(){const s=S.stats,o=S.st0||{};return {hap:seasonHap(s,o),tips:(s.tipSum||0)-(o.tipSum||0),year:yearOf(day()),trips:s.trips-(o.trips||0),fares:s.earned-(o.earned||0),earned:(s.earned+s.tips)-((o.earned||0)+(o.tips||0)),wom:S.wom||0,cites:(s.citesTotal||0)-(o.citesTotal||0)}}
// The score, line by line (the end screen shows these rows and they add up to scoreOf()).
function scoreParts(){
  const st=S.stats,cites=st.citesTotal||S.cites,rest=restOfSeason(curSeason()).net;
  const P=[['Net cash',S.money-DF().money,'cash now minus your start money'],['Rest of this summer',rest,'estimated: the off-season settles June, August and September'],
    ['Boats & permits',(S.up?S.up.value:0)*.9,'nine tenths of what you bought'],['Reputation',S.rep*15,`${S.rep} × 15`],['Trips',st.trips*60,`${st.trips} July trips × 60`],
    ['Citations',-cites*400,`${cites} × −400`],['Freezer fish',S.freezer*2,`${S.freezer} × 2`],['Clean record bonus',st.viol===0?300*S.years:0,st.viol===0?`no violations: 300 × ${S.years} seasons`:'you broke a rule']];
  return P.map(([k,v,n])=>[k,Math.round(v),n]);
}
function scoreOf(){return scoreParts().reduce((a,r)=>a+r[1],0)}
const GRADE_CUTS=[62000,55000,44000,27000];            // A, B, C, D: score per season, the same on every difficulty
function gradeOf(sc){
  sc=sc/(S.years||1);                                   // graded per season, so careers of any length compare
  if(sc>=GRADE_CUTS[0]) return ['A','Guide Master','Other guides watch where you anchor (legally).'];
  if(sc>=GRADE_CUTS[1])  return ['B','River Rat','You know every seam from Big Eddy to the Russian.'];
  if(sc>=GRADE_CUTS[2])  return ['C','Seasonal Hand','Booked, tired and still mostly dry.'];
  if(sc>=GRADE_CUTS[3])  return ['D','Greenhorn','You learned the regs the expensive way.'];
  return ['F','Hang Up the Waders','Maybe the slime line is hiring.'];
}
function endRows(){
  const s=S.stats;
  const last=curSeason();last.rest=restOfSeason(last);
  const yrs=S.seasons.concat([last]).map(x=>`<b>${x.year}:</b> ${x.trips} July trips, ${$(x.earned)} earned${x.rest&&x.rest.trips?`<br><span style="color:var(--mute)">rest of summer (estimated, not played): about ${x.rest.trips} trips, ${$(x.rest.net)} net</span>`:''}`).join('<br>');
  return [['Difficulty',`${DF().ic} ${DF().n}: ${DF().enforce<1?'fewer patrols, cheaper bills':DF().enforce>1?'more patrols, dearer bills, pickier clients':'standard patrols and bills'}; no score bonus`],['Career',`${S.years} seasons`],['Season by season',yrs],['Cash',$(Math.round(S.money))],['Net over the career',$(Math.round(S.money-DF().money))],['Boats & permits bought',S.up&&S.up.value?$(S.up.value):'none'],['July trips played / clients',`${s.trips} / ${s.clients}`],
    ['Fish landed',s.fish],['Trips where everyone limited',s.limits],['Tips',$(s.tips)],['Reputation',S.rep],
    ['Record',`${s.citesTotal||0} citation${(s.citesTotal||0)===1?'':'s'}, ${s.warnsTotal||0} warning${(s.warnsTotal||0)===1?'':'s'}, ${$(s.fines)} in fines`],
    ['Fuel',`${grp(s.fuelGal||0)} gal, ${$(Math.round(s.fuelCost||0))}`],['Coast Guard tows',s.tows||0],['Winter camping',campEndText()],['The cabin',homeEndText()],['Kings released',s.kings],['Freezer',`${S.freezer} reds`],['Boat checks passed',s.checks]];
}

// ---- save migrations ----
const MIGRATIONS=[
  // schema 2 (1.5.1): the trip result lives in b.out; b.res is only the Alaska-resident flag again
  {to:2,run:x=>{(x.book||[]).forEach(b=>{if(b.res&&typeof b.res==='object'){b.out=b.res;b.res=false}else if(typeof b.res!=='boolean')b.res=!!b.res})}},
  // schema 3 (1.9.0): camping grew from one trip a winter into a day budget with gear, a license year and next-season bonuses (28-camping.js).
  // An old save's single trip counts against this winter's days, so a game in the middle of an off-season carries on where it was.
  {to:3,run:x=>{
    const o=x.camp,c=campBase();
    if(o&&o.v===2){x.camp=o;return}
    if(o&&typeof o==='object'&&typeof o.s==='number'){c.s=o.s;c.days=Math.max(1,o.nights||1);c.trips=1;c.tot.trips=1}
    c.tot.nights=(x.stats&&x.stats.campNights)||0;
    x.camp=c;
  }},
  // schema 4 (1.10.0): cabin upkeep (32-home.js, src/home/). An existing cabin counts as kept up this far: nothing is overdue the moment you load,
  // a game in the middle of an off-season gets this winter's jobs, and a generator you already own is in shape.
  {to:4,run:x=>{
    const c=CabinUpkeep.newState(),y0=x.winter&&typeof x.winter.s==='number'?x.winter.s-1:Math.floor((typeof x.cur==='number'?x.cur:0)/14);
    Object.keys(c.did).forEach(k=>{if(k!=='bins')c.did[k]=y0});c.did.septic=y0-1;c.y=y0;
    if(!x.cabin||typeof x.cabin!=='object')x.cabin=c;
    if(typeof x.homeAsk!=='number')x.homeAsk=-1;
  }},
  // schema 5 (1.13.0): parties have traits (what they came for) and leave reviews. Booked parties and regulars get theirs now;
  // a trip in progress carries on the old way (no beats), and its party still writes a review at the dock.
  {to:5,run:x=>{
    if(!Array.isArray(x.reviews))x.reviews=[];
    (x.book||[]).forEach(b=>{if(!Array.isArray(b.tr))b.tr=traitsFor(b)});
    (x.regs||[]).forEach(g=>{if(!Array.isArray(g.tr))g.tr=traitsFor(g)});
    (x.reqs||[]).forEach(q=>{if(q&&q.r&&q.r.kind!=='dipnet'&&!Array.isArray(q.r.tr))q.r.tr=traitsFor(q.r)});
  }},
  // schema 6 (1.14.0): the weeks of the summer you play (34-summer.js) and season goals (35-goals.js). Defaults only, so it runs the same
  // whether or not 1.13's schema 5 ran first: a season without a pick plays the two July weeks, as before, and goals start with this season.
  {to:6,run:x=>{
    if(!x.weeks||typeof x.weeks!=='object'||Array.isArray(x.weeks))x.weeks={};
    if(!Array.isArray(x.goalLog))x.goalLog=[];
    if(x.goals!=null&&(typeof x.goals!=='object'||!Array.isArray(x.goals.list)))x.goals=null;
  }},
  // schema 8 (1.15): memories (37-memories.js): the trophy wall, firsts, postcards, the mentor, the rating's milestones, all in S.mem.
  // Written to run on any earlier save (schemas 5–7): it only adds S.mem. A career already under way has had its first trip, so the mentor
  // stays home (Help → "Ride with the mentor again" brings him). Records start from here; past reviews already count toward the rating.
  {to:8,run:x=>{x.mem=fillDefaults(x.mem&&typeof x.mem==='object'&&!Array.isArray(x.mem)?x.mem:{},memBase(x))}},
  // schema 9 (1.16.0, grow the business, 36-business.js): the outfit. Touches only x.biz, so it runs the same whether or not schemas 5, 6 and 8 ran first.
  // (Built as schema 7 on 1.12.1 and never released; 7 stays unused, so the order is 5, 6, 8, 9.)
  // A save already past its second season gets the outfit unlocked straight away.
  {to:9,run:x=>{
    if(!x.biz||typeof x.biz!=='object'||Array.isArray(x.biz))x.biz=bizBase();else fillDefaults(x.biz,bizBase());
    if(Array.isArray(x.seasons)&&x.seasons.length>=BIZ_UNLOCK)x.biz.on=true;
  }},
];
// ============================================================
//  GUIDE MASTER, part 3: running a trip.
//  Enforcement (cite / violate), the trip runner (a chain of decision pop-ups),
//  fishing spots and the dilemmas ("steps"). Rules follow the 2026 Kenai summary in regsView() (20-world.js).
// ============================================================

// ---- enforcement ----
const COPS=['an Alaska Wildlife Trooper','a State Parks ranger in a jet sled','an ADF&G enforcement officer at the launch'];
const NOAA='a NOAA Fisheries enforcement officer at the harbor';
function cite(what,fine,minor,notes,who){
  who=who||pick(COPS);let line;
  if(minor&&S.warns<1){S.warns++;S.stats.warnsTotal=(S.stats.warnsTotal||0)+1;line=`⚠️ ${who} writes you a warning for ${what}. One warning a season; the next one costs money.`}
  else{fine=Math.round(fine*DF().fine*(1+DF().esc*S.cites));S.cites++;S.citeLog.push(day());S.stats.citesTotal=(S.stats.citesTotal||0)+1;money(-fine);S.stats.fines+=fine;adj('rep',-6);
    line=`🚨 ${who} cites you for ${what}: ${$(fine)} fine. That’s ${S.cites} active citation${S.cites>1?'s':''} of 3 before State Parks pulls your Kenai River guide permit.${S.cites>1?' Repeat offenders pay more for every citation on the record.':''} (Citations drop off after the next season.) Citations are public record, and clients look their guide up: fewer bookings for the rest of the summer.`}
  showTile('🚨',minor&&line.startsWith('⚠️')?'Warning':'Citation',what,'bad');
  if(notes) notes.push(line); else say(line);
  if(line.startsWith('🚨')) citeCancel(notes);
}
// ---- (1.8.1) a habit gets noticed ----
// Breaking a rule can pay on the day, but over a season it catches up with you:
//  · every rule you break this July makes the next one likelier to be caught (troopers and other guides learn your boat);
//  · a guide who sees it tells the others (word of mouth, so fewer off-season bookings);
//  · a citation is public record: it can cost a booked July party, and each one trims the rest of the summer's bookings (25-fuel.js).
const HEAT_P=.15, SEEN_WOM=4, CITE_CANCEL=.85, CITE_REST=.08;
const heat=()=>Math.max(0,((S.stats&&S.stats.viol)||0)-((S.st0&&S.st0.viol)||0));   // rules broken this season (resets each winter)
function citeCancel(notes){
  if(!S.book||Math.random()>=CITE_CANCEL) return;
  const end=seasonFirst()+SEASON,bs=S.book.filter(b=>b.d>day()&&b.d<end&&b.status==='booked');if(!bs.length) return;
  const b=pick(bs);b.status='cancelled';S.stats.cancelled++;S.stats.citeCancels=(S.stats.citeCancels||0)+1;
  const l=`📵 The ${b.who} look you up, find the citation and cancel their ${dlabel(b.d)} ${TRIPS[b.type].n}. They want the deposit back, and you give it.`;
  if(notes) notes.push(l); else say(l);
}
function violate(notes,{p,fine,what,minor,who}){
  const h=heat();S.stats.viol++;
  if(Math.random()<Math.min(.95,p*DF().enforce*(1+HEAT_P*h))){cite(what,fine,minor,notes,who);return true}
  if(Math.random()<.3){adj('rep',-2);S.wom=(S.wom||0)-SEEN_WOM;const l='👀 Another guide saw it. Word travels fast on the Kenai: fewer off-season bookings, and the troopers hear about it too.';if(notes)notes.push(l);else say(l)}
  return false;
}

    if(halClosed(b.d)){const rk=Math.round(fishers*(1+q*3));line=`${rk} rockfish & lingcod, halibut released`}
    else{for(let i=0;i<fishers;i++)fish+=clamp(Math.round(2*q+(r()-.5)*1.2),0,2);S.stats.halibut+=fish;line=`${fish} halibut`}
  }
  fish+=t.kept;
  homeProcessing(b,fish,t);                              // 32-home.js: the fish processing station
  // ---- what the day was worth ----
  // The booked fare is the base. A good day (fish, happy clients, a clean boat and tackle) earns bigger tips and word of mouth;
  // a bad one (skunked, out of tackle, a breakdown, grumpy clients) means a partial refund and a bad review.
  const goal=BT?goalOf(b,t,Object.assign({},C,{fish:fish-t.kept})):{h:0,good:[],bad:[]};   // 33-day.js: what the party came for
  const happy=45+frac*45+t.happy+goal.h+upH(b.type)+DF().mood-RATE_MOOD*rateSteps();
  const fare=towed?Math.round(payOf(b)*.5):payOf(b),base=b.type==='halibut'&&!S.up.chp?1200:fare;
  const tip=Math.round(base*clamp((happy-60)/100,0,.3)*memTipK());   // 39-stars.js: a top-rated guide's parties tip more
  const skunk=fishers>0&&fish-t.kept<=0&&b.type!=='trout'&&!(b.type==='halibut'&&halClosed(b.d));
  const refundPct=clamp((42-happy)/200,0,.25)+(skunk?.05:0),refund=Math.round(fare*refundPct);
  const xs=(t.x||[]),xnet=xs.reduce((a,[,v])=>a+v,0),xpos=xs.reduce((a,[,v])=>a+Math.max(0,v),0),xneg=xs.reduce((a,[,v])=>a+Math.min(0,v),0);
  let dRep=clamp(Math.round((happy-50)/8),-6,8);const review=happy<35;if(review) dRep-=2;
  S.wom=(S.wom||0)+(happy>=96?2:happy>=88?1:happy<30?-2:happy<40?-1:0);
  const costs=T.loc==='lower'&&!S.up.dock?LAUNCH_FEE:0;
  if(r()<.07&&b.type!=='halibut'){money(-165);S.stats.spent+=165;t.notes.push('🎣 A client high-sticks a rod into the gunwale. Snap. $165 for a new rod and reel.')}
  S.gear=Math.max(0,S.gear-1);
  const lost=t.lost||0,short=BT&&C.fished<T.len?T.len-C.fished-30:0;   // called it early: back sooner, a little less tired
  pass((towed?T.len+120:T.len-sledTimeSaved(b.type))+lost-Math.max(0,short));if(short>0)adj('energy',Math.round(T.energy*short/T.len*.6));if(towed&&ft.tank==='fuel')S.loc='harbor';adj('energy',-T.energy+(sledTimeSaved(b.type)?3:0)-Math.round(lost/20));if(!t.loan)adj('boat',-Math.round((3+Math.floor(r()*4))*(S.up.motor?.5:1)*DF().wear));adj('rep',dRep);
  if(noBoat()&&b.type!=='halibut')t.notes.push('🔧 The boat is out of service: you can’t launch again until a major repair, an emergency patch or a loaner.');
  else if(t.boat0!=null&&!t.loan)boatWatch(t.boat0);
  money(fare-refund+tip+xnet-costs);
  const st=S.stats;st.hapSum=(st.hapSum||0)+clamp(happy-DF().mood+RATE_MOOD*rateSteps()*.7,0,110);st.hapN=(st.hapN||0)+1;st.tipSum=(st.tipSum||0)+tip;   // the season’s quality (24-career, 25-fuel): relative to the difficulty’s client mood
  st.trips++;st.clients+=b.n;st.fish+=fish;st.earned+=fare-refund;st.tips+=tip+xpos;st.spent+=costs-xneg;
  S.unlogged++;S.skill++;
  const net=fare-refund+tip+xnet-costs;
  const rv=addReview(b,t,happy,C||{fish:fish-t.kept,frac,limits,fishers},goal);  // 33-day.js: their review, in their words
  b.status='done';b.out={happy:Math.round(happy),fish,line,fare,refund,tip,net,stars:rv.stars};S.trip=null;
  storyAfterTrip(b,happy,t.notes);                      // 30-stories.js: returning parties, story arcs
  const mem=memDock(b,t,{C,rv,happy,fish});              // 37-memories.js: records, firsts, the catch card, the rating's milestones, the mentor's last word
  say(`${T.ic} ${T.n} with the ${b.who}: ${line}. Paid ${$(fare-refund)} + ${$(tip+xpos)} in tips.`);
  const mood=happy>=82?'😁 They’re already asking about next season. Word of mouth will bring you more bookings.':happy>=65?'🙂 Solid day. Handshakes at the trailer.':happy>=45?'😐 Polite thanks, small tip.':review?'😠 Tight-lipped goodbyes and a one-star review. Word gets around the Kenai.':'😕 They leave a little deflated.';
  const row=(l,v)=>`<br>${l}: <b>${v>=0?'':'−'}${$(Math.abs(v))}</b>`;
  const why=[];if(skunk)why.push('skunked');if(S.gear<=0&&t.notes.some(n=>n.startsWith('🪱')))why.push('no tackle');if(refund&&happy<42)why.push('unhappy clients');
  modalSwap(`${T.ic} Back at the dock`,`${(t.homeEv&&homeArt(t.homeEv))||artSlot('boat',()=>artBoatCtx(b,['dock',T.loc==='homer'||S.loc==='harbor'?'harbor':'launch']),{rest:true,key:'dock:'+t.id})}${mem.top}${t.notes.map(n=>`<p>${n}</p>`).join('')}
    <p><b>Catch:</b> ${line}${t.kept?` (${t.kept} kept on the sly)`:''}${lost?` · ${lost} minutes lost`:''}</p>
    ${towed?'<p>🛟 <b>Towed in.</b> Half the fare refunded.</p>':''}<p><b>The pay:</b>${row(`Booked fare${b.type==='halibut'&&!S.up.chp?' (day rate)':''}`,fare)}${refund?row(`Refund${why.length?` (${why.join(', ')})`:''}`,-refund):''}${row('Tip',tip)}${xs.map(([l,v])=>row(l,v)).join('')}${costs?row('Launch fee',-costs):''}<br><b>Net: ${net<0?'−':''}${$(Math.abs(net))}</b></p>
    <p>${mood} Rep ${dRep>=0?'+':'−'}${Math.abs(dRep)}.</p>${reviewHTML(rv,b)}${mem.html}
    <p style="font-size:13px;color:var(--mute)">📓 Log it in your ADF&amp;G logbook before bed.</p>`,[{l:'Head in',fn:()=>{}}].concat(b.card?[{l:'Hand them your card and ask them back',s:'10 minutes. After a day like this, most say yes.',fn:()=>regCard(b)}]:[]));
  sfx(happy>=50?'good':'bad');
}
// ============================================================
//  GUIDE MASTER, part 4: the fish.
//  Run timing for each species by date, daily weather and river level, Cook Inlet tides
//  and time-of-day bites. These drive trip quality, the sonar count, dipnetting and
//  "Take the boat out" (solo fishing when the boat isn't booked).
//
//  Run timing is a simplified model of typical Kenai returns, not a forecast:
//    late-run sockeye: enter mid-July, peak at the sonar around Jul 20–25, reach the upper river ~2 weeks later
//    coho: first fish late July, peak mid-August        pinks: even years only, peak early-to-mid August
//    late-run kings: peak late July (closed in 2026; later seasons vary)     rainbows/Dollies: resident, better as sockeye spawn
//    halibut: on the shallower summer grounds from late spring through September
// ============================================================
// doyOf(d), evenYear(d), seasonOf(d): 24-career.js. Each season's REG().mult/shift scale and move the runs.
const gauss=(x,c,s)=>Math.exp(-Math.pow((x-c)/s,2)/2);

// loc: where it can be fished and how good that water is for it (0–1). lag: days behind the sonar at river mile 19.
const SPECIES={
  sockeye:{n:'Sockeye',ic:'🐟',keep:true,lim:()=>S.limit,rate:1.2,loc:{lower:1,cooper:.6,kbeach:1},lag:{cooper:12},
           curve:x=>.08+.92*gauss(x,202,7)+.25*gauss(x,176,8),note:'Late run peaks at the sonar around Jul 20–25.'},
  coho:   {n:'Coho (silvers)',ic:'🎣',keep:true,lim:()=>2,rate:.6,loc:{lower:1,cooper:.15},lag:{cooper:20},
           curve:x=>gauss(x,228,12),note:'First silvers in late July; the run peaks mid-August.'},
  pink:   {n:'Pinks (humpies)',ic:'🩷',keep:true,lim:()=>6,rate:1.6,loc:{lower:1},
           curve:x=>gauss(x,222,7),note:'Even years only: in even Augusts the river floods with them.'},
  king:   {n:'King',ic:'👑',closed:true,lim:()=>1,rate:.15,loc:{lower:1,cooper:.2},
           curve:x=>.35*gauss(x,205,9),note:'Late run peaks in late July. Open, catch-and-release or closed, year to year: see Regs.'},
  trout:  {n:'Rainbow trout',ic:'🌈',cr:true,rate:2.4,loc:{cooper:1,lower:.3},
           curve:x=>.45+.4*gauss(x,225,15),note:'Resident fish. Get better as the sockeye spawn and the bead bite starts.'},
  dolly:  {n:'Dolly Varden',ic:'🐠',cr:true,rate:2,loc:{cooper:.85,lower:.3},
           curve:x=>.4+.4*gauss(x,220,15),note:'Follow the salmon; eat eggs and flesh.'},
  halibut:{n:'Halibut',ic:'🫓',keep:true,lim:()=>2,rate:.9,loc:{homer:1},
           curve:x=>.55+.35*gauss(x,196,35),note:'On the summer grounds. Fish the slack tide.'},
};

// ---- weather: generated each morning by rollDay() ----
function rollWeather(d){
  const k=S.wx[d]||'sun',r=(a,b)=>a+Math.random()*(b-a);
  const w={temp:Math.round({sun:r(66,76),cloud:r(57,65),rain:r(51,58),wind:r(56,64)}[k]),
    wind:Math.round({sun:r(3,10),cloud:r(5,12),rain:r(8,16),wind:r(18,28)}[k]),
    dir:pick(['N','NE','SE','S','SW','W','NW']),rain:k==='rain'?Math.round(r(.3,.9)*10)/10:0};
  // the Kenai is glacial: hot days melt ice and raise it, rain raises it, then it recedes
  const before=S.water??.5;
  S.water=clamp(before+w.rain*.35+(w.temp>=68?.06:0)-.07,.1,1);
  w.dw=Math.round((S.water-before)*100)/100;w.level=S.water;
  S.wxd[d]=w;
}
const wxOf=d=>S.wxd[d]||{temp:62,wind:8,dir:'SW',rain:0,dw:0,level:.5};
const waterTxt=w=>`${w.level>.75?'high':w.level<.3?'low':'normal'}, ${w.dw>.05?'rising':w.dw<-.04?'dropping':'steady'}`;
function windRisk(d=day()){return clamp(wxOf(d).wind/12,.5,2.2)}   // scales Skilak / Cook Inlet weather risks

// ---- tides at the mouth of the Kenai (semi-diurnal, spring/neap cycle). Heights in feet, roughly MLLW. ----
function tide(t){
  const amp=8+3.5*Math.cos(2*Math.PI*(t/1440)/14.77);
  const ph=2*Math.PI*(t-210)/745;
  return {h:10.5+amp*Math.cos(ph),rate:-Math.sin(ph),amp};
}
function tideTable(d=day()){
  const out=[];let p=tide(d*1440-5).h,c=tide(d*1440).h;
  for(let m=5;m<=1440;m+=5){const n=tide(d*1440+m).h;
    if(c>p&&c>=n) out.push({hi:true,m:m-5,h:c});else if(c<p&&c<=n) out.push({hi:false,m:m-5,h:c});p=c;c=n}
  return out;
}
const tideNow=(t=S.t)=>{const x=tide(t);return `${x.rate>.25?'flooding (incoming)':x.rate<-.25?'ebbing (outgoing)':x.h>14?'high slack':'low slack'}, ${x.h.toFixed(1)} ft`};

// ---- how good the fishing is: species × place × moment ----
function todFactor(sp,loc,t){
  const m=((t%1440)+1440)%1440,x=tide(t);
  if(loc==='kbeach') return .7+.35*(x.h-10.5+x.amp)/(2*x.amp)+(x.rate>0?.15:0);       // reds ride the incoming tide
  if(sp==='halibut') return 1.15-.35*Math.abs(x.rate);                               // slack tide
  const dawn=m>=300&&m<540,eve=m>=1080&&m<1320,night=m<300||m>=1320;
  if(sp==='sockeye') return dawn?1.15:eve?1.05:night?.8:.9;                           // midday sun + crowds
  if(sp==='coho'||sp==='king') return dawn?1.2:eve?1.05:night?.7:.85;
  if(sp==='trout'||sp==='dolly') return dawn||eve?1.1:.95;
  return 1;
}
function wxFactor(sp,loc,d){
  const w=wxOf(d),k=S.wx[d]||'sun';let f=1;
  if(loc==='lower'&&(sp==='sockeye'||sp==='pink')) f*=w.dw>.08?.88:1;                  // rising, dirty water scatters reds
  if(sp==='coho') f*=k==='rain'?1.08:1;                                              // fresh water pushes silvers in
  if(sp==='trout'||sp==='dolly') f*=(k==='cloud'||k==='rain'?1.08:k==='sun'?.94:1)*(w.level>.75?.88:1);
  if(sp==='halibut') f*=w.wind>18?.6:w.wind>12?.85:1;
  return f;
}
// this season's run size and timing for a species on a day (before place and daily noise)
function runCurve(sp,x,d){
  const R=REG(),m=R.mult[sp]??1,sh=(sp==='sockeye'||sp==='coho')?R.shift:0;
  return SPECIES[sp].curve(x-sh)*(sp==='pink'?(evenYear(d)?1:.05):1)*(sp==='sockeye'||sp==='coho'||sp==='king'?m:1);
}
function abundance(sp,loc,d=day()){
  const S_=SPECIES[sp],lw=S_&&S_.loc[loc];if(!lw)return 0;
  const lag=(S_.lag&&S_.lag[loc])||0,nz=(S.noise[d]&&S.noise[d][sp])||1;
  return clamp(runCurve(sp,doyOf(d)-lag,d)*nz*lw,0,1.3);
}
function fishOdds(sp,loc,t=S.t){const d=Math.floor(t/1440);return clamp(abundance(sp,loc,d)*todFactor(sp,loc,t)*wxFactor(sp,loc,d),0,1.4)}
function avgOdds(sp,loc,t0,mins){let s=0,n=0;for(let m=0;m<=mins;m+=30){s+=fishOdds(sp,loc,t0+m);n++}return s/n}

// runFactor() (used by trips): how this trip's water compares to a typical July trip
const TRIP_SP={reds:['sockeye','lower',.6],silver:['coho','lower',.15],trout:['trout','cooper',.6],halibut:['halibut','homer',.75]};
function runFactor(type,d=day()){
  const [sp,loc,center]=TRIP_SP[type]||TRIP_SP.reds,T=TRIPS[type];
  return clamp((avgOdds(sp,loc,d*1440+T.start,T.len)/center-1)*.15,-.15,.15);
}
// daily run noise + sonar count; called from rollDay()
function rollRun(d){
  const nz={};Object.keys(SPECIES).forEach(k=>nz[k]=Math.round((.7+Math.random()*.6)*100)/100);
  S.noise[d]=nz;
  return Math.round(runCurve('sockeye',doyOf(d),d)*nz.sockeye*230000/10)*10+Math.floor(Math.random()*10);
}

// ---- where to fish today (1.8.0): each spot answers to the day's water, wind, run and tide ----
// The spots in SPOTS (22-trips.js) are not equally good every day. SPOT_FIT[type][i] returns the day's reasons for spot i (value, text);
// they sum to a fit between -1 and 1 and move the catch by SPOT_Q per point. Scouting adds the day's hidden local noise (exact);
// the Fish tab shows the reasons from the conditions alone. Nothing is hidden from a player who looks: the buttons carry the hint.
const SPOT_Q=.15;
const TYPE_IX={reds:1,silver:2,trout:3,halibut:4};
const hz=(a,b,c)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
// today's conditions as signed readings (about -1 to +1, centred on a typical July day)
function spotConds(type,d=day()){
  const T=TRIPS[type],[sp,loc]=TRIP_SP[type]||TRIP_SP.reds,w=wxOf(d),k=S.wx[d]||'sun',n=(x,c,r)=>clamp((x-c)/r,-1,1);
  return {run:n(abundance(sp,loc,d),sp==='coho'?.09:.78,sp==='coho'?.12:.4),sock:n(abundance('sockeye','cooper',d),.22,.15),calm:n(w.wind,9,-6),lvl:n(w.level,.28,.3),
    trend:w.dw>.04?-.8:w.dw<-.05?.3:0,cloud:k==='cloud'||k==='rain'?.7:k==='sun'?-.7:0,slack:n(1-Math.abs(tide(d*1440+T.start+T.len/2).rate),.3,.35)};
}
const R=(v,up,down)=>[v,v>=0?up:down];     // a reading times its weight, with the reason for each sign
const SPOT_FIT={           // same order as SPOTS in 22-trips.js; null = no read (the closed-bank spot)
  reds:[
    c=>[R(.6*c.run,'a strong run stacks the seams','a thin run leaves the seams empty'),R(c.trend,'falling, clearing water holds reds in the seams','rising, dirty water scatters the seams')],
    c=>[R(.6*c.lvl,'high water pushes reds onto the gravel bars','low water leaves the bars dry'),R(.3*c.calm,'a calm run upriver','wind makes the long run rough')],
    null,
    c=>[R(.5*c.cloud,'overcast keeps the reds on the bank edge','bright sun pushes them to deep water'),R(-.3*c.run,'a thin run slides along the bank shallows','a big run crowds the walkway')]],
  silver:[
    c=>[R(.6*c.lvl,'big water fills the deep slots','low water empties the deep slots'),R(.3*c.calm,'easy trolling','wind makes trolling rough')],
    c=>[R(c.trend,'falling water parks silvers in the soft water','rising water drives silvers out of the soft water'),R(.4*c.cloud,'overcast helps','bright sun puts them down')],
    c=>[R(.6*c.run,'enough silvers to spread upriver','too few silvers to bother going this far'),R(.3*c.calm,'a calm run upriver','wind on the long run')]],
  trout:[
    c=>[R(.5*c.sock,'spawning reds have the rainbows on the egg bite','few spawning reds yet, so no egg bite'),R(-.4*c.lvl,'clear water shows the beads','milky, high water hides the beads'),R(.2*c.cloud,'overcast helps','bright sun')],
    c=>[R(c.trend===0?.4:-.3,'steady water fishes the riffles well','a changing river puts the fish down'),R(.3*c.cloud,'overcast helps','bright sun')],
    c=>[R(.8*c.calm,'a calm lake','whitecaps on Skilak')]],
  halibut:[
    c=>[R(.6*c.slack,'slack tide at the mouth','running tide at the mouth'),R(-.2*c.calm,'sheltered water','')],
    c=>[R(.6*c.calm,'light wind on the flats','chop on the flats'),R(.3*c.slack,'slack tide','running tide')],
    c=>[R(.9*c.calm,'calm seas out to the Barrens','chop out toward the Barren Islands')]],
};
// fit of spot i of a trip type on day d: {f, why}; exact adds the day's local noise (what scouting shows), otherwise conditions only
function spotFit(type,i,d=day(),exact=true){
  const fn=(SPOT_FIT[type]||[])[i];if(!fn) return null;
  const terms=fn(spotConds(type,d)),sum=terms.reduce((a,x)=>a+x[0],0),nz=exact?(hz(d,TYPE_IX[type]||0,i)-.5)*.7:0;
  const top=terms.reduce((m,x)=>Math.abs(x[0])>Math.abs(m[0])?x:m,[0,'']);
  return {f:clamp(sum+nz,-1,1),why:top[0]?top[1]:''};
}
const spotWord=f=>f>=.45?'Hot':f>=.15?'Good':f>-.15?'Fair':'Poor';
// did you scout where this trip goes (today or yesterday)?
const scoutedFor=(type,d=day())=>{const loc=TRIPS[type].loc;return loc==='lower'?S.scout>=d-1:!!(S.scoutAt&&S.scoutAt[loc]>=d-1)};
// what the player knows when picking a spot: 'exact' (scouted), 'tab' (looked at the Fish tab today) or null
const spotHint=(type,d=day())=>scoutedFor(type,d)?'exact':S.look===d?'tab':null;
const spotsToday=d=>{const t=[...new Set(todays(d).map(b=>b.type))];return t.length?t:['reds']};

// ---- 🚤 Take the boat out: booking-aware ----
// Returns the action for the Here tab at the lower launch or Cooper Landing (null elsewhere).
function boatAction(){
  if(S.loc!=='lower'&&S.loc!=='cooper') return null;
  const d=day(),m=tod(),boat=S.loc==='lower'?'jet sled':'drift boat';
  if(boatDown()) return {ic:'🚤',l:`Take the ${boat} out`,s:'Out of service at condition 0. Get a major repair at the shop first.',cat:'fish',dis:true,fn:()=>{}};
  const pend=todays(d).map(b=>({b,T:TRIPS[b.type]})).filter(x=>m<=x.T.start+90).sort((a,b)=>a.T.start-b.T.start)[0];
  let max=Math.max(0,(S.loc==='lower'?1080:1320)-m),why='';
  if(pend){
    const {b,T}=pend,here=T.loc===S.loc;
    if(here&&m>=T.start-60) return {ic:'🚤',l:'Take the boat out',s:`It’s booked: the ${b.who} are on the dock. Launch their trip instead.`,cat:'fish',dis:true,fn:()=>{}};
    const free=T.start-60-m-(here?0:travelMins(S.loc,T.loc));
    max=Math.min(max,free);why=` Back by ${fmt(T.start-60-(here?0:travelMins(S.loc,T.loc)))} for the ${b.who}.`;
  }
  if(max<120) return {ic:'🚤',l:'Take the boat out',s:pend?`Not enough time before your ${TRIPS[pend.b.type].n} with the ${pend.b.who} at ${fmt(pend.T.start)}.`:S.loc==='lower'?'Guide-vessel fishing below Skilak ends at 6 PM.':'Too late in the day to float.',cat:'fish',dis:true,fn:()=>{}};
  return {ic:'🚤',l:`Take the ${boat} out`,s:`No clients: fish for your freezer and scout the water. Up to ${Math.floor(max/60)} h.${why}${S.loc==='lower'?` Tank: ${Math.round(S.fuel)} gal (~${bn('soloHour')}/hour).`:''}`,cat:'fish',fn:()=>boatOut(max)};
}
function boatOut(max){
  const d=day(),m=tod(),loc=S.loc;
  if(loc==='lower'){
    if(isSunMon(d)) return modal('🚫 Your sled is a registered guide vessel',`<p>From May 1 to July 31, nobody may sport fish from a <b>registered guide vessel</b> on the Kenai below Skilak Lake on Sundays or Mondays, with or without clients. Today is ${dayName(d)}.</p><p style="font-size:13px;color:var(--mute)">You can still fish from the bank, or float the upper river from Cooper Landing.</p>`,[
      {l:'Fish from the bank instead',s:'The Flip for reds action, right here.',fn:()=>{}},
      {l:'Run it anyway. You’re alone; who’d know?',s:'Everyone on the Kenai knows your boat number.',fn:()=>{violate(null,{p:.45,fine:400,what:'fishing from a registered guide vessel on a closed day'});boatSpecies(max,true)}}]);
    if(m<360) return modal('⏰ Too early',`<p>Fishing from a registered guide vessel below Skilak is 6 AM–6 PM through July 31. It’s ${fmt(S.t)}.</p>`,[{l:'Wait at the launch until 6:00',s:`${360-m} min.`,fn:()=>{pass(360-m);boatSpecies(Math.min(max,1080-360))}},{l:'Never mind',fn:()=>{}}]);
  }
  boatSpecies(max);
}
function boatSpecies(max,illegal){
  const loc=S.loc,t=S.t,list=Object.keys(SPECIES).filter(k=>SPECIES[k].loc[loc]);
  const bar=o=>`<span style="display:inline-block;width:60px;height:7px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px"><i style="display:block;height:7px;border-radius:4px;width:${Math.round(clamp(o,0,1)*100)}%;background:${o>.6?'#2f7d4f':o>.3?'#c98a12':'#b8402a'}"></i></span>`;
  const w=wxOf(day()),k=WX[S.wx[day()]||'sun'];

//  GUIDE MASTER, part 5: the career.
//  A career is 2, 5 or 10 seasons. Each season you play the two-week July peak
//  (Monday to Sunday, starting on the Monday nearest July 13); the rest of the year is the off-season:
//  a recap, license and permit renewals, next year's forecast and rule changes, upgrades and new bookings.
//

const SEASON=14;

  5:{n:'5-year career',ic:'🛶',d:'Build a business: upgrade boats, raise your rates, ride out good runs and bad.'},
  10:{n:'10-year career',ic:'🏔️',d:'A decade on the river. King closures come and go, permits expire, the river changes.'}};

const dateOf=d=>new Date(weekStartUTC(yearOf(d),weekIdOf(d))+(sday(d)%7)*864e5);

const dlong=d=>{const x=dateOf(d);return `${dayName(d)}, ${MONTH[x.getUTCMonth()]} ${x.getUTCDate()}`};

function upOK(u){const U=S.up,s=seasonOf(day());

  if(u.id==='motor'){U.motor=true;S.boat=100;U.value+=u.cost}

  if(u.id==='drift'){U.drift=true;U.value+=u.cost}

// Rates: each +10% step costs something. Bookings fall with price (RATE_BOOK per step plus RATE_STEEP × 0, 1, 3 for steps 1, 2, 3, in July and across the rest of the

const RATE_BOOK=.08,RATE_STEEP=.025,RATE_MOOD=3;

STEP.fuel=(b,t)=>{const f=tripFuel(b),have=S[f.tank],p=fuelPrice(f.where),cap=f.tank==='fuel'?SLED_TANK():CHARTER_TANK,est=Math.round((cap-have)*p),need=expectBurn(b),typical=f.gal;
  const kenai=f.where==='kenai',own=kenai&&S.up.dock,wind=windKt(day()),runMins=own?10:kenai?(S.up.sled?45:65):20;
  // the harbor fuel dock keeps hours (6 AM–10 PM): arrive early and you wait for it to open; after closing there is no fuel
  const hr=kenai&&!own?L.harbor.hours(day()):null,arr=tod()+Math.round(runMins/2),wait=hr&&arr<hr[0]?hr[0]-arr:0,closed=!!hr&&arr+wait>=hr[1];
  const why=[wind>12?`${wind} kt of wind`:'',f.tank==='fuel'?'a long run to a far bar':''].filter(Boolean).join(' or ');
  return {t:'⛽ Low on fuel',b:`${t&&t.riskAsk?`<p style="background:#fbe3dc;border-radius:8px;padding:8px 10px"><b>⚠️ Think twice about running low.</b> If the tank runs dry out there, the Coast Guard tows you in: the trip is cut short and the fare halved, you pay a $${HARBOR_TOW} harbor assist, lose 4 rep and the clients leave a bad review, and the boarding can turn up a ticket. Every trip on fumes risks it.</p>`:''}<p>The gauge reads <b>${Math.round(have)} gallons</b>. A ${TRIPS[b.type].n.toLowerCase()} usually burns about <b>${typical}</b>, and up to about <b>${Math.round(need)}</b> with ${why||'the usual scatter'}. The only fuel is at the ${kenai?'Kenai Harbor':'Homer Harbor'} fuel dock (${$(p)}/gal${hr?`, open ${fmt(hr[0])}–${fmt(hr[1])}`:''}).</p>`,o:[
    Object.assign(O(own?'Top off at your own riverfront pump':kenai?(wait?`Send them for coffee; the fuel dock opens at ${fmt(hr[0])}, then fill up`:'Send them for coffee; trailer the sled to Kenai Harbor and fill up'):'Top off at the Homer Harbor fuel dock',closed?`Kenai Harbor’s fuel dock is closed (open ${fmt(hr[0])}–${fmt(hr[1])}).`:own?`10 minutes and ~${$(Math.round((cap-have)*fuelPrice('dock')))}.`:kenai?`About ${runMins+wait} minutes${wait?' (the dock isn’t open yet)':''} and ~${$(est)}. They won’t love waiting.`:`20 minutes and ~${$(est)}.`,(b,t)=>{
      const r=fillUp(f.tank,own?'dock':f.where);pass((own?10:kenai?runMins:20)+wait);t.happy-=own?0:kenai?8+(wait?3:0):2;
      t.notes.push(r?`⛽ ${r.gal.toFixed(1)} gallons at ${$(r.p)}: ${$(Math.round(r.cost))}. ${kenai?'The clients have opinions about the long coffee break.':''}`:'⛽ You can’t afford fuel. You go with what’s in the tank.')}),{dis:closed}),
    O(t&&t.riskAsk?`Risk it anyway: ${Math.round(have)} gallons`:`Risk it: ${Math.round(have)} gallons should do`,`If it doesn’t, the Coast Guard tows you in and the trip is cut short. You need about ${Math.round(need)} to be safe.`,(b,t)=>{
      if(!S.riskWarned){S.riskWarned=true;t.riskAsk=true;t.step--}})]};   // the first time ever, ask again with the consequences spelled out
};

// ---- the fuel dock ----
function harborActions(a){
  if(S.loc==='harbor'){
    const open=isOpen('harbor'),cap=SLED_TANK(),p=fuelPrice('kenai'),gal=Math.max(0,cap-S.fuel);
    a.push({ic:'⛽',l:`Fill the jet sled — ${gal.toFixed(1)} gal × ${$(p)} = ${$(Math.round(gal*p))}`,s:`${Math.round(S.fuel)}/${cap} gallons now. Fuel dock open 6 AM–10 PM.`,cat:'work',cls:S.fuel<bn('reds')+2?'primary':'',dis:!open||gal<1||S.money<p,
      fn:()=>{const r=fillUp('fuel','kenai');pass(15);say(`⛽ ${r.gal.toFixed(1)} gallons of marine gas at ${$(r.p)}: ${$(Math.round(r.cost))}. Tank full (${Math.round(S.fuel)} gal).`)}});
    a.push({ic:'🦅',l:'Watch the eagles work the dock',s:'20 min. Energy +3.',cat:'rest',fn:()=>{pass(20);adj('energy',3);say('🦅 A dozen bald eagles squabble over fish scraps on the pilings while the tide drops out of the harbor.')}});
  }
  if(S.loc==='shop'&&S.up&&S.up.dock){
    const cap=SLED_TANK(),p=fuelPrice('dock'),gal=Math.max(0,cap-S.fuel);
    a.push({ic:'⛽',l:`Fill the sled at your own dock — ${gal.toFixed(1)} gal × ${$(p)} = ${$(Math.round(gal*p))}`,s:`${Math.round(S.fuel)}/${cap} gallons now. Your riverfront pump: no trip to the harbor.`,cat:'work',cls:S.fuel<bn('reds')+2?'primary':'',dis:gal<1||S.money<p,
      fn:()=>{const r=fillUp('fuel','dock');pass(10);say(`⛽ ${r.gal.toFixed(1)} gallons from your own pump at ${$(r.p)}: ${$(Math.round(r.cost))}. Tank full (${Math.round(S.fuel)} gal).`)}});
  }
  if(S.loc==='homer'&&S.up&&S.up.chp){
    const p=fuelPrice('homer'),gal=Math.max(0,CHARTER_TANK-S.hfuel);
    a.push({ic:'⛽',l:`Fuel the charter boat — ${gal.toFixed(0)} gal × ${$(p)} = ${$(Math.round(gal*p))}`,s:`${Math.round(S.hfuel)}/${CHARTER_TANK} gal. A day on Cook Inlet burns ~${BURN.charter}.`,cat:'work',cls:S.hfuel<BURN.charter+5?'primary':'',dis:gal<1||S.money<p,
      fn:()=>{const r=fillUp('hfuel','homer');pass(20);say(`⛽ ${r.gal.toFixed(0)} gallons at the Homer Harbor fuel dock: ${$(Math.round(r.cost))}.`)}});
  }
}

// ---- the rest of the summer (June, August, September), settled in the off-season ----
// You play the two-week July peak; the rest of your season is booked off your reputation.
// (1.8.0) The rest of the summer follows how the July went, not only how many trips you ran: the average client's happiness
// (a good day with the right spot, a full tackle box, a clean boat and a fed crew), word of mouth and your regulars all bring the off-season trade.
// (1.8.1) Citations are public record: each one this season trims the off-season bookings (CITE_REST, 22-trips.js).
const WEB_REST=1.12,REST_X=1.95,QUAL_SPAN=90,WOM_W=.006,REG_W=.003;
const qualityF=p=>clamp(1+((p.hap==null?HAP0:p.hap)-HAP0)/QUAL_SPAN,.7,1.25);
function restOfSeason(p){
  if(!p||!p.trips) return {trips:0,gross:0,costs:0,net:0};
  const trips=Math.round(p.trips*REST_X*restWeeksX(p)*DF().book*clamp(S.rep/70,.5,1.25)*qualityF(p)*(1+clamp((p.wom||0)*WOM_W,-.10,.15))*(1-CITE_REST*Math.min(4,p.cites||0))*(1+REG_W*Math.min(REG_MAX,(S.regs||[]).length))*rateDemand()*starBook()*(S.up&&S.up.lodge?1.1:1)*(S.up&&S.up.dock?1.08:1)*(S.up&&S.up.web===p.year-2026?WEB_REST:1)),fare=(p.fares+(p.tips||0))/p.trips;
  let gross=Math.round(trips*fare),costs=Math.round(trips*(bn('reds')*fuelPrice('kenai')+LAUNCH_FEE+30));
  if(S.up&&S.up.asst){const x=Math.round(trips*.2);gross+=Math.round(x*fare*(1-ASST_CUT));costs+=Math.round(x*(bn('reds')*fuelPrice('kenai')+LAUNCH_FEE+30))}   // the assistant covers the off-month overflow
  if(S.up&&S.up.lodge){const l=lodgeSeason();gross+=l.gross;costs+=l.costs}
  return {trips,gross,costs,net:gross-costs};
}
function driftFuelPrices(){const r=Math.random;S.fuelBase=S.fuelBase||{kenai:6.19,homer:6.45};
  const f=1+(r()-.4)*.12;S.fuelBase.kenai=Math.round(S.fuelBase.kenai*f*100)/100;S.fuelBase.homer=Math.round(S.fuelBase.homer*f*100)/100}
