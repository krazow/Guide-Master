<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Master</title>
<meta name="description" content="Run a charter fishing guide business on Alaska's Kenai Peninsula: clients, combat fishing, bears and the regulations.">
<meta name="theme-color" content="#0f3b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guide Master">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-600-normal.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}</style>
<style>
/* ============================================================
   THEME: change these to re-skin the whole app.
   tools/new-game.py rewrites --brand-dark (also the PWA theme color).
   ============================================================ */
:root{
  --brand:#1f5d63; --brand-dark:#0f3b3f; --accent:#2f6d5a; --accent-soft:#6f8f5a; --surface:#f3ecdc; --paper:#fbf8f1;
  --cta:#e3642e; --cta-dark:#a9441b; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--brand-dark);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(var(--brand),var(--brand-dark));color:#fff}
.title .art{height:250px}
.title .body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:"DM Sans";font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
.big{background:var(--cta);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--cta-dark)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cta-dark)}
.small-note{font-size:12px;opacity:.7}
/* hud */
.hud{background:var(--brand-dark);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.hud-day{font-family:"Fraunces";font-size:20px;font-weight:800}
.hud-time{white-space:nowrap;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.stat b{overflow-wrap:anywhere}
html.fs-xl .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:360px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 4px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--surface);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--surface)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--accent);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip:active{background:#e3eee5}
.chip[disabled]{border-color:var(--line);color:#aaa}
/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;padding:9px 0 10px;font-size:11px;color:var(--mute);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ti{font-size:20px}
.tabs button.on{color:var(--brand)}
.tabs .dot{display:inline-block;width:7px;height:7px;background:var(--bad);border-radius:50%;margin-left:3px;vertical-align:top}
/* to-do, priorities, log */
.rules{font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:12px}
.rules p{margin:0 0 6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .ck{font-size:20px;width:26px;flex:none;text-align:center}
.todo b{display:block;font-size:15px}.todo span{font-size:12.5px;color:var(--mute)}
.todo .pin{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 7px;font-size:13px;color:var(--mute);cursor:pointer}
.prio{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink,#2a3d45);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prio.done .rk{background:var(--line);color:var(--mute)}
.prio .pt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.prio.done .pt{text-decoration:line-through;color:var(--mute)}
.prio .pb{display:flex;gap:4px;flex:none}
.prio .pb button,.prio-add button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;color:inherit}
.prio .pb button:disabled{opacity:.3;cursor:default}
.prio-add{display:flex;gap:6px;margin:8px 0 2px}
.prio-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
.prio-add button{padding:0 12px;font-weight:700}
.prio-empty{font-size:13px;color:var(--mute);padding:6px 2px}
.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.log p em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
/* event tiles (toasts) */
#tiles{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);width:calc(100% - 20px);max-width:460px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tile{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fffdf8;border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(8,25,30,.28),0 1px 0 rgba(0,0,0,.05);border-left:6px solid #6b7478;animation:tileIn .32s cubic-bezier(.2,.9,.3,1.2)}
.tile.good{border-left-color:var(--good)}.tile.bad{border-left-color:var(--bad)}.tile.info{border-left-color:var(--brand)}.tile.warn{border-left-color:var(--warn)}
.tile .ti{font-size:26px;width:32px;text-align:center;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tile .tt b{display:block;font-size:15px;line-height:1.25}
.tile .tt span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tile .ok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;color:var(--accent);font-weight:700}
.tile.out{animation:tileOut .25s ease-in forwards}
@keyframes tileIn{from{transform:translateY(-16px) scale(.96);opacity:0}}
@keyframes tileOut{to{transform:translateY(-12px);opacity:0;height:0;margin:0;padding-top:0;padding-bottom:0}}
.gear{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;font-size:19px;color:#fff;flex:none}
.title{position:relative}.tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;background:rgba(18,49,59,.55);border:0;border-radius:12px;width:44px;height:44px;font-size:21px;z-index:2}
.nm-in{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.nm-in:focus{outline:2px solid var(--accent);border-color:var(--accent)}
/* grouped actions, collapsible destinations, tips */
details.go{margin-top:14px}
details.go>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 2px;display:flex;justify-content:space-between}
details.go>summary::-webkit-details-marker{display:none}
details.go>summary::after{content:'▸ show';letter-spacing:.3px;text-transform:none}
details.go[open]>summary::after{content:'▾ hide'}
.dest.compact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.dest.compact .dn{flex:1 1 150px;display:block}
.dest.compact .dn span{display:block;text-align:left}
.dest.compact .chips{margin-top:0}
.tip{background:#fff5d6;border:1.5px solid #e6c97a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .tb{display:flex;gap:8px;margin-top:8px}
.tip button{border:1.5px solid #c9a24a;background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:#6b4e0e}
/* accessibility */
html.fs-l{zoom:1.12}html.fs-xl{zoom:1.25}
html.hc{--mute:#2b3336;--line:#7d7462;--paper:#ffffff;--surface:#efe5cc}
html.hc .hud-sub,html.hc .stat small{opacity:1}html.hc .act,html.hc .dest{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
.today{background:#eef3f4;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.today b{display:block;font-family:Fraunces;font-size:15px;margin-bottom:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mb{font-size:15px;line-height:1.5;margin-bottom:14px}
.modal .mb p{margin:0 0 8px}
.modal .act{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface);color:var(--ink);margin:0 4px 4px 0}
.tag.bad{background:#f6ddd5;color:var(--bad)}.tag.good{background:#dcefe2;color:var(--good)}
/* full-screen transition (travel, sleep…) */
.cross{position:fixed;inset:0;z-index:30;background:var(--brand-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cross svg{width:100%;max-width:480px;height:260px}
.cross .cap{font-family:"Fraunces";font-size:22px;margin-top:6px;text-align:center;padding:0 20px}
.cross .cap2{font-size:13px;opacity:.75;margin-top:6px}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
/* end */
.end{padding:22px 18px 40px}
.end h1{font-size:30px;margin:6px 0 4px}
.grade{font-family:"Fraunces";font-size:58px;font-weight:800;color:var(--cta);line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
/* polish */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
html.hc :focus-visible{outline:3px solid #000;outline-offset:0;box-shadow:0 0 0 7px #ffd400}
html.hc .hud :focus-visible,html.hc .title :focus-visible,html.hc nav.tabs :focus-visible{outline-color:#ffd400;box-shadow:0 0 0 7px #000}
.cross:focus-visible{outline:4px solid var(--cta);outline-offset:-8px}
.prio .pt[role="button"]{cursor:pointer;border-radius:6px}
/* ⌨️ keyboard shortcut hints (desktop only) */
.kn{display:none}
@media (hover:hover) and (pointer:fine){
  button.act{position:relative}
  .kn{display:block;position:absolute;top:6px;right:8px;font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;font-style:normal;color:var(--mute);border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.55;pointer-events:none}
  button.act:hover .kn{opacity:.9}
}
.keys{display:grid;gap:6px;margin:4px 0 10px}
.keys-row{display:flex;gap:12px;align-items:baseline}
.keys-row kbd{min-width:84px;font:600 12px ui-monospace,Menlo,Consolas,monospace;background:var(--card,#f4f1ea);border:1px solid var(--line,#ccc);border-bottom-width:2px;border-radius:5px;padding:2px 6px;text-align:center}

/* sample-game extras */
.status{margin-bottom:6px}
.end .kv span{color:var(--mute)}
.slot-empty{color:var(--mute)}
.alertbar.info{background:var(--brand)}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#fff;padding:20px;font-family:sans-serif">This game needs JavaScript.</p></noscript>
<script>
// ============================================================
//  GAME CONFIG: start here when you make a new game.
//  tools/new-game.py rewrites id / title / codePrefix / colors for you
//  (in this file, src/shell.html, the web manifest and sw.js).
//
//  Files, in build order (tools/build.py concatenates src/js/*.js by name):
//    00-game.js      this config
//    01-core.js      state, preferences, sound, player name, time + stat helpers
//    02-kit.js       bottom-sheet modals, event tiles, full-screen transitions
//    03-events.js    random-event engine (hooks, chances, cooldowns, chains)
//    04-loop.js      new game, days, nights, travel, the passing of time
//    05-ui.js        HUD, scene, tabs, action list, to-do + priorities, log, tips
//    06-save.js      autosave, 3 slots, migrations, transfer codes, install, service worker
//    07-endings.js   end screen, score, best score, achievements
//    08-settings.js  title screen, name/difficulty pickers, settings, accessibility, slots
//    09-keys.js      keyboard shortcuts for desktop
//    20-world.js     ← YOUR GAME: stats, starting state, places, actions, scenery
//    21-story.js     ← YOUR GAME: events, tips, to-do, achievements, scoring, migrations
//    99-boot.js      starts the app
//  Engine files (00–09) shouldn't need much editing; your game lives in 20+.
// ============================================================
const GAME={
  id:'guidemaster',           // storage-key prefix and service-worker cache prefix (lowercase, no spaces)
  title:'Guide Master',
  tagline:'Two weeks guiding the Kenai',
  codePrefix:'GUIDEMASTER',   // transfer codes start with this, e.g. POCKETWEEK:eyJ…
  version:'1.6.0',           // bump on every release: shown in Settings, stamped into saves and sw.js
  schema:2,                  // bump when the shape of S changes, and add a MIGRATIONS entry (21-story.js)
  days:14,                   // length of a run, in days (Mon Jul 13 – Sun Jul 26, 2026)
  wake:270,                  // default alarm, in minutes after midnight (270 = 4:30 AM: guides start early)
  startLoc:'shop',
  travelAnim:20,             // trips this many minutes or longer play the full-screen transition
  defaultName:'Skipper',      // used until the player picks a name
  slots:3,                   // save slots
};
// Guide Master: a run is 2, 5 or 10 seasons of 14 days (24-career.js), so days is computed from the save.
Object.defineProperty(GAME,'days',{get(){return 14*((typeof S!=='undefined'&&S&&S.years)||2)},configurable:true});
const APP_VERSION=GAME.version, SAVE_SCHEMA=GAME.schema;
const KEY=k=>GAME.id+'.'+k;  // every localStorage key goes through this
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
// Difficulties: anything here is readable in your content as DF().something.
const DIFFS={
  // money: starting cash. bad: random-event multiplier. enforce: catch-chance multiplier. fine: fine multiplier;
  // esc: extra fine per citation already on your record. cost: fuel, overhead, winter bills and repairs.
  // mood: client happiness (tips, rep). book: off-month bookings. wear: boat wear. No difficulty changes the score.
  easy:  {n:'Rookie Season',ic:'🎣',d:'More cash, fewer troopers, cheaper bills and easygoing clients. For learning the water.',money:3000,bad:0.6,enforce:0.7,fine:0.8,esc:0.1,cost:0.8,mood:6,book:1.08,wear:0.85},
  normal:{n:'Licensed Guide',ic:'🛶',d:'The Kenai as it is: busy, beautiful and well patrolled.',money:1500,bad:1,enforce:1,fine:1,esc:0.2,cost:1,mood:0,book:1,wear:1},
  hard:  {n:'Combat Season',ic:'🐻',d:'Thin cash, more troopers, fines that climb steeply with every citation, dearer fuel and bills, pickier clients, quieter off-months and more bad luck. Same score, tougher grade.',money:600,bad:1.5,enforce:1.4,fine:1.1,esc:0.3,cost:1.2,mood:-7,book:0.88,wear:1.25},
};
const DF=()=>DIFFS[(typeof S!=='undefined'&&S&&S.diff)||'normal']||DIFFS.normal;
// ---------------- state ----------------
// S is the whole saved game. Anything you put in S is saved, loaded and transferred automatically.
// tab is the open tab; uiNarr is the narration shown at the top of the Here tab (cleared on each tap).
let S, tab='act', uiNarr=[];

// ---------------- preferences (device-wide, not per save) ----------------
const PREF_KEY=KEY('prefs');
const PREF_DEF={fs:'n',hc:false,rm:(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})(),sound:true,tips:true,diff:'normal',goOpen:null};
function prefs(){try{return Object.assign({},PREF_DEF,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(e){return Object.assign({},PREF_DEF)}}
function setPref(k,v){const p=prefs();p[k]=v;try{localStorage.setItem(PREF_KEY,JSON.stringify(p))}catch(e){}applyPrefs()}
function applyPrefs(){const p=prefs(),c=document.documentElement.classList;c.toggle('fs-l',p.fs==='l');c.toggle('fs-xl',p.fs==='xl');c.toggle('hc',!!p.hc);c.toggle('rm',!!p.rm)}

// ---------------- sound (synthesized with Web Audio: no files to ship) ----------------
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,dur,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
// Add your own named sounds here.
const SFX={
  good:()=>{tone(784,0.18,'sine',0.09);tone(1175,0.28,'sine',0.07,0.12)},

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------------- player name ----------------
// Any text can contain {{name}}. It's swapped in only when shown, so renaming updates every line already in the log.
const NAME_KEY=KEY('name');
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function currentName(){return (typeof S!=='undefined'&&S&&S.name)||profileName()||GAME.defaultName}
function withName(t){return typeof t==='string'?t.replace(/\{\{name\}\}/g,esc(currentName())):t}
function cleanName(raw){const n=String(raw||'').replace(/\s+/g,' ').trim();
  if(!n) return {err:'Please enter a name.'};
  if(n.length>20) return {err:'Keep it to 20 characters or fewer.'};
  if(!/^[\p{L}\p{N}][\p{L}\p{N} '’.\-]*$/u.test(n)) return {err:'Letters, numbers, spaces, apostrophes, periods and hyphens only.'};
  return {name:n}}
function setPlayerName(n){
  const old=currentName();
  try{localStorage.setItem(NAME_KEY,n)}catch(e){}
  if(S&&!S.over){S.name=n;if(old!==n)say('✏️ From now on, everyone calls you {{name}}.');saveGame()}
  else{ // on the title screen: rename the saved game too, so Continue uses the new name
    const ls=store();if(ls)try{for(const k of slotKeys()){const v=ls.getItem(k);if(!v)continue;const d=JSON.parse(v);if(d&&d.S){d.S.name=n;ls.setItem(k,JSON.stringify(d))}}}catch(e){}
    if(S&&S.over) S.name=n}
}

const day=()=>S.cur;
const tod=()=>S.t-S.cur*1440;                       // minutes since midnight today
const dayName=d=>DAYS[((d%7)+7)%7];
function fmt(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mi=m%60;const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap}
function fmtAbs(a){const d=Math.floor(a/1440);return (d!==day()?dayName(d).slice(0,3)+' ':'')+fmt(a)}

// ---------------- helpers for content ----------------
function say(s){uiNarr.push(s);S.log.push({t:S.t,s})}              // narrate + log
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function adj(k,v,lo=0,hi=100){S[k]=clamp(Math.round(S[k]+v),lo,hi)} // nudge a 0–100 stat
function money(v){S.money=Math.round((S.money+v)*100)/100}
const $=x=>(x<0?'−':'')+'$'+(Math.round(Math.abs(x)*100)/100).toFixed(x%1?2:0);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function isOpen(id,t=S.t){const h=L[id].hours;if(!h)return true;const r=h(Math.floor(t/1440));if(!r)return false;const m=t%1440;return m>=r[0]&&m<r[1]}
function hoursTxt(id){const h=L[id].hours;if(!h)return '';const r=h(day());return r?`Open ${fmt(r[0])}–${fmt(r[1])}`:'Closed today'}
// ---------------- bottom-sheet modal ----------------
// modal(title, bodyHtml, [{l:'Label', s:'subtitle', fn:()=>{}, dis:false}, …])
// The first enabled button is highlighted (unless it has np:true; dilemma choices do, so no option is the "right" one).
// A button may carry legal:true/false, written to its data-legal attribute. Modals opened while one is showing are queued and shown in order.
// A 4th argument true makes the pop-up required: Esc doesn't close it, only its own button does (no backdrop-tap close exists).
// After any button, the game re-renders (unless you're on the title or end screen).
let MB=[], MQ=[];
function modal(title,body,btns,noClose){
  if(document.getElementById('mbg')){MQ.push([title,body,btns,noClose]);return}
  MB=btns;
  const el=document.createElement('div');el.className='modal-bg';el.id='mbg';if(noClose)el.dataset.lock='1';
  el.innerHTML=withName(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}"><h2>${title}</h2><div class="mb">${body}</div>${btns.map((b,i)=>`<button class="act ${i===0&&!b.dis&&!b.np?'primary':''}" ${b.legal!==undefined?`data-legal="${b.legal}"`:''} ${b.dis?'disabled':''} onclick="MBTN(${i})"><span class="tx"><b>${b.l}</b>${b.s?'<span>'+b.s+'</span>':''}</span></button>`).join('')}</div>`);
  document.body.appendChild(el);
  setTimeout(()=>{const b=el.querySelector('button.act:not([disabled])');if(b&&!el.querySelector('input,textarea'))b.focus({preventScroll:true})},30);
}
window.MBTN=i=>{if(MB[i]&&MB[i].dis)return;const el=document.getElementById('mbg');el&&el.remove();const f=MB[i]&&MB[i].fn;f&&f();
  if(!document.getElementById('mbg')&&MQ.length&&S&&!S.over){const q=MQ.shift();modal(...q)}
  if(S&&!S.over&&!document.querySelector('.title,.end'))render()};
function closeModals(){MQ=[];document.querySelectorAll('.modal-bg').forEach(e=>e.remove())}

// ---------------- full-screen transition ----------------
// transition('🚌','Off to work','20 minutes', done)  plays a short animation, then calls done().
// Tap to skip. Reduce-motion shortens it.
function transition(ic,cap,cap2,done,snd){
  const el=document.createElement('div');el.className='cross';el.tabIndex=0;sfx(snd||'whoosh');
  el.innerHTML=`<svg viewBox="0 0 480 260" aria-hidden="true"><rect width="480" height="260" fill="none"/><path d="M0 200 h480 M0 222 h480" stroke="#fff" stroke-opacity=".1"/>
    <text class="bob" x="240" y="150" text-anchor="middle" font-size="84">${ic}</text></svg>
    <div class="cap">${withName(cap)}</div><div class="cap2">${withName(cap2||'')}</div><div class="cap2" style="margin-top:18px">tap to skip</div>`;
  document.body.appendChild(el);el.focus();
  let fin=false;const end=()=>{if(fin)return;fin=true;el.remove();done&&done()};
  el.onclick=end;el.onkeydown=e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();end()}};
  setTimeout(end,prefs().rm?700:2200);
}

// ---------------- event tiles (toasts at the top) ----------------
// showTile('🎉','Found $20','On the way to the park','good')   kind: good | bad | warn | info
let tileQ=[];const TILE_MAX=3;
function tileBox(){let el=document.getElementById('tiles');if(!el){el=document.createElement('div');el.id='tiles';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}return el}
function showTile(ic,title,sub,kind,when){
  if(!S||S.over) return;
  when=when||`${dayName(day()).slice(0,3)} ${fmt(S.t)}`;
  const box=tileBox();
  if(box.children.length>=TILE_MAX){tileQ.push([ic,title,sub,kind,when]);return}
  const t=document.createElement('div');t.className='tile '+(kind||'info');
  title=withName(title);sub=withName(sub);sfx(kind==='good'?'good':kind==='bad'?'bad':'info');
  t.innerHTML=`<span class="ti">${ic}</span><span class="tt"><small>${{good:'Good news',bad:'Event',warn:'Heads up'}[kind]||'Update'} · ${when}</small><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span><button class="ok" aria-label="Got it">✓</button>`;
  let gone=false;const close=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>{t.remove();if(tileQ.length){const q=tileQ.shift();showTile(...q)}},260)};
  t.querySelector('.ok').onclick=close;t.onclick=e=>{if(e.target===t)close()};
  setTimeout(close,6500);box.appendChild(t);
}
function clearTiles(){tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove())}
window.showTile=showTile;
// ---------------- random events ----------------
// defEvent({
//   id:'found_cash',             unique id (saved in S.ev, so don't rename casually: see MIGRATIONS)
//   hook:'arrive',               when it can fire: 'wake' | 'arrive' | 'travel' | 'night' | any name you fireHook() yourself
//                                (or an array of hooks)
//   tile:['💵','Found $20','good'],  icon, title, kind for the toast
//   chance:0.1,                  0–1, or a function (ctx)=>number
//   bad:true,                    scale chance by the difficulty's "bad" multiplier
//   cond:ctx=>S.loc==='park',    must be true to fire
//   cooldown:2,                  days before it can fire again
//   max:1,                       times per game
//   priority:0,                  higher runs first
//   run:ctx=>{ money(20); say('…'); return {stop:true} }  return {stop:true} to stop later events on this hook
// })
// chain('id') forces an event to fire the next time its hook runs (one event can set up another).
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}
let EV_RUNNING=null;
function chain(id,cause){if(!S.ev.force.includes(id))S.ev.force.push(id);S.ev.cause=S.ev.cause||{};S.ev.cause[id]=cause||EV_RUNNING||null}
window.forceEvent=id=>chain(id);
const HOOK_SCALE={wake:0.85}; // chance that a hook call lets any event through at all (15% of mornings stay quiet)
const HOOK_SUB={wake:'This morning',night:'Overnight'};
function fireHook(hook,ctx={}){
  ctx.hook=hook;let res=null;const popItems=[];
  const scale=HOOK_SCALE[hook]??1,open=scale>=1||Math.random()<scale;
  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond){let ok=false;try{ok=e.cond(ctx)}catch(err){ok=false}if(!ok)continue}
    if(!open&&!forced) continue;
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=(typeof e.chance==='function'?e.chance(ctx):e.chance)*(e.bad?DF().bad:1);
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    const nBefore=uiNarr.length,mBefore=MQ.length+(document.getElementById('mbg')?1:0);
    EV_RUNNING=e.id;let r;try{r=e.run(ctx)||{}}finally{EV_RUNNING=null}
    // events that didn't open their own modal get collected into one OK pop-up per hook call
    if(MQ.length+(document.getElementById('mbg')?1:0)===mBefore) popItems.push({e,lines:uiNarr.slice(nBefore)});
    const [ic,title,kind]=e.tile||['📍',e.id.replace(/_/g,' '),'info'];
    const cause=S.ev.cause&&S.ev.cause[e.id],ce=cause&&EV.find(x=>x.id===cause);
    showTile(ic,title,ce?`Because of: ${ce.tile?ce.tile[1]:cause}`:(ctx.sub||HOOK_SUB[hook]||''),kind,hook==='night'?`${dayName(day()).slice(0,3)} night`:null);
    if(S.ev.cause)delete S.ev.cause[e.id];
    if(ctx.notes) ctx.notes.push(...uiNarr.slice(nBefore));
    if(r.stop){res=r;break}
    res=res||r;
  }
  eventPopup(hook,popItems);
  return res;
}
// ---- OK pop-up for events (on by default; Settings → Event pop-ups) ----
const POPUP_KEY=KEY('popups');
function popupsOn(){try{return localStorage.getItem(POPUP_KEY)!=='off'}catch(e){return true}}
function eventPopup(hook,items){
  if(!items.length||hook==='night'||!popupsOn()||!S||S.over) return; // night events go in the "Good night" summary
  const meta=e=>e.tile||['📍',e.id.replace(/_/g,' ')];
  const body=items.map(it=>{const m=meta(it.e);const txt=it.lines.map(l=>`<p style="margin:4px 0 0">${l}</p>`).join('');
    return items.length>1?`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-size:24px">${m[0]}</span><div><b>${m[1]}</b>${txt}</div></div>`:txt}).join('');
  const one=items.length===1?meta(items[0].e):null;
  modal(one?`${one[0]} ${one[1]}`:'📍 Meanwhile…',body||'<p></p>',[{l:'OK',fn:()=>{}}]);
}
// ---------------- the game loop ----------------
// Time only moves when the player does something. An action calls pass(minutes); travel calls go(dest);
// sleeping calls endDay(where). After every tap the engine checks for a loss and for staying up past midnight.
//
// Your content (20-world.js, 21-story.js) provides these functions:
//   newState()            the game-specific part of S (stats, inventory…)
//   onNewGame()           intro narration / welcome modal
//   onMorning(d)          start of each day
//   onNight(where,notes,d)  end of each day: eat, pay, recover… push lines to notes for the night summary
//   onTime(min)           (optional) runs every time minutes pass: hunger, timers, deliveries
//   onArrive(dest,from)   (optional) after travel
//   travelMins(from,to)   minutes between two places
//   checkLoss()           return a LOSSES key to end the game, or null

// The engine's half of S. Content fields from newState() are merged on top.
function baseState(){
  return Object.assign({name:profileName()||GAME.defaultName,diff:'normal',t:GAME.wake,cur:0,loc:GAME.startLoc,alarm:GAME.wake,
    log:[],prios:[],tips:{seen:[]},over:false,daily:null,achGame:[],stats:{},
    ev:{last:{},count:{},history:[],force:[],flags:{}}},newState());
}
function newGame(diff){
  clearTiles();closeModals();
  S=baseState();S.diff=DIFFS[diff]?diff:'normal';
  if(typeof DF().money==='number'&&'money' in S) S.money=DF().money;
  uiNarr=[];tab='act';
  onNewGame();
  startDay();
}
// Let time pass. Content actions call this: pass(60) is one hour.
function pass(min){min=Math.max(0,Math.round(min||0));S.t+=min;if(typeof onTime==='function')onTime(min)}
// Runs after every player action (the ACT dispatcher calls it).
function afterAction(){
  if(!S||S.over) return;
  const loss=checkLoss();if(loss) return gameOver(loss);
  if(S.t>=(S.cur+1)*1440-1){S.t=(S.cur+1)*1440-1;endDay('collapsed')} // stayed up all night
}
function startDay(){
  const d=day();
  S.daily={money:S.money,ev:S.ev.history.length,day:d};
  onMorning(d);
  fireHook('wake',{});
}
function dayCard(d){
  const D=S.daily;if(!D||D.day!==d) return '';
  const dm=Math.round(S.money-D.money);
  const evs=S.ev.history.slice(D.ev).map(h=>{const e=EV.find(x=>x.id===h.id);return e&&e.tile?e.tile[0]:'📍'});
  const parts=['money' in S?`💵 ${dm>=0?'+':'−'}$${Math.abs(dm)}`:'',...(typeof daySummary==='function'?daySummary(d):[])].filter(Boolean);
  return `<div class="today"><b>${dayName(d)} in review</b>${parts.join(' · ')}${evs.length?`<br>Events: ${evs.join(' ')}`:''}</div>`;
}
// End the day. where: 'home' (went to bed), 'collapsed' (stayed up past midnight), or any string your content uses.
function endDay(where){
  if(!S||S.over) return;
  const d=day(),notes=[];
  closeModals();
  onNight(where,notes,d);
  fireHook('night',{where,notes});
  const card=dayCard(d);
  achCheck({night:true,where});
  if(S.over) return;
  const loss=checkLoss();if(loss) return gameOver(loss);
  if(d+1>=GAME.days) return finish();
  S.cur=d+1;S.t=S.cur*1440+S.alarm;uiNarr=[];
  startDay();
  modal(`🌙 ${dayName(d)} night`,card+notes.map(n=>`<p>${n}</p>`).join(''),[{l:`☀️ Wake up: ${dayName(S.cur)}, ${fmt(S.t)}`,fn:()=>{}}]);
  sfx('info');
  render();
}
// Travel. Long trips get the full-screen transition.
function go(dest){
  if(!L[dest]||dest===S.loc) return;
  const from=S.loc,m=travelMins(from,dest);
  const arrive=()=>{
    pass(m);S.loc=dest;uiNarr=[];
    say(`${L[dest].ic} You get to ${L[dest].name}${m?` (${m} min)`:''}.`);
    fireHook('travel',{from,to:dest,sub:`On the way to ${L[dest].name}`});
    fireHook('arrive',{at:dest,from,sub:`At ${L[dest].name}`});
    if(typeof onArrive==='function') onArrive(dest,from);
    afterAction();if(S&&!S.over)render();
  };
  if(m>=GAME.travelAnim) transition(L[dest].ic,`Heading to ${L[dest].name}`,`${m} minutes`,arrive); else arrive();
}
// ---------------- UI ----------------
// Everything is plain template strings rendered into #app. render() rebuilds the screen from S after every tap,
// and autosaves. Content supplies: STATS, SCENE, L (places), actionsHere(), ACT_CATS, statusTags(), alertBar(),
// todoItems(), RULES_HTML, TIPS, EXTRA_TABS. See 20-world.js and 21-story.js.
const app=document.getElementById('app');
function meter(v,good){v=clamp(Math.round(v),0,100);const c=good?(v>60?'#8fd19e':v>30?'#f4d27a':'#ff8a70'):(v<40?'#8fd19e':v<70?'#f4d27a':'#ff8a70');return `<div class="meter"><i style="width:${v}%;background:${c}"></i></div>`}

// ---- scene: sky by time of day + the place's own art (L[loc].art) ----
function sceneSVG(){
  const m=tod(),[rise,set]=SCENE.sun,night=m<rise||m>set,dusk=(m>=set-90&&m<=set+30)||(m>=rise-30&&m<=rise+60);
  const sky=night?SCENE.skyNight:dusk?SCENE.skyDusk:SCENE.skyDay;
  const f=clamp((m-rise)/(set-rise),0,1);
  const sun=night?`<circle cx="400" cy="34" r="12" fill="#f3efe0"/>`:`<circle cx="${80+f*320}" cy="${50-Math.sin(f*Math.PI)*25}" r="16" fill="#fbeaa8" opacity=".9"/>`;
  const art=L[S.loc].art?L[S.loc].art({night,dusk,m}):'';
  return `<svg viewBox="0 0 480 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
  <rect width="480" height="170" fill="url(#sk)"/>${sun}<rect y="140" width="480" height="30" fill="${night?SCENE.groundNight:SCENE.ground}"/>${art}</svg>`;
}
function hud(){
  const d=day(),n=STATS.length;
  return `<div class="hud"><div class="hud-top"><div><div class="hud-day">${dayName(d)}</div><div class="hud-sub">{{name}} · ${DF().ic} ${DF().n} · ${typeof hudDay==='function'?hudDay(d):`Day ${d+1} of ${GAME.days}`}</div></div><div style="display:flex;align-items:center;gap:10px"><div class="hud-time">${fmt(S.t)}</div><button class="gear" onclick="openSettings()" aria-label="Settings">⚙️</button></div></div>
  <div class="stats" style="grid-template-columns:repeat(${Math.min(n,6)},minmax(0,1fr))">${STATS.map(s=>`<div class="stat"${s.title?` title="${esc(s.title)}"`:''}><small>${s.l}</small><b${s.warn&&s.warn()?' style="color:#ff8a70"':''}>${s.v()}</b>${s.m?meter(s.m(),s.good!==false):''}</div>`).join('')}</div></div>`;
}
function allTabs(){return [['act','🧭','Here'],...(EXTRA_TABS||[]).map(t=>[t.k,t.ic,t.l]),['todo','📋','To-do'],['log','📜','Log']]}
function render(){
  if(!S||S.over) return;
  const loc=L[S.loc];
  let h=hud();
  const al=typeof alertBar==='function'?alertBar():null;
  if(al) h+=`<div class="alertbar ${al.kind||''}">${al.t}</div>`;
  h+=`<div class="scene">${sceneSVG()}<div class="place"><h2>${loc.ic} ${loc.name}</h2><div>${loc.desc||''}${loc.hours?' · '+hoursTxt(S.loc):''}</div></div></div>`;
  const xt=(EXTRA_TABS||[]).find(t=>t.k===tab);
  h+=`<div class="content">${tab==='act'?actView():tab==='todo'?todoView():tab==='log'?logView():xt?xt.view():actView()}</div>`;
  const pending=todoItems().filter(x=>x.urgent&&!x.ok).length,tabs=allTabs();
  h+=`<nav class="tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')"${tab===k?' aria-current="page"':''}><span class="ti">${i}</span>${l}${k==='todo'&&pending?'<span class="dot"></span>':''}</button>`).join('')}</nav>`;
  app.innerHTML=withName(h);
  achCheck();
  saveGame();
}
window.setTab=k=>{tab=k;render();window.scrollTo(0,0)};

// ---- Here tab: narration, status, tip, actions, places ----
let ACTS=[];
function actView(){
  ACTS=[];
  let h=tipView();
  if(uiNarr.length) h+=`<div class="narr">${uiNarr.slice(-4).map(s=>'<p>'+s+'</p>').join('')}</div>`;
  const tags=typeof statusTags==='function'?statusTags():[];
  if(tags.length) h+=`<div class="status">${tags.join('')}</div>`;
  const acts=actionsHere().filter(Boolean);

  return h+'</details>';
}

// ---------------- saving ----------------
// render() autosaves after every tap, and the page saves when it's hidden (app switch, tab close).
// Saves live in localStorage, one key per slot. A finished game deletes its save.
const BEST_KEY=KEY('best'),SLOT_KEY=KEY('slot');
let saveNotice='';
function store(){try{return window.localStorage}catch(e){return null}}
function curSlot(){let n=1;try{n=parseInt(localStorage.getItem(SLOT_KEY)||'1',10)}catch(e){}return n>=1&&n<=GAME.slots?n:1}
function setSlot(n){try{localStorage.setItem(SLOT_KEY,String(n))}catch(e){}}
function slotKeys(n){n=n||curSlot();return [n===1?KEY('save'):KEY('save.slot'+n)]}
function packSave(){return {schema:SAVE_SCHEMA,app:APP_VERSION,S,uiNarr,tab,at:Date.now()}}
function saveGame(){const ls=store();if(!ls||!S)return;const keys=slotKeys();
  try{if(S.over)keys.forEach(k=>ls.removeItem(k));else{const v=JSON.stringify(packSave());keys.forEach(k=>{try{ls.setItem(k,v)}catch(e){}})}}catch(e){}}

// ---- loading and upgrading ----
// fillDefaults adds anything an older save is missing (new fields in baseState()/newState()) without touching what it has.
function fillDefaults(obj,def){
  for(const k in def){
    if(obj[k]===undefined||(obj[k]===null&&def[k]!==null&&typeof def[k]==='object'&&!Array.isArray(def[k]))) obj[k]=JSON.parse(JSON.stringify(def[k]));
    else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object') fillDefaults(obj[k],def[k]);
  }
  return obj;
}
const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
// numeric dotted version compare: >0 when a is newer than b ('1.10.0' > '1.9.2')
const verCmp=(a,b)=>{const p=v=>String(v||'').split('.').map(n=>parseInt(n,10)||0),x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){const k=(x[i]||0)-(y[i]||0);if(k)return k}return 0};
let newerWarned='';
function migrate(d){
  if(!d||typeof d!=='object'||!d.S||typeof d.S!=='object') throw new Error('not a '+GAME.title+' save');
  const from=num(d.schema,1),x=d.S,notes=[];
  // your schema upgrades (21-story.js), oldest first
  for(const m of (typeof MIGRATIONS!=='undefined'?MIGRATIONS:[]).slice().sort((a,b)=>a.to-b.to)) if(from<m.to) m.run(x,notes,d);
  fillDefaults(x,baseState());
  // engine fields must be sane
  x.t=num(x.t,GAME.wake);x.cur=clamp(num(x.cur,Math.floor(x.t/1440)),0,(x.years?x.years*14:GAME.days)-1); // years: Guide Master careers
  if(!L[x.loc]){notes.push('a place from another version doesn’t exist here, so you’re back at the start');x.loc=GAME.startLoc}
  if(!DIFFS[x.diff]) x.diff='normal';
  if(!Array.isArray(x.log)) x.log=[];
  if(!Array.isArray(x.prios)) x.prios=[];
  if(!Array.isArray(x.ev.force)) x.ev.force=[];
  if(!Array.isArray(x.ev.history)) x.ev.history=[];
  const newer=typeof d.app==='string'&&verCmp(d.app,APP_VERSION)>0?d.app:null;
  if(from>SAVE_SCHEMA&&!newer) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  const tabs=allTabs().map(t=>t[0]);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:tabs.includes(d.tab)?d.tab:'act',at:d.at,notes,newer};
}
function rawSave(n){const ls=store();if(!ls)return null;let best=null;
  for(const k of slotKeys(n)){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}if(!best||at>best.at)best={k,v,at}}
  return best}
function loadSave(n){
  const r=rawSave(n);if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){ // set an unreadable save aside instead of crashing on it forever
    try{const ls=store(),sn=n||curSlot();ls.setItem(KEY('save.broken'+(sn>1?'.slot'+sn:'')),r.v);slotKeys(sn).forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new game.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;
  render();
  if(d.newer&&newerWarned!==d.newer){newerWarned=d.newer;modal('⚠️ Save from a newer version',`<p>This save is from ${esc(GAME.title)} ${esc(d.newer)}, newer than this copy (${APP_VERSION}). Update to keep everything: whatever this copy doesn’t know about is ignored, and may be lost if you keep playing here.</p>`,[{l:'Continue anyway',fn:()=>{}}])}
  if(d.notes&&d.notes.length) modal('Save loaded',`<p>Welcome back. Note: ${d.notes.join('; ')}.</p>`,[{l:'Continue',fn:()=>{}}]);
}
window.resumeGame=()=>{const d=loadSave();if(!d)return titleScreen();
  try{adopt(d)}catch(e){saveNotice='That save couldn’t be loaded in this version.';titleScreen()}};

// ---- transfer codes: move a game between devices, browsers or the installed app ----
function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
function b64dec(b){return decodeURIComponent(escape(atob(b)))}
function exportCode(){const d=rawSave();if(!d&&!S)return '';const obj=d?JSON.parse(d.v):packSave();return GAME.codePrefix+':'+b64enc(JSON.stringify(obj))}
window.openTransfer=()=>{
  const code=exportCode();
  modal('🔁 Transfer a saved game',`<p>Copy this code to move your game to another device or browser.</p>
  ${code?`<textarea id="exp" readonly aria-label="Your transfer code" style="width:100%;height:70px;font-size:11px;border-radius:8px;border:1.5px solid var(--line);padding:6px">${code}</textarea>
  <button class="act" style="margin-top:6px" onclick="copyCode()"><span class="tx"><b id="cpl">📋 Copy code</b></span></button>`:'<p><i>No game in progress to export.</i></p>'}
  <p style="margin-top:12px">Or paste a code here to load it. It replaces the save in this slot.</p>
  <textarea id="imp" aria-label="Paste a transfer code" oninput="window.IMPV=this.value" placeholder="${GAME.codePrefix}:…" style="width:100%;height:70px;font-size:12px;border-radius:8px;border:1.5px solid var(--line);padding:6px"></textarea>
  <div id="imperr" style="color:var(--bad);font-size:13px"></div>`,
  [{l:'Load pasted code',fn:importCode},{l:'Close',fn:()=>{if(!S||S.over)titleScreen()}}]);
};
window.copyCode=async()=>{const t=document.getElementById('exp');t.select();try{await navigator.clipboard.writeText(t.value);document.getElementById('cpl').textContent='✅ Copied'}catch(e){document.getElementById('cpl').textContent='Selected: press Ctrl+C / Copy'}};
function importCode(){
  const raw=(window.IMPV||document.getElementById('imp')?.value||'').trim();window.IMPV='';
  try{
    const body=raw.replace(new RegExp('^'+GAME.codePrefix+':'),'').replace(/\s+/g,'');
    const d=migrate(JSON.parse(b64dec(body)));
    if(d.S.over) throw new Error('already over');
    setTimeout(()=>adopt(d),0);
  }catch(e){setTimeout(()=>{openTransfer();const el=document.getElementById('imperr');if(el)el.textContent=/already over/.test(e.message)?'That game is already finished.':`That code didn’t work. Make sure you copied all of it, starting with ${GAME.codePrefix}:`;const i=document.getElementById('imp');if(i)i.value=raw},0)}
}

// ---------------- endings ----------------
// finish()        the run reached its last night: graded with scoreOf()/gradeOf()

// Content supplies: scoreOf(), gradeOf(score), endRows(), LOSSES, FINISH_TEXT. See 21-story.js.

  app.innerHTML=withName(`<div class="end"><div style="display:flex;justify-content:space-between;align-items:center"><div class="small-note" style="color:var(--mute)">${lost?'GAME OVER':'COMPLETE'} · {{name}}</div><button class="gear" style="background:var(--surface);color:var(--ink)" onclick="openSettings()" aria-label="Settings">⚙️</button></div><h1>${h1}</h1><p>${sub}</p>

  <div class="kv"><span>Score</span><b>${sc}${newBest?' 🏆 new best':''}</b></div>${best!=null?`<div class="kv"><span>Previous best</span><b>${best}</b></div>`:''}
  <div class="kv"><span>🏆 Achievements this game</span><b style="text-align:right">${achNew.length?achNew.map(a=>a.ic+' '+a.n).join(', '):'none new'}</b></div>

// 1–9 press the numbered buttons (in a pop-up, its buttons; otherwise the action buttons on screen),
// a tab's first letter switches to it (H Here, T To-do, L Log…), Esc closes, ? lists all of this.
// Number hints only show on a computer with a mouse (CSS: hover + fine pointer), and never while typing.
const KEY_CLOSE=/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i;
const keyTabs=()=>{const m={};allTabs().forEach(([k,,l])=>{const c=l[0].toLowerCase();if(!m[c])m[c]=k});return m};
const keyVisible=el=>!!el&&!el.disabled&&el.offsetParent!==null&&el.getClientRects().length>0;
function keyTargets(){
  const mb=document.getElementById('mbg');
  if(mb) return {where:'modal',list:[...mb.querySelectorAll('.modal > button.act')].filter(keyVisible)};
  if(document.querySelector('.cross'))return {where:'none',list:[]};
  if(typeof S==='undefined'||!S||S.over||!document.querySelector('#app .hud'))return {where:'none',list:[]};
  return {where:'main',list:tab==='act'?[...document.querySelectorAll('#app .content button.act')].filter(keyVisible):[]}}
function keyHints(){try{
  document.querySelectorAll('.kn').forEach(n=>n.remove());
  const {list}=keyTargets();list.slice(0,9).forEach((b,i)=>{const n=document.createElement('i');n.className='kn';n.setAttribute('aria-hidden','true');n.textContent=i+1;b.appendChild(n)})}catch(e){}}
function keysModal(back){
  const row=(k,t)=>`<div class="keys-row"><kbd>${k}</kbd><span>${t}</span></div>`;
  const tabs=Object.entries(keyTabs());
  modal('⌨️ Keyboard shortcuts',`<div class="keys">${[
    row('1 – 9','Press the numbered button (the small number on its right)'),
    row(tabs.map(([c])=>c.toUpperCase()).join(' '),tabs.map(([,k])=>allTabs().find(t=>t[0]===k)[2]).join(', ')+' tabs'),
    row('Esc','Close the pop-up; skip a transition'),
    row('Enter','Press the highlighted button'),
    row('?','This list')].join('')}</div><p style="font-size:12px;color:var(--mute)">Shortcuts never fire while you’re typing.</p>`,
    (back?[{l:'Back to settings',fn:back}]:[]).concat([{l:'Close',fn:()=>{}}]))}
window.keysModal=keysModal;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key,lk=k.length===1?k.toLowerCase():k;
  if(k==='?'){e.preventDefault();if(!document.getElementById('mbg'))keysModal();return}
  const {where,list}=keyTargets();
  if(/^[1-9]$/.test(k)){const b=list[+k-1];if(b){e.preventDefault();b.click()}return}
  if(where==='modal'){
    if(k==='Escape'){if(document.getElementById('mbg').dataset.lock){e.preventDefault();return}const b=[...list].reverse().find(x=>KEY_CLOSE.test(((x.querySelector('.tx b')||x).textContent||'').trim()));if(b){e.preventDefault();b.click()}}
    return}
  if(where!=='main')return;
  const kt=keyTabs();if(kt[lk]){e.preventDefault();setTab(kt[lk])}
});
// refresh the hints whenever the screen or a pop-up changes
{let q=false;const go=()=>{q=false;keyHints()};
  try{new MutationObserver(ms=>{if(q)return;if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&!n.classList.contains('kn'))||[...m.removedNodes].some(n=>n.nodeType===1&&n.id==='mbg'))){q=true;requestAnimationFrame(go)}})
    .observe(document.body,{childList:true,subtree:true})}catch(e){}}

  const T=TRIPS[type],a=[T.start,T.start+T.len];
  return S.book.some(b=>{if(b.d!==d||b.status!=='booked'||!!b.asst!==!!asst)return false;const B=SLOT(b),gap=TRIPS[b.type].loc===T.loc?30:travelMins(TRIPS[b.type].loc,T.loc)+20;
    return a[0]<B[1]+gap&&B[0]<a[1]+gap});
}
// What's wrong with a booking under the rules (null = nothing)
function issueOf(b){
  const T=TRIPS[b.type];
  if(T.below&&isSunMon(b.d)) return 'sunmon';
  if(b.type==='silver'&&b.n>4) return 'overload';
  if(b.type==='reds'&&b.n>5) return 'overload';
  return null;
}
function addBooking(o){const b=Object.assign({id:S.nextId++,status:'booked',quirk:[]},o);S.book.push(b);S.book.sort((x,y)=>x.d-y.d||SLOT(x)[0]-SLOT(y)[0]);return b}
const partyLine=b=>`The ${b.who} (${b.from}${b.res?', Alaska residents':''}) · ${b.n} ${b.type==='halibut'?'passengers':'clients'}`;
const payOf=b=>b.type==='halibut'?(S.up&&S.up.chp?Math.round(350*b.n*S.up.rate):TRIPS.halibut.gig):Math.round(TRIPS[b.type].price*b.n*((S.up&&S.up.rate)||1));

      fn:()=>{spend(95);pass(180);S.cred.fa=faRenewTo(d);adj('energy',-6);say('⛑️ Three hours of chest compressions on a rubber torso named Rescue Randy. New card in your wallet, good for two years: guiding legally requires a current one.')}});

// ☕ Optional coffee break: 5 minutes on the clock, anywhere except the drift boat (Cooper Landing / a trout float).
function coffeeAction(onDrift){
  return {ic:'☕',l:'Grab a cup of coffee, it will take 5 minutes',s:onDrift?'Not on the drift boat: both hands are on the oars and there’s nowhere to set a cup.':'Optional. Adds 5 minutes to the clock.',cat:'rest',dis:onDrift,
    fn:()=>{pass(5);say(pick(['☕ Thermos coffee, black, steaming in the cold river air. Five minutes well spent.','☕ You pour a cup and watch the river slide by for five minutes.','☕ A quick cup. The world sharpens a little.']))}};
}

// ---- small extras on the Here tab ----
function statusTags(){
  const t=[],d=day();
  {const w=wxOf(d);t.push(`<span class="tag">${WX[S.wx[d]||'sun'].ic} ${WX[S.wx[d]||'sun'].n} ${w.temp}°F · 💨 ${w.wind} kt</span>`)}
  if(['lower','kbeach','homer'].includes(S.loc)) t.push(`<span class="tag">🌊 ${tideNow()}</span>`);
  if(S.loc==='lower'||S.loc==='cooper') t.push(`<span class="tag">🏞️ river ${waterTxt(wxOf(d))}</span>`);
  if(isSunMon(d)) t.push('<span class="tag bad">🚫 no guide-boat fishing below Skilak</span>');
  if(halClosed(d)) t.push('<span class="tag">⚓ no charter halibut retention</span>');
  t.push(`<span class="tag ${S.gear<1?'bad':''}">🪱 tackle ×${S.gear}</span>`);
  t.push(`<span class="tag ${S.fuel<bn('reds')?'bad':''}">⛽ ${Math.round(S.fuel)}/${SLED_TANK()} gal</span>`);
  if(S.unlogged+S.overdue) t.push(`<span class="tag ${S.overdue?'bad':''}">📓 ${S.unlogged+S.overdue} to log</span>`);
  if(S.cred.fa<d) t.push('<span class="tag bad">⛑️ first-aid card expired</span>');
  if(S.energy<25) t.push('<span class="tag bad">🥱 running on fumes</span>');
  if(S.freezer) t.push(`<span class="tag">🧊 ${S.freezer} reds in the freezer</span>`);
  return t;
}
function alertBar(){
  const d=day(),m=tod();
  if(boatDown()&&todays(d).some(b=>b.type!=='halibut')) return {t:`🔧 Your boat is out of service (condition 0). Pay for a major repair at the shop before your next launch.`};
  for(const b of todays(d)){const T=TRIPS[b.type];
    if(m>T.start&&m<=T.start+90&&S.loc!==T.loc) return {t:`⏰ The ${b.who} are waiting at ${L[T.loc].name} (launch was ${fmt(T.start)}).`};
    if(m>=T.start-120&&m<=T.start&&S.loc!==T.loc) return {t:`🛶 ${T.n} launches at ${fmt(T.start)} from ${L[T.loc].name}: ${travelMins(S.loc,T.loc)} min away.`,kind:'info'};}
  {const low=todays(d).find(b=>tripFuel(b)&&tripFuel(b).tank==='fuel'&&S.fuel<tripFuel(b).gal+2);if(low&&m<TRIPS[low.type].start)return {t:`⛽ ${Math.round(S.fuel)} gallons in the sled; your ${TRIPS[low.type].n.toLowerCase()} burns ~${tripFuel(low).gal}. Fuel dock: Kenai Harbor.`}}
  if(faUrgent(d)) return {t:`⛑️ First-aid card expires ${dayName(S.cred.fa)} night: classes ${FA_CLASS_TXT}`,kind:'info'};
  return null;
}

// ---- weather & the run ----
const WX={sun:{n:'Bluebird day',ic:'☀️',q:.03},cloud:{n:'Overcast',ic:'☁️',q:.04},rain:{n:'Steady rain',ic:'🌧️',q:-.02},wind:{n:'Windy',ic:'💨',q:-.04}};
function rollDay(d){
  S.wx[d]=pick(['sun','sun','cloud','cloud','rain','wind']);
  rollWeather(d);                                        // temperature, wind, rain, river level (23-fish.js)
  const n=rollRun(d);                                    // run-timing model → today's sockeye past the sonar
  S.run[d]=n;S.cum+=n;
}
function sonarSay(){const d=day(),y=S.run[d-1];say(y?`📊 Kenai sonar: <b>${y.toLocaleString()}</b> sockeye passed river mile 19 yesterday; <b>${S.cum.toLocaleString()}</b> for the season. ${y>150000?'The river is paved with reds.':y>90000?'Solid push of fish.':'Slow. The commercial setnetters may be catching them first.'}`:`📊 Season count so far: <b>${S.cum.toLocaleString()}</b> sockeye past the sonar.`)}

function onMorning(d){
  if(d===0) return;
  const sd=sday(d),newSeason=sd===0;
  if(newSeason) startSeason(seasonOf(d));               // 24-career.js: bills, new rules, forecast, upgrades
  rollDay(d);
  const w=WX[S.wx[d]];
  say(newSeason?`❄️➡️☀️ <b>${dlongY(d)}</b>, ${fmt(S.t)}. Season ${seasonOf(d)+1} of ${S.years}. ${w.ic} ${w.n}. Plan the off-season to open this year’s bookings.`:`${dlong(d)}, ${fmt(S.t)}. ${w.ic} ${w.n}.${Math.random()<.4?' '+pick(LORE):''}`);
  if(newSeason) return;
  const t=todays(d);
  if(t.length) say('🛶 Today: '+t.map(b=>`${TRIPS[b.type].ic} ${TRIPS[b.type].n} at ${fmt(TRIPS[b.type].start)}, ${L[TRIPS[b.type].loc].name} (the ${b.who}, ${b.n})`).join(' · '));
  else say('🛶 No trips booked today. Service the boat, return calls, or go fill the freezer.');
  if(isSunMon(d)) say(`🚫 ${dayName(d)}: no fishing from guide boats on the Kenai below Skilak Lake through July 31.`);
  const strong=REG().mult.sockeye>=.85;
  if(!strong&&S.limit===3&&REG().mult.sockeye<.7&&sd>=5){
    S.limit=2;S.eo.push('Kenai River sockeye limit cut to 2 per day, 4 in possession');
    say('📣 <b>Emergency order:</b> the late run is tracking below its goal. ADF&G cuts the Kenai sockeye limit to <b>2 per day</b>.');
    showTile('📣','Sockeye limit cut to 2','ADF&G emergency order','bad');
  }
  if(strong&&S.limit===3&&(S.cum>1200000*REG().mult.sockeye||sd>=8)){
    S.limit=6;S.eo.push('Kenai River sockeye limit raised to 6 per day, 12 in possession');
    say('📣 <b>Emergency order:</b> with the late run past its escapement goal, ADF&G raises the Kenai sockeye limit to <b>6 per day, 12 in possession</b>.');
    showTile('📣','Sockeye limit raised to 6','ADF&G emergency order','good');
  }
  if(strong&&sd===10&&!S.eo.some(e=>/Russian/.test(e))){
    S.eo.push('Russian River & upper Kenai sockeye limit 6 per day, 12 in possession');
    say('📣 <b>Emergency order:</b> the Russian River and a stretch of the upper Kenai go to 6 sockeye a day, too.');
  }
}
function onNight(where,notes,d){
  if(S.trip){S.trip=null;notes.push('🛶 You never finished the trip. The party drove off without paying.')}
  if(where==='collapsed'){S.loc='shop';notes.push('😵 You were up past midnight and fell asleep in the truck at the shop.')}
  money(-overhead());S.stats.spent+=overhead();notes.push(`💸 Boat payment, insurance and groceries: ${$(overhead())}.`);
  S.book.filter(b=>b.d===d&&b.status==='booked'&&b.asst).forEach(b=>asstSettle(b,notes));
  S.book.filter(b=>b.d===d&&b.status==='booked'&&!b.asst).forEach(b=>{b.status='noshow';adj('rep',-15);S.stats.noshow++;
    notes.push(`😠 You never showed for the ${b.who}. They posted a one-star review from the parking lot.`)});
  if(S.unlogged){S.overdue+=S.unlogged;notes.push(`📓 ${S.unlogged} logbook entr${S.unlogged>1?'ies are':'y is'} now overdue. Write ${S.unlogged>1?'them':'it'} up before a trooper asks.`);S.unlogged=0}
  adj('energy',(where==='home'?60:30)/(where==='collapsed'?2:1));
  if(d===S.cred.fa) notes.push('⛑️ Your first-aid/CPR card expired at midnight. You can’t legally guide until you renew it.');
  if(S.energy<15) notes.push('🥱 You’re running on fumes.');
}
function onTime(min){if(min>0)adj('energy',-min/50)}
function onArrive(dest){S.visited[dest]=true}
function daySummary(d){const n=S.book.filter(b=>b.d===d&&b.status==='done').length;return [`⭐ ${S.rep}`,`⚡ ${S.energy}`,`🛶 ${n} trip${n===1?'':'s'}`]}

// ---- booking requests ----
// Is a trip of this type on day d against the rules? (guide boats below Skilak Sun/Mon; charter halibut can't be kept on closed days)
const illegalDay=(type,d)=>!!(TRIPS[type].below&&isSunMon(d))||(type==='halibut'&&halClosed(d));
function makeRequest(){
  const d0=day()+1,end=seasonFirst()+SEASON;if(d0>=end||S.winter) return null;
  const s=seasonOf(day()),span=Math.min(6,end-d0);
  // the dipnet "guests" scam: rolled once per call, and at most one per season
  if(S.dipnetAsk!==s&&Math.random()<.12){
    const p=pick(PARTIES.filter(x=>!x.res));S.dipnetAsk=s;
    return {kind:'dipnet',d:d0+Math.floor(Math.random()*span),n:2+Math.floor(Math.random()*3),who:p.who,from:p.from,res:false};
  }
  const roll=()=>{const d=d0+Math.floor(Math.random()*span),types=['reds','reds','reds','reds','trout','trout','halibut'].concat(sday(d)>=8?['silver','silver']:[]);return {d,type:pick(types)}};
  for(let i=0;i<24;i++){
    let {d,type}=roll();
    if(illegalDay(type,d)) ({d,type}=roll());             // re-roll an illegal date once; the second pick stands, so some illegal requests still teach the lesson
    const p=pick(PARTIES),kind=Math.random()<.22&&type==='reds'?'king':'trip';
    const nr={reds:[2,6],silver:[2,5],trout:[2,4],halibut:[4,6]}[type],n=nr[0]+Math.floor(Math.random()*(nr[1]-nr[0]+1));
    let asst=false;
    if(conflicts(d,type)){if(S.up.asst&&type!=='halibut'&&!conflicts(d,type,true))asst=true;else continue}
    return {kind,asst,d,type,n,who:p.who,from:p.from,res:!!p.res,quirk:Math.random()<.25?[pick(['drinker','nolicense','photo','kid'])]:[]};
  }
  return null;
}
// What's wrong with the requested date, as a modal line ('' when nothing)
function requestWarn(r){
  const T=TRIPS[r.type],iss=issueOf({type:r.type,d:r.d,n:r.n}),w=[];
  if(iss==='sunmon') w.push(`🚫 ${dayName(r.d)}: guide boats can’t fish below Skilak Lake (May 1–Jul 31)`);
  if(iss==='overload') w.push(`🚫 ${T.n}s are limited to ${r.type==='silver'?4:5} anglers on a guide boat`);
  if(r.type==='halibut'&&halClosed(r.d)) w.push(`⚓ ${dayName(r.d)}: charter anglers can’t keep halibut today (${halDaysTxt()})`);
  if(faDue(r.d)&&faClassDay(r.d)&&T.start<960&&T.start+T.len>780) w.push(`⛑️ This runs into the 1–4 PM first-aid class on ${dayName(r.d)}, and your card is still due`);
  return w.map(x=>`<p style="font-size:13px;color:var(--warn)">${x}</p>`).join('');
}
// nearest later day in the same season that is legal and free (null if none). Only date problems are fixed by moving the date.
function nextLegalDay(r){
  const end=seasonFirst(seasonOf(r.d))+SEASON;
  for(let d=r.d+1;d<end;d++) if(!illegalDay(r.type,d)&&!conflicts(d,r.type,!!r.asst)) return d;
  return null;
}
function requestModal(r){
  const who=`The <b>${r.who}</b> (${r.from}${r.res?', Alaska residents':''})`;
  if(r.kind==='dipnet'){
    modal('📞 Booking request',`<p>${who}, ${r.n} people, want you to take them <b>dipnetting at the mouth of the Kenai</b> on ${dlong(r.d)}. “We’ll pay whatever. We saw it on YouTube.”</p>`,[
      {l:'Explain it’s Alaska residents only',s:'Offer a sockeye trip some other time.',fn:()=>{adj('rep',1);say('📞 You explain the personal-use dipnet fishery is for Alaska residents only. They’re disappointed but say they’ll book a sockeye trip next summer.')}},
      {l:`Take them as your “guests” — ${$(150*r.n)}`,s:'Cash up front.',fn:()=>{money(150*r.n);S.stats.earned+=150*r.n;say('🥅 You pocket the cash and hand nonresidents dipnets on the beach.');violate(null,{p:.35,fine:500,what:'helping nonresidents in the personal-use fishery'})}}]);
    return;
  }
  const T=TRIPS[r.type],asstNote=r.asst?`<p style="font-size:13px;color:var(--mute)">🧑‍🤝‍🧑 You’re booked then, so your assistant guide would take this party: you keep ${Math.round((1-ASST_CUT)*100)}% of the fare and tips.</p>`:'',price=T.gig?`day rate ${$(T.gig)}`:`${$(T.price)} × ${r.n} = ${$(T.price*r.n)}`;
  const book=(n,q,d)=>{const b=addBooking({d:d??r.d,type:r.type,n,who:r.who,from:r.from,res:r.res,quirk:q||r.quirk,asst:r.asst||undefined});sfx('good');say(`📅 Booked: ${T.ic} ${T.n}, ${dlong(b.d)} at ${fmt(T.start)}, the ${b.who} (${b.n})${b.asst?', with your assistant guide':''}.`)};
  if(r.kind==='king'){
    modal('📞 Booking request',`<p>${who}, ${r.n} anglers, ${dlong(r.d)}: “We want a <b>Kenai king</b>. A big one. Like the world record.”</p>${requestWarn(r)}`,[
      ...(kingRule()==='open'?[{l:'Book it: kings are open this year',s:`1 per day, 20 in. or longer. ${$(payOf({type:'reds',n:r.n}))}.`,fn:()=>book(r.n,['kingfan'])}]:[
      {l:`Tell them straight: kings are ${kingRule()==='cr'?'catch-and-release only':'closed'}`,s:`Book a sockeye trip instead: ${$(payOf({type:'reds',n:r.n}))}.`,fn:()=>book(r.n,['kingfan'])},
      {l:'Promise you’ll “see what we can do”',s:`Book it: ${$(payOf({type:'reds',n:r.n}))}.`,fn:()=>book(r.n,['kingfan','promised'])}]),
      {l:'Decline politely',fn:()=>say('📞 You pass. They’ll find somebody.')}]);
    return;
  }
  const o=[],warn=requestWarn(r),alt=illegalDay(r.type,r.d)?nextLegalDay(r):null,bn=r.type==='trout'&&r.n>3?3:r.n;
  const bad=illegalDay(r.type,r.d);
  if(r.type==='trout'&&r.n>3) o.push({l:'Book 3 (drift boat seats three)',s:`${$(payOf({type:'trout',n:3}))}. One of them stays at the lodge.`,fn:()=>book(3)});
  else o.push({l:`${bad?'Book it anyway':'Book it'} — ${$(payOf({type:r.type,n:r.n}))}`,s:bad?'You’ll face the rules on the water.':'',fn:()=>book(r.n)});
  if(bad&&alt!=null) o.splice(0,0,{l:`Offer ${dlong(alt)} instead`,s:`Same party, ${fmt(T.start)}. ${$(payOf({type:r.type,n:bn}))}.`,fn:()=>book(bn,null,alt)});
  o.push({l:'Decline politely',fn:()=>say('📞 You pass on that one.')});
  modal('📞 Booking request',`<p>${who} would like a <b>${T.ic} ${T.n}</b> on <b>${dlong(r.d)}</b> at ${fmt(T.start)} for <b>${r.n}</b>.</p>${warn}<p style="font-size:13px;color:var(--mute)">${T.long} ${price}.</p>${asstNote}`,o);
}

// ---- dipnetting (you're an Alaska resident) ----
function dipnetModal(){
  const d=day(),o=avgOdds('sockeye','kbeach',S.t,180),n=clamp(Math.round((2+13*o)*(.7+Math.random()*.6)),1,Math.max(1,25-S.pu));
  S.dipnet[d]=true;
  modal('🥅 Dipnetting at the mouth',`<p>Three hours in chest waders at the mouth of the Kenai, a five-foot hoop net and a few hundred of your neighbors. You bonk <b>${n} reds</b>.</p><p style="font-size:13px">🌊 Tide: ${tideNow()}. Reds ride the incoming tide in; ${o>.75?'you timed it right.':o>.45?'decent timing.':'next time, come on the flood tide.'}</p><p style="font-size:13px;color:var(--mute)">Personal use is for Alaska residents only. Household limit: 25. Before you leave the beach, clip both tips of each fish’s tail and record it on your permit.</p>`,[
    {l:'Clip both tail tips & record them on your permit',s:'10 more minutes.',fn:()=>{pass(190);S.freezer+=n;S.pu+=n;adj('energy',-10);say(`🥅 ${n} reds clipped, recorded and iced. Freezer: ${S.freezer}/25.`)}},
    {l:'Skip the paperwork, beat the traffic',fn:()=>{pass(180);S.freezer+=n;S.pu+=n;adj('energy',-10);say(`🥅 You toss ${n} reds in the cooler and hit the road.`);violate(null,{p:.3,fine:150,minor:true,what:'unmarked, unrecorded personal-use salmon'})}}]);
}

// ---- enforcement: boat & credential checks ----
function credCheck(){
  const who=pick(['An Alaska Wildlife Trooper','A State Parks ranger','A pair of troopers in a patrol boat']);
  let bad=false;
  if(S.cred.fa<day()&&todays().length){bad=true;say(`👮 ${who} asks for your guide license, USCG card and first-aid card. The first-aid card is expired.`);cite('guiding without a current first-aid card',500,false,null)}
  if(S.overdue>0){bad=true;say(`👮 ${who} flips through your ADF&G logbook and finds blank days.`);cite('logbook entries not filled out',250,true,null)}
  if(!bad){S.stats.checks++;adj('rep',1);say(`👮 ${who} checks your licenses, decals, life jackets, fire extinguisher and logbook. “Clean boat. Have a good one.”`)}
}

const FINISH_TEXT={h1:'{{name}}, that’s a wrap on your career',sub:()=>`${S.years} Julys on the Kenai, ${yearOf(0)}–${yearOf(day())}. The river keeps running; somebody else gets your seams now.`};
function curSeason(){const s=S.stats,o=S.st0||{};return {year:yearOf(day()),trips:s.trips-(o.trips||0),fares:s.earned-(o.earned||0),earned:(s.earned+s.tips)-((o.earned||0)+(o.tips||0)),wom:S.wom||0}}
function scoreOf(){return Math.round((S.money-DF().money)+restOfSeason(curSeason()).net+(S.up?S.up.value:0)*.75+S.rep*15+S.stats.trips*60-(S.stats.citesTotal||S.cites)*400+S.freezer*2+(S.stats.viol===0?300*S.years:0))}
const GRADE_CUTS=[66000,57000,45000,28000];            // A, B, C, D: score per season, the same on every difficulty
function gradeOf(sc){
  sc=sc/(S.years||1);                                   // graded per season, so careers of any length compare
  if(sc>=GRADE_CUTS[0]) return ['A','Guide Master','Other guides watch where you anchor (legally).'];
  if(sc>=GRADE_CUTS[1])  return ['B','River Rat','You know every seam from Big Eddy to the Russian.'];
  if(sc>=GRADE_CUTS[2])  return ['C','Seasonal Hand','Booked, tired and still mostly dry.'];
  if(sc>=GRADE_CUTS[3])  return ['D','Greenhorn','You learned the regs the expensive way.'];
  return ['F','Hang Up the Waders','Maybe the slime line is hiring.'];
}
function endRows(){
  const s=S.stats;
  const last=curSeason();last.rest=restOfSeason(last);
  const yrs=S.seasons.concat([last]).map(x=>`${x.year}: ${x.trips}${x.rest&&x.rest.trips?` + ${x.rest.trips}`:''} trips, ${$(x.earned+(x.rest?x.rest.net:0))}`).join('<br>');
  return [['Difficulty',`${DF().ic} ${DF().n}: ${DF().enforce<1?'fewer patrols, cheaper bills':DF().enforce>1?'more patrols, dearer bills, pickier clients':'standard patrols and bills'}; no score bonus`],['Career',`${S.years} seasons`],['Season by season',yrs],['Cash',$(Math.round(S.money))],['Net over the career',$(Math.round(S.money-DF().money))],['Boats & permits bought',S.up&&S.up.value?$(S.up.value):'none'],['Trips / clients',`${s.trips} / ${s.clients}`],
    ['Fish landed',s.fish],['Trips where everyone limited',s.limits],['Tips',$(s.tips)],['Reputation',S.rep],
    ['Record',`${s.citesTotal||0} citation${(s.citesTotal||0)===1?'':'s'}, ${s.warnsTotal||0} warning${(s.warnsTotal||0)===1?'':'s'}, ${$(s.fines)} in fines`],
    ['Fuel',`${Math.round(s.fuelGal||0)} gal, ${$(Math.round(s.fuelCost||0))}`],['Coast Guard tows',s.tows||0],['Winter camping',`${s.campNights||0} night${(s.campNights||0)===1?'':'s'}, ${s.encounters||0} wildlife encounter${(s.encounters||0)===1?'':'s'}`],['Kings released',s.kings],['Freezer',`${S.freezer} reds`],['Boat checks passed',s.checks]];
}

// ---- enforcement ----
const COPS=['an Alaska Wildlife Trooper','a State Parks ranger in a jet sled','an ADF&G enforcement officer at the launch'];
const NOAA='a NOAA Fisheries enforcement officer at the harbor';
function cite(what,fine,minor,notes,who){
  who=who||pick(COPS);let line;
  if(minor&&S.warns<1){S.warns++;S.stats.warnsTotal=(S.stats.warnsTotal||0)+1;line=`⚠️ ${who} writes you a warning for ${what}. One warning a season; the next one costs money.`}
  else{fine=Math.round(fine*DF().fine*(1+DF().esc*S.cites));S.cites++;S.citeLog.push(day());S.stats.citesTotal=(S.stats.citesTotal||0)+1;money(-fine);S.stats.fines+=fine;adj('rep',-6);
    line=`🚨 ${who} cites you for ${what}: ${$(fine)} fine. That’s ${S.cites} active citation${S.cites>1?'s':''} of 3 before State Parks pulls your Kenai River guide permit.${S.cites>1?' Repeat offenders pay more for every citation on the record.':''} (Citations drop off after the next season.)`}
  showTile('🚨',minor&&line.startsWith('⚠️')?'Warning':'Citation',what,'bad');
  if(notes) notes.push(line); else say(line);
}
function violate(notes,{p,fine,what,minor,who}){
  S.stats.viol++;
  if(Math.random()<Math.min(.95,p*DF().enforce)){cite(what,fine,minor,notes,who);return true}
  if(Math.random()<.3){adj('rep',-2);const l='👀 Another guide saw it. Word travels fast on the Kenai.';if(notes)notes.push(l);else say(l)}
  return false;
}
