const HELP=[
  ['🧭','Getting started',`<p class="help-sum">Run a fishing-guide business out of Soldotna, Alaska, for a <b>2-, 5- or 10-year career</b>.</p><ul>
    <li>Each season you guide <b>two weeks</b> yourself. Season 1 is the July peak of the sockeye run. Between seasons comes the off-season: bills, upgrades and planning.</li>
    <li>Time moves only when you act. Tap an action on the <b>🧭 Here</b> tab, or open <b>Go somewhere</b> to drive to another place.</li>
    <li><b>Energy</b> drops through the day and with every trip. <b>Go to bed</b> at the shop to get most of it back; a nap or a diner breakfast helps a little. Under 30, your trips catch fewer fish.</li>
    <li>The alarm rings at 5:00 AM (change it at the shop). <b>⏳ Wait until…</b> skips ahead. Stay up past midnight and you fall asleep in the truck and wake up tired.</li>
    <li>Tabs: <b>🧭 Here</b> (what you can do), <b>📅 Bookings</b>, <b>🐟 Fish</b> (conditions), <b>🏠 Home</b> (the cabin), <b>📖 Regs</b>, <b>📋 To-do</b> (today’s list and your own) and <b>📜 Log</b>.</li>
    <li>The top bar shows cash, your ★ rating (reputation is the bar under it), energy, boat, fuel, food and your record.</li>
    <li>A career ends early with <b>3 active citations</b>, <b>reputation at 0</b> or <b>more than $2,000 in debt</b>.</li></ul>`,'start'],
  ['🛶','Your first trip',`<p class="help-sum">Be at the launch on time, pick a spot, make the calls through the day, then get paid at the dock.</p><ul>
    <li>Your schedule is on <b>📅 Bookings</b>. Sockeye, silver and June king trips leave the <b>Lower Kenai launch</b>, trout floats leave <b>Cooper Landing</b>, halibut charters leave the <b>Homer Spit</b>.</li>
    <li>The party shows up an hour early. Every minute you’re late costs goodwill, and after 90 minutes they leave (and post a review).</li>
    <li><b>At the launch</b> you pack the cooler and pick a spot. The day then runs in <b>stretches</b>. Before each one you see the clock, the tide, yesterday’s sonar count, the boat traffic, the wind and the bite.</li>
    <li><b>Your moves:</b> stay put, switch tactics (5 minutes), run to another spot (time and gas), stop for shore lunch, or on the last call head in early.</li>
    <li><b>Dilemmas</b> come up along the way. The answers are shuffled and none is marked. Some are judgment calls; others tempt you to bend a rule. There is always a legal answer, and it costs something.</li>
    <li><b>Back at the dock</b> you see the catch, the fare, the tip, any refund and the party’s written review. The whole trip is one sheet that changes in place.</li></ul>`,'trip'],
  ['🎯','Clients',`<p class="help-sum">Every party comes for something. Give them that day and the tip follows.</p><ul>
    <li>You see what they want on the booking request and at the launch: <b>🥩 a full cooler</b>, <b>🏆 one big fish</b>, <b>🧒 action and an early lunch for the kids</b>, <b>📸 scenery and wildlife</b>, <b>🪰 fish on a fly</b>, <b>🌱 coaching and easy water</b> or <b>🤢 calm water</b>.</li>
    <li>Fit the day to the party: the walkway and a shore lunch for a family, the long run for trophy hunters, streamers for fly purists, sheltered water for green faces.</li>
    <li>Happy clients tip. Unhappy ones want part of the fare back.</li>
    <li>Each review is 1 to 5 stars. A party with a great day may become a <b>regular</b> and book you again next season; if they don’t offer, hand them your card at the dock.</li>
    <li>Over the years you may meet a rival guide, a family that comes back every summer and the local fish and game advisory committee.</li></ul>`,'clients'],
  ['🐟','Fish, weather and timing',`<p class="help-sum">Read the water before you launch. The right spot on the right day beats the usual spot.</p><ul>
    <li>The <b>🐟 Fish</b> tab shows the weather, river level, tides, the odds by place and species, where to fish today and when each run arrives.</li>
    <li>Look at it (or <b>scout the river</b> from the lower launch) and the spot buttons show a <b>Hot, Good, Fair or Poor</b> read. Scouting gives the exact read.</li>
    <li>Fresh reds ride the flood tide in. Boats crowd the popular drifts by mid-morning. The wind builds in the afternoon. Halibut like slack water.</li>
    <li>The daily <b>sonar count</b> (at the shop or on 📖 Regs) tells you how many sockeye came in yesterday. Pinks run in even years.</li>
    <li>With no clients booked, <b>Take the boat out</b> to fill your freezer and learn the water. Alaska residents can also dipnet reds at the river mouth, July 10 to 31.</li>
    <li>Skill grows with every trip, scouting run and ADF&amp;G office visit, and some of it rusts away each winter.</li></ul>`,'fish'],
  ['📖','Rules and the law',`<p class="help-sum">Play it by the book. Bending a rule can pay today, but it costs you over a career.</p><ul>
    <li>The <b>📖 Regs</b> tab lists your licenses and every rule for the week you’re guiding. Season 1 follows the real 2026 rules; later seasons change them.</li>
    <li><b>Below Skilak Lake, May 1 to July 31:</b> no fishing from guide boats on Sundays and Mondays, and only 6 AM to 6 PM on other days. In July, no more than five people in a guide boat while fishing.</li>
    <li><b>June 20 to August 15 below Skilak:</b> one single hook, no bait, while kings are restricted. Kings are closed in 2026; later years may allow catch-and-release or one a day.</li>
    <li>Limits are per person and change by emergency order. Guides don’t fish with clients aboard. Dipnetting is for Alaska residents only.</li>
    <li><b>Paperwork:</b> fill out your logbook at the shop after every trip, before bed. Keep your <b>first-aid/CPR card</b> current: classes in Soldotna Monday, Tuesday and Thursday, 1 to 4 PM (join by 1:30); a card lasts two years.</li>
    <li>Troopers check boats at the launches. Your first minor offense each season is a warning. After that it’s a <b>citation</b> and a fine, and each citation on your record makes the next fine bigger.</li>
    <li>Every rule you break this season makes the next one likelier to be caught, and other guides talk. A citation is public record: booked clients may cancel. Citations drop off after the next season; <b>three active</b> and you lose your permit.</li></ul>`,'rules'],
  ['💵','Money and score',`<p class="help-sum">Trips pay the bills. Your grade is your score per season.</p><ul>
    <li>A trip pays its <b>booked fare</b>, plus a <b>tip</b> that grows with happiness (nothing at so-so, up to 30% of the fare on a great day), minus any refund (and a $15 launch fee on the lower river).</li>
    <li>You pay overhead every night, plus fuel, tackle, food, repairs and fines. Winter brings license, insurance and living bills.</li>
    <li>The weeks you don’t guide still earn: the off-season settles the rest of the summer, and it follows how happy your clients were, not only how many trips you ran.</li>
    <li>The <b>score</b> adds up net cash, the rest of your last summer, most of what you spent on boats and permits, your reputation and your trips. Citations cost points; a clean record earns a bonus. The end screen shows every line.</li>
    <li><b>Grades per season:</b> A 62,000, B 55,000, C 44,000, D 27,000, F below. A career that ends early is an F.</li>
    <li>Difficulty never changes the cutoffs. Combat Season is harder and grades about a step lower; Rookie Season about a step higher. Prices here are for Licensed Guide.</li></ul>`,'money'],
  ['⭐','Reputation and the ★ rating',`<p class="help-sum">Your rating is the average of your last 20 reviews. Keep it high and work finds you.</p><ul>
    <li>It sits in the top bar. While you have few reviews, your reputation fills in. The bar under it is your reputation: at 0, nobody books you.</li>
    <li>A review is 5 stars for a great day, 4 for a good one and down from there.</li>
    <li><b>★4.5</b> with 10+ reviews: you’re a <b>top-rated guide</b>, and parties tip more on a good day.</li>
    <li><b>★4.7</b> with 12+ reviews: a <b>magazine feature</b>, once a career. The phone rings with extra trips that week.</li>
    <li>A season that averages <b>★4.7</b>: a <b>lodge partnership</b> that sends you extra parties every season (for a 10% fee), until your rating falls under <b>★4.3</b>.</li>
    <li>Under <b>★2.5</b>, fewer people book. Reputation also drifts back toward the middle each winter.</li></ul>`,'rating'],
  ['📆','The season',`<p class="help-sum">Two weeks of guiding a year. You pick which ones from your second summer on.</p><ul>
    <li>In the off-season, <b>📆 Your weeks</b> lets you choose two: <b>June kings</b> (or rainbows and halibut when kings are closed), either <b>July peak</b> week, <b>August silvers</b> or <b>September rainbows</b>. Dates, rules, runs and trips follow the week.</li>
    <li>The <b>☀️ morning report</b> gathers last night, overnight news, events, reminders and requests in one pop-up. Decisions that can’t wait follow it.</li>
    <li><b>Booking requests</b> wait at the top of 📅 Bookings for two days (a dot on the tab). Book or decline there; a bad date can often be moved. <b>Return calls</b> at the shop once a day for more.</li>
    <li><b>Season goals:</b> three a season, on 📅 Bookings. Reach them for a bonus, reputation or word of mouth on the season’s last night.</li>
    <li><b>Big days:</b> some requests come with a target, like <i>a 30-pound halibut for Dad’s 70th</i>. Meet it for a bonus.</li></ul>`,'season'],
  ['⛽','Boat, fuel and food',`<p class="help-sum">Keep the boat running, the tank full and food in the house.</p><ul>
    <li><b>Boat:</b> service it at the shop. A worn boat breaks down and clients notice. It warns you at 40, 20 and 10. At 0 it’s out of service until a $2,400 major repair; a $600 emergency patch (at 10 or less) or a $600 loaner (at 0) gets a booked trip out.</li>
    <li><b>Fuel:</b> a sockeye trip burns about 9 gallons, a silver trip about 11. Fill up only at the <b>Kenai Harbor fuel dock</b>, 6 AM to 10 PM, or haul gas home in cans and fuel up at the shop.</li>
    <li>Run dry and the Coast Guard tows you in: half the fare back to the clients, a $102 harbor assist and a hit to your reputation. Gas stored over winter needs stabilizer or it goes stale.</li>
    <li><b>Tackle:</b> restock in Soldotna. Out of tackle, trips go badly. <b>Rig tomorrow’s gear</b> at the shop for a better trip.</li>
    <li><b>Food:</b> you eat three meals a day from the pantry, fridge and freezer. Stock up in Soldotna. Missed meals cost energy, and a hungry guide has grumpy clients.</li>
    <li>Before each trip, <b>pack the cooler</b>: your lunch keeps you going, and snacks, lunch kits or a shore lunch of freezer reds make clients happier. On the all-day trout float and halibut charter, clients with no lunch are unhappy.</li>
    <li>Storms can knock the power out and spoil food. A <b>generator</b> (Home supplies in Soldotna) keeps the freezer going. Keep it and the gas outside.</li></ul>`,'boat'],
  ['🏠','Your cabin',`<p class="help-sum">The <b>🏠 Home</b> tab shows your cabin’s condition, 0 to 100. Keep it up and you sleep well.</p><ul>
    <li>It leaves you alone for your first week. After that it wears down slowly, and jobs come up. <b>Never more than two</b> show at once.</li>
    <li>Every job has <b>three ways</b>: do it yourself (time and energy), pay someone (cash) or skip it (a risk).</li>
    <li>Summer jobs: bear bins and fish waste, the generator, a garden (and a fence for the moose), the fish station. Off-season: heat, pipes and detectors in the fall, a cold snap and heavy snow, then spring breakup (driveway, well, septic).</li>
    <li>In good shape, you wake rested. Run down, you sleep badly, repairs land on guiding mornings, and a booked party can cancel.</li>
    <li>Do-it-yourself jobs in the off-season use the same 10 free days as winter camping.</li>
    <li>Trouble costs money, days, energy or reputation, but the cabin <b>never ends your career</b>. Never run a generator indoors.</li></ul>`,'cabin'],
  ['❄️','Off-season and winter camping',`<p class="help-sum">Between seasons you plan: bills, upgrades, your weeks, the cabin, camping and work.</p><ul>
    <li>The off-season summary shows last summer, the winter bills, next year’s rules and run forecast, and your record. Tap <b>Open bookings</b> when you’re ready.</li>
    <li><b>Upgrades:</b> a new motor, a new sled, a drift boat, marketing, a winter course, higher rates (more per trip, fewer bookings: the first step is cheap, the third is not), your own Homer charter permit and, later, an assistant guide, guest cabins or a riverfront lot.</li>
    <li>You have <b>10 free days</b> each winter for up to 3 camping trips and 2 winter jobs.</li>
    <li><b>Camping:</b> pick one of ten spots within 100 road miles, a month, company, where you sleep and what to pack. <b>Ice fish</b> (you need a fishing license, and licenses run by calendar year), ski, snowshoe, track wildlife, scout next season’s water or watch the northern lights.</li>
    <li>Each night has a 50% chance of an encounter, good or bad. What you pack and where you sleep change the odds.</li>
    <li>Each winter, skill rusts a little, warnings reset and old citations drop off. Renew your first-aid card if it’s due.</li></ul>`,'winter'],
  ['🧑‍🤝‍🧑','Growing the business',`<p class="help-sum">From your third off-season you can build an outfit, if you want to.</p><ul>
    <li>Hire up to <b>three guides</b> (reputation 55, 65 and 75 for the first, second and third) and buy up to <b>two more boats</b>: a used jet sled or a second drift boat.</li>
    <li>Guides take parties on days you’re booked, get calls of their own, and you can hand them one of your trips on the <b>Outfit</b> page of 📅 Bookings. Each needs a free boat. They never run Homer halibut.</li>
    <li>Their trips show up in the morning report. Their reviews name them and <b>don’t count</b> toward your own ★ rating.</li>
    <li>They’re paid per trip, get better every season and expect raises. Underpaid or overworked, they quit. Each needs licenses, and a guide’s citation goes on <b>your</b> record.</li>

  ['🏆','Trophy wall and memories',`<p class="help-sum">Your career’s highlights, in the <b>📜 Log</b> tab: switch to <b>🏆 Trophy wall</b>.</p><ul>

    <li>When a new season starts, a past client or two may send a postcard in the morning report.</li></ul>`,'wall'],
  ['🧓','Walt, your mentor',`<p class="help-sum">On a new career’s first trip, Walt Brandvold, an old Soldotna guide, rides along.</p><ul>

  ['🖼️','Pictures and settings',`<p class="help-sum">Make the game look, sound and pop up the way you like in <b>⚙️ Settings</b>.</p><ul>
    <li><b>🖼️ Illustrations</b> show at the moments that matter: the cabin, the launch, the river, the morning report, storms and camping. Everyday scenes rest a few days so they don’t repeat. Turn them off to keep the drawn scenes and save data.</li>

    <li><b>♿ Accessibility:</b> bigger text, high contrast and reduce motion. Also: 💡 tips, 🔊 sound and three 💾 save slots.</li>
    <li>On a computer, number keys press buttons, a tab’s first letter opens it, <b>Esc</b> closes a pop-up and <b>?</b> lists the shortcuts.</li></ul>`,'settings'],
  ['💡','Tips for a good career',`<p class="help-sum">A few habits that pay, season after season.</p><ul>
    <li>Read the 🐟 Fish tab or scout before you pick a spot.</li>
    <li>Fit the day to the party, and pack them a lunch.</li>
    <li>Rig tomorrow’s gear, log every trip and get to bed.</li>

  const rm=document.documentElement.classList.contains('rm')||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  try{el.scrollIntoView({block:'start',behavior:rm?'auto':'smooth'})}catch(e){el.scrollIntoView()}
  const h=el.matches('h3,nav')?el:el.querySelector('h3');if(h)try{h.focus({preventScroll:true})}catch(e){}
  return false;
};
function helpBody(){

// ============================================================
//  GUIDE MASTER: 💬 player feedback, emailed to the developer through Formspree.
//  The game POSTs JSON to the form endpoint; Formspree emails it with the subject below.
//  Only the form ID lives in this public code, never an email address.
//  Offline or unreachable → the message is queued in localStorage and sent when the game is online again.
// ============================================================
const FEEDBACK={
  formId:'mdeeqzbq',                            // Formspree form: https://formspree.io/f/mdeeqzbq
  subject:'Guide Master Feedback',
  maxLen:4000,
  qKey:()=>`${GAME.id}.feedbackQueue`,
};
const fbEndpoint=()=>FEEDBACK.formId?`https://formspree.io/f/${FEEDBACK.formId}`:'';
const FB_KINDS=['💡 Idea','🐞 Bug','📖 A rule or fact is wrong','👍 Love it','💬 Other'];
let FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};      // the open form's draft (inputs write here as you type)

function fbContext(){
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const c={version:APP_VERSION,app:standalone?'installed app':'browser',screen:`${screen.width}×${screen.height}`,device:navigator.userAgent.slice(0,160)};
  if(typeof S!=='undefined'&&S&&!S.over&&S.cur!=null){Object.assign(c,{career:`${S.years}-year, season ${seasonOf(S.cur)+1}`,day:`${dlongY(S.cur)} ${fmt(S.t)}`,difficulty:S.diff,location:(L[S.loc]||{}).name,cash:Math.round(S.money),rep:S.rep,trips:S.stats.trips})}
  return c;
}
function fbQueue(){try{return JSON.parse(localStorage.getItem(FEEDBACK.qKey())||'[]')}catch(e){return []}}
function fbSetQueue(q){try{localStorage.setItem(FEEDBACK.qKey(),JSON.stringify(q.slice(-10)))}catch(e){}}
// POST one message. Resolves 'sent' | 'queue' (network trouble: try later) | 'rejected' (Formspree said no).
async function fbPost(item){
  if(!fbEndpoint()) return 'queue';
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,timer=setTimeout(()=>ctl&&ctl.abort(),12000);
  try{
    const r=await fetch(fbEndpoint(),{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(item),signal:ctl&&ctl.signal});
    if(r.ok) return 'sent';
    return r.status===429||r.status>=500?'queue':'rejected';
  }catch(e){return 'queue'}finally{clearTimeout(timer)}
}
async function fbFlush(){
  const q=fbQueue();if(!q.length||!fbEndpoint()||(navigator.onLine===false))return;
  const left=[];for(const it of q){const r=await fbPost(it);if(r==='queue')left.push(it)}
  fbSetQueue(left);
  if(left.length<q.length&&typeof showTile==='function') showTile('💬','Feedback sent',`${q.length-left.length} saved message${q.length-left.length>1?'s':''} delivered`,'good');
}
window.addEventListener('online',()=>fbFlush());
setTimeout(()=>fbFlush(),4000);

function feedbackModal(back){
  const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const q=fbQueue().length;
  modal('💬 Send feedback',`<p style="font-size:14px">Tell the developer what you think: ideas, bugs, a rule we got wrong.</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">${FB_KINDS.map(k=>`<button style="cursor:pointer;border:1px solid ${k===FBD.kind?'var(--brand)':'var(--line)'};background:${k===FBD.kind?'var(--brand)':'transparent'};color:${k===FBD.kind?'#fff':'var(--ink)'}" onclick="FBD.kind=${esc(JSON.stringify(k))};document.querySelectorAll('.fbk').forEach(b=>{const on=b.dataset.k===FBD.kind;b.style.background=on?'var(--brand)':'transparent';b.style.color=on?'#fff':'var(--ink)';b.style.borderColor=on?'var(--brand)':'var(--line)'})" data-k="${esc(k)}" class="tag fbk">${k}</button>`).join('')}</div>
    <textarea id="fbmsg" maxlength="${FEEDBACK.maxLen}" rows="6" placeholder="Your feedback…" oninput="FBD.msg=this.value" style="width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)">${esc(FBD.msg)}</textarea>
    <input id="fbmail" type="email" placeholder="Your email (optional, for a reply)" value="${esc(FBD.email)}" oninput="FBD.email=this.value" autocomplete="email" style="width:100%;box-sizing:border-box;margin-top:8px;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)">
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" oninput="FBD.trap=this.value" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <p style="font-size:12px;color:var(--mute);margin-top:8px">Sent with the game version, your device type and where you are in the game, so problems can be tracked down. Nothing else.${q?` ${q} earlier message${q>1?'s are':' is'} waiting to send.`:''}</p>`,
    [{l:'📨 Send',s:'Emails your feedback to the developer.',fn:()=>fbSend(back)},
     {l:back?'Back':'Cancel',fn:()=>{if(back)back()}}]);
  setTimeout(()=>{const t=document.getElementById('fbmsg');if(t)t.focus()},250);
}
async function fbSend(back){
  const msg=FBD.msg.trim(),email=FBD.email.trim();
  if(msg.length<3){modal('💬 Send feedback','<p>Write a few words first.</p>',[{l:'Back to the form',fn:()=>feedbackModal(back)}]);return}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){modal('💬 Send feedback','<p>That email address doesn’t look right. Fix it, or leave it blank.</p>',[{l:'Back to the form',fn:()=>feedbackModal(back)}]);return}
  if(FBD.trap){FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};return}            // a bot filled the hidden field
  const item=Object.assign({_subject:FEEDBACK.subject,kind:FBD.kind,message:msg.slice(0,FEEDBACK.maxLen)},email?{email,_replyto:email}:{},fbContext(),{sentAt:new Date().toISOString()});
  showTile('📨','Sending…','Feedback','info');
  const r=navigator.onLine===false?'queue':await fbPost(item);
  if(r==='rejected'){modal('💬 Couldn’t send','<p>The feedback service turned the message down. Please try again later.</p>',[{l:'Back to the form',fn:()=>feedbackModal(back)},{l:'Close',fn:()=>{if(back)back()}}]);return}
  if(r==='queue') fbSetQueue(fbQueue().concat([item]));
  FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};
  sfx&&sfx('good');
  modal(r==='sent'?'🙏 Thanks!':'📥 Saved for later',r==='sent'?'<p>Your feedback is on its way. Thanks for helping make Guide Master better.</p>':'<p>No connection to the feedback service right now. Your message is saved on this device and will send automatically next time the game is online.</p>',
    [{l:'OK',fn:()=>{if(back)back()}}]);
}
window.feedbackModal=feedbackModal;
// ============================================================
//  GUIDE MASTER, part 9: winter camping (the adapter).
//  The camping game itself lives in src/camp/ (the KenaiCamp engine, which knows nothing about this game). This file is the
//  thin bridge: it builds the engine's trip ticket from the save (S), gives it a host adapter made of our own pop-ups, and
//  applies the trip report back to S. In the off-season ("S.winter" pending) the player has WINTER_DAYS free days to spend on
//  up to three camping trips and some winter work. Nothing here moves the game clock (S.t, S.cur).
//
//  Save state: S.camp = {v:2, s (winter these counters belong to), days, trips, gigs, gigsDone, gear (owned gear ids), lic (the
//  calendar year of the last fishing license), boost {s,q,book} (next season's bonus), hint, ach, noTrace, tot {…}}.
//  S.stats.campNights / encounters / seen keep counting as before (the end screen and the old achievements read them).
// ============================================================
const CAMP_MAX_TACKLE=12;
const CAMP_FISH_PER_RED=3;   // stocked trout and char are small: about three of them make the meals of one red salmon in the freezer
function campBase(){return {v:2,s:-1,days:0,trips:0,gigs:0,gigsDone:[],gear:[],lic:0,boost:{s:-1,q:0,book:0},hint:null,ach:[],noTrace:0,tot:{trips:0,nights:0,fish:0,tackle:0,gigs:0,spent:0,net:0}}}
const campGas=()=>Math.round(Math.max(4.5,((S.fuelBase&&S.fuelBase.kenai)||6.19)-.85)*100)/100;   // Peninsula pump gas ≈ marine dock price − the marine premium
// this winter's counters (they restart when a new off-season begins)
function campW(){
  const C=S.camp&&S.camp.v===2?S.camp:(S.camp=campBase());
  if(S.winter&&C.s!==S.winter.s){C.s=S.winter.s;C.days=0;C.trips=0;C.gigs=0;C.gigsDone=[]}
  return C;
}
const campDaysLeft=()=>S.winter?Math.max(0,KenaiCamp.data.WINTER_DAYS-campW().days):0;
const campTripsLeft=()=>S.winter?Math.max(0,KenaiCamp.data.MAX_TRIPS-campW().trips):0;
// is there anything left to do this winter? (the pop-up can still be opened to see the log or buy a shelter)
const campUsed=()=>!S.winter||campDaysLeft()<=0||(campTripsLeft()<=0&&campW().gigs>=KenaiCamp.data.MAX_GIGS);
// effects on next season's trips and bookings (used by 22-trips.js and genSeasonBookings in 24-career.js)
function campQ(){
  const C=S.camp;if(!C||!C.boost||C.boost.s<0||C.boost.s!==seasonOf(day())) return 0;
  return S.stats.trips-((S.st0&&S.st0.trips)||0)<3?C.boost.q*DF().craft:0;
}
const campBook=s=>{const C=S.camp;return C&&C.boost&&C.boost.s===s?C.boost.book*DF().craft:0};

function campTicket(){
  const C=campW(),A=S.arcs&&S.arcs.rival,W=S.winter;
  return {
    mode:'guide',year:2025+W.s,cash:Math.round(S.money),energy:S.energy,rep:S.rep,skill:S.skill,
    gas:campGas(),mpg:15,costMult:DF().cost,
    gear:C.gear.slice(),licYear:C.lic,food:{meals:foodMeals(),freezerRoom:Math.max(0,fishCap()-S.freezer)*CAMP_FISH_PER_RED},
    regulars:S.regs.map(g=>({id:g.who,name:'the '+g.who,mood:g.last?g.last.h:60})),
    rival:A&&A.st>=2?{id:'rival',name:'Dale Voss',mood:A.mood||0}:null,guideFriend:true,
    daysLeft:campDaysLeft(),tripsLeft:campTripsLeft(),gigsLeft:Math.max(0,KenaiCamp.data.MAX_GIGS-C.gigs),gigsDone:C.gigsDone.slice(),
    seen:Object.assign({},S.stats.seen),ach:C.ach.slice(),noTraceTrips:C.noTrace,
  };
}
// the trip report goes back into the save
function campApply(rep){
  const C=campW(),st=S.stats,W=S.winter;
  money(rep.cashDelta);st.spent+=rep.spent;
  S.energy=clamp(S.energy+rep.energyDelta,Math.min(S.energy,40),100);
  if(rep.repDelta)adj('rep',rep.repDelta);
  S.skill+=rep.skillDelta;S.wom=(S.wom||0)+rep.womDelta;
  // Stocked trout and char are eaten fresh over the winter; they do not keep. They only spare the pantry you already stocked (a
  // careful kitchen), so a guide who never buys food gets nothing for it. (Before 1.11.0 they went into the freezer as reds' worth of meals.)
  rep.pantrySaved=0;
  if(rep.foodFish&&S.food.pan>=MEALS){rep.pantrySaved=Math.min(Math.round(rep.foodFish/CAMP_FISH_PER_RED)*FISH_MEALS,PANTRY_CAP-S.food.pan);S.food.pan+=rep.pantrySaved}
  if(rep.tackleCredit)S.gear=Math.min(Math.max(S.gear,CAMP_MAX_TACKLE),S.gear+rep.tackleCredit);
  if(rep.firstTripBoost||rep.bookingBoost){
    const B=C.boost.s===W.s?C.boost:(C.boost={s:W.s,q:0,book:0});
    B.q=Math.round(Math.min(KenaiCamp.data.MAX_FIRST,B.q+rep.firstTripBoost)*1000)/1000;B.book=Math.round(Math.min(KenaiCamp.data.MAX_BOOK,B.book+rep.bookingBoost)*1000)/1000;
  }
  if(rep.scout){const sh=(S.reg&&S.reg.shift)||0;
    C.hint={s:W.s,txt:rep.scout.areas.includes('kasilof')&&!rep.scout.areas.includes('upper')?'Kasilof anglers':'upper-river guides',
      run:sh>=2?`the late run should come about ${sh} days later than usual`:sh<=-2?`the late run should come about ${-sh} days earlier than usual`:'the late run should arrive about when it normally does'}}
  rep.relations.forEach(x=>{
    if(x.kind==='regular'){const g=S.regs.find(y=>y.who===x.id);if(g&&g.last){g.last.h=clamp(g.last.h+x.delta*5,0,100);if(x.delta>=2)g.miss=0}}
    else if(x.kind==='rival'&&S.arcs&&S.arcs.rival){const A=S.arcs.rival;if(x.delta>=2)A.mood=1;else if(x.delta<=-2)A.mood=-1}
  });
  st.seen=st.seen||{};Object.keys(rep.speciesSeen).forEach(id=>{st.seen[id]=(st.seen[id]||0)+rep.speciesSeen[id]});
  st.encounters=(st.encounters||0)+rep.encounters;st.campNights=(st.campNights||0)+rep.nights;
  rep.gearBought.forEach(g=>{if(!C.gear.includes(g))C.gear.push(g)});if(rep.license)C.lic=Math.max(C.lic,rep.license.year);
  rep.achievements.forEach(a=>{if(!C.ach.includes(a))C.ach.push(a)});C.noTrace+=rep.noTraceTrips;
  if(rep.trips&&rep.trips.length){const L=rep.trips[rep.trips.length-1],mo=KenaiCamp.data.month(L.month);if(mo)C.lastMon={s:W.s,name:mo.n,year:KenaiCamp.data.calYear(mo,2025+W.s)}}
  C.days+=rep.daysUsed;C.trips+=rep.tripsTaken;C.gigs+=rep.gigs.length;C.gigsDone=C.gigsDone.concat(rep.gigs);
  const T=C.tot;T.trips+=rep.tripsTaken;T.nights+=rep.nights;T.fish+=rep.foodFish;T.tackle+=rep.tackleCredit;T.gigs+=rep.gigs.length;T.spent+=rep.spent;T.net+=rep.cashDelta;
  return rep;
}
// what the wrap-up says about next season
function campWrapHtml(rep){
  const f=n=>n>0?'+'+n:String(n),L=[];
  L.push(`${rep.tripsTaken} camping trip${rep.tripsTaken===1?'':'s'}, ${rep.nights} night${rep.nights===1?'':'s'}${rep.gigs.length?`, ${rep.gigs.length} winter job${rep.gigs.length===1?'':'s'}`:''}.`);
  L.push(`Cash ${rep.cashDelta<0?'−':'+'}${$(Math.abs(Math.round(rep.cashDelta)))} · Energy ${f(rep.energyDelta)} · Rep ${f(rep.repDelta)}${rep.skillDelta?` · Skill ${f(rep.skillDelta)}`:''}.`);
  if(rep.foodFish)L.push(`🐟 ${rep.foodFish} stocked fish, eaten fresh at the cabin and over the camp stove. ${rep.pantrySaved>0?`They spared ${rep.pantrySaved} meals in your pantry.`:'They don’t keep, and with no pantry stocked there is nothing to spare.'}`);
  if(rep.tackleCredit)L.push(`🪶 Tackle +${rep.tackleCredit}: that many trips’ worth of flies and leaders you won’t have to buy.`);
  if(rep.firstTripBoost)L.push(`🎯 Better first trips in July (about ${Math.round(rep.firstTripBoost*100)}% more catch on your first three trips).`);
  if(rep.bookingBoost)L.push(`📅 A few more bookings next season.`);
  if(rep.scout)L.push(`🔭 Talking with ${campW().hint.txt}, you hear that ${campW().hint.run}.`);
  rep.relations.forEach(x=>L.push(`🤝 ${x.name.charAt(0).toUpperCase()+x.name.slice(1)}: ${x.delta>=2?'a good trip together':x.delta<0?'a rough night together':'a quiet trip'}.`));
  if(rep.newSpecies.length)L.push(`📖 ${rep.newSpecies.length} new animal${rep.newSpecies.length>1?'s':''} in your camping log.`);
  rep.achievements.forEach(a=>{const x=KenaiCamp.data.ACH.find(y=>y.id===a);if(x)L.push(`${x.ic} <b>${x.n}</b>: ${x.d}`)});
  return L.map(x=>`<p>${x}</p>`).join('');
}
function campWrap(rep){
  if(!rep.tripsTaken&&!rep.gigs.length&&!rep.gearBought.length&&!rep.license) return setTimeout(winterModal,0);
  sfx(rep.encounters?'good':'click');
  modal('🏕️ What camping did',campWrapHtml(rep),[{l:'Back to the off-season',fn:()=>setTimeout(winterModal,0)}]);
}
// 40-art.js: an illustration on top of the hub and each day, evening and night of a trip (only when one is enabled).
// The engine never sees the game: the adapter keeps the session handle and reads its state; what the player picked last
// (an activity, an evening by the fire) is noted from the buttons, and tonight's encounter from the trip's event list.
const CAMP_ART_PHASES=['hub','day','evening','night','result','leave'];
let CAMP_ART=null;
function campArtShow(btns){
  const A=CAMP_ART,s=A&&A.h&&A.h.session;
  if(!s) return {art:artSlot('camp',()=>({time:'day',phase:'hub'})),btns};
  const v=s.view(),ph=v.meta.phase,T=s.state.trip;
  if(ph==='day'&&T&&T.slotsUsed===0&&!T.today.length){A.act=null;A.night=false}
  let ev=null;
  if(T&&ph==='night'&&T.events.length>A.ev) ev=T.events[T.events.length-1];
  A.ev=T?T.events.length:0;
  // tonight's encounter always shows; a camp scene shows once per camping trip (the screen it first fits), never on every screen
  let art=!CAMP_ART_PHASES.includes(ph)||(ph==='result'&&!T)?'':(ev&&artSlot('event',()=>Object.assign(artEventCtx(ev,'camp'),{time:'night'}),{deco:true,key:'camp'}))||'';
  if(!art&&CAMP_ART_PHASES.includes(ph)&&!(ph==='result'&&!T)){
    art=artSlot('camp',()=>artCampCtx(s,{activity:A.act,night:A.night}),{avoid:A.shown,key:'camp'});
    const e=art&&ART.get((art.match(/data-art="([^"]+)"/)||[])[1]);if(e)A.shown.add(artKey(e));
  }
  return {art,btns:btns.map((b,i)=>Object.assign({},b,{fn:()=>{const id=v.buttons[i]&&v.buttons[i].id;
    if((ph==='day'||ph==='evening')&&id&&id!=='evening'){A.act=id;A.night=ph==='evening'}if(b.fn)b.fn()}}))};
}

  '1.17.0':['🖼️ Pictures! Your cabin on the Home tab, the launch at dawn, the river, the dock, the morning report, the cabin’s storms and your camping trips now come with illustrations, more than fifty of them.','🐻 A bear on the gravel bar, a moose on the highway or a chimney fire gets its own picture, right above the choice. Everyday scenes take a few days off once you’ve seen them, so they stay special.','⚙️ Prefer the drawn scenes? Turn pictures off in Settings → Illustrations. They download as you meet them and stay for offline play. Your game in progress carries on.'],

const CHANGELOG_GENERIC='Fixes and small improvements throughout.';
const LASTVER_KEY=KEY('lastVersion');
function lastSeenVersion(){try{return localStorage.getItem(LASTVER_KEY)||''}catch(e){return ''}}
function rememberVersion(){try{localStorage.setItem(LASTVER_KEY,APP_VERSION)}catch(e){}}
// Run every slot's save through the engine's own migrate() and write it back stamped with this version
// (keeping its timestamp, so the current slot and "newest save" don't change). Returns {count, oldest app version}.
function upgradeAllSaves(){
  const ls=store(),out={count:0,oldest:''};if(!ls)return out;
  for(let n=1;n<=GAME.slots;n++){
    try{
      const r=rawSave(n);if(!r)continue;
      const raw=JSON.parse(r.v),d=migrate(raw);if(d.S.over)continue;
      out.count++;
      if(typeof raw.app==='string'&&raw.app&&(!out.oldest||verCmp(raw.app,out.oldest)<0))out.oldest=raw.app;
      if(d.newer)continue; // from a newer version: leave it exactly as it is
      ls.setItem(r.k,JSON.stringify({schema:d.schema,app:APP_VERSION,S:d.S,uiNarr:d.uiNarr,tab:d.tab,at:r.at||d.at}));
    }catch(e){}
  }
  return out;
}
function changelogLines(from){
  const vs=Object.keys(CHANGELOG).filter(v=>verCmp(v,APP_VERSION)<=0&&(!from||verCmp(v,from)>0)).sort((a,b)=>verCmp(b,a));
  const lines=[];
  if(!CHANGELOG[APP_VERSION])lines.push([APP_VERSION,CHANGELOG_GENERIC]);
  vs.forEach(v=>CHANGELOG[v].forEach(t=>lines.push([v,t])));
  return lines.slice(0,8);
}
function maybeUpdateNotice(){
  try{
    const seen=lastSeenVersion();
    if(seen===APP_VERSION)return;
    if(document.getElementById('mbg'))return; // something else is open; the next title screen will show it
    const saves=upgradeAllSaves(),from=seen||saves.oldest;
    if(!seen&&!saves.count){rememberVersion();return} // brand-new player
    const lines=changelogLines(from),multi=new Set(lines.map(l=>l[0])).size>1;
    const intro=from&&from!==APP_VERSION?`<p>${esc(GAME.title)} was updated from version ${esc(from)} to <b>${esc(APP_VERSION)}</b>.</p>`:`<p>${esc(GAME.title)} is now on version <b>${esc(APP_VERSION)}</b>.</p>`;
    const sv=saves.count?`<p>${saves.count>1?'Your saved games were':'Your saved game was'} updated to work with this version.</p>`:'';
    modal(`🆕 Updated to version ${esc(APP_VERSION)}`,`${intro}${sv}<p style="margin-bottom:2px"><b>What’s new</b></p><ul>${lines.map(l=>`<li>${multi?`<small>${esc(l[0])}</small> `:''}${l[1]}</li>`).join('')}</ul>`,
      [{l:'Got it',fn:rememberVersion}],true);
  }catch(e){}
}
// ============================================================
//  GUIDE MASTER, part 9: more to find on the river.
//  1. Returning parties: a party that has a great day may become a regular. It rebooks next season in proportion to how
//     the last trip went and remembers it when it comes back (S.regs).
//  2. Six more dilemmas from real Kenai guiding (life jackets for kids, whales off Homer, a capsized paddler, a client's own
//     treble hooks, posted private banks, seasick charter clients). Same rules as the others: the legal option costs something,
//     the rule-breaking one pays cash if nobody's watching.
//  3. Three story arcs that run across seasons (S.arcs): a rival guide, a returning family and a seat on the local fish and game
//     advisory committee.
//  Rules cited here are real: Alaska requires kids 12 and under to wear a life jacket on boats under 26 feet while underway;
//  vessels are to stay 100 yards from humpback whales in Alaska waters; riverbed below the ordinary high-water line is state land
//  while the uplands are often private; local advisory committees send proposals to the Alaska Board of Fisheries.
// ============================================================

// ---- returning parties ----
const ORD=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'];
const REG_MAX=10;
function addReg(b,h,s,arc){S.regs.push({who:b.who,from:b.from,res:!!b.res,type:b.type==='halibut'?'reds':b.type,n:Math.min(b.n,b.type==='trout'?3:b.type==='silver'?4:5),trips:1,last:{h,s},arc:arc?'garza':null,tr:(b.tr||[]).slice()});if(arc)S.arcs.garza.st=1}
// "Hand them your card" at the dock: a party that had a good day and didn't offer their number. Better days say yes more often.
function regCard(b){
  pass(10);const h=b.out?b.out.happy:75;b.card=false;
  if(S.regs.length>=REG_MAX||S.regs.some(x=>x.who===b.who)) return;
  if(Math.random()<(h>=88?.85:.6)){addReg(b,h,seasonOf(day()),false);say(`⭐ The ${b.who} tuck your card in a wallet: “We’ll call you for next season.” They’re a regular now.`)}
  else say(`🪪 The ${b.who} thank you for the card. “Maybe next year.”`)
}
function regAfterTrip(b,happy,notes){
  const h=Math.round(happy),s=seasonOf(day());let g=S.regs.find(x=>x.who===b.who);
  const arc=b.arc==='garza';
  if(g){
    g.last={h,s};g.trips=(g.trips||1)+1;
    if(h>=88) notes.push(`⭐ The ${b.who} are already talking about next season.`);
  }else{
    const join=arc?h>=60:(h>=75&&S.regs.length<REG_MAX&&Math.random()<.4);
    if(join){addReg(b,h,s,arc);
      notes.push(`⭐ The ${b.who} slip you a card with their number: “Same time next season?” If you treat them right, they will be back.`)}
    else if(arc)S.arcs.garza.st=-1;
    else if(h>=75&&S.regs.length<REG_MAX) b.card=true;                 // a happy party that didn't ask: you can hand them your card at the dock
  }
}
// next season's bookings from the regulars; returns report lines for the off-season
function regsRebook(base,r){
  const lines=[];
  S.regs.slice().forEach(g=>{
    const h=g.last?g.last.h:0,p=h>=88?.95:h>=75?.85:h>=60?.55:h>=45?.25:0,type=g.type;
    if(r()<p){
      for(let k=0;k<12;k++){
        const i=1+Math.floor(r()*13),w=i%7;
        if(w<1||w>5||(type==='silver'&&i<7)) continue;
        const d=base+i,tt=weekType(type,d);if(conflicts(d,tt)||illegalDay(tt,d)) continue;   // 34-summer.js: the week's trip (a sockeye regular fishes silvers in August)
        const n=Math.min(g.n+(h>=88&&g.n<(type==='trout'?3:type==='silver'?4:5)?1:0),type==='trout'?3:type==='silver'?4:5);
        addBooking({d,type,n,who:g.who,from:g.from,res:g.res,quirk:[],reg:true,arc:g.arc||undefined,tr:(g.tr||[]).slice()});g.miss=0;
        lines.push(`⭐ The ${g.who} (${g.from}) are back for their ${ORD[Math.min(10,(g.trips||1)+1)]} summer${h>=88?': last time was a five-star day':''}.`);break}
    }else{
      g.miss=(g.miss||0)+1;
      if(h<45||g.miss>=2){S.regs=S.regs.filter(x=>x!==g);if(g.arc==='garza')S.arcs.garza.st=-1;lines.push(`🪧 The ${g.who} didn’t rebook${h<45?': last year’s trip left a bad taste':''}.`)}
    }
  });
  return lines;
}
// at launch: they remember last time
function regTripStart(b,t){
  const g=b.reg&&S.regs.find(x=>x.who===b.who);if(!g||!g.last) return;
  const h=g.last.h,nth=ORD[Math.min(10,(g.trips||1)+1)];
  if(h>=88){t.happy+=5;t.notes.push(`⭐ The ${b.who} are back for their ${nth} summer. They’ve talked about last year’s day all winter and trust you with this one.`)}
  else if(h>=75){t.happy+=3;t.notes.push(`⭐ The ${b.who} are back for their ${nth} summer and glad to see you.`)}
  else if(h<62){t.happy-=4;t.notes.push(`😬 The ${b.who} came back, but they remember last year’s rough day. They’re watching.`)}
}
// after a trip: returning parties and arcs
function storyAfterTrip(b,happy,notes){
  regAfterTrip(b,happy,notes);
  if(b.arc==='garza'&&b.reg){const A=S.arcs.garza;if(A.st>=1&&A.st<=3){A.st++;if(A.st===4)say('👨‍👩‍👦 The Garzas’ fourth July. Some families become part of the river.')}}
}

// ---- six more dilemmas ----

// ============================================================
//  GUIDE MASTER, part 8: food, home fuel and backup power (added in 1.7.0).
//
//  Three small systems that share one idea: the cabin has stores, and the stores can run out.
//
//  FOOD (S.food, S.freezer)
//    Meals are the unit (3 a day). The pantry (dry goods, no spoilage), the fridge (fresh, goes off after 6 days) and the freezer
//    (your dipnet and solo-trip reds, one red is about 4 meals) feed you. Every night the game eats the day's meals for you,
//    fridge first, then pantry, then a thawed red; a meal you already ate in town or packed for a trip doesn't count twice.
//    A meal you can't eat costs energy. One tap at the Soldotna grocery store stocks about a week ("Stock up").
//    Groceries used to be part of the nightly overhead; that part now lives here (OVERHEAD went from $75 to $57), so nobody pays twice.
//  THE COOLER (STEP.pack)
//    Before each trip you pack your own lunch (energy) and decide what the clients get: nothing, snack bags, store lunch kits
//    or a shore lunch of freezer reds (happiness, so tips). On a long day (the trout float, halibut) hungry clients are unhappy.
//  HOME FUEL (S.home)
//    Fuel is still bought only at the Kenai Harbor dock; you can haul extra home into approved cans (and a 100-gallon transfer tank
//    you can buy) and fuel the sled from it at the shop. Untreated gas goes stale over a winter; stabilizer ($9 per 25 gal) carries
//    it through one. Stale gas takes up room until you dispose of it.
//  OUTAGES AND THE GENERATOR (S.home.gen, the power_out event, suppliesWinter)
//    Wind and trees knock out the Peninsula's power now and then, in July and in winter. A portable generator (outside, with an
//    inlet and interlock) burns home fuel to keep the freezer going; without one a long outage spoils fresh food and, past a day
//    or two, the freezer, and costs you sleep. A freezer holds about 24 hours half full and 48 hours full; the fridge only a few hours.
//
//  Off-season: pantry and freezer carry over, the fridge doesn't, untreated fuel goes stale, one winter outage may hit, and there is
//  no day-to-day food tracking (the winter living bill already covers eating).
//  Prices are 2026 estimates; README.md ("Food, home fuel and the generator") lists them and where they come from.
// ============================================================
const MEALS=3, FISH_MEALS=4, FRESH_DAYS=6;
const PANTRY_CAP=60, FRIDGE_CAP=15, KIT_CAP=18;                // meals; meals; client lunch kits
const MEAL_PRICE={fri:7,pan:5}, KIT_PRICE=12, GAS_STATION_LUNCH=12;   // dollars (×the difficulty's cost)
const CAN_GAL=5, CAN_PRICE=35, CANS_MAX=8, TANK_GAL=100, TANK_PRICE=768;
const STAB_PRICE=9, STAB_GAL=25, STALE_FEE=15;                 // stabilizer ($ per 25 gal), hazardous-waste drop-off
const FREEZER_BASE=30, FREEZER_BIG=70, FREEZER_PRICE=650;      // fish the freezer holds
const GENS=[null,
  {n:'7,500 W open-frame generator',short:'open-frame',cost:850,install:600,gph:.45},
  {n:'7,000 W inverter generator',short:'inverter',cost:4449,install:600,gph:.28}];
const mealPrice=k=>Math.round(MEAL_PRICE[k]*DF().cost*100)/100;
const kitPrice=()=>Math.round(KIT_PRICE*DF().cost);
const r1=x=>Math.round(x*10)/10;

// ---- what you have ----
const fuelCap=()=>S.home.cans*CAN_GAL+(S.home.tank?TANK_GAL:0);
const fuelFresh=()=>r1(S.home.gal+S.home.tgal);                 // usable gallons (untreated + stabilized)
const fuelAll=()=>r1(S.home.gal+S.home.tgal+S.home.stale);      // everything taking up room
const fuelRoom=()=>Math.max(0,r1(fuelCap()-fuelAll()));
const fishCap=()=>S.home.frz?FREEZER_BIG:FREEZER_BASE;
const groceryMeals=()=>S.food.fri+S.food.pan;
const foodMeals=()=>groceryMeals()+S.freezer*FISH_MEALS+S.food.fm;
const foodDays=()=>Math.floor(foodMeals()/MEALS*10)/10;
const dayWord=d=>d===1?'day':'days';
const daysTxt=d=>d>=10?String(Math.floor(d)):d.toFixed(1).replace(/\.0$/,'');
const genOf=()=>GENS[S.home.gen]||null;
// A hint for the fuel alerts: gas from your own cans is a way to fuel the sled without a trip to the harbor.
const homeFuelHint=()=>fuelFresh()>=3?` Or fuel the sled at the shop from your home cans (${fuelFresh()} gal).`:'';
const genHours=()=>genOf()?r1(fuelFresh()/genOf().gph):0;

// Put fish in the freezer (it holds fishCap()); the rest go to the neighbors. Returns how many were stored.
function addFish(n){
  const put=Math.max(0,Math.min(n,fishCap()-S.freezer));S.freezer+=put;
  if(put<n) say(`🧊 The freezer is full (${fishCap()}). ${n-put} fish go to the neighbors.`);
  return put;
}
// A meal eaten somewhere else today (the diner, fish and chips, a packed lunch) doesn't come out of the pantry tonight.
function ateAdd(k){const d=day();S.ate=(S.ate&&S.ate.d===d)?S.ate:{d,n:0};S.ate.n+=k}
const ateToday=()=>S.ate&&S.ate.d===day()?S.ate.n:0;
// Take meals from the stores: the fridge first (it spoils), then the pantry, then a thawed red. Returns {fri,pan,fish,miss}.
function takeMeals(k){
  const F=S.food,got={fri:0,pan:0,fish:0,miss:0};
  for(let i=0;i<k;i++){
    if(F.fri>0){F.fri--;got.fri++}
    else if(F.pan>0){F.pan--;got.pan++}
    else if(F.fm>0){F.fm--;got.fish++}
    else if(S.freezer>0){S.freezer--;F.fm=FISH_MEALS-1;got.fish++}
    else got.miss++;
  }
  return got;
}

// ---- the grocery store ----
// How many meals of fresh and pantry food a shop to `target` meals buys (the fridge holds 15, the pantry 60).
function groceryPlan(target){
  const F=S.food,need=Math.max(0,target-F.pan-F.fri);
  let fri=Math.min(Math.round(need*.4),FRIDGE_CAP-F.fri),pan=Math.min(need-fri,PANTRY_CAP-F.pan);
  fri=Math.min(need-pan,FRIDGE_CAP-F.fri);
  fri=Math.max(0,fri);pan=Math.max(0,pan);
  return {fri,pan,cost:Math.round((fri*mealPrice('fri')+pan*mealPrice('pan'))*100)/100};
}
// "Stock up": buy groceries to `days` days of pantry and fridge food. Returns the plan, or null if there's nothing to buy or no money.
function stockUp(days){
  const target=Math.min(PANTRY_CAP+FRIDGE_CAP,Math.round(days*MEALS)),p=groceryPlan(target);
  if(p.fri+p.pan<=0||S.money<p.cost) return null;
  spend(p.cost);S.food.fri+=p.fri;S.food.pan+=p.pan;if(p.fri>0)S.food.fd=day();
  S.stats.groceries=(S.stats.groceries||0)+p.cost;return p;
}
function buyKits(n){
  n=Math.min(n,KIT_CAP-S.food.kits);const c=n*kitPrice();
  if(n<=0||S.money<c) return 0;
  spend(c);S.food.kits+=n;S.stats.groceries=(S.stats.groceries||0)+c;return n;
}

// ---- home fuel ----
// Buy fuel at a dock and carry it home in cans. Fuel is sold only at the Kenai Harbor dock (or your own pump, with the riverfront lot).
function haulFuel(gal,where){
  const p=fuelPrice(where||'kenai'),room=fuelRoom();
  const g=Math.max(0,Math.min(gal==null?room:gal,room,Math.floor(S.money/p*10)/10)),cost=Math.round(g*p*100)/100;
  if(g<=0) return 0;
  S.home.gal=r1(S.home.gal+g);money(-cost);S.stats.spent+=cost;S.stats.fuelGal=(S.stats.fuelGal||0)+g;S.stats.fuelCost=(S.stats.fuelCost||0)+cost;
  return {gal:r1(g),cost,p};
}
function takeHomeFuel(g){                                       // untreated first, then stabilized
  const H=S.home;let left=g;
  const a=Math.min(H.gal,left);H.gal=r1(H.gal-a);left-=a;
  const b=Math.min(H.tgal,left);H.tgal=r1(H.tgal-b);left-=b;
  return r1(g-left);
}
function fuelSledFromHome(){
  const g=r1(Math.min(SLED_TANK()-S.fuel,fuelFresh()));
  if(g<=0) return 0;
  takeHomeFuel(g);S.fuel=r1(S.fuel+g);return g;
}
const stabCost=()=>Math.ceil(S.home.gal/STAB_GAL)*STAB_PRICE;
function stabilize(){
  const H=S.home,c=stabCost();
  if(H.gal<=0||S.money<c) return 0;
  spend(c);const g=H.gal;H.tgal=r1(H.tgal+g);H.gal=0;return g;
}

// ---- power outages ----
// An outage of h hours. A generator runs on home fuel for as long as the fuel lasts; the rest of the time the freezer and fridge warm up.
function outage(h,winter){
  let G=genOf(),fail=null;
  if(G){fail=homeGenCheck(winter);if(fail)G=null}        // 32-home.js: an unserviced generator may not start
  const out={h,run:0,burn:0,off:h,fish:0,fresh:0,energy:0,lines:[],genFail:!!fail};
  if(G){out.run=r1(Math.min(h,fuelFresh()/G.gph));out.burn=takeHomeFuel(r1(out.run*G.gph));out.off=r1(h-out.run)}
  const off=out.off,keep=S.freezer>=fishCap()/2?48:24;
  out.fish=Math.round(S.freezer*clamp((off-keep)/24,0,1));S.freezer-=out.fish;S.stats.spoiled=(S.stats.spoiled||0)+out.fish;
  out.fresh=Math.round(S.food.fri*clamp((off-8)/16,0,1));S.food.fri-=out.fresh;
  if(!winter&&off>=4){out.energy=Math.min(10,Math.round(2+off/3));adj('energy',-out.energy)}
  S.stats.outages=(S.stats.outages||0)+1;
  const hrs=out.h>=48?`${r1(out.h/24)} days`:`${Math.round(out.h)} hours`;
  if(fail) out.lines.push(`⚡ The power is out about ${hrs}. ${fail}`);
  else if(G&&out.off<=0) out.lines.push(`🔌 The power is out about ${hrs}. You roll out the ${G.short} generator, plug it into the inlet and run it outside, well away from the cabin (exhaust is carbon monoxide). ${out.burn} gallons of home gas later the freezer, fridge and lights never missed a beat.`);
  else if(G&&out.run>0) out.lines.push(`🔌 The power is out about ${hrs}. The ${G.short} generator keeps things going for ${Math.round(out.run)} hours, then the home gas runs out (${out.burn} gallons burned). The last ${Math.round(out.off)} hours are cold and dark.`);
  else if(G) out.lines.push(`🔌 The power is out about ${hrs}, and the ${G.short} generator has no gas to run on: your cans are empty.`);
  else out.lines.push(`⚡ The power is out about ${hrs}. Without a generator the freezer and fridge are on their own.`);
  if(out.fish||out.fresh) out.lines.push(`🧊 ${[out.fish?`${out.fish} red${out.fish>1?'s':''} thawed in the freezer and went in the dump`:'',out.fresh?`${out.fresh} meals of fresh food spoiled`:''].filter(Boolean).join(' and ')}.`);
  else if(out.off>0) out.lines.push(`🧊 The freezer held (${out.off<keep?'it was closed and stayed cold':'barely'}).`);
  if(out.energy) out.lines.push(`😮‍💨 No lights, no coffee maker, a dead phone and a warm cabin: you sleep badly. Energy −${out.energy}.`);
  if(!winter) homeArtNote([{id:G&&out.run>0?'outage_gen':'outage_dark',sev:0}]);   // 32-home.js: the morning report's picture (40-art.js)
  return out;
}
const outageHours=winter=>{const r=Math.random();
  if(winter) return r<.45?8+Math.floor(Math.random()*17):r<.85?24+Math.floor(Math.random()*37):60+Math.floor(Math.random()*51);
  return r<.55?2+Math.floor(Math.random()*6):r<.9?8+Math.floor(Math.random()*13):24+Math.floor(Math.random()*17)};
// July: a windy morning is the likeliest time for a tree on the line.
defEvent({id:'power_out',hook:'wake',tile:['⚡','Power outage','bad'],bad:true,cooldown:3,chance:()=>S.wx[day()]==='wind'?.1:.025,cond:()=>!S.winter&&day()>0,
  run:()=>{const o=outage(outageHours(false));S.power={d:day(),h:o.h,gen:!!genOf()&&o.run>0,burn:o.burn,fish:o.fish,fresh:o.fresh};say(o.lines.join(' '))}});

// ---- the off-season ----
// Runs once as a season rolls over (24-career.js, startSeason). Returns lines for the winter summary.
function suppliesWinter(){
  const H=S.home,F=S.food,bits=[];S.winOut=null;
  if(H.gal>0){H.stale=r1(H.stale+H.gal);bits.push(`⛽ ${r1(H.gal)} gal of untreated gas went stale (dispose of it at the shop)`);H.gal=0}
  if(H.tgal>0){H.gal=H.tgal;H.tgal=0}                       // stabilized gas made it through; it is a year old now and needs treating again
  if(F.fri>0){bits.push(`🥬 ${F.fri} meals of fresh food spoiled`);F.fri=0}
  const lines=bits.length?[bits.join(' · ')+'.']:[];
  if(Math.random()<.55*DF().bad){const o=outage(outageHours(true),true);
    S.winOut={h:o.h,gen:!!genOf()&&!o.genFail&&o.off<=0};
    lines.push(`🌨️ <b>A winter storm cut the power for ${o.h>=48?`${r1(o.h/24)} days`:`${Math.round(o.h)} hours`}.</b> ${genOf()?(o.off<=0?`The generator burned ${o.burn} gal and the freezer held.`:o.run<=0?'The generator had no gas to run on.':`The generator ran ${Math.round(o.run)} hours on ${o.burn} gal of home gas, then it was cold and dark.`):'No generator.'}${o.fish?` ${o.fish} freezer reds spoiled.`:S.freezer&&o.off>0?' The freezer held.':''}`)}
  return lines;
}

// ---- nightly meals (called from onNight) ----
function suppliesNight(notes,d){
  const F=S.food;
  if(F.fri>0&&d-F.fd>=FRESH_DAYS){notes.push(`🥬 ${F.fri} meals of fresh food went off in the fridge.`);F.fri=0}
  const need=Math.max(0,MEALS-(S.ate&&S.ate.d===d?S.ate.n:0)),got=takeMeals(need);
  const eaten=got.fri+got.pan+got.fish,out=MEALS-need;
  if(eaten) notes.push(`🍽️ ${eaten} meal${eaten>1?'s':''} at home${got.fish?' (red salmon from the freezer)':''}${out?`, ${out} on the road`:''}. About ${daysTxt(foodDays())} days of food left.`);
  S.hungry=got.miss>0?Math.min(3,(S.hungry||0)+1):0;             // nights in a row you went without
  if(got.miss){S.stats.missed=(S.stats.missed||0)+got.miss;const e=7*got.miss;adj('energy',-e);notes.push(`🍽️ The cupboards are bare: you went without ${got.miss} meal${got.miss>1?'s':''}. Energy −${e}. Stock up at the grocery store in Soldotna.`)}
  else if(foodDays()<2) notes.push('🛒 Food is running low. Stock up at the grocery store in Soldotna.');
  if(S.power&&S.power.d===d) S.power=null;
  if(S.hungry>=2&&foodMeals()<MEALS&&!(S.ev.last.hungry_morning!=null&&d+1-S.ev.last.hungry_morning<HUNGER_WARN_GAP)) chain('hungry_morning');      // (1.8.1) a second night without: a warning, with a quick fix, first thing tomorrow
}

// (1.8.1) Running on empty: after a second night in a row without enough to eat, the morning opens with a warning and a quick, pricier fix
// (the 24-hour gas station on the Sterling Highway: breakfast now and a day of food for the cupboard). Groceries are still the cheap way.
const EMERGENCY_FOOD=38, EMERGENCY_MEALS=3, HUNGER_WARN_GAP=7;   // dollars (×the difficulty's cost); pantry meals; days between warnings
const emergencyPrice=()=>rp(EMERGENCY_FOOD);
function hungerModal(){
  const h=S.hungry||0,c=emergencyPrice();
  modal('🍽️ Running on empty',`<p>${h>=3?'Three':'Two'} nights in a row without a proper dinner. You’re slow, short with the clients and running on coffee.</p><p class="small-note hunger-note">Hungry guides lose energy every night and their clients notice (−${HUNGER_HAPPY[Math.min(3,h)]} happiness on every trip). A week of groceries in Soldotna costs about ${$(Math.round(MEALS*7*mealPrice('pan')))}.</p>`,[
    {l:`Gas station on the way: breakfast and a day of food — ${$(c)}`,s:`15 min. About twice grocery prices. Not hungry today, energy +6, and ${EMERGENCY_MEALS} meals in the cupboard.`,dis:!canAfford(c),fn:()=>{
      spend(c);S.stats.emergencyFood=(S.stats.emergencyFood||0)+1;pass(15);ateAdd(1);adj('energy',6);S.food.pan=Math.min(PANTRY_CAP,S.food.pan+EMERGENCY_MEALS);S.hungry=0;
      say(`⛽ Breakfast burritos, coffee and a bag of canned chili, bread and peanut butter from the 24-hour gas station: ${$(c)}. Not cheap, but you’re fed. Stock up at the grocery store when you can.`)}},
    {l:'Not now: push through',s:`Clients −${HUNGER_HAPPY[Math.min(3,h)]} happiness today, and another night without dinner costs energy.`,fn:()=>say('🥱 You push through on coffee. The grocery store in Soldotna is open 5 AM to 10 PM.')}]);
}
defEvent({id:'hungry_morning',hook:'wake',tile:['🍽️','Running on empty','bad'],chance:0,max:1e6,priority:5,cooldown:HUNGER_WARN_GAP,cond:()=>!S.winter&&(S.hungry||0)>=2&&foodMeals()<MEALS,run:()=>hungerModal()});

// A guide who has been going without is short with the clients (called from tripStart): −5 / −9 / −13 happiness after 1 / 2 / 3 nights in a row, and a worse catch.
// (1.8.1: was −5 a night, up to −15; the curve is softer so going hungry hurts without ending a career on its own.)
const HUNGER_HAPPY=[0,5,9,13];
function hungerTrip(t){
  const h=S.hungry||0;if(h<=0) return;
  t.happy-=HUNGER_HAPPY[Math.min(3,h)];t.q-=.015*h;t.notes.push(`🍽️ ${h>1?'Days':'A day'} of going without food: you’re short-tempered and slow, and the clients notice.`);
}

// ---- the cooler: before each trip ----
const LUNCH_EFFECT={none:[0,-6],snack:[2,4],kit:[4,7],fish:[6,9]};   // client happiness on a short / long trip
STEP.pack=(b,t)=>{
  const T=TRIPS[b.type],long=T.len>=480,n=b.n,F=S.food,L_=long?1:0;
  const skips=long?10:6,kitN=n,fishN=Math.ceil(n/4),snackN=Math.ceil(n/3);
  const ownNote=foodMeals()>0?`1 meal from home (${daysTxt(foodDays())} days of food left).`:`The cupboards are bare: a ${$(rp(GAS_STATION_LUNCH))} gas-station sandwich on the way.`;
  const lunch=(kind,txt)=>{const [s,l]=LUNCH_EFFECT[kind],h=L_?l:s;t.happy+=h;t.notes.push(txt)};
  const eatOwn=()=>{
    if(foodMeals()>0){takeMeals(1);t.notes.push('🥪 You pack your own lunch from home. A real lunch keeps you going.')}
    else{fx(t,-rp(GAS_STATION_LUNCH),'Gas-station sandwich');t.notes.push('🥪 Nothing at home to pack, so you grab a gas-station sandwich on the way.')}
    ateAdd(1);adj('energy',3);
  };
  const o=[O('Pack your own lunch',`${ownNote} ${long?'The clients get nothing, and on a long day they notice (−6 happiness).':'The clients bring their own.'}`,(b,t)=>{eatOwn();if(long)lunch('none','😒 No lunch for the clients on an all-day trip. Stomachs growl by noon.')})];
  if(F.pan>=snackN) o.push(O('…and snack bags for the clients',`Pantry granola bars, jerky and drinks (${snackN} pantry meals). Clients ${long?'+4':'+2'} happiness.`,(b,t)=>{eatOwn();F.pan-=snackN;lunch('snack','🍫 Snack bags and hot drinks for the clients.')}));
  if(F.kits>=kitN) o.push(O('…and a lunch kit for each client',`Sandwich, chips, fruit and a drink (${kitN} of your ${F.kits} kits). Clients ${long?'+7':'+4'} happiness.`,(b,t)=>{eatOwn();F.kits-=kitN;lunch('kit','🥪 Lunch kits at the first gravel bar: the clients are delighted.')}));
  if(S.freezer>=fishN) o.push(O('…and a shore lunch of grilled red salmon',`Thaw ${fishN} freezer red${fishN>1?'s':''} (${S.freezer} on hand). A Kenai tradition. Clients ${long?'+9':'+6'} happiness.`,(b,t)=>{eatOwn();S.freezer-=fishN;lunch('fish','🔥 Grilled red salmon with lemon and pepper on a gravel bar: the clients will remember it.')}));
  o.push(O('Skip food and just go',`Saves the food. You'll drag all day: energy −${skips}.${long?' The clients go hungry too (−6 happiness).':''}`,(b,t)=>{adj('energy',-skips);t.notes.push('🥱 No lunch for anyone. By two o’clock you are running on coffee.');if(long)lunch('none','😒 No lunch for the clients on an all-day trip. Stomachs growl by noon.')}));
  return {t:'🧺 Pack the cooler',b:`<p>${hrsTxt(T.len)} on the water with the ${b.who}. Pack your own lunch and decide what the ${n} clients get. You have <b>${daysTxt(foodDays())} ${dayWord(foodDays())}</b> of food at home${F.kits?`, ${F.kits} lunch kit${F.kits>1?'s':''}`:''}${S.freezer?` and ${S.freezer} red${S.freezer>1?'s':''} in the freezer`:''}.</p>`,o,fixed:true};
};
const hrsTxt=m=>`${Math.round(m/60)} hours`;

// ---- shopping for the house ----
function buyHome(id){
  const H=S.home;let c=0,msg='';
  if(id==='cans'){c=2*CAN_PRICE;H.cans=Math.min(CANS_MAX,H.cans+2);msg=`🛢️ Two more approved 5-gallon fuel cans: ${$(c)}. They stand outside on a pad, away from the cabin and from anything that could light them. Storage ${fuelCap()} gal.`}
  if(id==='tank'){c=TANK_PRICE;H.tank=1;msg=`🛢️ A ${TANK_GAL}-gallon steel transfer tank with a hand pump: ${$(c)}. It sits outside on a level pad, away from the cabin. Storage ${fuelCap()} gal.`}
  if(id==='gen1'||id==='gen2'){const k=id==='gen1'?1:2,G=GENS[k],swap=H.gen>0;c=G.cost+(swap?0:G.install);H.gen=k;msg=`🔌 ${G.n}${swap?' swapped in for the old one':' and an electrician’s inlet and interlock'}: ${$(c)}. It runs outside on home gas, about ${G.gph} gallons an hour, and keeps the freezer going through an outage.`}
  if(id==='frz'){c=FREEZER_PRICE;H.frz=1;msg=`🧊 A big chest freezer: ${$(c)}. It holds ${FREEZER_BIG} fish instead of ${FREEZER_BASE}.`}
  spend(c);sfx('good');say(msg);
  if(id==='gen1'||id==='gen2') homeNewGen();            // 32-home.js: a new generator is in shape
}
function homeItems(){
  const H=S.home,items=[];
  const add=(id,ic,n,c,d,why)=>items.push({id,l:`${ic} ${n} — ${$(c)}`,s:why?`${why}. ${d}`:d,dis:!!why||S.money<c,c});
  add('cans','🛢️','Two more fuel cans (+10 gal)',2*CAN_PRICE,'Approved 5-gallon cans, stored outside.',H.cans>=CANS_MAX?'You have the most the shed holds':'');
  add('tank','🛢️',`${TANK_GAL}-gallon transfer tank with pump`,TANK_PRICE,`Haul a month of fuel home from the harbor. Stale gas still goes bad over a winter unless you stabilize it.`,H.tank?'Done':'');
  if(H.gen<1) add('gen1','🔌',`${GENS[1].n} + install`,GENS[1].cost+GENS[1].install,`About ${GENS[1].gph} gal/hr. Louder, thirstier, cheap. Keeps the freezer on in an outage.`,'');
  if(H.gen<2) add('gen2','🔌',H.gen?`Swap in the ${GENS[2].n}`:`${GENS[2].n} + install`,GENS[2].cost+(H.gen?0:GENS[2].install),`About ${GENS[2].gph} gal/hr (Honda EU7000iS class). Quiet and frugal.`,'');
  add('frz','🧊','Chest freezer (holds 70 fish)',FREEZER_PRICE,`Room for a full dipnet and more (now ${FREEZER_BASE}).`,H.frz?'Done':'');

}

// ---- actions on the Here tab (called from actionsHere in 20-world.js) ----
function suppliesActions(a){
  const H=S.home,F=S.food,open=isOpen('town');
  if(S.loc==='shop'){
    a.push({ic:'📦',l:'Check the pantry, freezer and fuel cans',s:`${daysTxt(foodDays())} days of food · ${fuelFresh()} gal home fuel${genOf()?` · ${genOf().short} generator`:''}.`,cat:'work',fn:()=>homeModal()});
    const g=r1(Math.min(SLED_TANK()-S.fuel,fuelFresh()));
    if(fuelFresh()>0&&g>=1) a.push({ic:'🛢️',l:`Fuel the sled from your home cans — ${g.toFixed(1)} gal`,s:`Free, 10 min. Sled ${Math.round(S.fuel)}/${SLED_TANK()} gal; ${fuelFresh()} gal in storage.`,cat:'work',cls:S.fuel<bn('reds')+2?'primary':'',fn:()=>{const x=fuelSledFromHome();pass(10);say(`🛢️ You pour ${x.toFixed(1)} gallons from the cans into the sled. Tank ${Math.round(S.fuel)} gal; ${fuelFresh()} gal left at home.`)}});
    if(H.gal>0) a.push({ic:'🧴',l:`Add stabilizer to your stored fuel — ${$(stabCost())}`,s:`${H.gal} gal of untreated gas. Stabilized gas keeps through a winter; untreated goes stale.`,cat:'work',cls:sday(day())>=SEASON-3&&!isLastSeason()?'primary':'',dis:S.money<stabCost(),fn:()=>{const c=stabCost(),x=stabilize();pass(10);say(`🧴 Stabilizer in ${r1(x)} gallons of stored gas: ${$(c)}. It will keep through the winter.`)}});
    if(H.stale>0) a.push({ic:'🗑️',l:`Dispose of stale gas — ${$(STALE_FEE)}`,s:`${H.stale} gal. Take it to the hazardous-waste drop-off; don’t burn it in the sled. 45 min.`,cat:'work',dis:S.money<STALE_FEE,fn:()=>{spend(STALE_FEE);pass(45);say(`🗑️ ${H.stale} gallons of stale gas to the hazardous-waste drop-off: ${$(STALE_FEE)}. The cans are free again.`);H.stale=0}});
    if(S.up&&S.up.dock&&fuelRoom()>=1) a.push({ic:'🛢️',l:`Fill your home cans at your own pump — ${fuelRoom().toFixed(1)} gal`,s:`${$(fuelPrice('dock'))}/gal. ${fuelAll()}/${fuelCap()} gal stored.`,cat:'work',dis:S.money<fuelPrice('dock'),fn:()=>{const r=haulFuel(null,'dock');pass(10);if(r)say(`🛢️ ${r.gal} gallons from your own pump into the cans: ${$(Math.round(r.cost))}.`)}});
  }
  if(S.loc==='town'){
    const week=groceryPlan(7*MEALS),days=Math.max(0,Math.min(7,7-(groceryMeals())/MEALS));
    a.push({ic:'🛒',l:week.fri+week.pan>0?`Stock up: groceries for a week — ${$(Math.round(week.cost))}`:'Stock up: the kitchen is already full for a week',s:week.fri+week.pan>0?`${week.fri+week.pan} meals, 45 min. You have ${daysTxt(foodDays())} ${dayWord(foodDays())} of food. Soldotna groceries run about 23% over the national average.`:`${daysTxt(foodDays())} days of food at home (the pantry and fridge hold a week or more).`,cat:'town',cls:foodDays()<2?'primary':'',dis:!open||week.fri+week.pan<=0||S.money<week.cost,fn:()=>{const p=stockUp(7);pass(45);if(p)say(`🛒 Groceries for the week: ${p.fri+p.pan} meals (${p.fri} fresh, ${p.pan} for the pantry), ${$(Math.round(p.cost))}. About ${daysTxt(foodDays())} days of food at home.`)}});
    a.push({ic:'🥪',l:`Lunch kits for clients — 6 for ${$(6*kitPrice())}`,s:`Sandwich, chips, fruit, drink. ${F.kits}/${KIT_CAP} on hand. Pack them before a trip: happier clients, bigger tips.`,cat:'town',dis:!open||F.kits>KIT_CAP-6||S.money<6*kitPrice(),fn:()=>{const n=buyKits(6);pass(20);if(n)say(`🥪 ${n} client lunch kits: ${$(n*kitPrice())}. ${F.kits} in the cooler.`)}});
    const big=groceryPlan(PANTRY_CAP+FRIDGE_CAP);
    a.push({ic:'🏪',l:'Home supplies: generator, fuel cans, freezer',s:`${genOf()?`${genOf().short} generator · `:'No generator · '}${fuelCap()} gal of fuel storage · freezer ${fishCap()} fish.`,cat:'town',fn:()=>homeShopModal()});
    if(big.fri+big.pan>=20) a.push({ic:'🧺',l:`Big shop: fill the pantry and fridge — ${$(Math.round(big.cost))}`,s:`${big.fri+big.pan} meals (${Math.round((big.fri+big.pan)/MEALS)} days) for the winter or a long stretch. 60 min.`,cat:'town',dis:!open||S.money<big.cost,fn:()=>{const p=stockUp((PANTRY_CAP+FRIDGE_CAP)/MEALS);pass(60);if(p)say(`🧺 A big shop: ${p.fri+p.pan} meals, ${$(Math.round(p.cost))}. About ${daysTxt(foodDays())} days of food.`)}});
  }
  if(S.loc==='harbor'){
    const open2=isOpen('harbor'),room=fuelRoom(),p=fuelPrice('kenai');

      if(room>10) a.push({ic:'🛢️',l:`Haul 10 gallons home — ${$(Math.round(10*p))}`,s:'A smaller load for the truck bed.',cat:'work',dis:!open2||S.money<p*10,fn:()=>{const r=haulFuel(10,'kenai');pass(10);if(r)say(`🛢️ ${r.gal} gallons into the cans for home: ${$(Math.round(r.cost))}. ${fuelFresh()} gal in storage.`)}});
    }
  }
}
