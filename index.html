// ============================================================
//  GUIDE MASTER, part 10: the cabin (the adapter).
//  Keeping up the cabin lives in src/home/ (the CabinUpkeep module, which knows nothing about this game). This file is the thin
//  bridge: it builds the module's ticket from the save (S), gives it a host made of our own pop-ups, and applies each report back
//  to S: cash, energy, rep, minutes in July, free days in the off-season (shared with winter camping), food and fuel.
//
//  Save state: S.cabin is the module's own state (it is opaque here); S.homeAsk is the last winter the player was reminded about
//  spring jobs; S.winOut is this winter's power outage (31-supplies.js), which the module reads.
//  The year of the cabin: the July of season s, and the winter before it, are one cycle s. Fall jobs come before the winter's storms
//  roll (they open the winter report, or the moment you leave for camping), spring jobs after, and spring happens as the bookings open.
// ============================================================
const HOME_DAY_VALUE=90;   // dollars a lost free winter day costs when none are left: the winter job that slipped
const cabin=()=>S.cabin=CabinUpkeep.normState(S.cabin);
const homeSeason=()=>S.winter?S.winter.s:seasonOf(day());
const homePhase=()=>S.winter?(cabin().rolled===S.winter.s?'spring':'fall'):'summer';
function homeRecentFish(){const d=day();return S.book.filter(b=>b.status==='done'&&b.d>d-4&&b.d<=d&&b.type!=='trout'&&b.out&&b.out.fish>0).length}
function homeTicket(o){
  const w=!!S.winter;
  return Object.assign({
    state:cabin(),phase:homePhase(),season:homeSeason(),sday:w?0:sday(day()),abs:day(),
    cash:Math.round(S.money),energy:S.energy,rep:S.rep,daysLeft:w?campDaysLeft():0,atHome:S.loc==='shop'&&!S.trip,
    costMult:DF().cost,bad:DF().bad,
    gen:{owned:!!genOf(),gas:S.home.stale>0?'stale':'ok'},homeFuel:fuelFresh(),outage:w?(S.winOut||null):null,recentFish:homeRecentFish(),
  },o||{});
}
// lost free days come out of the winter budget; with none left, the winter work that slipped costs money
function homeDays(used,lost){
  if(!S.winter||(used<=0&&lost<=0)) return;
  campW();const left=campDaysLeft(),want=used+lost,take=Math.min(left,want);
  S.camp.days+=take;
  const unmet=want-take;
  if(unmet>0){const c=-homeCharge(-Math.round(HOME_DAY_VALUE*unmet*DF().cost));money(-c);S.stats.spent+=c;say(`💸 No free days are left this winter, so ${unmet} day${unmet>1?'s':''} of lost winter work comes out of your pocket: ${$(c)}.`)}
}
// Home trouble never takes cash below this: the plumber and the neighbors let you carry the rest, so it can't end a career
const HOME_FLOOR=-1200;
function homeCharge(delta){
  if(delta>=0) return delta;
  const ok=Math.max(0,S.money-HOME_FLOOR),pay=Math.min(-delta,ok);
  return -pay;
}
// a party that cannot reach or stay at the cabin cancels: the soonest booked trips from d0 to d1, and the deposit goes back
function homeCancel(n,d0,d1){
  if(!(n>0)||!S.book) return;
  const bs=S.book.filter(b=>b.status==='booked'&&b.d>=d0&&b.d<=d1);
  for(let i=0;i<n&&i<bs.length;i++){
    const b=bs[i];b.status='cancelled';S.stats.cancelled++;
    say(`📵 The ${b.who} cancel their ${dlabel(b.d)} ${TRIPS[b.type].n}: they heard about the trouble at your place. You refund the deposit.`);
  }
}
// spring trouble waits for the bookings: when the season opens, the first days' parties cancel
function homeSeasonOpens(s){const n=S.homeCancel||0;S.homeCancel=0;homeCancel(n,seasonFirst(s),seasonFirst(s)+3)}
function homeApply(rep,quiet){
  if(!rep) return rep;
  S.cabin=rep.state;
  const c=homeCharge(rep.cashDelta||0),waived=c-(rep.cashDelta||0);
  if(c) money(c);
  S.stats.spent+=Math.max(0,(rep.spent||0)-waived);
  if(waived>0) say('🤝 You can’t cover all of it, so the plumber and the neighbors let you carry the rest. Nobody repossesses a cabin over it.');
  if(rep.energyDelta) adj('energy',rep.energyDelta);
  if(rep.repDelta) adj('rep',rep.repDelta);
  if(rep.womDelta) S.wom=(S.wom||0)+rep.womDelta;
  if(rep.homeFuel) takeHomeFuel(rep.homeFuel);
  if(rep.freshLost&&S.food.fri>0){S.food.fri=0}
  if(rep.foodMeals>0){if(S.food.fri<=0)S.food.fd=day();S.food.fri=Math.min(FRIDGE_CAP,S.food.fri+rep.foodMeals)}
  homeDays(rep.daysUsed,rep.daysLost);
  if(rep.cancels>0){if(S.winter)S.homeCancel=(S.homeCancel||0)+rep.cancels;else homeCancel(rep.cancels,day(),day()+2)}
  if(rep.minutes>0&&!S.winter) pass(rep.minutes);
  if(!quiet) rep.lines.forEach(l=>say(l));
  return rep;
}
// ---- illustrations (40-art.js): the module reports what happened as events [{id, sev}] (CabinUpkeep.EVENTS); the worst one with a picture wins ----
const homeEvSort=evs=>(evs||[]).map((e,i)=>({e,i})).sort((a,b)=>(b.e.sev||0)-(a.e.sev||0)||a.i-b.i).map(x=>x.e);
function homeArt(evs){if(!artOn()||!evs||!evs.length)return '';return artFirst(homeEvSort(evs).map(e=>()=>artSlot('event',()=>artEventCtx(e.id,'home'),{deco:true})))}
// the morning report collects the cabin's events of the night and the morning (homeMorning, a summer outage) for its picture
function homeArtNote(evs){if(DIGEST&&evs&&evs.length)(DIGEST.home=DIGEST.home||[]).push(...evs)}
const homeHost=()=>({show:(t,h,b,lock,meta)=>modalSwap(t,homeArt(meta&&meta.events)+h,b,lock),   // meta.events: a storm prompt's own id, then its outcome

  ticket:()=>homeTicket(),apply:r=>homeApply(r),rand:()=>Math.random()});
const homeBotHost=()=>({ticket:()=>homeTicket(),apply:r=>homeApply(r,true)});

// ---- generator: will it start in an outage? (called from outage() in 31-supplies.js) ----
function homeGenCheck(winter){
  const t=homeTicket({season:seasonOf(day())-(winter?1:0)}),o=CabinUpkeep.genOdds(t);
  if(!(o.p>0)||Math.random()>=o.p) return null;
  const rep=homeApply(CabinUpkeep.genFailed(t),true);
  if(!winter) homeArtNote(rep.events);
  return rep.lines[0];
}
// a generator you just bought is in shape
function homeNewGen(){homeApply(CabinUpkeep.noteGen(homeTicket()),true)}

// ---- July: a morning, the fish station ----
function homeMorning(){
  if(S.winter||S.over) return;
  const rep=CabinUpkeep.daily(homeTicket());
  homeApply(rep);homeArtNote(rep.events);
  if(rep.severity>0) showTile('🏠','Trouble at the cabin',rep.lines[0].replace(/<[^>]+>/g,'').slice(0,80),'bad');
  else if(rep.remind) showTile('🏠','Cabin job',rep.remind,'info');
}
// after a trip: the clients' fish (22-trips.js tripEnd): a fee, or a spoiled batch
function homeProcessing(b,fish,t){
  if(!cabin().proc||b.type==='trout'||fish<=0) return;
  const rep=CabinUpkeep.processing(homeTicket({fish,clients:b.n}));
  S.cabin=rep.state;
  if(rep.earned>0)(t.x=t.x||[]).push(['Fish processing fees',rep.earned]);
  if(rep.energyDelta) adj('energy',rep.energyDelta);
  if(rep.womDelta) S.wom=(S.wom||0)+rep.womDelta;
  if(rep.repDelta) adj('rep',rep.repDelta);
  rep.lines.forEach(l=>t.notes.push(l));
  if(rep.events&&rep.events.length) t.homeEv=rep.events;   // "Back at the dock" can show a spoiled batch (40-art.js)
}

// ---- the off-season ----
// Fall jobs, then the winter's storms roll (once), then spring jobs; spring itself happens as bookings open.
function homeRollWinterSync(){
  if(!S.winter||cabin().rolled===S.winter.s) return null;
  return homeApply(CabinUpkeep.rollWinter(homeTicket()),true);
}
function homeRollWinter(then){
  const w=S.winter;if(!w||cabin().rolled===w.s){if(then)then();return}
  const rep=homeApply(CabinUpkeep.rollWinter(homeTicket()),true);
  rep.lines.forEach(l=>say(l));
  CabinUpkeep.ui.scenes(homeHost(),rep,()=>{render();if(then)then()});
}
// answer whatever storm prompts are left with the top button (a bot, or a game left mid-prompt)
function homeAnswerStorms(){CabinUpkeep.autoplay(homeBotHost(),{policy:(j)=>j.kind==='event'?CabinUpkeep.policies.first(j):null})}
// leaving the off-season (finishWinter in 24-career.js): spring happens
function homeFinishWinter(){
  if(!S.winter) return;
  homeRollWinterSync();homeAnswerStorms();
  const rep=homeApply(CabinUpkeep.rollSpring(homeTicket()),true);
  if(rep.lines.length){rep.lines.forEach(l=>say(l));CabinUpkeep.ui.report(homeHost(),'🏠 Spring at the cabin',rep)}
}
// the winter pop-up's own buttons
function homeWinterModal(){
  const t=homeTicket(),jobs=CabinUpkeep.jobs(t),more=CabinUpkeep.dueCount(t)-jobs.length,ph=t.phase;
  if(ph==='spring'){
    CabinUpkeep.ui.batch(homeHost(),{title:'🏠 Spring breakup at the cabin',intro:`Condition ${Math.round(cabin().cond)}/100. Cash ${$(t.cash)}. ${t.daysLeft} free day${t.daysLeft===1?'':'s'} left, shared with camping and winter work.`,
      extra:[{l:'🏪 Home upgrades',s:'A wood stove, a fish processing station, a bear-resistant bin.',fn:()=>setTimeout(()=>CabinUpkeep.ui.shop(homeHost(),homeWinterModal),0)},{l:'Back to the off-season',fn:()=>setTimeout(winterModal,0)}]});
    return;
  }
  modal(ph==='fall'?'🏠 Get the cabin ready for winter':'🏠 Spring breakup at the cabin',
    `${artSlot('cabin',artCabinCtx,{key:'cabin-sheet'})}<p style="font-size:13px;color:var(--mute)">Condition ${Math.round(cabin().cond)}/100. Cash ${$(t.cash)}. ${t.daysLeft} free day${t.daysLeft===1?'':'s'} left this winter, shared with camping and winter work. ${ph==='fall'?'The first cold snap and the first big snow come when you leave for camping or open bookings.':'Last winter’s storms are behind you; breakup comes next.'}</p>${jobs.length?'':'<p>Nothing is due right now.</p>'}${more>0?`<p style="font-size:12.5px;color:var(--mute)">${more} more job${more>1?'s':''} after these.</p>`:''}`,
    jobs.map(j=>({l:`${j.ic} ${j.title}`,s:`${j.why} ${j.risk}`,fn:()=>setTimeout(()=>CabinUpkeep.ui.open(homeHost(),j.id,()=>homeWinterModal()),0)}))
      .concat([{l:'🏪 Home upgrades',s:'A wood stove, a fish processing station, a bear-resistant bin.',fn:()=>setTimeout(()=>CabinUpkeep.ui.shop(homeHost(),homeWinterModal),0)},{l:'Back to the off-season',fn:()=>setTimeout(winterModal,0)}]));
}
const cabinWinterBlurb=()=>{const ph=homePhase();return ph==='fall'?'Fall jobs before the cold: heat, pipes, detectors. Storms come when you leave for camping or open bookings.':'Spring breakup: the driveway, the foundation, the well and septic.'};
const homeWinterLabel=()=>{const n=CabinUpkeep.dueCount(homeTicket());return n?`${n} job${n>1?'s':''} due`:'all set'};
// "Open bookings": the winter's storms first, then a nudge about spring jobs, then the season
function homeOpenGate(go){
  const w=S.winter;if(!w){go();return}
  if(cabin().rolled!==w.s){homeRollWinter(()=>setTimeout(winterModal,0));return}
  const n=CabinUpkeep.dueCount(homeTicket());
  if(n&&S.homeAsk!==w.s){S.homeAsk=w.s;
    CabinUpkeep.ui.batch(homeHost(),{title:'🏠 Spring jobs are due',intro:'Breakup is coming. Do them yourself, pay someone, or skip them and take your chances.',extra:[{l:'Open bookings',fn:go}]});return}
  go();
}
// camping starts: the first storm has to land before the free days are spent
function homeBeforeCamping(go){if(S.winter&&cabin().rolled!==S.winter.s)homeRollWinter(go);else go()}

// ---- bots and tests ----
function homeBot(policy,o){return CabinUpkeep.autoplay(homeBotHost(),{policy:policy||'careful',rand:o&&o.rand})}
function homeBotWinter(policy,o){homeBot(policy,o);homeRollWinterSync();return homeBot(policy,o)}
window.homeBot=homeBot;window.homeBotWinter=homeBotWinter;

// ---- the Home tab, the HUD and the tab dot ----
const homeDot=()=>{try{return !S.winter&&CabinUpkeep.dueCount(homeTicket())>0}catch(e){return false}};
function homeView(){return CabinUpkeep.ui.tab(homeTicket())}   // 40-art.js: the cabin's picture sits in the scene at the top of the tab (artScene)
EXTRA_TABS.splice(2,0,{k:'home',ic:'🏠',l:'Home',view:homeView});
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('[data-cab]'):null;
  if(!b||!S||S.over) return;
  if(b.dataset.cab==='job') CabinUpkeep.ui.open(homeHost(),b.dataset.id,()=>{afterAction();if(S&&!S.over)render()});
  else if(b.dataset.cab==='shop') CabinUpkeep.ui.shop(homeHost(),()=>render());
});
function homeTags(){
  const t=[];
  if(cabin().cond<40&&S.loc==='shop') t.push('<span class="tag bad">🏠 cabin run down</span>');
  return t;
}
function homeEndText(){
  const T=cabin().tot,n=T.diy+T.pay+T.skip;
  return `${T.diy} job${T.diy===1?'':'s'} done yourself, ${T.pay} paid, ${T.skip} skipped; ${T.events} mishap${T.events===1?'':'s'}<br><span style="color:var(--mute)">cabin condition ${Math.round(cabin().cond)}/100${T.fees?`, ${$(T.fees)} in fish processing fees`:''}${T.harvest?`, ${T.harvest} meals from the garden`:''}</span>`;
}
TIPS.push({id:'cabin',when:()=>day()>=2&&!S.winter&&CabinUpkeep.dueCount(homeTicket())>0,t:'🏠 The cabin needs a little upkeep now and then. Open the <b>Home</b> tab: each job can be done yourself, paid for, or skipped (at a risk). Never more than two at a time.'});
// ============================================================
//  GUIDE MASTER, part 3b (1.13.0): a day on the water.
//  · A trip is a few beats inside the one trip sheet (22-trips.js): the launch (the spot), then two or three calls through the day
//    (stay, move, switch tactics, shore lunch, call it early). Fish land between beats, from the same model as before (q, the run,
//    weather, the spot's fit, your skill) split across the stretches of the day, so reading the tide, the traffic and the wind pays.
//  · Every party has one or two traits (what they came for). Happiness and the tip follow how well the day matched them, and
//    they leave a short written review (S.reviews: {day, who, type, stars, text}).
//  · Judgment-call dilemmas (no rule to break, or a rule that costs more or less by party) live at the bottom of this file.
// ============================================================

// ---- clients with goals ----
const ALLT=['reds','silver','trout','halibut'];
const TRAITS={
  meat:   {ic:'🥩',n:'Meat fishers',  want:'a full cooler to fly home',              types:['reds','silver','halibut']},
  trophy: {ic:'🏆',n:'Trophy hunters',want:'one big fish, not a pile of small ones',  types:ALLT},
  kids:   {ic:'🧒',n:'Kids aboard',   want:'steady action and an early lunch',       types:ALLT},
  photo:  {ic:'📸',n:'Photographers', want:'scenery, wildlife and the shot',         types:ALLT},
  fly:    {ic:'🪰',n:'Fly purists',   want:'fish on a fly, and no bait',             types:['trout','silver']},
  first:  {ic:'🌱',n:'First-timers',  want:'patient coaching and easy water',        types:ALLT},
  seasick:{ic:'🤢',n:'Seasick-prone', want:'calm water and a short run',             types:['halibut']},
};
const TRAIT_HINT=[
  ['kids',/kid|grandkid|grandson|Scout|sons\b|Garza|three generations|graduation|family reunion|Lopez family|Chen and Rivera/i],
  ['photo',/photo|YouTuber|artist|astronomy|book club|anniversary|newlywed|honeymoon|Germany|Tokyo|Swiss|Australian/i],
  ['fly',/fly/i],
  ['meat',/crew|cannery|pipeline|trucking|farm|Kowalski|oilfield|hockey|bartender|Coast Guard|Nguyen|mail carriers|husbands/i],
  ['trophy',/Navy|Marine|law-firm|startup|bachelor|college buddies|doctors|firefighters|brothers|hunter-ed|paramedics/i],
  ['first',/first|book club|teachers|retired couple|mother and son|newlyweds|night-shift|dentist|sisters/i],
];
const traitOK=(k,type)=>!!(TRAITS[k]&&TRAITS[k].types.includes(type))&&!(k==='meat'&&type==='king'&&kingRule()!=='open');   // 1.14.0: no meat fishers on a catch-and-release king trip
// one or two traits for a party on a trip type (hinted by who they are and their quirks, then chance)
function traitsFor(o){
  const type=o.type||'reds',r=Math.random,tr=[],q=o.quirk||[];
  const add=k=>{if(k&&traitOK(k,type)&&!tr.includes(k)&&tr.length<2)tr.push(k)};
  if(q.includes('kid'))add('kids');if(q.includes('kingfan'))add('trophy');if(q.includes('photo'))add('photo');if(q.includes('first'))add('first');
  TRAIT_HINT.forEach(([k,re])=>{if(re.test(o.who||'')&&r()<.75)add(k)});
  if(type==='halibut'&&r()<.3)add('seasick');
  const pool=()=>Object.keys(TRAITS).filter(k=>traitOK(k,type)&&!tr.includes(k)&&!(k==='trophy'&&(tr.includes('kids')||type==='reds'))&&!(k==='kids'&&tr.includes('trophy')));
  if(!tr.length) add(pick(pool()));
  if(tr.length<2&&r()<.3) add(pick(pool()));
  return tr;
}
// a booking's traits, fitted to its trip type (regulars keep theirs where they still make sense)
function fitTraits(b){
  const tr=(b.tr||[]).filter(k=>traitOK(k,b.type));
  return tr.length?tr:traitsFor(b);
}
const hasT=(b,k)=>!!(b&&b.tr&&b.tr.includes(k));
const tv=(b,m,d)=>{for(const k of (b&&b.tr)||[])if(k in m)return m[k];return d};   // a party-dependent number: the first trait that has one
const traitTxt=(tr,long)=>(tr||[]).filter(k=>TRAITS[k]).map(k=>`${TRAITS[k].ic} ${TRAITS[k].n}${long?`: ${TRAITS[k].want}`:''}`).join(long?' · ':', ');
const traitIcons=tr=>(tr||[]).filter(k=>TRAITS[k]).map(k=>TRAITS[k].ic).join('');
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hrsLeft=m=>m<=0?'no time':`${Math.floor(m/60)?Math.floor(m/60)+' h':''}${m%60?`${Math.floor(m/60)?' ':''}${m%60} min`:''}`;

// ---- the beats of a day ----
// at: minutes after the trip's start when each beat begins (the first is the launch: the spot choice). tac: the two tactics.
const BEATS={
  reds:   {at:[0,120,240],     nm:['Launch','The first drift','The midday call'],      tac:['flip','bank']},
  silver: {at:[0,100,200],     nm:['Launch','Mid-afternoon','The evening bite'],       tac:['troll','drift']},
  trout:  {at:[0,160,320],     nm:['The upper river','The middle river','The lower river'],tac:['beads','streamers']},
  halibut:{at:[0,150,330,480], nm:['The run out','Slack tide','The turn','The run home'],tac:['anchor','jig']},
};
const TAC={
  flip:     {n:'Flip the seams from the sled',          sh:'flipping from the sled'},
  bank:     {n:'Beach the sled and fish a gravel bar',  sh:'fishing from the bank'},
  troll:    {n:'Back-troll plugs down the slots',       sh:'back-trolling plugs'},
  drift:    {n:'Drift spinners and swing flies',        sh:'drifting spinners and flies'},
  beads:    {n:'Drift beads under an indicator',        sh:'drifting beads'},
  streamers:{n:'Swing and strip streamers',             sh:'swinging streamers'},
  anchor:   {n:'Anchor up and set out a chum bag',      sh:'anchored on a chum slick'},
  jig:      {n:'Drift the bottom with jigs',            sh:'drifting jigs'},
};
// moving between spots: minutes off the water and extra gallons (trout floats only go downstream)
const MOVE={reds:[[0,12,0,8],[12,0,0,15],[0,0,0,0],[8,15,0,0]],silver:[[0,8,20],[8,0,20],[20,20,0]],trout:[[0,15,30],[0,0,20],[0,0,0]],halibut:[[0,20,45],[20,0,35],[45,35,0]]};
const MOVE_GAL={reds:[[0,3,0,1],[3,0,0,3],[0,0,0,0],[1,3,0,0]],silver:[[0,1,4],[1,0,4],[4,4,0]],trout:[[0,0,0],[0,0,0],[0,0,0]],halibut:[[0,8,25],[8,0,18],[25,18,0]]};
const BEAT_Q=.3, LUNCH_MIN=30, GOAL_H=9, GOAL_MID=4;   // GOAL_MID: a day out with a guide who listens is worth something by itself (keeps an average day where it was before 1.13)
const canMove=(type,a,b)=>a!==b&&!(SPOTS[type][b]&&SPOTS[type][b].viol)&&(type!=='trout'||b>a);

function segWin(b,k){const T=TRIPS[b.type],A=BEATS[b.type].at,a=A[k]||0,e=k+1<A.length?A[k+1]:T.len;return {t0:b.d*1440+T.start+a,m0:T.start+a,len:e-a}}
const windAt=(d,m)=>wxOf(d).wind*(.7+.6*clamp((m-600)/360,0,1));     // the wind builds through the afternoon
function traffic(type,i,m){                                           // 0 (empty) .. 1 (elbow to elbow)
  if(type==='reds') return [m>=470&&m<900?1:.35,.2,0,.8][i]||0;
  if(type==='silver') return [.5,m>=900?.8:.5,.1][i]||0;
  if(type==='trout') return [m>=540&&m<900?.9:.4,.35,.1][i]||0;
  if(type==='king') return [m<540?.6:.4,.25,.45][i]||0;            // 1.14.0: June kings (34-summer.js)
  return [.45,.3,.1][i]||0;
}
const trafWord=x=>x>=.85?'elbow-to-elbow boats':x>=.55?'busy':x>=.3?'a few boats':'nearly empty';
// what a stretch of the day does to a spot and a tactic: signed readings with the reason for each sign (R from 23-fish.js)
function segTerms(b,k,i,tac){
  const type=b.type,d=b.d,w=segWin(b,k),mid=w.t0+w.len/2,mm=w.m0+w.len/2,x=tide(mid),slack=1-Math.abs(x.rate),flood=x.rate>.25,ebb=x.rate<-.25;
  const c=spotConds(type,d),windy=clamp((windAt(d,mm)-9)/8,0,1.5),tr=traffic(type,i,w.m0+30),out=[];
  out.push(R(-(tr-.5)*(tac==='bank'?.3:.9),'quiet water, nobody on the drift','boats stacked up on the drift'));
  if(type==='reds'){
    if(i===0||i===3) out.push(R(flood?(i===0?.5:.25):ebb?-.2:0,'fresh reds push in on the flood','the ebb slows the push of fresh fish'));
    if(i===1) out.push(R(-.4*windy,'','wind on the long run upriver'));
    out.push(tac==='bank'?R(-.1+.25*Math.max(0,c.cloud),'overcast keeps reds tight to the bank','you give up the middle seams'):R(.3*c.run,'a strong run fills the seams','a thin run leaves the seams empty'));
  }else if(type==='silver'){
    if(i<2) out.push(R(flood?.5:ebb?-.25:0,'the flood pushes fresh silvers in','the ebb leaves the slots empty'));
    if(k===BEATS.silver.at.length-1) out.push(R(.15,'silvers turn on toward evening',''));
    out.push(tac==='troll'?R(.4*c.lvl-.5*windy,'big water fills the deep slots','wind and low water make back-trolling hard'):R(.5*c.trend+.3*c.cloud,'clearing water and soft light for spinners','rising water and bright sun put them off spinners'));
  }else if(type==='king'){

// 1.16.0: a staff trip uses the 1.13 party model where it is cheap. Each trait the party came for is met (or not) by the guide's skill,

function staffFit(b,g,catchF,fish){

    else if(k==='kids') v=.2+rel*.4+(b.type==='trout'?.2:0)-(catchF<.45?.4:0);
    else if(k==='photo') v=.1+(b.type==='trout'||b.type==='king'?.3:0)+sk*.2;
    else if(k==='fly') v=b.type==='trout'||b.type==='silver'?sk*.6+.1:-.4;

// ============================================================
//  GUIDE MASTER, part 7 (1.15): memories. The trophy wall, firsts, standout clients, postcards, and the catch moments.
//  · Every stretch of a trip that lands fish leaves a "best fish" with a size (a seeded hash, so it never touches Math.random):
//    the biggest per species goes on the trophy wall (S.mem.rec). Trophies (the day's big fish), kings at the boat, barn-door
//    halibut (100 lb and up), limit-outs and the first fish of a species get a short moment inside the trip sheet
//    (≤1.5 s, none with reduced motion; an optional chime, off by default) and a catch card at the dock you can save as a PNG.
//  · Firsts (S.mem.firsts): the first king, barn door, limit-out, five-star review and first fish of each species.
//  · Postcards: at the start of a new season, one or two past clients with a good day behind them write in (the morning report).
//  · The trophy wall lives in the 📜 Log tab (a switch at the top): records, firsts, standout clients, postcards, the rating.
//  Hooks: tripNext (memSheet), tripStart (memTripStart), tripEnd (memDock), startSeason (memSeasonStart), finishWinter (memSeasonOpen).
//  The star rating and its milestones live in 39-stars.js; the mentor's ride-along in 38-mentor.js.
// ============================================================

// ---- the save's memories (S.mem). Created on first use, so a new game and an old save (MIGRATIONS to:8) both get one. ----
// mentor: 'due' on a new career (no trips yet), 'riding' while he is aboard, 'done' or 'skipped' after (Help → ride again sets 'due')
function memBase(x){x=x||S;return {v:1,rec:{},firsts:{},trips:[],cards:[],cardS:-1,mentor:x&&x.stats&&x.stats.trips>0?'done':'due',feat:null,lodge:null,top:false}}
function MEM(){if(!S.mem||typeof S.mem!=='object')S.mem=memBase();return fillDefaults(S.mem,memBase())}
// a seeded number in [0,1) from a few integers: sizes and postcard picks never consume Math.random (seeded tests and the simulator stay put)
const memU=(a,b,c)=>{const x=Math.sin(a*12.9898+b*78.233+(c||0)*37.719+1.618)*43758.5453;return x-Math.floor(x)};

// ---- species and sizes ----
// lo–hi: the range of an ordinary good fish; a trophy (the stretch's big fish in 33-day.js) is above hi. Kings and barn doors are trophies too.
const FISH_SZ={
  sockeye:{n:'Sockeye',pl:'sockeye',ic:'🐟',u:'lb',lo:5,hi:9,half:true},
  silver: {n:'Silver salmon',pl:'silvers',ic:'🎣',u:'lb',lo:8,hi:13,half:true},
  rainbow:{n:'Rainbow trout',pl:'rainbows',ic:'🌈',u:'in',lo:16,hi:26},
  halibut:{n:'Halibut',pl:'halibut',ic:'⚓',u:'lb',lo:15,hi:60},
  king:   {n:'King salmon',pl:'kings',ic:'👑',u:'lb',lo:20,hi:60},
};
const SP_ORDER=['king','sockeye','silver','rainbow','halibut'];
const BARN=100;   // a "barn door" halibut
// the species a trip type lands (trip types added by other features map by name)
function speciesOf(type){
  const m={reds:'sockeye',silver:'silver',trout:'rainbow',halibut:'halibut'};
  if(m[type]) return m[type];
  const s=String(type||'');
  return /king/i.test(s)?'king':/silver|coho/i.test(s)?'silver':/trout|rainbow/i.test(s)?'rainbow':/halibut/i.test(s)?'halibut':/red|sock/i.test(s)?'sockeye':null;
}
const szTxt=(sp,z)=>{const S2=FISH_SZ[sp];if(!S2)return '';return S2.u==='in'?`${Math.round(z)}-inch`:`${S2.half&&z%1?z.toFixed(1):Math.round(z)}-pound`};
const szShort=(sp,z)=>{const S2=FISH_SZ[sp];return S2.u==='in'?`${Math.round(z)} in`:`${S2.half&&z%1?z.toFixed(1):Math.round(z)} lb`};
// the best fish of a stretch: the trophy's own size when there was one (read off the 🏆 line), else the best of n ordinary fish
function segSize(b,sg,sp){
  const X=FISH_SZ[sp];if(!X||!sg||!(sg.n>0)) return null;
  if(sp==='king'&&!/🏆 A \d/.test(sg.line||'')){const u=memU((b.id||1)*5+sg.k,b.d,sg.n+3);return {z:Math.round(22+Math.pow(u,1.6)*50),big:true}}   // a June king trip: every king is the fish of the trip, 22–72 lb (most 25–45)
  if(sg.big){const m=/🏆 A (\d+)-(?:pound|inch)/.exec(sg.line||'');return {z:m?+m[1]:Math.round(X.hi*1.15),big:true}}
  const u=memU((b.id||1)*7+sg.k,b.d,sg.n),x=Math.pow(u,1/Math.max(1,Math.min(sg.n,8)));
  let z=X.lo+(X.hi-X.lo)*(sp==='halibut'?x*x:x)*.98;
  z=X.half?Math.round(z*2)/2:Math.round(z);
  return {z:Math.min(z,X.hi-(X.half?.5:1)),big:false};
}
const isTrophy=(sp,z,big)=>!!big||sp==='king'||(sp==='halibut'&&z>=BARN);

// ---- what a trip has landed so far, and what is worth a moment ----
// t.mm: {segs:[k already counted], best:{sp,z,big}, ev:[pending moment events], lim:bool, king:bool, shown:[...]}
const mmOf=t=>t.mm||(t.mm={segs:[],best:null,ev:[],lim:false,king:false,said:[]});
function memNote(b,t,sp,z,big,why){
  const M=MEM(),mm=mmOf(t),X=FISH_SZ[sp];if(!X||!(z>0)) return;
  const rank=(s2,z2,b2)=>(s2==='king'?3:isTrophy(s2,z2,b2)?2:1)*1000+z2/FISH_SZ[s2].hi*100;
  if(!mm.best||rank(sp,z,big)>rank(mm.best.sp,mm.best.z,mm.best.big))mm.best={sp,z,big};
  const rec=M.rec[sp],year=yearOf(b.d),isNew=!rec||z>rec.z;
  if(isNew){M.rec[sp]={z,who:b.who,from:b.from,d:b.d,year,type:b.type,id:b.id};if(rec&&rec.id!==b.id)mm.ev.push({k:'record',sp,z,old:rec.z})}   // a personal best over an earlier trip's fish
  if(!M.firsts['sp_'+sp]){memFirst('sp_'+sp,b,`${X.ic} First ${X.n.toLowerCase()}: a ${szTxt(sp,z)} fish for the ${b.who}`);mm.ev.push({k:'first',sp,z})}
  // one king moment a trip: a June king trip lands several over its stretches (and the king dilemma can add one); the rest ride on the record
  if(sp==='king'){if(!mm.kingEv){mm.kingEv=1;mm.ev.push({k:'king',sp,z})}if(!M.firsts.king)memFirst('king',b,`👑 First king: about ${Math.round(z)} pounds, ${why||'at the boat'} with the ${b.who}`)}
  else if(sp==='halibut'&&z>=BARN){mm.ev.push({k:'barn',sp,z});if(!M.firsts.barn)memFirst('barn',b,`🚪 First barn door: a ${Math.round(z)}-pound halibut for the ${b.who}`)}
  else if(big) mm.ev.push({k:'trophy',sp,z});
}
function memFirst(k,b,txt){const M=MEM();if(M.firsts[k])return false;M.firsts[k]={d:b?b.d:day(),year:yearOf(b?b.d:day()),who:b?b.who:'',txt};return true}
// count every stretch that has landed since we last looked, the king at the boat, the leopard rainbow, and the limit
function memScan(b,t,key){
  const mm=mmOf(t),sp=speciesOf(b.type),bt=t.bt;
  if(bt&&bt.segs) bt.segs.forEach(sg=>{if(!sg||mm.segs.includes(sg.k))return;mm.segs.push(sg.k);
    if(b.type==='halibut'&&halClosed(b.d))return;                 // rockfish and lingcod: no halibut record
    const s=segSize(b,sg,sp);if(s)memNote(b,t,sp,s.z,s.big)});
  if(key==='king'&&!mm.king){mm.king=true;memNote(b,t,'king',Math.round(44+memU(b.id||1,b.d,3)*20),true,'at the boat')}
  if(key==='photo'&&!mm.leo){mm.leo=true;memNote(b,t,'rainbow',26,false)}
  if(bt&&bagged(b)&&!mm.lim){const f=fishersOf(b,t);if(f>0&&bt.box>=f*limOf(b)){mm.lim=true;mm.ev.push({k:'limit',sp,n:bt.box});if(!MEM().firsts.limit)memFirst('limit',b,`🧊 First limit-out: every one of the ${b.who} limited`)}}
}

// ---- the moment: a short burst inside the trip sheet ----
const MM_RANK={king:6,barn:5,trophy:4,limit:3,first:2,record:1};
const MM_GO=['king','barn','trophy','limit','first'];       // what earns a moment (a personal best alone rides along as a tag)
function momentOf(ev){
  if(!ev.some(e=>MM_GO.includes(e.k))) return null;
  const top=ev.slice().sort((a,c)=>MM_RANK[c.k]-MM_RANK[a.k])[0],X=FISH_SZ[top.sp]||FISH_SZ.sockeye,more=[...new Set(ev.map(e=>e.k))].filter(k=>k!==top.k);
  const head={king:'👑 King at the boat!',barn:'🚪 Barn door!',trophy:'🏆 Trophy!',limit:'🧊 Limit out!',record:'📏 New personal best!',first:`${X.ic} First ${X.n.toLowerCase()}!`}[top.k];
  const sub={king:`About ${Math.round(top.z)} pounds of chrome.`,barn:`A ${Math.round(top.z)}-pound halibut over the rail.`,trophy:`A ${szTxt(top.sp,top.z)} ${X.n.toLowerCase()}.`,limit:`Every rod in the boat has its limit: ${top.n} ${X.pl} in the box.`,
    record:`A ${szTxt(top.sp,top.z)} ${X.n.toLowerCase()}, your biggest yet.`,first:`A ${szTxt(top.sp,top.z)} fish. The first one goes on the wall.`}[top.k];
  const tags=more.map(k=>({record:'📏 personal best',first:'✨ a first',limit:'🧊 limit out',trophy:'🏆 trophy',barn:'🚪 barn door',king:'👑 king'}[k])).filter(Boolean);
  return {k:top.k,head,sub:sub+(tags.length?` Also: ${tags.join(', ')}.`:''),ic:top.k==='king'?'👑':top.k==='limit'?'🧊':X.ic};
}
function momentHTML(m){
  if(!m) return '';
  return `<div class="gm-moment gm-${m.k}" role="status"><svg class="gm-jump" viewBox="0 0 120 60" aria-hidden="true"><path class="gm-arc" d="M8 52 Q60 -14 112 52" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" opacity=".45"/><g class="gm-fishg"><path d="M0 0 q14 -9 28 0 q-14 9 -28 0z M26 0 l9 -7 v14z" fill="currentColor"/><circle cx="7" cy="-1.5" r="1.6" fill="#fff"/></g><g class="gm-spark" fill="#f4c542"><circle cx="20" cy="14" r="2.5"/><circle cx="96" cy="12" r="2"/><circle cx="60" cy="4" r="2.5"/><circle cx="80" cy="28" r="1.8"/><circle cx="38" cy="30" r="1.8"/></g></svg><div class="gm-mt"><b>${m.head}</b><span>${m.sub}</span></div></div>`;
}
// the optional chime: off by default (⚙️ Settings → Catch chime), a three-note bell, no audio files
function memChime(){if(!prefs().chime)return;try{[[880,0],[1175,.09],[1568,.18]].forEach(([f,w])=>tone(f,.45,'sine',.07,w));tone(2349,.5,'sine',.025,.2)}catch(e){}}
// called by tripNext (22-trips.js) for every view of the trip sheet: {top, foot} html (the moment, then the mentor's line)
function memSheet(b,t,key){
  let top='';
  try{memScan(b,t,key);const mm=mmOf(t);if(mm.ev.length){const m=momentOf(mm.ev);mm.said.push(...mm.ev.map(e=>e.k));mm.ev=[];top=momentHTML(m);if(m)memChime()}}catch(e){}
  const foot=typeof mentorLine==='function'?mentorLine(b,t,key):'';
  return {top,foot};
}
// tripStart (22-trips.js): the mentor climbs aboard, a lodge guest's referral fee
function memTripStart(b,t){
  if(typeof mentorBoard==='function') mentorBoard(b,t);
  if(b.lodge&&typeof starsTripStart==='function') starsTripStart(b,t);
}

// ---- the dock: the last stretches, the review's firsts, the card ----
// tripEnd (22-trips.js) calls this after the review is written. info: {C, rv, happy, fish}. Returns {top, html} for the dock sheet:
// the moment goes on top, the catch card, the rating's news and the mentor's last word below the review.
function memDock(b,t,info){
  const M=MEM(),mm=mmOf(t),C=info.C,rv=info.rv,sp=speciesOf(b.type);let html='',top='';
  try{
    memScan(b,t,'dock');
    if(C&&bagged(b)&&C.fishers>0&&C.limits===C.fishers&&!mm.lim){mm.lim=true;mm.ev.push({k:'limit',sp,n:C.fish});memFirst('limit',b,`🧊 First limit-out: every one of the ${b.who} limited`)}
    if(rv&&rv.stars===5) memFirst('five',b,`⭐ First five-star review, from the ${b.who}: “${rv.text.split('. ')[0].replace(/\.$/,'')}.”`);
    memFirst('trip',b,`🛶 First guided trip: the ${b.who}, ${b.from}`);
    // remember the trip (postcards, standout clients): the last 60
    const best=mm.best;M.trips.push({d:b.d,who:b.who,from:b.from,type:b.type,stars:rv?rv.stars:0,best:best?[best.sp,best.z]:null,tr:(b.tr||[]).slice(0,2),lim:!!mm.lim});
    if(M.trips.length>60)M.trips.splice(0,M.trips.length-60);
    const m=momentOf(mm.ev),said=mm.said.concat(mm.ev.map(e=>e.k));mm.ev=[];
    if(m){top=momentHTML(m);memChime()}
    if(said.some(k=>MM_GO.includes(k))&&best) html+=cardHTML(b,info,best,said);
  }catch(e){}
  if(typeof starsAfterTrip==='function') html+=starsAfterTrip(b,t,info);
  if(typeof mentorDock==='function') html+=mentorDock(b,t);
  return {top,html};
}

// ---- the catch card: a shareable-looking card in the dock summary, and a PNG of it ----
let CARD=null;
function cardData(b,info,best,said){

//  GUIDE MASTER, part 8 (1.15): a mentor's first trip.
//  On a new career's first trip, Walt Brandvold (forty-some Julys on the Kenai, a Soldotna local) rides along and walks you
//  through one thing per beat: reading the conditions line, choosing a move, the party's goals and a rule dilemma.
//  His lines sit inside the trip sheet (no extra pop-ups). "I’ve got this" sends him ashore; he rides once per save

const MENTOR={n:'Walt Brandvold',sh:'Walt',ic:'🧓'};
// the lessons, in the order he likes to give them; each one once, on the first sheet where it fits
function mentorSay(b,t,key){
  const m=t.mentor,T=TRIPS[b.type]||{},seen=k=>m.seen.includes(k),first=!m.seen.length;
  const hi=first?`Walt Brandvold climbs in with a thermos and a coffee can of jigs. He has run this river since the sleds were wooden. `:'';
  const illegal=window.TRIPV&&TRIPV.o&&TRIPV.o.some(o=>o.legal===false);
  if((key==='spot'||key==='pack')&&!seen('conds')){
    const c={reds:'Clock, tide, yesterday’s sonar, the boats, the wind and the radio. Fresh reds ride the flood in, and Big Eddy is elbow to elbow by eight.',
      silver:'Clock, tide, sonar, the boats, the wind. Silvers push in on the flood and turn on toward evening. Six o’clock is the hard stop down here.',
      trout:'Read the river level and the wind. Spawning reds put the rainbows on the egg bite, and Skilak blows up most afternoons.',
      halibut:'Tide first, always. Slack holds a chum slick on the bottom; a running tide drags it off. Then the wind: chop out in the open means green faces.'}[b.type]||'Clock, water, boats, wind, the radio: read it top to bottom.';
    return ['conds',`${hi}“See that list? Read it top to bottom before you pick a spot. ${c} The 🐟 Fish tab gives you the same read ashore, the night before.”`];
  }
  if(key==='beat'&&!seen('moves')) return ['moves',`${hi}“Your call now, ${'{{name}}'}. Stay if the bite is holding. Switching tactics costs five minutes; a run costs time and gas. Don’t chase every rumor on the radio, but don’t babysit a dead drift either.”`];
  if(illegal&&!seen('rules')) return ['rules',`${hi}“Here’s where guides lose permits. There’s always a legal answer, and it always costs you something: time, a fish, a smaller tip. Pay it. The troopers know every boat on this river, and three tickets ends you.”`];
  if((key==='beat'||(!first&&seen('moves')))&&!seen('goals')&&key!=='pack'){
    const tr=(b.tr||[]).filter(k=>TRAITS[k]);
    return ['goals',`${hi}“Look at the 🎯 line. ${tr.length?`The ${b.who} came for ${tr.map(k=>TRAITS[k].want).join(', and ')}.`:`Ask the ${b.who} what they came for.`} Give them that and the tip takes care of itself. Fish count, but the day they wanted counts more.”`];
  }

}

//    (or a guide with few reviews) starts near ★4.0. The top bar shows it as ★4.6 where Rep used to be; S.rep stays underneath

//    ★4.7 over 12+ reviews brings a magazine feature, once a career: a burst of up to three extra bookings over the next week.
//    A season averaging ★4.7 (6+ reviews) signs a lodge partnership: two extra bookings each season, 10% referral fee to the lodge,
//    until the rating slips under ★4.3 at a season's end. (1.15 integration: ★4.8 over a July never triggered in the sims.)
//  · With 1.14's summer weeks, the magazine's readers and the lodge's guests book inside the season's chosen weeks, on the trip
//    that week's water offers (memBookType): June kings, July sockeye, August silvers, September rainbows; trout or halibut Sun/Mon.
//  · Falling ratings hurt: under ★2.5, fewer season bookings and a quieter rest of the summer (starBook(), down to −30%).
//  Calibrated with tools/sim: the default bots (food, passive, ignores) average ★2.8–3.5 and never reach ★4.5, so none of this
//  moves their grades; guide/skilled play reaches ★4.5 in most careers and ★4.7 in some.

{const i=STATS.findIndex(s=>s.l==='Rep');const R={l:'Rating',v:()=>starTxt(rating().r),m:()=>S.rep,warn:()=>S.rep<20||(rating().n>=5&&rating().r<STAR_LOW),
  get title(){const x=rating();return `Rating ${starTxt(x.r)}: the average of your last ${Math.min(RATE_N,x.n)||'few'} reviews${x.n<RATE_N?' (and your reputation, until there are more)':''}. ${topRated()?'Top-rated: better tips. ':''}Reputation ${S.rep}/100 (the bar): word of mouth. At 0, nobody books you.`}};

// ---- a lodge guest pays the lodge its cut (tripStart, through memTripStart) ----
function starsTripStart(b,t){const fee=Math.round(payOf(b)*LODGE_FEE);if(fee>0){fx(t,-fee,'Referral fee to the lodge');if(S.mem&&S.mem.lodge)S.mem.lodge.fee+=fee}}

// ---- after each review (the dock sheet): top-rated, the magazine ----
function starsAfterTrip(b,t,info){
  const M=MEM(),x=rating(),out=[];
  if(!M.top&&topRated()){M.top=true;out.push(`⭐ <b>Top-rated guide: ${starTxt(x.r)}.</b> Your reviews put you near the top of every booking site on the Kenai. Parties who pay well find you, and they tip about 15% more on a good day.`)}
  else if(M.top&&x.n>=STAR_TOP_N&&x.r<STAR_TOP-.2){M.top=false;out.push(`📉 Your rating slips to ${starTxt(x.r)}: you drop off the top-rated lists. Good days bring it back.`)}
  if(!M.feat&&x.n>=STAR_FEAT_N&&x.r>=STAR_FEAT){
    const add=featBook(day()+1,7);M.feat={d:day(),s:seasonOf(day()),n:add.length,pend:add.length?0:(isLastSeason()?0:FEAT_N)};
    out.push(`📰 <b>A magazine feature.</b> A writer from an Alaska fishing magazine has been reading your reviews (${starTxt(x.r)}) and calls to ride along next summer. The story runs online tonight.${add.length?` The phone rings off the hook: ${add.length} more trip${add.length>1?'s':''} booked this week (${add.map(a=>dlabel(a.d)).join(', ')}).`:M.feat.pend?' This week is full, so the readers book the first week of next season.':''}`);
  }
  return out.length?`<div class="gm-stars-ms">${out.map(l=>`<p>${l}</p>`).join('')}</div>`:'';
}
// the trip a magazine reader or a lodge guest books on day d: the played week's main trip on Tue–Sat (June kings, or rainbows when
// kings are closed; July sockeye; August silvers; September rainbows and silvers), a trout float (or Homer halibut with the charter
// permit) on Sundays and Mondays while guide boats are off the lower river (through Jul 31; after that the week's trip runs then too)
function memBookType(d){
  const w=((d%7)+7)%7,main=typeof weekOf==='function'?weekOf(d).main(d):'reds';
  if((w===0||w===6)&&isSunMon(d)) return S.up&&S.up.chp?'halibut':'trout';
  return main;
}
// party size for those bookings (the week's usual sizes, a seeded pick)
function memBookN(type,d,k){const L=typeof WEEK_N!=='undefined'&&WEEK_N[type]||(type==='halibut'?[4,5,6]:type==='trout'?[2,3]:[3,4]);return L[Math.floor(memU(d,k,1)*L.length)]}
// up to FEAT_N bookings on open, legal days from d0 for `span` days within the season: magazine readers (deterministic picks)
function featBook(d0,span,max){
  const end=seasonFirst(seasonOf(d0))+SEASON,out=[];max=max||FEAT_N;
  for(let d=d0;d<Math.min(end,d0+span)&&out.length<max;d++){
    const type=memBookType(d);if(illegalDay(type,d)||conflicts(d,type))continue;
    const ps=PARTIES,p=ps[Math.floor(memU(d,out.length,7)*ps.length)];
    out.push(addBooking({d,type,n:memBookN(type,d,3),who:p.who,from:p.from,res:!!p.res,quirk:[],tr:['photo'],feat:true}));
  }
  return out;
}

// ---- the season turns (startSeason → memSeasonStart, in the morning report) ----
function starsSeasonStart(s){
  const M=MEM(),rv=(S.reviews||[]).filter(r=>seasonOf(r.day)===s-1),n=rv.length,avg=n?rv.reduce((a,x)=>a+x.stars,0)/n:0,x=rating();
  if(!M.lodge&&n>=STAR_LODGE_N&&avg>=STAR_LODGE&&s<S.years){M.lodge={s,n:0,fee:0};digestLine(`🏨 <b>A lodge partnership.</b> Last season’s reviews averaged ${starTxt(avg)}. A riverside lodge in Soldotna wants you as its guide: ${LODGE_N} extra trips with its guests every season, for a ${Math.round(LODGE_FEE*100)}% referral fee.`)}
  else if(M.lodge&&!M.lodge.off&&x.r<STAR_LODGE_OFF){M.lodge.off=s;digestLine(`🏨 Your rating fell to ${starTxt(x.r)}, and the lodge sends its guests to another guide. The partnership is over.`)}
  if(x.n>=5&&x.r<STAR_LOW) digestLine(`📉 Your rating is ${starTxt(x.r)}. Fewer parties book a guide with reviews like that: expect a quieter summer until it comes back up.`);
}
// finishWinter → memSeasonOpen: the lodge's guests, and magazine readers who couldn't get a date last summer
function starsSeasonOpen(s){
  const M=MEM(),lines=[],base=s*SEASON;
  if(M.feat&&M.feat.pend){const add=featBook(base+1,7,M.feat.pend);M.feat.pend=0;M.feat.n+=add.length;if(add.length)lines.push(`📰 Readers of last summer’s magazine story booked ${add.length} trip${add.length>1?'s':''} in the first week.`)}
  if(M.lodge&&!M.lodge.off){
    let k=0;const want=LODGE_N;
    for(let i=0;i<SEASON*3&&k<want;i++){const d=base+1+Math.floor(memU(s,i,11)*(SEASON-2)),w=sday(d)%7;if(w<1||w>5)continue;   // Tue–Sat of either chosen week
      const type=memBookType(d);if(conflicts(d,type)||illegalDay(type,d))continue;
      const p=PARTIES[Math.floor(memU(s,i,13)*PARTIES.length)];addBooking({d,type,n:memBookN(type,d,s),who:p.who,from:p.from,res:!!p.res,quirk:[],tr:['first'],lodge:true});k++}
    M.lodge.n+=k;if(k)lines.push(`🏨 The lodge sends ${k} part${k>1?'ies':'y'} of its guests (${Math.round(LODGE_FEE*100)}% referral fee).`);
  }
  return lines;
}

// ---- on the trophy wall ----
function starsWall(){
  const M=MEM(),x=rating(),rv=(S.reviews||[]).slice(-RATE_N),dist=[5,4,3,2,1].map(k=>[k,rv.filter(r=>r.stars===k).length]);
  const ms=[[topRated(),`★${STAR_TOP} top-rated guide (${STAR_TOP_N}+ reviews): parties that pay and tip better`],
    [!!M.feat,`★${STAR_FEAT} magazine feature (${STAR_FEAT_N}+ reviews): a week of extra bookings, once${M.feat?`: ran ${dlabel(M.feat.d)}, ${yearOf(M.feat.d)}`:''}`],
    [!!(M.lodge&&!M.lodge.off),`★${STAR_LODGE} over a whole season: a lodge partnership, ${LODGE_N} extra trips a season${M.lodge?` (${M.lodge.n} so far${M.lodge.off?', ended':''})`:''}`]];
  return `<div class="sect">★ Your rating</div><div class="rules gm-stars-ms" style="margin-top:0"><p style="margin:0 0 4px"><b style="font-size:20px">${starTxt(x.r)}</b> from the last ${x.n} review${x.n===1?'':'s'}${x.n<RATE_N?' (with your reputation filling in until there are '+RATE_N+')':''}. Reputation ${S.rep}/100.</p>
    <p style="margin:0 0 6px;color:var(--mute)">${dist.map(([k,c])=>`${k}★ ${c}`).join(' · ')}</p>${ms.map(([ok,t])=>`<div class="gm-ms"><span class="${ok?'ok':''}" aria-label="${ok?'reached':'not yet'}">${ok?'✓':'○'}</span><span>${t}</span></div>`).join('')}
    ${x.n>=5&&x.r<STAR_LOW?`<p style="color:var(--bad);margin:6px 0 0">Under ★${STAR_LOW}: fewer bookings until it comes back up.</p>`:''}</div>`;
}

  if(!mobile&&/Safari/i.test(ua)&&!/Chrome|Chromium|Edg/i.test(ua))return ['In Safari’s menu bar, choose <b>File → Add to Dock…</b> (macOS Sonoma or later).','Click <b>Add</b>. Guide Master opens from the Dock in its own window.'];
  if(!mobile)return ['Click the install icon (a screen with a down arrow) at the right end of the address bar,','or open the browser menu (⋮ or …) and choose <b>Install Guide Master</b> (Edge: <b>Apps → Install this site as an app</b>).','Click <b>Install</b>. Guide Master gets its own window and a desktop icon.'];
  return ['Open the browser menu (⋮), at the top right.','Tap <b>Install app</b> or <b>Add to Home screen</b>.','Tap <b>Install</b> (or <b>Add</b>). Guide Master is now on your home screen.'];
}
function installSheet(){
  const steps=installSteps();
  modal('📲 Install Guide Master',`<p>Put the game on your home screen: it opens full screen, like an app, and plays offline.</p>
  <ol class="inst-steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  <p style="font-size:13px;color:var(--mute)">Don’t see it in the menu? Use the game for a minute and look again: some browsers only offer it after a short visit. On Android and computers the installed app keeps this browser’s saved games.</p>`,
  [{l:'Got it',fn:()=>{}}]);
}
window.doInstall=async()=>{
  if(deferredInstall){const ev=deferredInstall;deferredInstall=null;
    try{ev.prompt();const c=await ev.userChoice;if(c&&c.outcome==='accepted'){try{localStorage.setItem(INSTALLED_KEY,'1')}catch(e){}}}catch(e){}
    syncInstallBtn();return}
  if(isIOS()){if(typeof saveGame==='function'&&S&&!S.over)saveGame();location.href='install/ios.html';return}
  installSheet();
};
// ============================================================
//  GUIDE MASTER: fish buying & processing (the adapter).
//  The business itself lives in src/tender/ (the Tender module, which knows nothing about this game). This file is the thin bridge:
//  it builds the module's ticket from the save (S), gives it a host made of our own pop-ups, and applies each report back to S.
//
//  Save state: S.fish.tender is the module's own state (opaque here; created on first use, so old saves load as they are).
//  The year: the off-season planner (from TENDER_UNLOCK seasons played) charters or buys tenders and a plant; when bookings open the
//  season opens (upkeep and crew are paid, the market and the opener calendar are set); on a played opener day your skipper runs the
//  tender unless you take her out yourself (a day choice on the Here tab); the next off-season settles the openers you didn't play,
//  the plant's season, the fall charter, depreciation and the loan payment.
//  Guardrail: the module never takes cash below Tender.FLOOR (a forced sale and a write-off cover the rest), so it can't end a career.
//  Nothing here draws a random number or changes a thing until you charter or buy something: a game without the business plays as before.
//
//  Hooks (wrapped, not edited): startSeason (the fall settlement), finishWinter (the season opens), onMorning (the opener notice, the
//  plant's call), onNight (the skipper's opener), actionsHere (run the tender yourself), the shared FISH_HUB section (the planner button, one line in 24-career.js),
//  scoreParts and endRows (assets, the loan, the rest of the summer), the Bookings tab (the business at a glance).
//  For the other commercial modules (gillnet, seine, crab): tenderRoute({species, lbs, area, day}) sells your own catch to your own
//  buyer when you have one in that water (it returns null otherwise, and the delivery goes to an outside buyer as before).
// ============================================================
const TENDER_UNLOCK=Tender.data.K.UNLOCK;                // seasons played before the business opens: the off-season after commercial fishing does
const TENDER_SELF_BY=480;                                // run the tender yourself only if you start by 8:00 AM (the openers run 7 AM to 7 PM)
const TENDER_CANCEL_REP=5;                               // reputation a party costs you when you cancel on them for an opener
function tenderSeed(){return Tender.util.hash(S.name||'',S.nextId||0,S.years||0,(S.seasons||[]).length)}
function TND(){S.fish=S.fish||{};if(!S.fish.tender||typeof S.fish.tender!=='object')S.fish.tender=Tender.newState(tenderSeed());else Tender.normState(S.fish.tender);return S.fish.tender}
const tenderHas=()=>!!(S&&S.fish&&S.fish.tender&&(Tender.active(S.fish.tender)||S.fish.tender.loan||S.fish.tender.season));
const tenderOn=()=>!!(S&&S.seasons&&S.seasons.length>=TENDER_UNLOCK)||tenderHas();
function tenderTicket(o){
  const w=!!S.winter,d=day(),s=w?S.winter.s:seasonOf(d),R=REG();
  return Object.assign({state:TND(),phase:w?'winter':'summer',s,year:2026+s,cash:Math.round(S.money),floor:Tender.FLOOR,rep:S.rep,energy:S.energy,costMult:DF().cost,
    diesel:Math.max(3,Math.round(((S.fuelBase&&S.fuelBase.kenai)||6.19)*.85*100)/100),daysLeft:w?campDaysLeft():0,seasonsLeft:S.years-s,md:w?0:mdOf(d),
    run:{sockeye:R.mult.sockeye,coho:R.mult.coho,pinkEven:(2026+s)%2===0,king:R.king},wind:w?null:wxOf(d).wind},o||{});
}
function tenderApply(rep,quiet){
  if(!rep) return rep;
  S.fish.tender=rep.state;
  const c=Math.round(rep.cashDelta||0);
  if(c) money(c);
  S.stats.tenderNet=(S.stats.tenderNet||0)+c;
  if(rep.energyDelta) adj('energy',rep.energyDelta);
  if(rep.repDelta) adj('rep',rep.repDelta);
  if(rep.daysUsed>0) homeDays(rep.daysUsed,0);         // 32-home.js: free winter days, shared with camping and the cabin
  if(rep.forced) S.stats.tenderForced=(S.stats.tenderForced||0)+1;
  if(!quiet) rep.lines.forEach(l=>say(l));
  return rep;
}
// ---- illustrations (40-art.js): the module reports events [{id, sev}] (Tender.EVENTS); the worst one with a picture wins ----
function tenderArt(evs){if(typeof artOn!=='function'||!artOn()||!evs||!evs.length)return '';return artFirst(evs.slice().sort((a,b)=>(b.sev||0)-(a.sev||0)).map(e=>()=>artSlot('event',()=>artEventCtx(e.id,'tender'),{deco:true})))}
const tenderHost=()=>({show:(t,h,b,lock,meta)=>modalSwap(t,tenderArt(meta&&meta.events)+h,b,lock),ticket:()=>tenderTicket(),apply:r=>tenderApply(r),rand:()=>Math.random()});
const tenderBotHost=()=>({ticket:()=>tenderTicket(),apply:r=>tenderApply(r,true)});

// ---- the off-season ----
// The "Commercial & crab" sheet is shared with the gillnet, seine and crab adapters (same names and shapes in each branch, so a merge
// keeps one copy): each pushes one section {id, order, ic, l, short, s(), open(back), on()} into FISH_HUB; fishWinterBtns() is the
// planner's button (one line in winterModal, 24-career.js). on() (optional) hides a section until it opens: the tender comes later.
var FISH_HUB=typeof FISH_HUB!=='undefined'&&Array.isArray(FISH_HUB)?FISH_HUB:[];
var fishHubList=typeof fishHubList==='function'?fishHubList:function(){return FISH_HUB.filter(x=>!x.on||x.on()).sort((a,b)=>a.order-b.order)};
var fishHubOn=typeof fishHubOn==='function'?fishHubOn:function(){return !!(S&&S.winter&&fishHubList().length)};
var fishWinterBtns=typeof fishWinterBtns==='function'?fishWinterBtns:function(){
  const H=fishHubList();if(!fishHubOn()||!H.length) return [];
  const t=H.map(x=>x.short).join(' · ');
  return [{l:'⚓ Commercial & crab',s:t.charAt(0).toUpperCase()+t.slice(1)+'. Optional, and risky.',fn:()=>fishHubModal()}];
};
var fishHubModal=typeof fishHubModal==='function'?fishHubModal:function(){
  const back=()=>setTimeout(winterModal,0),again=()=>setTimeout(fishHubModal,0),H=fishHubList();
  if(H.length===1) return H[0].open(back);
  modal('⚓ Commercial & crab',`<p style="font-size:13px;color:var(--mute)">Work the water when you are not guiding. Cash ${$(Math.round(S.money))}. ${campDaysLeft()} free day${campDaysLeft()===1?'':'s'} left this winter.</p>`,
    H.map(x=>({l:`${x.ic} ${x.l}`,s:x.s(),fn:()=>x.open(again)})).concat([{l:'Back to the off-season',fn:back}]));
};
FISH_HUB.push({id:'tender',order:4,ic:'⚓',l:'Fish buying & processing',short:'a tender and a plant',on:()=>tenderOn(),
  s:()=>{const st=TND();return Tender.active(st)?`${st.tenders.length} tender${st.tenders.length===1?'':'s'}${st.plant?', your '+st.plant.name:''}${st.loan?`, ${$(st.loan.bal)} owed`:''}.`:'Charter a tender and buy fish from the commercial fleet, then a plant. Big money both ways.'},
  open:back=>{if(!tenderOn()){modal('⚓ Fish buying & processing',`<p>The fleet’s buyers want someone with ${TENDER_UNLOCK} seasons on the water behind them.</p>`,[{l:'Back',fn:()=>back()}]);return}
    Tender.ui.planner(tenderHost(),()=>back())}});
// the fall: what you didn't play, the plant's season, the winter's bills (into the off-season summary, no pop-up of its own)
const _tenderStart=startSeason;
startSeason=function(s){
  const prev=S.reg;
  _tenderStart(s);
  const lines=[];
  if(S.fish&&S.fish.tender&&(S.fish.tender.season||Tender.active(S.fish.tender)||S.fish.tender.loan)){
    const R=prev||REG(),t=tenderTicket({run:{sockeye:R.mult.sockeye,coho:R.mult.coho,pinkEven:(2025+s)%2===0,king:R.king}});
    const rep=tenderApply(Tender.closeSeason(t),true);lines.push(...rep.lines);S.fish.tender.events=rep.events;
  }
  if(S.seasons.length===TENDER_UNLOCK&&!(S.fish&&S.fish.tender&&S.fish.tender.told)){TND().told=true;
    lines.push('⚓ <b>New: fish buying & processing.</b> The commercial fleet needs buyers. Charter a tender, then maybe a plant, from <b>⚓ Commercial & crab</b> below. Optional, and risky.')}
  if(lines.length&&S.winter){S.winter.sup=(S.winter.sup||[]).concat(lines);lines.forEach(l=>say(l))}
};
// spring: the season opens with the bookings
const _tenderFinish=finishWinter;
finishWinter=function(){
  if(S.winter&&tenderHas()){const rep=tenderApply(Tender.openSeason(tenderTicket()),true);rep.lines.forEach(l=>say(l))}
  _tenderFinish();
  tenderNotice();   // the season's first morning can be an opener
};

// ---- the summer ----
const tenderToday=()=>{if(!S||S.winter||!S.fish||!S.fish.tender||!S.fish.tender.season)return null;try{return Tender.openerToday(tenderTicket())}catch(e){return null}};
const _tenderMorning=onMorning;
onMorning=function(d){
  _tenderMorning(d);
  if(S.winter||!S.fish||!S.fish.tender||!S.fish.tender.season) return;
  const st=S.fish.tender;
  if(st.plant){const rep=tenderApply(Tender.plantDay(tenderTicket()),true);if(rep.energyDelta)say(`🏭 A call with the plant manager before coffee: energy ${rep.energyDelta}.`)}
  tenderNotice();
};
function tenderNotice(){
  const op=tenderToday();if(!op) return;
  const A=Tender.data.AREAS,l=`⚓ <b>Opener today</b>, ${op.tenders.map(x=>A[x.area].short).join(' and ')}: your skipper takes the ${op.tenders.map(x=>x.name).join(' and the ')} out unless you run ${op.tenders.length>1?'one':'her'} yourself (Here tab, by ${fmt(TENDER_SELF_BY)}).`;
  say(l);digestLine(l);
}
const _tenderNight=onNight;
onNight=function(where,notes,d){
  _tenderNight(where,notes,d);
  if(!S.fish||!S.fish.tender||!S.fish.tender.season) return;
  if(tenderToday()){const rep=tenderApply(Tender.opener(tenderTicket(),{self:false}),true);rep.lines.forEach(l=>notes.push(l))}
};
// run the tender yourself: a day choice. Your own parties today come first: cancel them, hand them to a guide, or leave the opener to the skipper.
function tenderConflicts(){return todays(day()).filter(b=>!(S.trip&&S.trip.id===b.id))}
function tenderSelf(){
  const bs=tenderConflicts();
  if(bs.length){const b=bs[0],T=TRIPS[b.type],g=typeof canHand==='function'&&canHand(b)&&typeof staffLane==='function'?staffLane(b.d,b.type,null,b):null;
    modal('⚓ You’re booked today',`<p>The ${b.who} (${b.n}) have a ${T.ic} ${T.n.toLowerCase()} with you at ${fmt(T.start)}. Running the tender takes the whole day.</p>`,[
      ...(g!=null?[{l:`Hand them to ${staffName(g)}`,s:'Your guide takes the party; you take the tender.',fn:()=>{bizAssign(b.id,g);tenderSelf()}}]:[]),
      {l:`Cancel on the ${b.who}`,s:`Refund the deposit; reputation −${TENDER_CANCEL_REP}.`,fn:()=>{b.status='cancelled';S.stats.cancelled++;adj('rep',-TENDER_CANCEL_REP);say(`📵 You call the ${b.who} to cancel their ${T.n.toLowerCase()}: the fleet is fishing and your tender needs you. You refund the deposit.`);tenderSelf()}},
      {l:'Let the skipper run the opener',s:'Keep your party.',fn:()=>{}}]);
    return}
  Tender.ui.opener(tenderHost(),rep=>{
    if(!rep) return;
    const end=day()*1440+20*60+30;if(S.t<end)S.t=end;S.loc='shop';   // home by 8:30 PM, after the run to the plant
    sfx(rep.cashDelta>=0?'good':'bad');afterAction();
  });
}
window.tenderSelf=tenderSelf;
const _tenderActions=actionsHere;
actionsHere=function(){
  const a=_tenderActions();
  if(S.winter||S.trip||S.loc!=='shop') return a;
  const op=tenderToday();if(!op) return a;
  const late=tod()>TENDER_SELF_BY,bs=tenderConflicts();
  a.push({ic:'⚓',l:`Run your tender on today’s opener`,s:late?`The boats set at 7 AM: too late to run her yourself today. Your skipper has her.`:`The whole day: you post the price, pick the fish and make the run to the plant. Saves the skipper’s wage; energy −${Tender.data.K.SELF_ENERGY}.${bs.length?` You have ${bs.length} part${bs.length>1?'ies':'y'} booked today.`:''}`,cat:'work',dis:late,fn:()=>tenderSelf()});
  return a;
};

// ---- your own catch from the other commercial modules ----
// tenderRoute({species, lbs, area, day}): null when you have no buyer in that water; otherwise your buyer takes it at your posted price:
// {price, value, line}. The caller pays the player value (the business pays it and keeps the margin in its season's books).
function tenderRoute(dl){
  if(!dl||!S||!S.fish||!S.fish.tender) return null;
  const t=tenderTicket();if(!Tender.buyerIn(t,dl.area)) return null;
  const rep=Tender.route(t,dl);if(!rep.routed) return null;
  S.fish.tender=rep.state;
  return {price:rep.price,value:rep.value,area:rep.area,species:rep.species,line:rep.lines[0]};
}
window.tenderRoute=tenderRoute;
window.tenderBuyerIn=area=>!!(S&&S.fish&&S.fish.tender&&Tender.buyerIn(tenderTicket(),area));

// ---- score and the end screen ----
const _tenderParts=scoreParts;
scoreParts=function(){
  const P=_tenderParts();
  if(!tenderHas()) return P;
  const st=S.fish.tender,v=Tender.value(st),debt=Tender.debt(st),K=Tender.data.K;
  let est=0;if(st.season&&!S.winter){try{est=Tender.estimate(tenderTicket())}catch(e){est=0}}
  if(v) P.push(['Tenders & plant',Math.round(v*K.SCORE),`${Math.round(K.SCORE*10)} tenths of what they’re worth now`]);
  if(est) P.push(['Fish business, rest of summer',est,'estimated: the openers and the plant settle in the fall']);
  if(debt) P.push(['Bank loan',-debt,'what you still owe']);
  return P;
};
const _tenderEnd=endRows;
endRows=function(){
  const rows=_tenderEnd(),st=S.fish&&S.fish.tender;
  if(st&&(st.tot.seasons||Tender.active(st))) rows.push(['Fish business',`${st.tot.seasons} season${st.tot.seasons===1?'':'s'}, ${grp(Math.round(st.tot.lbs))} lb bought over the rail, ${$(Math.round(st.tot.net))} net${st.tot.forced?', sold off once at the dock auction':''}${st.loan?`; ${$(st.loan.bal)} still owed`:''}`]);
  return rows;
};
// ---- the Bookings tab: the business at a glance, during the season ----
{const bt=EXTRA_TABS.find(t=>t.k==='book');if(bt){const v0=bt.view;bt.view=()=>{
  const h=v0();if(S.winter||!S.fish||!S.fish.tender||!S.fish.tender.season) return h;
  try{return h+Tender.ui.tab(tenderTicket())}catch(e){return h}}}}
// ---- bots and tests ----
function tenderBot(policy){return Tender.autoplay(tenderBotHost(),{policy:policy||'processor'})}
window.tenderBot=tenderBot;window.TND=TND;window.tenderTicket=tenderTicket;window.tenderApply=tenderApply;
TIPS.push({id:'tender',when:()=>!!S.winter&&tenderOn()&&!tenderHas(),t:'⚓ The commercial fleet needs buyers. In <b>⚓ Fish buying & processing</b> you can charter a tender for a season and buy fish over the rail. Optional, and it can lose money.'});
// ---------------- boot ----------------
applyPrefs();
titleScreen();
</script>
