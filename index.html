const POOL={reds:['king','snag','over','guide_fish','anchor','combat','motor'],silver:['bait','king','extra_rod','guide_fish','motor'],trout:['bear','photo','combat','guide_fish'],halibut:['size27','crew']};

// ---- the runner ----
function tripStart(b){
  if(boatDown()&&b.type!=='halibut'){say('🔧 The boat is out of service. Get a major repair at the shop first.');return}
  const T=TRIPS[b.type],late=Math.max(0,tod()-T.start),t={id:b.id,late,q:0,happy:0,notes:[],step:0,steps:[],shore:false,nofish:0,kept:0,abort:false,x:[],lost:0};
  if(late){t.happy-=late/3;t.notes.push(`⏰ You rolled in ${late} minutes late. The ${b.who} noticed.`)}
  // tackle and boat condition shape the day before you even leave the dock
  if(S.gear<=0){t.happy-=3;t.notes.push('🪱 You’re out of tackle. The clients fish with whatever is left in the bottom of the box, and they notice.')}
  if(S.boat>=80) t.happy+=2;
  if(S.boat<70&&b.type!=='halibut'&&Math.random()<(70-S.boat)/90){
    const m=60+Math.floor(Math.random()*60);lose(t,m);t.happy-=12;fx(t,-Math.round(payOf(b)*.15),'Breakdown credit');fx(t,-rp(80),'Roadside repair');adj('boat',8);
    t.notes.push(`🔧 Worn-out gear lets you down: ${b.type==='trout'?'an oarlock snaps and the trailer bearing howls':'the jet sled quits on the way out'} and you lose ${m} minutes. You credit the ${b.who} 15% of the fare and pay ${$(rp(80))} for a quick fix. Service the boats at the shop.`);
  }
  if(fuelShort(b)) t.steps.push('fuel');                 // 25-fuel.js
  const iss=issueOf(b);if(iss) t.steps.push('issue_'+iss);
  if(b.type==='reds'&&b.n===5) t.steps.push('five');
  if(b.quirk.includes('nolicense')) t.steps.push('license');
  if(S.cred.fa<day()) t.steps.push('expired');
  t.steps.push('spot');
  const want=S.diff==='hard'?3:2,beats=[],q=b.quirk;
  if(q.includes('drinker')) beats.push('beer');
  if(q.includes('kingfan')&&(b.type==='reds'||b.type==='silver')) beats.push('king');
  if(q.includes('photo')&&b.type==='trout') beats.push('photo');
  if(b.type==='halibut'&&halClosed(b.d)) beats.push('tuewed');
  if(S.boat<25&&TRIPS[b.type].fuel){beats.push('motor');t.q-=.08;t.notes.push('🔧 The neglected jet sled runs rough all day. Service the boats at the shop.')}
  if(q.includes('promised')){t.happy-=15;t.notes.push('👑 They were “promised” a shot at a king. There was never going to be one: the fishery is closed.')}
  const pool=POOL[b.type].filter(x=>!beats.includes(x)&&!(x==='bait'&&!noBait())&&!(x==='size27'&&halClosed(b.d)));
  while(beats.length<want&&pool.length) beats.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  t.steps.push(...beats.slice(0,Math.max(want,beats.length)));
  if(b.type==='silver') t.steps.push('sixpm');
  S.trip=t;sfx('whoosh');tripNext();
}
function tripNext(){
  const t=S.trip;if(!t) return;
  const b=bk(t.id);if(!b||b.status!=='booked'){S.trip=null;return}
  if(t.step>=t.steps.length) return tripEnd(b,t);
  const f=STEP[t.steps[t.step]];if(!f){t.step++;return tripNext()}
  const v=f(b,t),T=TRIPS[b.type];
  const opts=v.o.map((o,k)=>({o,k}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}   // shuffled every showing
  modal(v.t,`<p class="small-note" style="color:var(--mute);margin:0 0 6px">${T.ic} ${T.n} · ${b.who}</p>${v.b}`,opts.map(({o,k})=>({l:o.l,s:o.s,legal:o.legal!==false,np:true,k,fn:()=>{
    const tt=S.trip;if(!tt) return;const bb=bk(tt.id);if(!bb) {S.trip=null;return}
    o.fn&&o.fn(bb,tt);
    if(S.trip&&!tt.abort){tt.step++;tripNext()}}})));
}
// index of the first legal button in the open modal (0 when the buttons aren't dilemma options); for tests and bots
window.legalBtn=()=>{const i=MB.findIndex(b=>b.legal===true);return i<0?0:i};
function tripCancel(b,note){b.status='cancelled';S.stats.cancelled++;S.trip=null;if(note)say(note)}
function tripEnd(b,t){
  const T=TRIPS[b.type],d=day(),r=Math.random;
  let q=.5+t.q+runFactor(b.type)+(WX[S.wx[d]||'sun']||WX.sun).q+(S.prep===d?.08:0)+(S.scout>=d-1&&T.loc==='lower'?.05:0)
    +upQ(b.type)+(S.gear>0?0:-.15)+(S.boat<40?-.1:0)+(S.energy<30?-.1:0)+Math.min(.1,S.skill*.01)+(r()-.5)*.24;
  q=clamp(q,.05,1);
  // fuel: burn from the tank; run dry and the trip ends with a Coast Guard tow
  const ft=tripFuel(b);let towed=false;
  if(ft){const gal=Math.round((ft.gal+(t.fuelx||0)*(ft.tank==='fuel'?fuelMult():1)+(r()-.3)*3*(ft.tank==='fuel'?fuelMult():1))*(1+Math.max(0,wxOf(d).wind-12)/40)*10)/10;
    if(S[ft.tank]>=gal) S[ft.tank]=Math.round((S[ft.tank]-gal)*10)/10;
    else{q*=Math.max(.2,S[ft.tank]/gal);t.happy-=25;towed=true;if(ft.tank==='fuel')towIn(t.notes);else{S.hfuel=0;S.stats.tows=(S.stats.tows||0)+1;money(-HARBOR_TOW);adj('rep',-4);t.notes.push('🛟 The charter boat runs dry off Anchor Point. The Coast Guard tows you into Homer Harbor and the harbormaster brings you to the fuel dock: '+$(HARBOR_TOW)+'.')}}}
  const fishers=Math.max(0,b.n-t.nofish);let fish=0,frac=0,line='',limits=0;
  if(b.type==='reds'||b.type==='silver'){
    const lim=b.type==='reds'?S.limit:2,nm=b.type==='reds'?'red':'silver';
    for(let i=0;i<fishers;i++){const c=clamp(Math.round(lim*q+(r()-.5)*1.6),0,lim);fish+=c;if(c===lim)limits++}
    frac=fishers?fish/(lim*fishers):0;
    if(fishers&&limits===fishers){S.stats.limits++;t.happy+=5}
    line=`${fish} ${nm}${fish===1?'':'s'}${limits?`, ${limits} limit${limits>1?'s':''}`:''}`;
  }else if(b.type==='trout'){
    fish=Math.round(fishers*(2+q*8));frac=q;line=`${fish} trout landed & released`;
  }else{
    frac=q;
    if(halClosed(b.d)){const rk=Math.round(fishers*(1+q*3));line=`${rk} rockfish & lingcod, halibut released`}
    else{for(let i=0;i<fishers;i++)fish+=clamp(Math.round(2*q+(r()-.5)*1.2),0,2);S.stats.halibut+=fish;line=`${fish} halibut`}
  }
  fish+=t.kept;
  // ---- what the day was worth ----
  // The booked fare is the base. A good day (fish, happy clients, a clean boat and tackle) earns bigger tips and word of mouth;
  // a bad one (skunked, out of tackle, a breakdown, grumpy clients) means a partial refund and a bad review.
  const happy=45+frac*45+t.happy+upH(b.type)+DF().mood-RATE_MOOD*rateSteps();
  const fare=towed?Math.round(payOf(b)*.5):payOf(b),base=b.type==='halibut'&&!S.up.chp?1200:fare;
  const tip=Math.round(base*clamp((happy-62)/130,0,.3));
  const skunk=fishers>0&&fish-t.kept<=0&&b.type!=='trout'&&!(b.type==='halibut'&&halClosed(b.d));
  const refundPct=clamp((42-happy)/200,0,.25)+(skunk?.05:0),refund=Math.round(fare*refundPct);
  const xs=(t.x||[]),xnet=xs.reduce((a,[,v])=>a+v,0),xpos=xs.reduce((a,[,v])=>a+Math.max(0,v),0),xneg=xs.reduce((a,[,v])=>a+Math.min(0,v),0);
  let dRep=clamp(Math.round((happy-50)/8),-6,8);const review=happy<35;if(review) dRep-=2;
  S.wom=(S.wom||0)+(happy>=96?2:happy>=88?1:happy<30?-2:happy<40?-1:0);
  const costs=T.loc==='lower'&&!S.up.dock?LAUNCH_FEE:0;
  if(r()<.07&&b.type!=='halibut'){money(-165);S.stats.spent+=165;t.notes.push('🎣 A client high-sticks a rod into the gunwale. Snap. $165 for a new rod and reel.')}
  S.gear=Math.max(0,S.gear-1);
  const lost=t.lost||0;
  pass((towed?T.len+120:T.len-sledTimeSaved(b.type))+lost);if(towed&&ft.tank==='fuel')S.loc='harbor';adj('energy',-T.energy+(sledTimeSaved(b.type)?3:0)-Math.round(lost/20));adj('boat',-Math.round((3+Math.floor(r()*4))*(S.up.motor?.5:1)*DF().wear));adj('rep',dRep);
  if(boatDown()&&b.type!=='halibut')t.notes.push('🔧 The boat is out of service: you can’t launch again until you pay for a major repair at the shop.');
  money(fare-refund+tip+xnet-costs);
  const st=S.stats;st.trips++;st.clients+=b.n;st.fish+=fish;st.earned+=fare-refund;st.tips+=tip+xpos;st.spent+=costs-xneg;
  S.unlogged++;S.skill++;
  const net=fare-refund+tip+xnet-costs;
  b.status='done';b.out={happy:Math.round(happy),fish,line,fare,refund,tip,net};S.trip=null;
  say(`${T.ic} ${T.n} with the ${b.who}: ${line}. Paid ${$(fare-refund)} + ${$(tip+xpos)} in tips.`);
  const mood=happy>=82?'😁 Five stars, and they’re already asking about next July. Word of mouth will bring you more bookings.':happy>=65?'🙂 Solid day. Handshakes at the trailer.':happy>=45?'😐 Polite thanks, small tip.':review?'😠 Tight-lipped goodbyes and a one-star review. Word gets around the Kenai.':'😕 They leave a little deflated.';
  const row=(l,v)=>`<br>${l}: <b>${v>=0?'':'−'}${$(Math.abs(v))}</b>`;
  const why=[];if(skunk)why.push('skunked');if(S.gear<=0&&t.notes.some(n=>n.startsWith('🪱')))why.push('no tackle');if(refund&&happy<42)why.push('unhappy clients');
  modal(`${T.ic} Back at the dock`,`${t.notes.map(n=>`<p>${n}</p>`).join('')}
    <p><b>Catch:</b> ${line}${t.kept?` (${t.kept} kept on the sly)`:''}${lost?` · ${lost} minutes lost`:''}</p>
    ${towed?'<p>🛟 <b>Towed in.</b> Half the fare refunded.</p>':''}<p><b>The pay:</b>${row(`Booked fare${b.type==='halibut'&&!S.up.chp?' (day rate)':''}`,fare)}${refund?row(`Refund${why.length?` (${why.join(', ')})`:''}`,-refund):''}${row('Tip',tip)}${xs.map(([l,v])=>row(l,v)).join('')}${costs?row('Launch fee',-costs):''}<br><b>Net: ${net<0?'−':''}${$(Math.abs(net))}</b></p>
    <p>${mood} Rep ${dRep>=0?'+':'−'}${Math.abs(dRep)}.</p>
    <p style="font-size:13px;color:var(--mute)">📓 Log it in your ADF&amp;G logbook before bed.</p>`,[{l:'Head in',fn:()=>{}}]);
  sfx(happy>=50?'good':'bad');
}
// ============================================================
//  GUIDE MASTER, part 4: the fish.
//  Run timing for each species by date, daily weather and river level, Cook Inlet tides
//  and time-of-day bites. These drive trip quality, the sonar count, dipnetting and
//  "Take the boat out" (solo fishing when the boat isn't booked).
//
//  Run timing is a simplified model of typical Kenai returns, not a forecast:
//    late-run sockeye: enter mid-July, peak at the sonar around Jul 20–25, reach the upper river ~2 weeks later
//    coho: first fish late July, peak mid-August        pinks: even years only, peak early-to-mid August
//    late-run kings: peak late July (closed in 2026; later seasons vary)     rainbows/Dollies: resident, better as sockeye spawn
//    halibut: on the shallower summer grounds from late spring through September
// ============================================================
// doyOf(d), evenYear(d), seasonOf(d): 24-career.js. Each season's REG().mult/shift scale and move the runs.
const gauss=(x,c,s)=>Math.exp(-Math.pow((x-c)/s,2)/2);

// loc: where it can be fished and how good that water is for it (0–1). lag: days behind the sonar at river mile 19.
const SPECIES={
  sockeye:{n:'Sockeye',ic:'🐟',keep:true,lim:()=>S.limit,rate:1.2,loc:{lower:1,cooper:.6,kbeach:1},lag:{cooper:12},
           curve:x=>.08+.92*gauss(x,202,7)+.25*gauss(x,176,8),note:'Late run peaks at the sonar around Jul 20–25.'},
  coho:   {n:'Coho (silvers)',ic:'🎣',keep:true,lim:()=>2,rate:.6,loc:{lower:1,cooper:.15},lag:{cooper:20},
           curve:x=>gauss(x,228,12),note:'First silvers in late July; the run peaks mid-August.'},
  pink:   {n:'Pinks (humpies)',ic:'🩷',keep:true,lim:()=>6,rate:1.6,loc:{lower:1},
           curve:x=>gauss(x,222,7),note:'Even years only: in even Augusts the river floods with them.'},
  king:   {n:'King',ic:'👑',closed:true,lim:()=>1,rate:.15,loc:{lower:1,cooper:.2},
           curve:x=>.35*gauss(x,205,9),note:'Late run peaks in late July. Open, catch-and-release or closed, year to year: see Regs.'},
  trout:  {n:'Rainbow trout',ic:'🌈',cr:true,rate:2.4,loc:{cooper:1,lower:.3},
           curve:x=>.45+.4*gauss(x,225,15),note:'Resident fish. Get better as the sockeye spawn and the bead bite starts.'},
  dolly:  {n:'Dolly Varden',ic:'🐠',cr:true,rate:2,loc:{cooper:.85,lower:.3},
           curve:x=>.4+.4*gauss(x,220,15),note:'Follow the salmon; eat eggs and flesh.'},
  halibut:{n:'Halibut',ic:'🫓',keep:true,lim:()=>2,rate:.9,loc:{homer:1},
           curve:x=>.55+.35*gauss(x,196,35),note:'On the summer grounds. Fish the slack tide.'},
};

// ---- weather: generated each morning by rollDay() ----
function rollWeather(d){
  const k=S.wx[d]||'sun',r=(a,b)=>a+Math.random()*(b-a);
  const w={temp:Math.round({sun:r(66,76),cloud:r(57,65),rain:r(51,58),wind:r(56,64)}[k]),
    wind:Math.round({sun:r(3,10),cloud:r(5,12),rain:r(8,16),wind:r(18,28)}[k]),
    dir:pick(['N','NE','SE','S','SW','W','NW']),rain:k==='rain'?Math.round(r(.3,.9)*10)/10:0};
  // the Kenai is glacial: hot days melt ice and raise it, rain raises it, then it recedes
  const before=S.water??.5;
  S.water=clamp(before+w.rain*.35+(w.temp>=68?.06:0)-.07,.1,1);
  w.dw=Math.round((S.water-before)*100)/100;w.level=S.water;
  S.wxd[d]=w;
}
const wxOf=d=>S.wxd[d]||{temp:62,wind:8,dir:'SW',rain:0,dw:0,level:.5};
const waterTxt=w=>`${w.level>.75?'high':w.level<.3?'low':'normal'}, ${w.dw>.05?'rising':w.dw<-.04?'dropping':'steady'}`;
function windRisk(d=day()){return clamp(wxOf(d).wind/12,.5,2.2)}   // scales Skilak / Cook Inlet weather risks

// ---- tides at the mouth of the Kenai (semi-diurnal, spring/neap cycle). Heights in feet, roughly MLLW. ----
function tide(t){
  const amp=8+3.5*Math.cos(2*Math.PI*(t/1440)/14.77);
  const ph=2*Math.PI*(t-210)/745;
  return {h:10.5+amp*Math.cos(ph),rate:-Math.sin(ph),amp};
}
function tideTable(d=day()){
  const out=[];let p=tide(d*1440-5).h,c=tide(d*1440).h;
  for(let m=5;m<=1440;m+=5){const n=tide(d*1440+m).h;
    if(c>p&&c>=n) out.push({hi:true,m:m-5,h:c});else if(c<p&&c<=n) out.push({hi:false,m:m-5,h:c});p=c;c=n}
  return out;
}
const tideNow=(t=S.t)=>{const x=tide(t);return `${x.rate>.25?'flooding (incoming)':x.rate<-.25?'ebbing (outgoing)':x.h>14?'high slack':'low slack'}, ${x.h.toFixed(1)} ft`};

// ---- how good the fishing is: species × place × moment ----
function todFactor(sp,loc,t){
  const m=((t%1440)+1440)%1440,x=tide(t);
  if(loc==='kbeach') return .7+.35*(x.h-10.5+x.amp)/(2*x.amp)+(x.rate>0?.15:0);       // reds ride the incoming tide
  if(sp==='halibut') return 1.15-.35*Math.abs(x.rate);                               // slack tide
  const dawn=m>=300&&m<540,eve=m>=1080&&m<1320,night=m<300||m>=1320;
  if(sp==='sockeye') return dawn?1.15:eve?1.05:night?.8:.9;                           // midday sun + crowds
  if(sp==='coho'||sp==='king') return dawn?1.2:eve?1.05:night?.7:.85;
  if(sp==='trout'||sp==='dolly') return dawn||eve?1.1:.95;
  return 1;
}
function wxFactor(sp,loc,d){
  const w=wxOf(d),k=S.wx[d]||'sun';let f=1;
  if(loc==='lower'&&(sp==='sockeye'||sp==='pink')) f*=w.dw>.08?.88:1;                  // rising, dirty water scatters reds
  if(sp==='coho') f*=k==='rain'?1.08:1;                                              // fresh water pushes silvers in
  if(sp==='trout'||sp==='dolly') f*=(k==='cloud'||k==='rain'?1.08:k==='sun'?.94:1)*(w.level>.75?.88:1);
  if(sp==='halibut') f*=w.wind>18?.6:w.wind>12?.85:1;
  return f;
}
// this season's run size and timing for a species on a day (before place and daily noise)
function runCurve(sp,x,d){
  const R=REG(),m=R.mult[sp]??1,sh=(sp==='sockeye'||sp==='coho')?R.shift:0;
  return SPECIES[sp].curve(x-sh)*(sp==='pink'?(evenYear(d)?1:.05):1)*(sp==='sockeye'||sp==='coho'||sp==='king'?m:1);
}
function abundance(sp,loc,d=day()){
  const S_=SPECIES[sp],lw=S_&&S_.loc[loc];if(!lw)return 0;
  const lag=(S_.lag&&S_.lag[loc])||0,nz=(S.noise[d]&&S.noise[d][sp])||1;
  return clamp(runCurve(sp,doyOf(d)-lag,d)*nz*lw,0,1.3);
}
function fishOdds(sp,loc,t=S.t){const d=Math.floor(t/1440);return clamp(abundance(sp,loc,d)*todFactor(sp,loc,t)*wxFactor(sp,loc,d),0,1.4)}
function avgOdds(sp,loc,t0,mins){let s=0,n=0;for(let m=0;m<=mins;m+=30){s+=fishOdds(sp,loc,t0+m);n++}return s/n}

// runFactor() (used by trips): how this trip's water compares to a typical July trip
const TRIP_SP={reds:['sockeye','lower',.6],silver:['coho','lower',.15],trout:['trout','cooper',.6],halibut:['halibut','homer',.75]};
function runFactor(type,d=day()){
  const [sp,loc,center]=TRIP_SP[type]||TRIP_SP.reds,T=TRIPS[type];
  return clamp((avgOdds(sp,loc,d*1440+T.start,T.len)/center-1)*.15,-.15,.15);
}
// daily run noise + sonar count; called from rollDay()
function rollRun(d){
  const nz={};Object.keys(SPECIES).forEach(k=>nz[k]=Math.round((.7+Math.random()*.6)*100)/100);
  S.noise[d]=nz;
  return Math.round(runCurve('sockeye',doyOf(d),d)*nz.sockeye*230000/10)*10+Math.floor(Math.random()*10);
}

// ---- 🚤 Take the boat out: booking-aware ----
// Returns the action for the Here tab at the lower launch or Cooper Landing (null elsewhere).
function boatAction(){
  if(S.loc!=='lower'&&S.loc!=='cooper') return null;
  const d=day(),m=tod(),boat=S.loc==='lower'?'jet sled':'drift boat';
  if(boatDown()) return {ic:'🚤',l:`Take the ${boat} out`,s:'Out of service at condition 0. Get a major repair at the shop first.',cat:'fish',dis:true,fn:()=>{}};
  const pend=todays(d).map(b=>({b,T:TRIPS[b.type]})).filter(x=>m<=x.T.start+90).sort((a,b)=>a.T.start-b.T.start)[0];
  let max=Math.max(0,(S.loc==='lower'?1080:1320)-m),why='';
  if(pend){
    const {b,T}=pend,here=T.loc===S.loc;
    if(here&&m>=T.start-60) return {ic:'🚤',l:'Take the boat out',s:`It’s booked: the ${b.who} are on the dock. Launch their trip instead.`,cat:'fish',dis:true,fn:()=>{}};
    const free=T.start-60-m-(here?0:travelMins(S.loc,T.loc));
    max=Math.min(max,free);why=` Back by ${fmt(T.start-60-(here?0:travelMins(S.loc,T.loc)))} for the ${b.who}.`;
  }
  if(max<120) return {ic:'🚤',l:'Take the boat out',s:pend?`Not enough time before your ${TRIPS[pend.b.type].n} with the ${pend.b.who} at ${fmt(pend.T.start)}.`:S.loc==='lower'?'Guide-vessel fishing below Skilak ends at 6 PM.':'Too late in the day to float.',cat:'fish',dis:true,fn:()=>{}};
  return {ic:'🚤',l:`Take the ${boat} out`,s:`No clients: fish for your freezer and scout the water. Up to ${Math.floor(max/60)} h.${why}${S.loc==='lower'?` Tank: ${Math.round(S.fuel)} gal (~${bn('soloHour')}/hour).`:''}`,cat:'fish',fn:()=>boatOut(max)};
}
function boatOut(max){
  const d=day(),m=tod(),loc=S.loc;
  if(loc==='lower'){
    if(isSunMon(d)) return modal('🚫 Your sled is a registered guide vessel',`<p>From May 1 to July 31, nobody may sport fish from a <b>registered guide vessel</b> on the Kenai below Skilak Lake on Sundays or Mondays, with or without clients. Today is ${dayName(d)}.</p><p style="font-size:13px;color:var(--mute)">You can still fish from the bank, or float the upper river from Cooper Landing.</p>`,[
      {l:'Fish from the bank instead',s:'The Flip for reds action, right here.',fn:()=>{}},
      {l:'Run it anyway. You’re alone; who’d know?',s:'Everyone on the Kenai knows your boat number.',fn:()=>{violate(null,{p:.45,fine:400,what:'fishing from a registered guide vessel on a closed day'});boatSpecies(max,true)}}]);
    if(m<360) return modal('⏰ Too early',`<p>Fishing from a registered guide vessel below Skilak is 6 AM–6 PM through July 31. It’s ${fmt(S.t)}.</p>`,[{l:'Wait at the launch until 6:00',s:`${360-m} min.`,fn:()=>{pass(360-m);boatSpecies(Math.min(max,1080-360))}},{l:'Never mind',fn:()=>{}}]);
  }
  boatSpecies(max);
}
function boatSpecies(max,illegal){
  const loc=S.loc,t=S.t,list=Object.keys(SPECIES).filter(k=>SPECIES[k].loc[loc]);
  const bar=o=>`<span style="display:inline-block;width:60px;height:7px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px"><i style="display:block;height:7px;border-radius:4px;width:${Math.round(clamp(o,0,1)*100)}%;background:${o>.6?'#2f7d4f':o>.3?'#c98a12':'#b8402a'}"></i></span>`;
  const w=wxOf(day()),k=WX[S.wx[day()]||'sun'];
  modal(`${loc==='lower'?'🚤 Lower Kenai':'🛶 Upper Kenai float'}: what are you after?`,
    `<p style="font-size:13px;color:var(--mute)">${k.ic} ${w.temp}°F, wind ${w.dir} ${w.wind} kt · river ${waterTxt(w)}${loc==='lower'?' · one unbaited, single-hook lure (EO)':' · rainbows catch-and-release'}</p>`,
    list.map(sp=>{const S_=SPECIES[sp],o=avgOdds(sp,loc,t,120);
      const shut=S_.closed&&kingRule()!=='open';return {l:`${S_.ic} ${S_.n}${S_.closed?` (${{closed:'closed',cr:'catch-and-release',open:'open'}[kingRule()]})`:''}`,s:shut?`You can’t target kings this year. ${S_.note}`:`${bar(o)}${o>.75?'Hot':o>.45?'Fair':o>.2?'Slow':S_.cr?(S_.loc[loc]<.5?'Few in this stretch: better on the upper river':'Tough today'):'Hardly any yet'}. ${S_.note}`,dis:shut,fn:()=>boatHours(sp,max,illegal)}}).concat([{l:'Never mind',fn:()=>{}}]));
}
function boatHours(sp,max,illegal){
  const opts=[2,4,6].filter(h=>h*60<=max);
  modal(`${SPECIES[sp].ic} How long?`,`<p>${S.loc==='lower'?`About ${bn('soloHour')} gallons an hour from your tank (${Math.round(S.fuel)} gal), plus the ${$(LAUNCH_FEE)} launch fee. Run dry and the Coast Guard tows you in.`:`Drift boat, no motor on this stretch. Shuttle back from Jim’s Landing: ${$(35)}.`} You’ll learn where fish are holding for your next trips.</p>`,
    opts.map(h=>({l:`${h} hours`,s:`Back at ${fmt(S.t+h*60+20)}.`,fn:()=>boatFish(sp,h,illegal)})).concat([{l:'Never mind',fn:()=>{}}]));
}
function boatFish(sp,h,illegal){
  const loc=S.loc,t0=S.t,S_=SPECIES[sp],cost=loc==='lower'?LAUNCH_FEE:35;
  spend(cost);const got=loc==='lower'?burnSolo(bn('soloHour')*h):1;const o=avgOdds(sp,loc,t0,h*60)*got;if(got<1)h=Math.max(1,Math.round(h*got));else pass(h*60+20);adj('energy',-4*h);adj('boat',loc==='lower'?-2:-1);
  S.skill++;S.scout=day();S.solo[day()]=(S.solo[day()]||0)+1;
  const lines=[],rnd=()=>.6+Math.random()*.8;
  let n=Math.round(o*S_.rate*h*rnd());
  if(sp==='king'){n=Math.min(1,n);if(n){S.freezer+=1;S.stats.legalKings=(S.stats.legalKings||0)+1;lines.push('👑 A legal king, recorded on your harvest record. Kings are open this year.')}else lines.push('👑 No king today. They’re the fish of ten thousand casts.')}
  else if(S_.keep){const lim=S_.lim(),room=sp==='halibut'?lim:Math.max(0,lim);n=Math.min(n,room);if(n>=lim)lines.push(`🎯 Limit: ${lim}. Bag limits are per day, so you reel up and run home.`);
    if(n){S.freezer+=n;lines.push(`🧊 ${n} ${S_.n.toLowerCase()} for the freezer, every one hooked in the mouth.`)}else lines.push(`😶 ${h} hours and no ${S_.n.toLowerCase()} kept. ${o<.3?'The run isn’t here yet.':'Some days are like that.'}`)}
  else{lines.push(n?`${S_.ic} ${n} ${S_.n.toLowerCase()} to hand, photographed wet and released.`:`${S_.ic} Nothing to hand. Pretty river, though.`)}
  // incidental king hookups (closed: release in the water)
  const kings=sp!=='king'&&kingRule()!=='open'&&loc==='lower'&&Math.random()<avgOdds('king',loc,t0,h*60)*.25*h?1:0;
  if(kings){S.stats.kings++;lines.push('👑 A bright king smashes your lure. Kings are closed: you slip the hook without lifting it from the water and watch it swim off.')}
  // what you learned
  const best=Object.keys(SPECIES).filter(k=>SPECIES[k].loc[loc]&&!SPECIES[k].closed).map(k=>[k,avgOdds(k,loc,(day()+1)*1440+360,360)]).sort((a,b)=>b[1]-a[1])[0];
  if(best) lines.push(`🔭 Scouting note: tomorrow morning looks best for ${SPECIES[best[0]].n.toLowerCase()} here. Your next trip gets a boost.`);
  if(illegal) lines.push('🚫 You fished from a guide vessel on a closed day.');
  say(`${loc==='lower'?'🚤':'🛶'} ${h} hours on the ${loc==='lower'?'lower Kenai':'upper Kenai'}. `+lines.join(' '));
  sfx(n?'good':'info');
}

// ---- 🐟 Fish tab: conditions, tides, odds by place, run timing ----
function fishView(){
  const d=day(),w=wxOf(d),k=WX[S.wx[d]||'sun'],tt=tideTable(d);
  const row=(a,b)=>`<div class="kv" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><span>${a}</span><b style="text-align:right">${b}</b></div>`;
  let h=`<div class="sect">Today · ${dlong(d)}</div>`+row('Weather',`${k.ic} ${k.n}, ${w.temp}°F`)+row('Wind',`${w.dir} ${w.wind} kt${w.wind>18?' · small-craft advisory on Cook Inlet':''}`)+
    row('Rain',w.rain?`${w.rain} in`:'none')+row('Kenai River',waterTxt(w)+(w.level>.75?' · milky, fast':''))+row('Tide at the mouth now',tideNow())+
    row('Tides today',tt.map(x=>`${x.hi?'▲':'▼'} ${fmt(x.m)} ${x.h.toFixed(1)}′`).join(' · '));
  const places=[['lower','🚤 Lower Kenai'],['cooper','🏔️ Upper Kenai'],['kbeach','🥅 Kenai mouth (dipnet)'],['homer','⚓ Kachemak Bay']];
  h+=`<div class="sect">Odds right now</div>`;
  places.forEach(([loc,n])=>{const sp=Object.keys(SPECIES).filter(x=>SPECIES[x].loc[loc]);
    h+=`<div class="todo"><span class="ck">${n.split(' ')[0]}</span><div style="flex:1"><b>${n.slice(n.indexOf(' ')+1)}</b>${sp.map(x=>{const o=fishOdds(x,loc);return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-top:3px"><span style="width:118px">${SPECIES[x].ic} ${SPECIES[x].n}</span><span style="flex:1;height:7px;background:var(--line);border-radius:4px"><i style="display:block;height:7px;border-radius:4px;width:${Math.round(clamp(o,0,1)*100)}%;background:${SPECIES[x].closed&&kingRule()!=='open'?'#9aa':o>.6?'#2f7d4f':o>.3?'#c98a12':'#b8402a'}"></i></span></div>`}).join('')}</div></div>`});
  h+=`<div class="sect">Run timing on the Kenai · ${yearOf(d)}</div><div class="rules" style="margin:0 0 8px">📣 ${REG().fc} ${evenYear(d)?'Even year: pinks coming.':'Odd year: few pinks.'}</div>${runChart(d)}<div class="rules" style="font-size:12.5px">${['sockeye','coho','pink','king','trout'].map(x=>`${SPECIES[x].ic} <b>${SPECIES[x].n}</b>: ${SPECIES[x].note}`).join('<br>')}<br>⏱️ Reds bite best at first light and in the long July evenings; at the mouth they ride the incoming tide. Halibut bite at slack water. Rain and glacial melt raise the river; rising, dirty water scatters the reds.<br><span style="color:var(--mute)">A simplified model of typical run timing, not a forecast.</span></div>`;
  return h;
}
function runChart(d){
  const x0=166,x1=258,W=440,H=130,X=x=>20+(x-x0)/(x1-x0)*(W-30),Y=v=>H-18-v*(H-34);
  const series=[['sockeye','#c0392b',x=>runCurve('sockeye',x,d)/1.4],['coho','#2c6e9e',x=>runCurve('coho',x,d)/1.4],['pink','#d36ba6',x=>runCurve('pink',x,d)],['king','#7a7a7a',x=>runCurve('king',x,d)/.35*.4]],w0=doyOf(seasonFirst(seasonOf(d)));
  const path=f=>{let p='';for(let x=x0;x<=x1;x+=2)p+=(p?'L':'M')+X(x).toFixed(1)+' '+Y(clamp(f(x),0,1)).toFixed(1);return p};
  const months=[[166,'Jun 15'],[182,'Jul 1'],[213,'Aug 1'],[244,'Sep 1']];

    <rect x="${X(w0)}" y="8" width="${X(w0+13)-X(w0)}" height="${H-26}" fill="#1f5d63" opacity=".08"/><text x="${X(w0+6.5)}" y="18" text-anchor="middle" font-size="9" fill="#1f5d63" font-family="DM Sans">your 2 weeks · ${yearOf(d)}</text>
    <line x1="${X(doyOf(d))}" x2="${X(doyOf(d))}" y1="8" y2="${H-18}" stroke="#e3642e" stroke-width="2"/>
    ${months.map(([x,l])=>`<line x1="${X(x)}" x2="${X(x)}" y1="${H-18}" y2="${H-14}" stroke="#999"/><text x="${X(x)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#6b7478" font-family="DM Sans">${l}</text>`).join('')}
    <line x1="20" x2="${W-10}" y1="${H-18}" y2="${H-18}" stroke="#ccc"/>
    ${series.map(([n,c,f])=>`<path d="${path(f)}" fill="none" stroke="${c}" stroke-width="2"${n==='king'?' stroke-dasharray="4 3"':''}/>`).join('')}
  </svg><div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute);margin:6px 2px 0">${series.map(([n,c])=>`<span><i style="display:inline-block;width:12px;height:3px;background:${c};vertical-align:middle;margin-right:4px"></i>${SPECIES[n].n}</span>`).join('')}<span><i style="display:inline-block;width:2px;height:10px;background:#e3642e;vertical-align:middle;margin-right:4px"></i>today</span></div>`;
}
EXTRA_TABS.splice(1,0,{k:'fish',ic:'🐟',l:'Fish',view:()=>fishView()});
// ============================================================
//  GUIDE MASTER, part 5: the career.
//  A career is 2, 5 or 10 seasons. Each season you play the two-week July peak
//  (Monday to Sunday, starting on the Monday nearest July 13); the rest of the year is the off-season:
//  a recap, license and permit renewals, next year's forecast and rule changes, upgrades and new bookings.
//
//  Day indexes stay continuous across seasons (S.cur 0..14×years−1), so the engine needs no changes
//  beyond GAME.days (a getter in 00-game.js) and the HUD hook hudDay().
// ============================================================
const SEASON=14;
const CAREERS={2:{n:'2-year career',ic:'🎣',d:'Two Julys on the Kenai. A taste of the guiding life.'},
  5:{n:'5-year career',ic:'🛶',d:'Build a business: upgrade boats, raise your rates, ride out good runs and bad.'},
  10:{n:'10-year career',ic:'🏔️',d:'A decade on the river. King closures come and go, permits expire, the river changes.'}};
const seasonOf=d=>Math.floor(d/SEASON);
const sday=d=>d-seasonOf(d)*SEASON;                         // day within the season, 0 = Monday
const yearOf=d=>2026+seasonOf(d);
const seasonFirst=(s=seasonOf(day()))=>s*SEASON;
const isLastSeason=(d=day())=>seasonOf(d)>=S.years-1;
// the Monday nearest July 13 of a year, as a UTC date
function seasonStartUTC(y){const t=Date.UTC(y,6,13),w=new Date(t).getUTCDay();let off=(1-w+7)%7;if(off>3)off-=7;return t+off*864e5}
const dateOf=d=>new Date(seasonStartUTC(yearOf(d))+sday(d)*864e5);
const MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dlabel=d=>{const x=dateOf(d);return `${dayName(d).slice(0,3)} ${MONTH[x.getUTCMonth()].slice(0,3)} ${x.getUTCDate()}`};
const dlong=d=>{const x=dateOf(d);return `${dayName(d)}, ${MONTH[x.getUTCMonth()]} ${x.getUTCDate()}`};
const dlongY=d=>`${dlong(d)}, ${yearOf(d)}`;
const isSunMon=d=>{const w=((d%7)+7)%7;return w===6||w===0};   // DAYS starts on Monday; seasons are whole weeks
function doyOf(d){const x=dateOf(d);return Math.round((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5)+1}
const evenYear=d=>yearOf(d)%2===0;
function hudDay(d){return `Season ${seasonOf(d)+1}/${S.years} · ${dlabel(d)}, ${yearOf(d)}`}

// ---- the rules and the runs change every season ----
// Season 1 is 2026 as it really is. Later seasons are invented: forecasts vary, kings may reopen,
// halibut charter rules shift with the allocation. (A game, not a prediction.)
function genRegs(s){
  if(s===0) return {year:2026,king:'closed',hal:{size:27,closed:[1,2]},mult:{sockeye:1,coho:1,king:1},shift:0,
    fc:'Late-run sockeye forecast: about average. Kenai kings: closed all season (stock of concern).'};
  const r=Math.random,sock=Math.round((.6+r()*.8)*100)/100,coho=Math.round((.6+r()*.8)*100)/100;
  const kr=r(),king=kr<.45?'closed':kr<.75?'cr':'open';
  const hal={size:pick([26,27,28,30,32]),closed:pick([[1,2],[1,2],[2],[1],[]])};
  const w=x=>x>=1.2?'strong':x>=.95?'about average':x>=.75?'below average':'weak';
  return {year:2026+s,king,hal,mult:{sockeye:sock,coho,king:king==='open'?1.6:king==='cr'?1:.8},shift:Math.round((r()-.5)*8),
    fc:`Late-run sockeye forecast: ${w(sock)}. Coho: ${w(coho)}. Kenai kings: ${{closed:'closed all season',cr:'catch-and-release only',open:'open: 1 per day, 20 inches or longer'}[king]}.`};
}
const REG=()=>S.reg||genRegs(0);
const kingRule=()=>REG().king;                              // 'closed' | 'cr' (catch-and-release) | 'open'
const noBait=()=>REG().king!=='open';                        // single-hook, no-bait EO rides along with king restrictions
const halSize=()=>REG().hal.size;
const halClosed=d=>REG().hal.closed.includes(((d%7)+7)%7);
const halDaysTxt=()=>{const c=REG().hal.closed;return c.length?c.map(i=>DAYS[i]+'s').join(' and '):'none this year'};
function kingRuleTxt(){return {closed:`Closed in ${REG().year} by emergency order, including catch-and-release. A king hooked by accident is released right away, without lifting it from the water.`,
  cr:`Catch-and-release only in ${REG().year}. Kings may not be kept, and big kings may not be removed from the water.`,
  open:`Open in ${REG().year}: 1 per day, 20 inches or longer, recorded on your harvest record right away.`}[kingRule()]}
function gearRuleTxt(){return noBait()?'Below Skilak, Jun 20–Aug 15: one unbaited, single-hook artificial lure. No bait, no treble hooks.':'Bait and multiple hooks allowed below Skilak this year (kings are open). Single hooks still kinder to release fish.'}
// first-aid/CPR: a card lasts two years
const faDue=(d=day())=>S.cred.fa<(seasonOf(d)+1)*SEASON;     // expires before this season ends
const faRenewTo=(d=day())=>(seasonOf(d)+2)*SEASON+2;         // the Wednesday of the season two years on

// ---- the rest of the summer (June, August, September), settled in the off-season ----
// You play the two-week July peak; the rest of your season is booked off your reputation.
function restOfSeason(p){
  if(!p||!p.trips) return {trips:0,gross:0,costs:0,net:0};
  const trips=Math.round(p.trips*2.4*DF().book*clamp(S.rep/70,.5,1.25)*(1+clamp((p.wom||0)*.005,-.06,.08))*rateDemand()*(S.up&&S.up.lodge?1.1:1)*(S.up&&S.up.dock?1.08:1)),fare=p.fares/p.trips;
  let gross=Math.round(trips*fare),costs=Math.round(trips*(bn('reds')*fuelPrice('kenai')+LAUNCH_FEE+30));
  if(S.up&&S.up.asst){const x=Math.round(trips*.2);gross+=Math.round(x*fare*(1-ASST_CUT));costs+=Math.round(x*(bn('reds')*fuelPrice('kenai')+LAUNCH_FEE+30))}   // the assistant covers the off-month overflow
  if(S.up&&S.up.lodge){const l=lodgeSeason();gross+=l.gross;costs+=l.costs}
  return {trips,gross,costs,net:gross-costs};
}
function driftFuelPrices(){const r=Math.random;S.fuelBase=S.fuelBase||{kenai:6.19,homer:6.45};
  const f=1+(r()-.4)*.12;S.fuelBase.kenai=Math.round(S.fuelBase.kenai*f*100)/100;S.fuelBase.homer=Math.round(S.fuelBase.homer*f*100)/100}

//  GUIDE MASTER: 💬 player feedback, emailed to the developer through Formspree.
//  The game POSTs JSON to the form endpoint; Formspree emails it with the subject below.
//  Only the form ID lives in this public code, never an email address.
//  Offline or unreachable → the message is queued in localStorage and sent when the game is online again.
// ============================================================
const FEEDBACK={
  formId:'mdeeqzbq',                            // Formspree form: https://formspree.io/f/mdeeqzbq
  subject:'Guide Master Feedback',
  maxLen:4000,
  qKey:()=>`${GAME.id}.feedbackQueue`,
};
const fbEndpoint=()=>FEEDBACK.formId?`https://formspree.io/f/${FEEDBACK.formId}`:'';
const FB_KINDS=['💡 Idea','🐞 Bug','📖 A rule or fact is wrong','👍 Love it','💬 Other'];
let FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};      // the open form's draft (inputs write here as you type)

function fbContext(){
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const c={version:APP_VERSION,app:standalone?'installed app':'browser',screen:`${screen.width}×${screen.height}`,device:navigator.userAgent.slice(0,160)};
  if(typeof S!=='undefined'&&S&&!S.over&&S.cur!=null){Object.assign(c,{career:`${S.years}-year, season ${seasonOf(S.cur)+1}`,day:`${dlongY(S.cur)} ${fmt(S.t)}`,difficulty:S.diff,location:(L[S.loc]||{}).name,cash:Math.round(S.money),rep:S.rep,trips:S.stats.trips})}
  return c;
}
function fbQueue(){try{return JSON.parse(localStorage.getItem(FEEDBACK.qKey())||'[]')}catch(e){return []}}
function fbSetQueue(q){try{localStorage.setItem(FEEDBACK.qKey(),JSON.stringify(q.slice(-10)))}catch(e){}}
// POST one message. Resolves 'sent' | 'queue' (network trouble: try later) | 'rejected' (Formspree said no).
async function fbPost(item){
  if(!fbEndpoint()) return 'queue';
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,timer=setTimeout(()=>ctl&&ctl.abort(),12000);
  try{
    const r=await fetch(fbEndpoint(),{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(item),signal:ctl&&ctl.signal});
    if(r.ok) return 'sent';
    return r.status===429||r.status>=500?'queue':'rejected';
  }catch(e){return 'queue'}finally{clearTimeout(timer)}
}
async function fbFlush(){
  const q=fbQueue();if(!q.length||!fbEndpoint()||(navigator.onLine===false))return;
  const left=[];for(const it of q){const r=await fbPost(it);if(r==='queue')left.push(it)}
  fbSetQueue(left);
  if(left.length<q.length&&typeof showTile==='function') showTile('💬','Feedback sent',`${q.length-left.length} saved message${q.length-left.length>1?'s':''} delivered`,'good');
}

async function fbSend(back){
  const msg=FBD.msg.trim(),email=FBD.email.trim();
  if(msg.length<3){modal('💬 Send feedback','<p>Write a few words first.</p>',[{l:'Back to the form',fn:()=>feedbackModal(back)}]);return}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){modal('💬 Send feedback','<p>That email address doesn’t look right. Fix it, or leave it blank.</p>',[{l:'Back to the form',fn:()=>feedbackModal(back)}]);return}
  if(FBD.trap){FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};return}            // a bot filled the hidden field
  const item=Object.assign({_subject:FEEDBACK.subject,kind:FBD.kind,message:msg.slice(0,FEEDBACK.maxLen)},email?{email,_replyto:email}:{},fbContext(),{sentAt:new Date().toISOString()});
  showTile('📨','Sending…','Feedback','info');

  if(r==='queue') fbSetQueue(fbQueue().concat([item]));
  FBD={kind:FB_KINDS[0],msg:'',email:'',trap:''};
  sfx&&sfx('good');
  modal(r==='sent'?'🙏 Thanks!':'📥 Saved for later',r==='sent'?'<p>Your feedback is on its way. Thanks for helping make Guide Master better.</p>':'<p>No connection to the feedback service right now. Your message is saved on this device and will send automatically next time the game is online.</p>',
    [{l:'OK',fn:()=>{if(back)back()}}]);
}

function campPick(dest){
  const w=CAMP_ENC.map(e=>e.h.includes(dest.h)?(e.h[0]===dest.h?4:3):0),tot=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return CAMP_ENC[i]}
  return CAMP_ENC[0];
}
const CAMP_QUIET=['❄️ A quiet night. Minus 10°F, snow squeaking under your boots, and stars all the way down.',
  '🌌 The northern lights roll green over the spruce for an hour. Then silence.',
  '🌲 Snow loads the spruce boughs until one lets go with a soft thump. Otherwise: nothing at all.',
  '🔥 You feed the fire, the stove ticks, and the cold sits just outside the tent.',
  '🌙 A full moon on fresh snow; you could read by it.',
  '💨 The wind rises at midnight and drops at four. You sleep through most of it.'];

// ---- the flow: winterModal → campModal → nightsModal → confirm → goCamp → report ----
const campUsed=()=>!!(S.camp&&S.winter&&S.camp.s===S.winter.s);
function campModal(){
  if(!S.winter) return;
  modal('🏕️ Winter camping · cash '+$(Math.round(S.money)),`<p>Winter on the Kenai Peninsula. Pick a place within 100 road miles of Soldotna. One trip per off-season: the rest of the winter you work your other job.</p><p style="font-size:13px;color:var(--mute)">Pump gas about ${$(campGas())}/gal; the pickup gets ${CAMP_MPG} mpg. Most campgrounds are unserviced in winter.</p>`,
    CAMP_DEST.map(d=>({l:`${d.ic} ${d.n} — ${d.miles} mi`,s:d.d,fn:()=>setTimeout(()=>nightsModal(d),0)})).concat([{l:'Not now',s:'Back to the off-season summary.',fn:()=>setTimeout(winterModal,0)}]));
}
function nightsModal(d){
  modal(`${d.ic} ${d.n}`,`<p>${d.d}</p><p style="font-size:13px;color:var(--mute)">${d.miles} miles each way. Fee ${d.fee?$(d.fee)+'/night':'none (unmaintained in winter)'}. Each night has a 50% chance of a wildlife encounter.</p>`,
    CAMP_NIGHTS.map(n=>{const c=campCost(d,n);return {l:`${n} night${n>1?'s':''} — ${$(c.total)}`,s:c.total>S.money?'Can’t afford it.':`${$(c.fuel)} gas, ${$(c.fees)} fees, ${$(c.sup)} supplies.`,dis:c.total>S.money,fn:()=>setTimeout(()=>campConfirm(d,n),0)}})
      .concat([{l:'Back',s:'Pick another place.',fn:()=>setTimeout(campModal,0)}]));
}
function campConfirm(d,n){
  const c=campCost(d,n);
  modal(`🏕️ ${n} night${n>1?'s':''} at ${d.n}`,`<p>⛽ Gas: ${d.miles*2} miles round trip ÷ ${CAMP_MPG} mpg = ${c.gal} gal × ${$(c.gas)} = <b>${$(c.fuel)}</b><br>🏕️ Campsite fees: <b>${$(c.fees)}</b><br>🥫 Supplies, ${$(CAMP_SUPPLIES)}/night: <b>${$(c.sup)}</b><br>Total: <b>${$(c.total)}</b> of ${$(Math.round(S.money))}.</p>`,
    [{l:'Pack the truck',s:'Go.',dis:c.total>S.money,fn:()=>goCamp(d,n)},{l:'Back',fn:()=>setTimeout(()=>nightsModal(d),0)}]);
}
function goCamp(d,n){
  if(!S.winter||campUsed()) return null;
  const c=campCost(d,n);if(c.total>S.money) return null;
  money(-c.total);S.stats.spent+=c.total;S.camp={s:S.winter.s,dest:d.id,nights:n};
  const st=S.stats;st.campNights=(st.campNights||0)+n;st.seen=st.seen||{};
  const e0=S.energy,rows=[];let enc=0;
  for(let i=1;i<=n;i++){
    if(Math.random()<.5){
      const e=campPick(d);enc++;st.encounters=(st.encounters||0)+1;st.seen[e.id]=(st.seen[e.id]||0)+1;
      rows.push(`<p><b>Night ${i}: ${e.ic} ${e.t}.</b> ${e.text} <em>${e.fx()}</em></p>`);
    }else{adj('energy',2);rows.push(`<p><b>Night ${i}:</b> ${pick(CAMP_QUIET)} (Energy +2)</p>`)}
  }
  adj('energy',0);
  S.camp.enc=enc;
  sfx(enc?'good':'click');
  modal(`🏕️ Back from ${d.n}`,rows.join('')+`<p>${n} night${n>1?'s':''}, ${enc} encounter${enc===1?'':'s'}. Spent <b>${$(c.total)}</b>. Energy ${e0} → <b>${S.energy}</b> (carries into the season). Cash ${$(Math.round(S.money))}.</p>`,
    [{l:'Back to the off-season',fn:()=>setTimeout(winterModal,0)}]);
  return {cost:c.total,enc,rows};
}
// ---------------- "Updated to version X" notice ----------------
// The title screen calls maybeUpdateNotice(). If this device last acknowledged a different version, a pop-up says which
// version the game is now, what's new, and (when there are saved games) that they were brought up to date. The only way
// to dismiss it is its "Got it" button; the version is remembered only after that, so a reload shows it again.
// A brand-new player (no remembered version, no saves) gets no pop-up: the version is just remembered.
// Add a line list here for each release (newest last). Unknown versions get the generic line below.
const CHANGELOG={
  '1.3.0':['⛽ Fuel: gas up the jet sled and the truck, and watch the gauge before a long run.'],
  '1.3.1':['☕ Coffee break: spend 5 minutes on coffee to settle in (not on the drift boat).'],
  '1.3.2':['❓ Help! button on the title screen and in Settings explains the rules and the game.'],
  '1.4.0':['💬 Send feedback: tell the developer about ideas, bugs or a rule that looks wrong.'],
  '1.5.0':['🏕️ Winter camping in the off-season: pick a destination and how many nights.'],
  '1.5.1':['🩹 Fixes: no more “undefined” on bookings; first-aid classes now Mon/Tue/Thu with earlier reminders; booking requests for days you can’t legally fish are flagged, with an offer to move them.'],
  '1.5.2':['🆕 This notice: after each update you’ll see what changed, and your progress is brought up to date automatically.'],
  '1.5.3':['⚖️ Difficulty now changes the game, not the score: Combat Season means more patrols and dearer bills, Rookie the reverse. Grades were recalibrated, so an A takes real work.'],
  '1.5.4':['🎲 Dilemma options shuffle: playing it straight costs something, bending a rule can pay cash, and repeat offenders pay steeper fines. Pay now follows the day: catch, tackle and boat shape tips, refunds and word of mouth.'],
  '1.6.0':['💲 Higher rates now cost you: fewer bookings, pickier clients and a rep requirement that rises each step.','🔧 Boats at condition 0 are out of service until repaired. New motors burn less gas and new sleds finish trips sooner.','🧑‍🤝‍🧑 Late-career money sinks: hire an assistant guide, build guest cabins, or buy a riverfront lot with your own launch.'],
};
const CHANGELOG_GENERIC='Fixes and small improvements throughout.';
const LASTVER_KEY=KEY('lastVersion');
function lastSeenVersion(){try{return localStorage.getItem(LASTVER_KEY)||''}catch(e){return ''}}
function rememberVersion(){try{localStorage.setItem(LASTVER_KEY,APP_VERSION)}catch(e){}}
// Run every slot's save through the engine's own migrate() and write it back stamped with this version
// (keeping its timestamp, so the current slot and "newest save" don't change). Returns {count, oldest app version}.
function upgradeAllSaves(){
  const ls=store(),out={count:0,oldest:''};if(!ls)return out;
  for(let n=1;n<=GAME.slots;n++){
    try{
      const r=rawSave(n);if(!r)continue;
      const raw=JSON.parse(r.v),d=migrate(raw);if(d.S.over)continue;
      out.count++;
      if(typeof raw.app==='string'&&raw.app&&(!out.oldest||verCmp(raw.app,out.oldest)<0))out.oldest=raw.app;
      if(d.newer)continue; // from a newer version: leave it exactly as it is
      ls.setItem(r.k,JSON.stringify({schema:d.schema,app:APP_VERSION,S:d.S,uiNarr:d.uiNarr,tab:d.tab,at:r.at||d.at}));
    }catch(e){}
  }
  return out;
}
function changelogLines(from){
  const vs=Object.keys(CHANGELOG).filter(v=>verCmp(v,APP_VERSION)<=0&&(!from||verCmp(v,from)>0)).sort((a,b)=>verCmp(b,a));
  const lines=[];
  if(!CHANGELOG[APP_VERSION])lines.push([APP_VERSION,CHANGELOG_GENERIC]);
  vs.forEach(v=>CHANGELOG[v].forEach(t=>lines.push([v,t])));
  return lines.slice(0,8);
}
function maybeUpdateNotice(){
  try{
    const seen=lastSeenVersion();
    if(seen===APP_VERSION)return;
    if(document.getElementById('mbg'))return; // something else is open; the next title screen will show it
    const saves=upgradeAllSaves(),from=seen||saves.oldest;
    if(!seen&&!saves.count){rememberVersion();return} // brand-new player
    const lines=changelogLines(from),multi=new Set(lines.map(l=>l[0])).size>1;
    const intro=from&&from!==APP_VERSION?`<p>${esc(GAME.title)} was updated from version ${esc(from)} to <b>${esc(APP_VERSION)}</b>.</p>`:`<p>${esc(GAME.title)} is now on version <b>${esc(APP_VERSION)}</b>.</p>`;
    const sv=saves.count?`<p>${saves.count>1?'Your saved games were':'Your saved game was'} updated to work with this version.</p>`:'';
    modal(`🆕 Updated to version ${esc(APP_VERSION)}`,`${intro}${sv}<p style="margin-bottom:2px"><b>What’s new</b></p><ul>${lines.map(l=>`<li>${multi?`<small>${esc(l[0])}</small> `:''}${l[1]}</li>`).join('')}</ul>`,
      [{l:'Got it',fn:rememberVersion}],true);
  }catch(e){}
}
// ---------------- boot ----------------
applyPrefs();
titleScreen();
</script>
