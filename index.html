<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Master</title>
<meta name="description" content="Run a charter fishing guide business on Alaska's Kenai Peninsula: clients, combat fishing, bears and the regulations.">
<meta name="theme-color" content="#0f3b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guide Master">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-600-normal.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}</style>
<style>
/* ============================================================
   THEME: change these to re-skin the whole app.
   tools/new-game.py rewrites --brand-dark (also the PWA theme color).
   ============================================================ */
:root{
  --brand:#1f5d63; --brand-dark:#0f3b3f; --accent:#2f6d5a; --accent-soft:#6f8f5a; --surface:#f3ecdc; --paper:#fbf8f1;
  --cta:#e3642e; --cta-dark:#a9441b; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--brand-dark);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(var(--brand),var(--brand-dark));color:#fff}
.title .art{height:250px}
.title .art{position:relative;flex:none;overflow:hidden}
.title .body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:12px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:"DM Sans";font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
/* "What's the game about?": the intro and bullets, folded */
.title details.about{border-radius:14px;background:rgba(255,255,255,.08)}
.title details.about summary{min-height:44px;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:15.5px;cursor:pointer;list-style:none;border-radius:14px}
.title details.about summary::-webkit-details-marker{display:none}
.title details.about summary::before{content:"▸";display:inline-block;transition:transform .15s;opacity:.85}
.title details.about[open] summary::before{transform:rotate(90deg)}
.title details.about>p,.title details.about>ul{padding:0 14px 0 32px}.title details.about>p{padding-left:14px;margin-bottom:8px}
.title details.about>ul{margin-left:14px;padding:0 14px 12px 18px}
/* the other buttons: two columns; an odd one out spans both */
.title .big{text-wrap:balance}
.title .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.title .tgrid .ghost{min-height:48px;padding:8px 6px;font-size:15px;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center}
.title .tgrid .wide{grid-column:1/-1}
/* the install bar (41-install.js) at the very top */
.inst-bar{display:flex;align-items:center;gap:2px;background:#0a2a2d;color:#fff;padding:0 0 0 12px;font-size:14px;line-height:1.25;border-bottom:1px solid rgba(255,255,255,.18)}
.inst-bar .ib-t{flex:1;min-width:0}
.inst-bar .ib-go{flex:none;height:44px;min-width:44px;padding:0 14px;border:5px solid transparent;background-clip:padding-box;border-radius:15px;background-color:#fff;color:var(--brand-dark);font-weight:700;font-size:14.5px}
.inst-bar .ib-x{flex:none;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:18px;border-radius:10px}
.big{background:var(--cta);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--cta-dark)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cta-dark)}
.small-note{font-size:12px;opacity:.7}
.heat-note,.hunger-note{color:var(--bad);opacity:1;margin:8px 0 0}
/* hud */
.hud{background:var(--brand-dark);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-right{display:flex;align-items:center;gap:8px;flex:none}
.hud-day{font-family:"Fraunces";font-size:20px;font-weight:800}
.hud-time{white-space:nowrap;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:minmax(0,1.45fr) repeat(6,minmax(0,1fr));gap:4px;margin-top:8px}   /* Cash is the widest */
.stat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.fs-xl .stats{grid-template-columns:repeat(4,minmax(0,1fr))}   /* large text: two rows of four, so no value wraps or clips */
@media (max-width:360px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 2px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--surface);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--surface)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--accent);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip:active{background:#e3eee5}
.chip[disabled]{border-color:var(--line);color:#aaa}
/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;padding:9px 0 10px;font-size:11px;color:var(--mute);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ti{font-size:20px}
.tabs button.on{color:var(--brand)}
.tabs .dot{display:inline-block;width:7px;height:7px;background:var(--bad);border-radius:50%;margin-left:3px;vertical-align:top}
/* to-do, priorities, log */
.rules{font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:12px}
.rules p{margin:0 0 6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .ck{font-size:20px;width:26px;flex:none;text-align:center}
.todo b{display:block;font-size:15px}.todo span{font-size:12.5px;color:var(--mute)}
.todo .pin{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 7px;font-size:13px;color:var(--mute);cursor:pointer}
.prio{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink,#2a3d45);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prio.done .rk{background:var(--line);color:var(--mute)}
.prio .pt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.prio.done .pt{text-decoration:line-through;color:var(--mute)}
.prio .pb{display:flex;gap:4px;flex:none}
.prio .pb button,.prio-add button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;color:inherit}
.prio .pb button:disabled{opacity:.3;cursor:default}
.prio-add{display:flex;gap:6px;margin:8px 0 2px}
.prio-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
.prio-add button{padding:0 12px;font-weight:700}
.prio-empty{font-size:13px;color:var(--mute);padding:6px 2px}
.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.log p em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
/* event tiles (toasts) */
#tiles{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);width:calc(100% - 20px);max-width:460px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tile{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fffdf8;border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(8,25,30,.28),0 1px 0 rgba(0,0,0,.05);border-left:6px solid #6b7478;animation:tileIn .32s cubic-bezier(.2,.9,.3,1.2)}
.tile.good{border-left-color:var(--good)}.tile.bad{border-left-color:var(--bad)}.tile.info{border-left-color:var(--brand)}.tile.warn{border-left-color:var(--warn)}
.tile .ti{font-size:26px;width:32px;text-align:center;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tile .tt b{display:block;font-size:15px;line-height:1.25}
.tile .tt span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tile .ok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;color:var(--accent);font-weight:700}
.tile.out{animation:tileOut .25s ease-in forwards}
@keyframes tileIn{from{transform:translateY(-16px) scale(.96);opacity:0}}
@keyframes tileOut{to{transform:translateY(-12px);opacity:0;height:0;margin:0;padding-top:0;padding-bottom:0}}
.gear{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;font-size:19px;color:#fff;flex:none}
.title{position:relative}.tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;background:rgba(18,49,59,.55);border:0;border-radius:12px;width:44px;height:44px;font-size:21px;z-index:2}
.nm-in{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.nm-in:focus{outline:2px solid var(--accent);border-color:var(--accent)}
/* grouped actions, collapsible destinations, tips */
details.go{margin-top:14px}
details.go>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 2px;display:flex;justify-content:space-between}
details.go>summary::-webkit-details-marker{display:none}
details.go>summary::after{content:'▸ show';letter-spacing:.3px;text-transform:none}
details.go[open]>summary::after{content:'▾ hide'}
.dest.compact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.dest.compact .dn{flex:1 1 150px;display:block}
.dest.compact .dn span{display:block;text-align:left}
.dest.compact .chips{margin-top:0}
.tip{background:#fff5d6;border:1.5px solid #e6c97a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .tb{display:flex;gap:8px;margin-top:8px}
.tip button{border:1.5px solid #c9a24a;background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:#6b4e0e}
/* accessibility */
html.fs-l{zoom:1.12}html.fs-xl{zoom:1.25}
html.hc{--mute:#2b3336;--line:#7d7462;--paper:#ffffff;--surface:#efe5cc}
html.hc .hud-sub,html.hc .stat small{opacity:1}html.hc .act,html.hc .dest{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
.today{background:#eef3f4;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.today b{display:block;font-family:Fraunces;font-size:15px;margin-bottom:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mb{font-size:15px;line-height:1.5;margin-bottom:14px}
.modal .mb p{margin:0 0 8px}
.modal .act{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface);color:var(--ink);margin:0 4px 4px 0}
.tag.bad{background:#f6ddd5;color:var(--bad)}.tag.good{background:#dcefe2;color:var(--good)}
/* full-screen transition (travel, sleep…) */
.cross{position:fixed;inset:0;z-index:30;background:var(--brand-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cross svg{width:100%;max-width:480px;height:260px}
.cross .cap{font-family:"Fraunces";font-size:22px;margin-top:6px;text-align:center;padding:0 20px}
.cross .cap2{font-size:13px;opacity:.75;margin-top:6px}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
/* end */
.end{padding:22px 18px 40px}
.end h1{font-size:30px;margin:6px 0 4px}
.grade{font-family:"Fraunces";font-size:58px;font-weight:800;color:var(--cta);line-height:1}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv>span{flex:0 0 auto}.kv>b{text-align:right}
.kv b{font-variant-numeric:tabular-nums}
/* polish */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
html.hc :focus-visible{outline:3px solid #000;outline-offset:0;box-shadow:0 0 0 7px #ffd400}
html.hc .hud :focus-visible,html.hc .title :focus-visible,html.hc nav.tabs :focus-visible{outline-color:#ffd400;box-shadow:0 0 0 7px #000}
.cross:focus-visible{outline:4px solid var(--cta);outline-offset:-8px}
.prio .pt[role="button"]{cursor:pointer;border-radius:6px}
/* ⌨️ keyboard shortcut hints (desktop only) */
.kn{display:none}
@media (hover:hover) and (pointer:fine){
  button.act{position:relative}
  .kn{display:block;position:absolute;top:6px;right:8px;font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;font-style:normal;color:var(--mute);border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.55;pointer-events:none}
  button.act:hover .kn{opacity:.9}
}
.keys{display:grid;gap:6px;margin:4px 0 10px}
.keys-row{display:flex;gap:12px;align-items:baseline}
.keys-row kbd{min-width:84px;font:600 12px ui-monospace,Menlo,Consolas,monospace;background:var(--card,#f4f1ea);border:1px solid var(--line,#ccc);border-bottom-width:2px;border-radius:5px;padding:2px 6px;text-align:center}

/* sample-game extras */
.status{margin-bottom:6px}
.end .kv span{color:var(--mute)}
.slot-empty{color:var(--mute)}
.alertbar.info{background:var(--brand)}
/* tap targets: anything you press is at least 44×44 CSS px */
.chip{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:6px 14px}
.gear,.tile .ok{width:44px;height:44px}
.tip button,.todo .pin,.prio-add button{min-height:44px;min-width:44px}
.prio .pb button{min-width:44px;height:44px}
.prio-add button{height:44px}
.prio .pt{min-height:44px;display:flex;align-items:center}
details.go>summary{min-height:44px;align-items:center}
.modal:focus{outline:none}
button.act,.ghost,.big{min-height:44px}

.modal.swap{animation:none}
.packbox{margin:10px 0 4px;padding:10px;border:1px solid var(--line);border-radius:12px}
.packbox p{margin:6px 0}
.packbox [role=group]{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.packopt{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.packopt b{font-size:14px}.packopt span{font-size:12px;color:var(--mute)}
.packopt.on{border-color:var(--accent,#2f7d8a);box-shadow:inset 0 0 0 1px var(--accent,#2f7d8a);background:rgba(47,125,138,.12)}
.req{border:1px solid var(--line);border-radius:12px;padding:10px 10px 2px;margin-bottom:10px;background:var(--paper)}
.req .rb p{margin:0 0 8px;font-size:14.5px}
.digest .dig{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.digest .dig .di{font-size:22px;line-height:1.2}
.digest .dig p{margin:3px 0 0;font-size:14px}
.digest .sect{margin-top:10px}
/* illustrations (40-art.js; art/README.md "How pictures are shown"). The 16:9 art is cropped to a banner whose height is reserved
   before the image arrives (no layout shift): half the column's width (2:1), at most 30% of the screen's height so the text and the
   buttons stay in view; 16:9 on tall, wide screens (tablets). The placeholder is the picture's own average color (inline), the image
   fades in once decoded (not with reduced motion, and not again on a redraw), and a picture that can't load takes its box away. */
:root{--art-w:min(100vw,480px);--art-h:min(calc(var(--art-w) * .5),30vh)}
@media (min-width:600px) and (min-height:900px){:root{--art-h:min(calc(var(--art-w) * .5625),30vh)}}
.art-fig{margin:0 0 10px;border-radius:12px;overflow:hidden;aspect-ratio:2/1;max-height:30vh;background:#cfdfe3}
.art-fig picture{display:contents}
.art-fig img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease-out}
.art-fig[data-ld] img{opacity:1}
.art-fig[data-err]{display:none}
/* a sheet: a full-bleed banner above the title (02-kit.js sheetHTML lifts it there) */
.modal>.art-fig:first-child{margin:-20px -18px 14px;border-radius:0;aspect-ratio:auto;max-height:none;height:var(--art-h)}
/* a tab: the picture takes the drawn scene's place, at the banner's height; the place's name moves to the sky, one line */
.scene>.art-fig{position:absolute;inset:0;margin:0;border-radius:0;aspect-ratio:auto;max-height:none;height:100%}
.scene:has(>.art-fig:not([data-err])){height:var(--art-h)}
.scene:has(>.art-fig:not([data-err])) .place{top:10px;bottom:auto;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.scene:has(>.art-fig:not([data-err])) .place h2{font-size:16px}.scene:has(>.art-fig:not([data-err])) .place div{display:none}
@media (prefers-reduced-motion:reduce){.art-fig img{transition:none}}
@media (prefers-color-scheme:dark){.art-fig{background:#22313a;filter:brightness(.86) saturate(.95)}}
/* the Help sheet (26-help.js): contents with tap-to-jump links, then one short section per topic */
.help-toc{background:var(--surface);border-radius:12px;padding:10px 12px 6px;margin:0 0 6px}
.help-toc:focus{outline:none}
.help-toc>b{display:block;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.help-toc ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.help-toc a{display:flex;align-items:center;min-height:44px;font-size:14px;line-height:1.25;color:var(--brand);text-decoration:none;border-bottom:1px solid var(--line)}
.help-toc a:hover{text-decoration:underline}
.help-sec{padding:4px 0 10px;border-bottom:1px solid var(--line);scroll-margin-top:4px}
.help-sec h3{display:flex;align-items:center;gap:6px;font-family:Fraunces,Georgia,serif;font-size:18px;margin:8px 0 2px}
.help-sec h3:focus{outline:none}.help-sec h3:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.help-up{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-size:17px;color:var(--mute);text-decoration:none;border-radius:10px}
.help-up:hover{background:var(--surface)}
.help-sum{font-weight:600;font-size:15px;margin:0 0 4px!important}
.help-sec ul{margin:0;padding-left:20px;font-size:14px;line-height:1.45}
.help-sec li{margin:0 0 5px}
.help-note{font-size:12px;color:var(--mute);margin-top:10px!important}
@media (max-width:360px){.help-toc ul{grid-template-columns:1fr}}
/* Install app (41-install.js): the steps sheet and the thank-you note */
.inst-steps{margin:8px 0 10px;padding-left:22px;line-height:1.5;font-size:15px}.inst-steps li{margin:4px 0}
.inst-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);max-width:min(440px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:60}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#fff;padding:20px;font-family:sans-serif">This game needs JavaScript.</p></noscript>
<script>
// ============================================================
//  KENAI WINTER CAMP, part 0: the namespace.
//  The whole camping engine lives behind ONE global, KenaiCamp. It never reads or writes anything of the host game:
//  everything it needs comes in through the trip ticket and a small host adapter, and everything it produces goes
//  out in the trip report. See src/camp/README.md for the contract.
//  The only browser storage it touches uses keys that start with "kenaicamp:".
// ============================================================
const KenaiCamp={
  VERSION:'1.0.0',
  SCHEMA:1,                 // version of the ticket, report and stored-data shapes; bump when any of them change
  PREFIX:'kenaicamp:',      // every storage key this engine uses starts with this
};
(function(K){
  'use strict';
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const r2=x=>Math.round(x*100)/100;
  const grp=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  // money: $1,234 (cents only when there are some), with a real minus sign
  const $=x=>{const f=(Math.round(Math.abs(x)*100)/100).toFixed(x%1?2:0).split('.');f[0]=grp(+f[0]);return (x<0?'−':'')+'$'+f.join('.')};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sgn=n=>(n<0?'−':'+')+Math.abs(n);
  // a small seeded generator (mulberry32) for tests and the solo harness
  function seeded(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
  // storage that never throws and never leaves the kenaicamp: namespace
  const store={
    ok(){try{return typeof localStorage!=='undefined'&&!!localStorage}catch(e){return false}},
    get(k){try{return this.ok()?JSON.parse(localStorage.getItem(K.PREFIX+k)):null}catch(e){return null}},
    set(k,v){try{if(this.ok())localStorage.setItem(K.PREFIX+k,JSON.stringify(v))}catch(e){}},
    del(k){try{if(this.ok())localStorage.removeItem(K.PREFIX+k)}catch(e){}},
  };
  K.util={clamp,r2,grp,$,esc,sgn,seeded,store};
})(KenaiCamp);
// ============================================================
//  KENAI WINTER CAMP, part 1: the content.
//  Places, months, gear, shelters, wildlife and weather, activities, winter work and achievements.
//
//  Mileages are one-way road miles from Soldotna, worked out from Sterling Highway mileposts (Soldotna at about
//  milepost 95.2): Johnson Lake Rd at MP 110, Clam Gulch at 117.4, Deep Creek at 137.3, Anchor River at 161, Homer at 173,
//  Quartz Creek at 44.9, Swanson River Rd at 83.5 (+17 mi), Skilak Lake Rd west end at 75.2, Hidden Lake 3.5 mi and Lower Skilak
//  13.3 mi along it. Captain Cook SRA is "25 miles north of Kenai" (about 11 from Soldotna to Kenai). Most campgrounds are not
//  serviced in winter, so winter camping there is free but without services. Prices are 2026 estimates, not quotes.
// ============================================================
(function(K){
  'use strict';
  const D=K.data={};
  D.MPG=15; D.SUPPLIES=25; D.NIGHTS=[1,2,3,5]; D.WINTER_DAYS=10; D.MAX_TRIPS=3; D.MAX_GIGS=2;
  D.MAX_BOOK=.02;            // the most a winter can add to next season's daily chance of a booking
  D.MAX_FIRST=.03;           // the most it can add to the catch on the first few trips
  D.LICENSE=20;               // an Alaska resident sport fishing license ($20 in ADF&G's 2025 and 2026 regulations; it was $29 before 1.11.0); licenses run by calendar year
  D.ICE_WALK=4;               // inches of clear, hard ice for a person on foot
  D.CAPACITY=12;              // load points the truck and sled carry; every item and companion uses some
  D.RENT_ICE=15;              // renting an ice kit at the Soldotna tackle shop

  // ---- places (habitat h: lake, forest, coast, river, mtn) ----
  D.PLACES=[
    {id:'johnson',ic:'🏞️',n:'Johnson Lake (Kasilof)',miles:16,fee:0,h:'lake',ice:'Johnson Lake',scout:'kasilof',d:'Sterling Hwy MP 110, then Johnson Lake Road. The state rec area has toilets and a boat launch in summer ($20 a site); in winter nothing is serviced or plowed, so you park out and camp free on the ice-rimmed lake. ADF&G stocks this lake, and winter anglers fish it through the ice.'},
    {id:'clam',ic:'🌊',n:'Clam Gulch beach',miles:22,fee:0,h:'coast',d:'MP 117.4 on the Sterling Hwy. The summer campground ($20 a site) is not serviced in winter; the bluff looks over Cook Inlet and the volcanoes across the water.'},
    {id:'hidden',ic:'🌲',n:'Hidden Lake (Kenai Refuge)',miles:24,fee:0,h:'forest',scout:'upper',d:'3.5 miles along Skilak Lake Road from the Sterling Hwy at MP 75.2. The refuge charges $15 in season. In winter, expect no services and no fee.'},
    {id:'swanson',ic:'🛶',n:'Swanson River Road & Swan Lake canoe area',miles:29,fee:0,h:'lake',ski:true,cabin:45,d:'Turn north at MP 83.5 and drive 17 miles of refuge road to the canoe-route landings. Summer parking is $5. In winter it’s unserviced, quiet ski and snowmobile country, and a refuge public-use cabin can be reserved ahead.'},
    {id:'skilak',ic:'⛰️',n:'Lower Skilak Lake Campground',miles:33,fee:0,h:'mtn',scout:'upper',cabin:55,d:'13.3 miles along Skilak Lake Road from the west end. A summer campground (May to September) with no fee. In winter you’re on your own on a big, windy lake shore; a public-use cabin in the area can be reserved ahead.'},
    {id:'cook',ic:'🌲',n:'Captain Cook State Rec Area',miles:36,fee:0,h:'forest',ice:'Stormy Lake',ski:true,d:'About 25 miles north of Kenai, near Stormy Lake, where winter visitors ice fish stocked fish. Discovery Campground is $20 a site in summer; in winter you camp unserviced.'},
    {id:'deep',ic:'🦅',n:'Deep Creek State Rec Area',miles:42,fee:0,h:'coast',d:'MP 137.3 on the Sterling Hwy, on the Cook Inlet bluff above the beach. Summer sites are $20; in winter there is no service, and the beach is a cold, bright place for eagles.'},
    {id:'quartz',ic:'🏔️',n:'Quartz Creek (Kenai Lake)',miles:51,fee:0,h:'mtn',scout:'upper',cabin:65,d:'Quartz Creek Campground sits at MP 44.9 near Cooper Landing, a summer Forest Service campground. In winter it is unserviced with steep mountain slopes on all sides. The campground has no cabin of its own, but the Forest Service rents public-use cabins in the area ($50 to $75 a night). Dall sheep and goats are in the high country, and the upper Kenai River runs below.'},
    {id:'anchor',ic:'🎣',n:'Anchor River State Rec Area',miles:66,fee:20,h:'river',d:'MP 161, the westernmost highway point in North America. The state campgrounds charge $20 a site; the Anchor River runs open under ice shelves and steelhead and Dolly Varden are in it.'},
    {id:'spit',ic:'⚓',n:'Homer Spit',miles:83,fee:0,h:'coast',d:'The city’s Spit campgrounds are open April through October only, so in winter you park rough with no hookups and no dump station. Expect sea ducks, sea otters, eagles and a hard wind off Kachemak Bay.'},
  ];
  D.place=id=>D.PLACES.find(p=>p.id===id);

  // ---- months: daylight hours (about, at 60°N), ice quality, and the weather odds ----
  D.MONTHS=[
    {id:'nov',n:'November',day:7.3,ice:.22,clear:.35,cold:.5,storm:1,chin:.5,yo:0,t:'10 to 25°F',d:'Early ice is thin and the days are shrinking.'},
    {id:'dec',n:'December',day:5.8,ice:.4,clear:.40,cold:1.2,storm:1.2,chin:.8,yo:0,t:'0 to 20°F',d:'The darkest weeks: barely five and a half hours of light, and the best northern lights.'},
    {id:'jan',n:'January',day:6.8,ice:.8,clear:.45,cold:1.6,storm:1,chin:1,yo:1,t:'−15 to 15°F',d:'Cold and still, with ice that holds. Fishing licenses started over on January 1.'},
    {id:'feb',n:'February',day:9,ice:.95,clear:.5,cold:1.3,storm:1,chin:1,yo:1,t:'−5 to 25°F',d:'The ice is at its best and the days are noticeably longer.'},
    {id:'mar',n:'March',day:11.5,ice:.65,clear:.5,cold:.5,storm:.7,chin:1.5,yo:1,t:'10 to 35°F',d:'Long bright days, but thaws and soft ice are coming.'},
  ];
  D.month=id=>D.MONTHS.find(m=>m.id===id);
  D.slots=m=>m.day>=9?2:1;                      // daylight activities per day: one in the dark months, two on long days
  // calendar year of a month in a winter that starts in `year`: Nov and Dec are that year, Jan to Mar the next
  D.calYear=(m,year)=>year+m.yo;

  // ---- things to pack (wt = load points; once = bought once and kept, otherwise paid every trip) ----
  D.PACK=[
    {id:'bear',ic:'🛢️',n:'Bear-resistant food container',cost:80,wt:3,once:true,d:'Locks food and scented gear away from foxes, ravens, wolverines and bears. Keep it downwind of camp, away from the tent.'},
    {id:'fuel',ic:'⛽',n:'Extra stove fuel',cost:14,wt:2,once:false,d:'A cold snap burns twice the fuel. Running out at 25 below is how a hard night becomes a dangerous one.'},
    {id:'bag',ic:'🛌',n:'Cold-rated sleeping bag (−20°F)',cost:160,wt:3,once:true,d:'Rated well below the night’s low, on an insulated pad. Cold sleepers burn through the night’s energy.'},
    {id:'layers',ic:'🧥',n:'Spare layers: wool, a dry hat and mitts',cost:70,wt:2,once:true,d:'Cotton kills when it’s wet. A dry set of wool is the cheapest insurance there is.'},
    {id:'truck',ic:'🔋',n:'Truck kit: jump pack, shovel, tow strap',cost:70,wt:2,once:true,d:'A dead battery or a drifted-in road is a nuisance with this and a tow bill without it.'},
    {id:'ice',ic:'🧊',n:'Ice kit: hand auger, rod and skimmer',cost:90,wt:4,once:true,d:'Needed to fish through the ice. You can rent one in town for a day if you can’t carry it.'},
    {id:'picks',ic:'📍',n:'Ice picks and a throw rope',cost:25,wt:1,once:true,d:'Worn around the neck, the picks let you pull yourself out of the water. The rope is for pulling out someone else.'},
    {id:'vise',ic:'🪶',n:'Fly-tying vise and materials',cost:40,wt:1,once:true,d:'Evenings by the fire turn into flies and leaders for next July.'},
  ];
  D.pack=id=>D.PACK.find(p=>p.id===id);

  // ---- where you sleep (comfort lowers the odds of a bad night; load and cap use truck space) ----
  D.SHELTERS={
    tent:{id:'tent',ic:'⛺',n:'Four-season tent and stove',comfort:0,load:2,cap:0,cost:0,d:'What you already own. Cold, but light.'},
    wall:{id:'wall',ic:'🏕️',n:'Wall tent with a wood stove',comfort:1,load:3,cap:0,cost:1200,d:'A canvas wall tent and a small stove: you can stand up, dry your boots and keep a pot hot. About $1,200.'},
    camper:{id:'camper',ic:'🚐',n:'Truck camper',comfort:2,load:0,cap:4,cost:7500,d:'A used, insulated pickup camper with a furnace. It carries your gear, too. About $7,500.'},
    cabin:{id:'cabin',ic:'🛖',n:'Public-use cabin',comfort:2,load:0,cap:0,cost:0,d:'A refuge, State Parks or Forest Service cabin reserved ahead: bunks, a stove and four walls.'},
  };

  // ---- the animals (every wildlife encounter is a species for the camping log) ----
  D.SPECIES=[
    ['moose','🫎','Moose'],['wolves','🐺','Wolves'],['lynx','🐈','Lynx'],['fox','🦊','Red fox'],['ravens','🐦‍⬛','Ravens'],
    ['porcupine','🦔','Porcupine'],['swans','🦢','Trumpeter swans'],['eagles','🦅','Bald eagles'],['sheep','🐏','Dall sheep'],['bear','🐻','Brown bear'],
    ['otters','🦦','River otters'],['wolverine','🦡','Wolverine'],['hares','🐇','Snowshoe hares'],['ptarmigan','🐦','Willow ptarmigan'],['seaotters','🦭','Sea otters'],['chickadees','🐤','Chickadees'],
  ].map(([id,ic,n])=>({id,ic,n}));
  D.ALL=D.SPECIES.map(s=>s.id);

  // ---- encounters and weather ----
  // kind: good, bad or mixed. cat: wild (weighted by the habitat of the place) or weather (any place, weighted by the month).
  // counter: the packed item that makes a bad one rarer and gentler. fx(c) returns {d:{energy,cash,rep,skill,wom,days,thaw,messy}, line}.
  // c.has(item), c.r() random 0..1, c.comfort, c.shelter. Money in d.cash is negative for a cost.
  const E=D.ENC=[];
  const add=e=>E.push(e);
  add({id:'moose',ic:'🫎',t:'A cow moose and her calf',kind:'good',cat:'wild',h:['forest','lake','river','coast'],
    text:'At first light a cow moose and her calf browse the willows right at the edge of camp, breath smoking in the cold.',
    fx:c=>c.r()<.25?{d:{energy:-6},line:'You edge in for a better look. She lays her ears back and stamps; you retreat to the truck for an hour.'}:{d:{energy:5},line:'You stay in the doorway and just watch.',lesson:'Give a moose room. A cow with a calf is the one that charges.'}});
  add({id:'wolves',ic:'🐺',t:'Wolves howling across the lake',kind:'good',cat:'wild',h:['lake','forest','mtn'],
    text:'Around midnight a pack starts up on the far shore. One voice, then five, rising and bouncing off the frozen lake.',
    fx:()=>({d:{energy:4,skill:1},line:'You lie awake and listen to every note.'})});
  add({id:'lynx',ic:'🐈',t:'A lynx on the trail',kind:'good',cat:'wild',h:['forest','lake'],
    text:'On a morning walk a lynx crosses the trail ahead, big paws, tufted ears, in snowshoe hare country. It looks at you and is gone.',
    fx:()=>({d:{energy:3,skill:1},line:'Hare tracks everywhere; you learn to read them.'})});
  add({id:'fox',ic:'🦊',t:'A red fox raids the food bag',kind:'bad',cat:'wild',h:['forest','coast','river','lake'],counter:'bear',
    text:'You wake to a fox trotting off with your bacon. The food bag you left out is shredded.',
    fx:c=>c.has('bear')?{d:{},line:'The fox gives the sealed container a hard sniff and trots off with nothing.',lesson:'A bear-resistant container works on foxes, too.'}:{d:{cash:-35,energy:-2,messy:1},line:'You restock at the gas station.',lesson:'Food left out feeds foxes and teaches them to come back. Seal it away from the tent.'}});
  add({id:'ravens',ic:'🐦‍⬛',t:'Ravens open the cooler',kind:'bad',cat:'wild',h:['forest','coast','river','lake','mtn'],counter:'bear',
    text:'A pair of ravens figure out the latch on the cooler and you find them lunching on your sandwiches, croaking like they paid for them.',
    fx:c=>c.has('bear')?{d:{},line:'The ravens walk around the locked container twice and give up.'}:{d:{cash:-20,messy:1},line:'Smart birds.',lesson:'Ravens learn latches. A cooler is not a lock.'}});
  add({id:'porcupine',ic:'🦔',t:'A porcupine at the truck',kind:'bad',cat:'wild',h:['forest','lake','river'],
    text:'In the night a porcupine finds salt on the truck and chews on a tire sidewall and the axe handle you left out.',
    fx:()=>({d:{cash:-60},line:'A new tire patch and a new axe handle.',lesson:'Salty tool handles and road-salted tires draw porcupines. Put tools away at night.'})});
  add({id:'swans',ic:'🦢',t:'Trumpeter swans on open water',kind:'good',cat:'wild',h:['lake','river'],
    text:'Where the outlet keeps the water open, a family of trumpeter swans feeds along the ice edge, their calls like small brass horns.',
    fx:()=>({d:{energy:4,rep:1},line:'You have a story for the next clients.'})});
  add({id:'eagles',ic:'🦅',t:'Bald eagles on the beach',kind:'good',cat:'wild',h:['coast','river'],
    text:'A dozen bald eagles line the tide flat and the driftwood, picking over what the tide left.',
    fx:()=>({d:{energy:4,skill:1},line:'You watch how they work the water.'})});
  add({id:'sheep',ic:'🐏',t:'Dall sheep on the slope',kind:'good',cat:'wild',h:['mtn'],
    text:'White specks on the avalanche chute above camp resolve into Dall sheep, bedded in the wind-scoured alpine, glowing in the low sun.',
    fx:()=>({d:{energy:6},line:'You carry the picture home.'})});
  add({id:'bear',ic:'🐻',t:'A brown bear out of its den',kind:'bad',cat:'wild',h:['forest','mtn','lake','coast'],counter:'bear',cw:.5,
    text:'A warm spell and big tracks in the snow beside the tent: a brown bear is awake and wandering where it should be asleep.',
    fx:c=>c.has('bear')?{d:{energy:-4},line:'Your food is sealed and well away from the tent, so there is nothing to reward the bear. You still break camp in the dark and drive out.',lesson:'A bear that finds food at a camp comes back for the next one. Store it, and leave.'}:{d:{cash:-15,energy:-9,messy:1},line:'You pack up in the dark and drive out.',lesson:'Food in the tent invites a bear to it. Cook and store away from where you sleep.'}});
  // new in this version
  add({id:'otters',ic:'🦦',t:'River otters on the ice',kind:'good',cat:'wild',h:['river','lake'],
    text:'Two river otters pop out of an open lead, slide belly-first down the snowbank and dive back in, again and again, as if the ice were a playground.',
    fx:()=>({d:{energy:4},line:'You laugh for the first time in a week.'})});
  add({id:'wolverine',ic:'🦡',t:'A wolverine raids the cache',kind:'bad',cat:'wild',h:['forest','mtn','lake'],counter:'bear',cw:.25,
    text:'Something with big claws and no fear has torn into the food you stashed under the tarp, and it dragged half of it into the spruce. The tracks are a wolverine’s, loping straight lines in the snow.',
    fx:c=>c.has('bear')?{d:{},line:'The wolverine rolls the locked container thirty feet and gives up.',lesson:'Nothing but a hard container stops a wolverine. A tarp is a wrapper.'}:{d:{cash:-45,energy:-3,messy:1},line:'You write off the food and restock.',lesson:'A wolverine will tear through a tarp. Hard-sided, locked, and away from camp.'}});
  add({id:'hares',ic:'🐇',t:'Snowshoe hares at dusk',kind:'good',cat:'wild',h:['forest','lake','river'],
    text:'At dusk the willows are full of snowshoe hares in their white coats, hopping out onto the packed trail with their oversized back feet.',
    fx:()=>({d:{energy:3},line:'Where the hares are, the lynx are not far away.'})});
  add({id:'ptarmigan',ic:'🐦',t:'Ptarmigan in the willows',kind:'good',cat:'wild',h:['mtn','lake','coast'],
    text:'A flock of willow ptarmigan, white as the snow, bursts from under a bush and clucks across the slope.',
    fx:()=>({d:{energy:4},line:'Alaska’s state bird, in its winter whites.'})});
  add({id:'seaotters',ic:'🦭',t:'Sea otters off the Spit',kind:'good',cat:'wild',h:['coast'],only:['spit'],
    text:'Off the end of the Spit a raft of sea otters floats on its backs in the swell, cracking clams on their chests.',
    fx:()=>({d:{energy:5},line:'You watch until your fingers go numb.'})});
  add({id:'chickadees',ic:'🐤',t:'Chickadees at camp',kind:'good',cat:'wild',h:['forest','lake','river','coast'],
    text:'A flock of black-capped and boreal chickadees works the spruce around camp, tiny and loud and not at all bothered by the cold.',
    fx:()=>({d:{energy:3},line:'They live on what they find, so you don’t feed them.',lesson:'Don’t feed wildlife, even the small ones. Fed birds lose their winter foraging skills.'})});
  // weather
  add({id:'coldsnap',ic:'🥶',t:'A cold snap',kind:'bad',cat:'weather',base:3.5,mon:'cold',
    text:'The temperature falls through the night to minus 25 and keeps going. Water bottles freeze solid, the water line of a camper or cabin freezes, and in the morning the truck’s battery will not turn over.',
    fx:c=>{let e=-8;if(c.has('bag'))e*=.6;if(c.has('layers'))e*=.75;if(c.has('fuel'))e*=.8;if(c.comfort>=2)e*=.7;e=Math.round(e);
      const kit=c.has('truck'),cash=kit?0:-60,ok=[c.has('bag')&&'a bag rated for it',c.has('layers')&&'dry layers',c.has('fuel')&&'plenty of stove fuel'].filter(Boolean);
      return {d:{energy:e,cash},line:(kit?'Your jump pack gets the truck going in minutes. ':'A tow truck and a new battery clamp cost you. ')+(ok.length?'Camp was ready with '+ok.join(' and ')+'.':'You were not ready for it.'),
        lesson:'A cold snap is when stove fuel, a bag rated below the low and a jump pack earn their weight.'}}});
  add({id:'snowstorm',ic:'🌨️',t:'A snowstorm',kind:'bad',cat:'weather',base:3.2,mon:'storm',counter:'truck',cw:.7,

      }
      if(id==='aurora'){
        const seen=r()<.7;T.aurora++;
        if(seen){const first=T.aurora===1;adjE(first&&T.pack.includes('layers')?2:0);if(first){adjR(1);R.wom+=1}R.aurora++;T.log.push('Photographed the northern lights.');
          return toRes('🌌 Northern lights',`<p>Around midnight a green curtain unrolls over the spruce, then pink at the edges. You set the camera on a tripod, count out thirty seconds and watch your breath freeze. ${first?'The pictures will be on your page by February. (Rep +1)':''}</p>`,toNight)}

    function toNight(){const T=ss.trip;T.nightHtml=night();ss.phase='night'}

    }
    function leave(thorough){

      else{html=`<p>You toss the scraps on the coals, kick snow over the ring and go.</p>`;T.messy=true;if(r()<.25){adjR(-1);html+=`<p>The next party in finds the mess and mentions it around town. (Rep −1)</p>`}}

    function finishTrip(html){

      R.trips.push(sum);R.log.push({kind:'trip',title:`${m.n} at ${pl.n}`,lines:T.log.slice()});
      T.sum=sum;

    }
    function summaryHtml(s){

    // ---- winter work ----
    function gig(id){

      if(id==='iceguide'){
        const lines=[];
        if(ss.lic<D.calYear(m,t.year)){spend(D.LICENSE);ss.lic=D.calYear(m,t.year);R.lic=ss.lic;lines.push(`You buy a ${ss.lic} fishing license first (${$(D.LICENSE)}).`)}
        let rent=0;if(!has('ice')){rent=D.RENT_ICE*t.costMult;spend(rent);lines.push(`You rent an ice kit (${$(rent)}).`)}
        const gas=r2(8*t.costMult*t.gas/5.3);spend(gas);
        let fare=140,tip=Math.round(r()*40);const cancel=r()<.15;if(cancel){fare=70;lines.push('One of the two cancels at the last minute.')}
        earn(fare+tip);net=fare+tip-gas-rent;e=-4;adjE(e);rep=cancel?0:1;adjR(rep);
        html=`<p>You meet two clients at a stocked lake, drill the holes, check the ice and get everybody on fish by noon. ${lines.join(' ')} They pay ${$(fare)} and tip ${$(tip)}. Gas ${$(gas)}.</p><p><em>Net about ${$(Math.round(net))}. (Energy ${e}${rep?', Rep +1':''})</em></p>`;
      }else if(id==='snowmachine'){

        else{const tip=tipTop?50:Math.round(r()*20);earn(gross+tip);net=gross+tip-fuel;rep=tipTop?1:0;if(rep)adjR(1);html=`<p>Three riders, a blue-sky day, a lake crossing and a cow moose on the trail. They pay ${$(gross)} and tip ${$(tip)}. Fuel ${$(fuel)}.</p>`}
        e=-5;adjE(e);html+=`<p><em>Net about ${$(Math.round(net))}. (Energy ${e}${rep?`, Rep ${sgn(rep)}`:''})</em></p>`;
      }else{
        earn(60);net=60;e=-3;adjE(e);rep=1;adjR(1);w=1;bk=.005;R.wom+=w;R.book=Math.min(D.MAX_BOOK,R.book+bk);
        html=`<p>You work a trailhead table and a warming tent, hand out soup and learn names. Half the people in line turn out to fish the river in July. They pay a ${$(60)} stipend and meals.</p><p><em>(Energy ${e}, Rep +1, word of mouth +1)</em></p>`;

    }
    function gigWhy(g){

  // ---- doing a job ----
  C.resolve=function(t0,jobId,optId,o){
    const t=C.normTicket(t0),s=t.state,r=(o&&o.rand)||Math.random,out=newOut();
    const list=dueJobs(s,t),j=list.find(x=>x.id===jobId);
    if(!j)return null;
    const jd=describe(j.q?Object.assign({},j,{title:()=>j.title(s,t,j.q)}):j,s,t),opt=jd.opts.find(x=>x.id===optId);
    if(!opt||opt.dis)return null;
    out.cash-=opt.cash;out.spent+=opt.cash;out.energy-=opt.energy;if(opt.cash)out.costs['job:'+optId]=(out.costs['job:'+optId]||0)+opt.cash;
    if(t.phase==='summer')out.minutes+=opt.min;else out.days+=opt.days;
    if(opt.gas)out.fuel+=opt.gas;
    const y=t.y,mark=j.id==='bins'?t.abs:y;
    s.tot[optId]++;
    if(j.kind==='event'){
      s.queue=s.queue.filter(e=>e!==j.q&&!(e.id===j.q.id));
      (j.id==='cold'?coldOutcome:snowOutcome)(s,t,optId,r,out,j.q);
      if(optId!=='skip')s.cond+=j.cond;else s.cond-=T.stormWear;
    }else{
      if(optId==='skip'){
        if(j.id==='bins')s.skipAbs=t.abs;else s.skip[j.id]=y;
        s.cond-=Math.ceil(j.cond*T.skipWear);
        line(out,`⏭️ ${jd.title} skipped. ${jd.risk}`);
      }else{
        const f=D.FX[j.id];if(f)f(s,t,optId,out);
        if(j.id!=='septic'||optId==='pay')s.did[j.id]=mark;
        s.cond+=j.cond*(optId==='diy'?1:1);
        out.done.push(j.id);
        line(out,`${j.ic} ${DONE_TXT(j,optId,opt)}`);
      }
    }
    return report(s,out);
  };
  const DONE_TXT=(j,optId,opt)=>`${j.title({},{})} ${optId==='diy'?'done by your own hands':'taken care of'}${opt.cash?` (${$(opt.cash)})`:''}.`;
  // what finishing a job changes beyond its did-mark
  D.FX={
    sweep:(s)=>{s.sweepSkips=0},
    tape:(s)=>{s.tape=1},skirt:(s)=>{s.skirt=1},strap:(s)=>{s.strap=1},detect:(s)=>{s.detect=1},fence:(s)=>{s.fence=1},
    garden:(s,t)=>{s.garden.y=t.y},
    septic:(s,t,o)=>{if(o==='diy')s.did.septic=Math.max(s.did.septic,t.y-2)},
    stclean:(s,t,o)=>{s.station.tidy=Math.min(100,s.station.tidy+(o==='pay'?70:55))},
  };

  // ---- a cold snap: heat, pipes and drips ----
  function coldOutcome(s,t,optId,r,out,q){
    const m=cm(s)*t.bad,sev=q.sev,y=t.y;
    const oilOk=!!s.heat.oil&&s.did.oil===y,woodOk=!!s.heat.stove&&s.did.wood===y,heatOk=oilOk||woodOk;
    const drip=optId==='skip'?1:.35;
    line(out,`🥶 A cold snap pushes the thermometer to ${['−10','−25','−35'][sev-1]}°F.`);
    let cold=false;
    if(!heatOk){
      cold=true;cost(out,$c(t,C.RUSH),'rush');out.energy-=8;s.cond-=4;
      line(out,`🛢️ The tank runs dry in the middle of the night and the furnace quits. A rush delivery at dawn costs ${$($c(t,C.RUSH))} and the cabin is down to 40°F before it warms up.`);
    }else if(woodOk&&!oilOk)line(out,'🔥 The wood stove carries the cabin through the cold, the way it should.');
    else line(out,'🔥 The heat holds. Nice and warm inside.');
    if(s.chill){cold=true}
    let pf=T.freezeBase*[.5,1,1.6][sev-1]*(s.tape?.12:1)*(s.skirt?.55:1)*drip*(cold?2.5:1)*(s.chill?1.6:1)*m;
    pf=clamp(pf,0,.9);
    if(r()<pf){
      const burst=r()<clamp(T.burstShare*(s.tape?.45:1)*(cold?1.4:1),0,.8);
      out.sev=2;
      if(burst){cost(out,$c(t,2400),'burst');ev(out,'pipe_burst',2);out.daysLost+=3;s.cond-=12;out.fresh=1;
        line(out,`💦 A pipe under the floor bursts. Water everywhere until you find the shutoff. The plumber and the cleanup come to ${$($c(t,2400))}, it takes about three days to dry out, and the fridge food is a loss.`)}
      else{cost(out,$c(t,380),'frozen');ev(out,'pipes_frozen',2);out.daysLost+=1;s.cond-=4;if(cold)out.fresh=1;
        line(out,`🧊 The kitchen line freezes solid. A plumber thaws it for ${$($c(t,380))} and it eats a day.${cold?' The fridge got cold enough to ruin the fresh food.':''}`)}
    }else line(out,optId==='skip'?'😮‍💨 The pipes hold, this time.':'🚰 The pipes hold. The dripping taps did their job.');
    s.chill=0;s.tot.events++;
  }

  // ---- heavy snow: roof and driveway ----
  function snowOutcome(s,t,optId,r,out,q){
    const m=cm(s)*t.bad,d=q.depth,safe=optId!=='skip';
    if(safe)line(out,optId==='diy'?'⛏️ You rake the roof and plow the drive. Your back files a complaint.':'🚜 The neighbor plows the drive and a roofer rakes the snow off the roof.');
    const pl=T.roofP[d-1]*(safe?.1:1)*m;
    if(r()<pl){const c=$c(t,1400*(1+.4*(d-1)));cost(out,c,'icedam');ev(out,'ice_dam',2);s.cond-=8;out.sev=2;
      line(out,`💧 Snow melts and refreezes at the eaves. An ice dam lets water in and the ceiling stains. Repairs come to ${$(c)}.`)}
    else if(!safe&&d===3&&r()<T.collapseP*m){const c=$c(t,2600);cost(out,c,'collapse');ev(out,'shed_collapse',2);s.cond-=14;out.daysLost+=1;out.sev=2;
      line(out,`🏚️ The shed roof gives way under two feet of wet snow. Cleanup and a new roof run ${$(c)}, and a day.`)}
    else if(!safe)line(out,'🏠 The roof carries it. You were lucky.');
    if(!safe){out.daysLost+=d;line(out,`🚧 The plow doesn’t come for a while. You’re snowed in for ${d===1?'a day':d===2?'two days':'three days'}: a winter job slips or a trip gets pushed.`)}
    s.tot.events++;
  }

  // ---- the off-season: winter ----
  C.rollWinter=function(t0,o){
    const t=C.normTicket(t0),s=t.state,r=(o&&o.rand)||Math.random,out=newOut(),y=t.y,m=cm(s)*t.bad;
    if(s.rolled===y)return report(s,out);
    s.rolled=y;s.cond-=T.winterDrift;s.queue=[];
    const oilOk=!!s.heat.oil&&s.did.oil===y,woodOk=!!s.heat.stove&&s.did.wood===y,heatOk=oilOk||woodOk;
    // outage: a long one with no generator and no stove leaves the cabin cold
    const O=t.outage;
    if(O)ev(out,O.gen?'outage_gen':'outage_dark',O.h>=12&&!O.gen&&!woodOk?1:0);
    if(O&&O.h>=12&&!O.gen&&!woodOk){s.chill=1;line(out,'🥶 The power was out long enough for the cabin to go cold: the furnace blower needs electricity. A wood stove or a generator would have kept it warm.')}
    const coldNow=r()<T.coldP,snowNow=r()<T.snowP;
    if(coldNow)s.queue.push({id:'cold',sev:1+(r()<.5?1:0)+(r()<.2?1:0)});
    if(snowNow)s.queue.push({id:'snow',depth:1+(r()<.5?1:0)+(r()<.25?1:0)});
    if(!heatOk&&!coldNow){const c=$c(t,260*1.2);cost(out,c,'late');line(out,`🛢️ You never topped up the tank, so you order a delivery in January at a worse price: ${$(c)}.`)}
    // a chimney fire
    if(s.heat.stove&&s.did.sweep!==y){
      const p=clamp(T.fireP*(1+.8*Math.min(2,s.sweepSkips))*m,0,.5);s.sweepSkips++;
      if(r()<p){const c=$c(t,s.detect?500:700);cost(out,c,'fire');ev(out,'chimney_fire',2);out.energy-=10;s.cond-=12;out.sev=2;s.tot.events++;
        line(out,`🔥 A roar in the stovepipe: creosote has caught. You shut the damper, get everyone out and the volunteer fire department checks the chimney. A new liner and cleanup run ${$(c)}.${s.detect?' The smoke alarm gave you the head start.':''}`)}
    }
    // carbon monoxide
    const heatsWithFire=!!s.heat.stove||t.gen.owned;
    const pco=(heatsWithFire?T.coP:T.coBase)*m;
    if(r()<pco){
      if(s.detect){const c=$c(t,60);cost(out,c,'co');ev(out,'co_alarm',1);s.tot.events++;line(out,`🚨 The CO alarm goes off in the night. You open the doors, get out and find a blocked flue cap. ${$(c)} for a new cap, and thanks to the alarm, nobody gets hurt.`)}
      else{const c=$c(t,950);cost(out,c,'co');ev(out,'co_night',2);out.daysLost+=2;out.energy-=20;out.sev=2;s.tot.events++;
        line(out,`☠️ You wake with a pounding headache and nausea. It is carbon monoxide from a blocked flue. The ER visit comes to ${$(c)} and a couple of days to recover. Alarms would have caught it; they are cheap.`)}
    }
    return report(s,out);
  };

  // ---- the off-season: spring ----
  C.rollSpring=function(t0,o){
    const t=C.normTicket(t0),s=t.state,r=(o&&o.rand)||Math.random,out=newOut(),y=t.y,m=cm(s)*t.bad;
    if(s.sprung===y)return report(s,out);
    s.sprung=y;
    // breakup
    if(s.did.breakup!==y&&r()<clamp(T.breakupP*m,0,.95)){
      if(r()<.6){const c=$c(t,260),x=r()<T.cancelP;cost(out,c,'stuck');ev(out,'breakup_stuck',1);out.energy-=6;if(x)out.cancels++;s.tot.events++;out.sev=1;line(out,`🚧 Breakup. The driveway is soup and the truck sinks to the axles on the first morning. A tow costs ${$(c)}.${x?' A party coming for the first days of July will not make it down the drive.':''}`)}
      else{const c=$c(t,900);cost(out,c,'heave');ev(out,'frost_heave',2);s.cond-=6;s.tot.events++;out.sev=2;line(out,`🚧 Frost heaves shift a skirting panel and a post settles. The back door sticks. A carpenter sets it right for ${$(c)}.`)}
    }
    // the well
    const wy=Math.max(0,y-s.did.well);
    if(r()<clamp(s.did.well===y?.003:T.wellBase+T.wellYear*Math.max(0,wy-1),0,.2)*m){
      const c=$c(t,1500),x=r()<T.cancelP;if(x)out.cancels++;cost(out,c,'well');ev(out,'well_pump',2);out.daysLost+=3;out.energy-=10;s.cond-=10;s.tot.events++;out.sev=2;
      line(out,`💧 The water turns cloudy, then the pump quits. Many homes around Soldotna rely on a well, and yours needs a new pump and treatment: ${$(c)}, and three days with the house barely usable.${x?' A booked party will not stay at a place with no water.':''}`)}
    // septic
    const over=y-s.did.septic-3;
    if(r()<clamp(over<0?.002:T.septicBase+T.septicYear*over,0,.3)*m){
      const c=$c(t,2100),x=r()<T.cancelP;if(x)out.cancels++;cost(out,c,'septic');ev(out,'septic_backup',2);out.daysLost+=2;s.cond-=10;s.tot.events++;out.sev=2;
      line(out,`🚽 The septic tank backs up into the house. An emergency pump-out and a cleaned drain field come to ${$(c)}, and the house is unusable for a couple of days.${x?' A booked party hears about it and cancels.':''}`)}
    // an earthquake
    if(r()<T.quakeP*t.bad){
      if(s.strap){ev(out,'quake_ok',0);line(out,'🌎 A magnitude 6 quake rattles the cabin, felt across the Kenai. Dishes jump, but the strapped water heater and the anchored shelves stay put.')}
      else{const c=$c(t,1100);cost(out,c,'quake');ev(out,'quake',2);out.daysLost+=1;s.cond-=15;s.tot.events++;out.sev=2;
        line(out,`🌎 A magnitude 6 earthquake, felt across the Kenai (like the big 2018 Anchorage quake). The water heater tips, a shelf comes down and the kitchen is a mess: ${$(c)} to fix, and a day.`)}
    }
    // a run-down place puts off the first parties of the season: the lower the condition, the likelier one looks elsewhere
    if(s.cond<T.shabbyAt&&r()<(T.shabbyAt-s.cond)/T.shabbyAt*T.shabbyP){out.cancels++;out.sev=Math.max(out.sev,1);line(out,'🏚️ A party drives out to see where they will be staying, takes a look at the sagging porch and the stained ceiling, and books another guide. A run-down cabin costs you a trip.')}
    s.skip={};
    return report(s,out);
  };

  // ---- a July morning ----
  C.daily=function(t0,o){
    const t=C.normTicket(t0),s=t.state,r=(o&&o.rand)||Math.random,out=newOut(),y=t.y,m=cm(s)*t.bad;
    s.cond-=T.drift;
    // a bear: more likely with fish at home and bins overdue; once a summer
    if(s.bearY!==y&&t.sday>=1&&!quiet(t)){
      const over=t.abs-s.did.bins>=T.bearOver;
      let p=(T.bearBase+(t.recentFish>0?T.bearFish:0))*(over?(s.bin?3:4):s.bin?.4:1)*m;
      if(r()<clamp(p,0,.5)){
        s.bearY=y;s.tot.bears++;s.tot.events++;const k=r();
        if(k<.45){const c=$c(t,120+Math.round(r()*280));cost(out,c,'bear');ev(out,'bear_raid',1);s.cond-=5;out.sev=1;line(out,`🐻 A black bear gets into the garbage and the fish scraps overnight. Torn bags, a dented bin and a mess all over the yard: ${$(c)} to clean and repair.`)}
        else if(k<.8){const c=$c(t,60);cost(out,c,'bear');ev(out,'bear_yard',1);out.minutes+=45;out.energy-=4;out.sev=1;line(out,`🐻 You wake to a bear snorting around the yard. It takes 45 minutes and a lot of banging pots before it leaves, and ${$(c)} of cleanup.`)}
        else{out.rep-=3;out.wom-=4;out.sev=1;ev(out,'bear_raid',1);line(out,'🐻 A bear gets into your garbage and a Fish and Game officer stops by to talk about attractants. Feeding bears, even by accident with trash, can mean a warning or a fine. You get a warning, and the neighbors hear about it. Rep −3, and word of mouth takes a hit.')}
      }
    }
    // a cabin in good shape sends you out rested
    if(s.cond>=T.restAt){out.energy+=T.rest;if(s.restY!==y){s.restY=y;line(out,'☕ The cabin is warm, dry and tidy, and you wake rested. Energy +'+T.rest+' a morning while it stays that way.')}}
    // a run-down cabin gets in the way of the season: nights are cold and damp, and now and then something fails on a guiding morning
    if(s.cond<T.tiredAt){const e=s.cond<15?4:2;out.energy-=e;if(s.tiredY!==y){s.tiredY=y;line(out,'🥶 The cabin is cold and damp and the roof drips onto a pan. You sleep badly, and it shows on the river.')}}
    if(s.cond<T.troubleAt&&t.sday>=1&&!quiet(t)){
      if(s.troubleY!==y){s.troubleY=y;s.troubles=0}
      if(s.troubles<T.troubleMax&&r()<clamp(T.troubleP*m*(1+(T.troubleAt-s.cond)/25),0,.5)){
        s.troubles++;s.tot.events++;out.sev=1;const k=r();
        if(k<.4){const c=$c(t,380),x=r()<T.cancelP;cost(out,c,'trouble');ev(out,'pump_fail',1);if(x)out.cancels++;out.energy-=6;s.cond+=3;line(out,`🚰 The pump and pressure tank give out in the night. No water for the coffee, the dishes or the clients’ lunch bag. A plumber on a Saturday costs ${$(c)}.${x?' The next party cancels rather than wait.':''}`)}
        else if(k<.75){const c=$c(t,420);cost(out,c,'trouble');ev(out,'roof_leak',1);out.minutes+=60;out.energy-=6;s.cond+=3;line(out,`💧 The roof leaks onto the stove and the wiring trips the breaker. An hour on a ladder in the rain and ${$(c)} in parts, and you start the day late and wet.`)}
        else{const c=$c(t,260);cost(out,c,'trouble');ev(out,'furnace_fail',1);out.energy-=10;out.rep-=1;s.cond+=2;line(out,`🥶 The furnace blower quits on the coldest night of the month. You get no sleep, a clean-up and a repair of ${$(c)}, and the clients notice how tired you look. Energy −10, rep −1.`)}
      }
    }
    // the garden: harvest on day 10
    if(t.sday===10&&s.garden.y===y){
      const eaten=!s.fence&&r()<T.moosePct;
      if(eaten){s.tot.moose++;out.meals+=2;out.sev=1;ev(out,'garden_moose',1);line(out,'🫎 A cow moose and her calf stroll through the garden at dawn. They eat the kale, the carrots and half the potatoes, and leave tracks like dinner plates. You get a couple of meals out of what is left.')}
      else{out.meals+=T.harvest;s.tot.harvest+=T.harvest;ev(out,'garden_harvest',0);line(out,`🥬 The garden comes in: potatoes, kale and carrots. ${T.harvest} meals for the kitchen.`)}
    }
    // one gentle reminder a day
    if(s.rem!==t.abs&&t.abs-s.rem>=(t.y===0?3:1)){
      const due=dueJobs(s,Object.assign({},t,{state:s}));
      if(due.length){s.rem=t.abs;const j=due[0],n=due.length;out.remind=`${j.ic} ${j.title(s,t,j.q)}${n>1?` (and ${n-1} more)`:''}. Home tab.`}
    }
    return report(s,out);
  };

  // ---- the generator ----
  C.genOdds=function(t0){
    const t=C.normTicket(t0),s=t.state,y=t.y,why=[];
    if(!t.gen.owned)return {p:0,why};
    let p=.03;
    if(s.did.genoil!==y){p+=.12;why.push('the oil was never changed')}
    if(s.did.genrun!==y){p+=.12;why.push('it was never run under load')}
    if(t.gen.gas==='stale'){p+=.18;why.push('stale gas is still in the cans')}
    return {p:clamp(p*cm(s)/1,0,.55),why};
  };
  // the generator would not start: the shop gets it going (oil, carburetor), and it is in shape afterwards
  C.genFailed=function(t0,o){
    const t=C.normTicket(t0),s=t.state,out=newOut(),c=$c(t,85);
    cost(out,c,'gen');ev(out,'gen_fail',1);s.did.genoil=t.y;s.did.genrun=t.y;s.tot.events++;out.sev=1;
    const why=C.genOdds(t0).why;
    line(out,`🔧 The generator coughs and dies${why.length?` (${why.join(', ')})`:''}. You get it running later with a fresh carburetor clean, oil and a new plug: ${$(c)}. Next time, service it before the power goes out.`);
    return report(s,out);
  };
  // a new generator is in shape
  C.noteGen=function(t0){const t=C.normTicket(t0),s=t.state;s.did.genoil=t.y;s.did.genrun=t.y;return report(s,newOut())};

  // ---- the fish processing station ----
  C.processing=function(t0,o){
    const t=C.normTicket(t0),s=t.state,r=(o&&o.rand)||Math.random,out=newOut();
    if(!s.proc||t.fish<=0||t.clients<=0)return report(s,out);
    const st=s.station,y=t.y;
    const spoilP=(st.tidy<30?T.spoilBad:st.tidy<55?T.spoilMid:T.spoilOk)+(s.did.stdef===y?0:.05);
    const fish=Math.min(t.fish,t.clients*3),fee=Math.round(fish*T.fee*T.optIn*t.costMult);
    st.tidy=Math.max(0,st.tidy-6);
    if(r()<spoilP){
      out.wom-=1;out.rep-=1;s.tot.spoiled++;out.sev=1;ev(out,'spoiled_batch',1);
      line(out,'🐟 A bag of fillets goes into the wrong cooler, or the sealer didn’t seal. By the time the clients unpack it at home, it’s off. You refund the fee and they tell their friends.');
    }else{
      out.earned+=fee;out.cash+=fee;out.energy-=2;s.tot.fees+=fee;
      line(out,`🐟 Fillet, vacuum-seal and freeze: ${fish>1?'a few of':''} the clients’ fish go home flat-packed. ${$(fee)} in processing fees.`);
    }
    if(st.tidy<55)line(out,'🧽 The fish table could use a scrub.');
    return report(s,out);
  };

  // ---- the shop ----
  C.shop=function(t0){
    const t=C.normTicket(t0),s=t.state;
    return D.SHOP.map(i=>{const c=$c(t,i.cost),has=i.has(s);return {id:i.id,ic:i.ic,n:i.n,d:i.d,cost:c,has,dis:has||t.cash<c,why:has?'Done':t.cash<c?'Not enough cash':''}});
  };
  C.buy=function(t0,id){
    const t=C.normTicket(t0),s=t.state,out=newOut(),it=C.shop(t0).find(x=>x.id===id);
    if(!it||it.dis)return null;
    cost(out,it.cost);
    if(id==='stove'){s.heat.stove=1;s.cond+=3}
    if(id==='station'){s.proc=1;s.station.tidy=100;s.did.stdef=t.y}
    if(id==='bin'){s.bin=1;s.cond+=1}
    line(out,`${it.ic} ${it.n}: ${$(it.cost)}.`);
    return report(s,out);
  };

  // ---- what the Home tab shows ----
  C.status=function(t0){
    const t=C.normTicket(t0),s=t.state,rows=[];
    const heat=[s.heat.oil?'furnace (heating oil or propane)':'',s.heat.stove?'wood stove':''].filter(Boolean).join(' and ');
    rows.push(['🔥 Heat',heat]);
    const prot=[s.tape?'heat tape':'',s.skirt?'skirted crawlspace':''].filter(Boolean);
    rows.push(['🚰 Freeze-proofing',prot.length?prot.join(', '):'none yet']);
    rows.push(['🚨 Detectors',s.detect?'fitted':'none']);
    if(t.gen.owned)rows.push(['🔌 Generator',C.genOdds(t).p<=.1?'serviced':'overdue for service']);
    if(s.proc)rows.push(['🐟 Fish station',`tidiness ${Math.round(s.station.tidy)}%`]);
    if(s.garden.y===t.y)rows.push(['🥬 Garden',s.fence?'fenced':'unfenced']);
    return rows;
  };
})(CabinUpkeep);
// ============================================================
//  CABIN UPKEEP, part 3: screens.
//  CabinUpkeep.ui.tab(ticket)            the Home tab as an HTML string. Its buttons carry data-cab="job" (with data-id) or data-cab="shop";
//                                        the host listens for clicks on them and calls open() or shop().
//  CabinUpkeep.ui.open(host, jobId)      the choice pop-up for one job: do it yourself, pay someone, or skip it
//  CabinUpkeep.ui.shop(host, back)       the things you buy once
//  CabinUpkeep.ui.scenes(host, rep, done) a winter report followed by each storm prompt in turn, then done()
//
//  The host adapter: {
//    show(title, html, buttons, lock, meta), required. Show a pop-up. buttons: [{l, s, dis, fn, stay}]; fn runs after the pop-up has closed.
//                                        meta (optional): {id, kind, events} for an illustration; a host may ignore it. id and kind are the job's (on a
//                                        job's pop-ups); events is a list of {id, sev} from CabinUpkeep.EVENTS: on a storm prompt its own id (cold_snap,
//                                        heavy_snow) before the choice, then the report's events (or the prompt's id again if nothing happened);
//                                        on a winter, spring or mishap report, the report's events.

  // ---- an opener: the tender at anchor, buying over the rail ----

  // ---- the plant's season ----
  function plantSeason(t,st,r,exp){
    const p=st.plant,P=D.PLANTS[p.kind],S0=st.season,A=p.area,g=S0.going,lv=S0.lv,mix=D.MIX[p.mix]?p.mix:'hg',out={lines:[],events:[]};

// ============================================================
//  TENDER & PROCESSOR, part 4: headless play.
//  Tender.autoplay(host, {policy}) makes the winter's decisions with no screen. host: {ticket(), apply(report)}.
//  Policies:
//    'processor'  works up the ladder sensibly: a chartered tender, then one of its own, line space, then a shore plant bought mostly
//                 with cash in a year the market doesn't look weak; hires a full crew, keeps things up, pays the loan down
//    'mogul'      over-invests: borrows the most it can for two tenders, a shore plant, then a floating processor; overpays the fleet,
//                 skips upkeep, fillets everything
//    or your own function (ticket) → [[id, arg], ...]
// ============================================================
(function(T){
  'use strict';
  const D=T.data,K=D.K;
  const P={
    processor(t){
      const st=t.state,out=[],cash=t.cash,left=t.seasonsLeft,owned=st.tenders.filter(v=>v.kind==='used').length,fc=T.forecast(t).lv;
      if(left<=0) return out;
      // tenders
      if(!st.tenders.length){
        const price=T.price(t,'buyT');
        if(st.yrs>=1&&left>=3&&cash>=price+70000) out.push(['buyT',{area:'uci'}]);
        else if(st.yrs>=1&&left>=3&&cash>=price*K.DOWN+60000&&t.rep>=K.BUY_REP) out.push(['buyT',{area:'uci',loan:true}]);
        else if(cash>=T.price(t,'lease')+40000&&left>=1) out.push(['lease',{area:'uci'}]);
      }
      // the plant: line space first, a shore plant once the business has a few seasons and the cash
      if(!st.plant&&owned+(out.some(x=>x[0]==='buyT')?1:0)>0){
        const sp=T.price(t,'shore'),cushion=(t.floor||T.FLOOR)+120000;
        if(st.yrs>=2&&left>=3&&fc.salmon>0&&t.rep>=K.BUY_REP&&cash>=sp*K.DOWN+cushion) out.push(['shore',{area:'uci',loan:cash<sp+cushion}]);
        else if(st.yrs>=1&&cash>=T.price(t,'space')+30000) out.push(['space',{area:'uci'}]);
      }
      out.push(['mix',{mix:'fresh'}],['crew',{lvl:'full'}],['price',{offset:.02,care:'bled'}]);
      const low=st.tenders.some(v=>v.kind==='used'&&v.cond<55)||(st.plant&&st.plant.kind!=='space'&&st.plant.cond<55);
      out.push(['maint',{lvl:low?'full':'basic'}]);
      if(st.loan&&cash>160000) out.push(['payLoan',{amt:Math.min(st.loan.bal,Math.round(cash-140000))}]);
      return out;
    },
    mogul(t){
      const st=t.state,out=[],left=t.seasonsLeft;
      if(left<=0) return out;
      if(st.tenders.length<K.MAX_TENDERS) out.push(['buyT',{area:'uci',loan:true}],['lease',{area:'uci'}]);
      if(!st.plant) out.push(['floater',{area:'uci',loan:true}],['shore',{area:'uci',loan:true}],['space',{area:'uci'}]);
      else if(st.plant.kind==='shore'&&st.yrs>=3&&t.rep>=65) out.push(['sellP',{}],['floater',{area:'uci',loan:true}]);
      out.push(['mix',{mix:'fillet'}],['crew',{lvl:'full'}],['price',{offset:.08,care:'fast'}],['maint',{lvl:'skip'}]);
      if(st.plant&&st.plant.kind==='floater') out.push(['wcrab',{}]);
      return out;
    },
  };
  T.policies=P;
  T.autoplay=function(host,opts){
    // the policy is asked again after every step (cash and the state change), and each kind of step is taken once a winter
    const pol=typeof(opts&&opts.policy)==='function'?opts.policy:P[(opts&&opts.policy)||'processor'],done=[];

      const t=host.ticket(),next=pol(t).find(([id,arg])=>!done.includes(id)&&!T.why(t,id,arg)&&!(id==='wcrab'&&t.state.winterCrab));
      if(!next)break;
      const rep=T.act(t,next[0],next[1]);done.push(next[0]);if(rep.refused)continue;host.apply(rep);
    }

  };
})(Tender);

// ---------------- sound (synthesized with Web Audio: no files to ship) ----------------
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,dur,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
// Add your own named sounds here.
const SFX={
  good:()=>{tone(784,0.18,'sine',0.09);tone(1175,0.28,'sine',0.07,0.12)},

  info:()=>tone(660,0.16,'sine',0.06),
  win: ()=>[523,659,784,1046].forEach((f,i)=>tone(f,0.28,'sine',0.09,i*0.1)),
  tap: ()=>tone(520,0.05,'sine',0.03),
  whoosh:()=>tone(300,0.6,'triangle',0.05,0,900),

};
