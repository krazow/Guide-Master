# Runs the Playwright tests on every push and pull request to main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch or pull request at a time: a newer push cancels the older run, so a stuck or superseded run never blocks the queue.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check index.html and sw.js are built from src/
        run: python3 tools/build.py --check
      - name: Build the single-file offline game
        run: python3 tools/build-offline.py
      - name: Run tests
        run: npm test
